      '<div class="btn-row left"><a class="btn red" data-a="resetSave">重置遊戲</a></div></div>' +
      '<div class="set-col"><div class="set-h">遊戲</div>' +
      '<div class="set-row">戰鬥速度：<a class="tog' + (st.speed === 1 ? ' on' : '') + '" data-a="setOpt" data-v="speed:1">1x</a><a class="tog' + (st.speed === 2 ? ' on' : '') + '" data-a="setOpt" data-v="speed:2">2x</a></div>' +
      '<div class="set-row">經濟模式：<a class="tog' + (st.econ !== 'fast' ? ' on' : '') + '" data-a="setEcon" data-v="std">標準</a><a class="tog' + (st.econ === 'fast' ? ' on' : '') + '" data-a="setEcon" data-v="fast">單機加速</a><br><small>標準：精力每 6 分鐘 1 點，農田／訓練原速。單機加速：精力每 1 分鐘、農田 4 倍速、訓練 2 倍、戰鬥銀幣與塔俸 ×1.5（D）。</small></div>' +
      (UI.soundRows ? UI.soundRows() : '') +
      '<div class="set-row">手機直向時自動旋轉橫向：<a class="tog' + (st.rotate !== false ? ' on' : '') + '" data-a="setOpt" data-v="rotate:1">開</a><a class="tog' + (st.rotate === false ? ' on' : '') + '" data-a="setOpt" data-v="rotate:0">關</a></div>' +
      '<div class="set-row small">版本：' + S.RELEASE + '　存檔格式 v' + S.VERSION + '<br>本作為粉絲重製的單機版，所有美術均以程式繪製，與原版營運商無關。</div></div></div>';
    return UI.panel('設置', b, { cls: 'mid' });
  };
  UI.actions.setOpt = function (v) {
    var a = v.split(':'), st = S.state.settings;
    if (a[0] === 'speed') st.speed = +a[1];
    else if (a[0] === 'rotate') st.rotate = a[1] === '1';
    else if (a[0] === 'energyMode') { G.tick(); st.energyMode = a[1]; S.state.player.energyTs = U.now(); }
    G.commit(); UI.layout(); UI.renderModal();
  };
  UI.actions.saveNow = function () { UI.toast(S.save(true) ? '已存檔' : '存檔失敗：瀏覽器不允許本機儲存，請改用匯出', S.storageOk ? 'good' : 'bad'); UI.renderModal(); };
  UI.actions.exportSave = function () {
    var text = S.exportText(), name = 'mengjiang-save-' + U.dayKey() + '.json', okDl = false;
    try {
      if (window.Blob && window.URL && URL.createObjectURL) {
        var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name;
        document.body.appendChild(a); a.click(); setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 500); okDl = true;
      }
    } catch (e) { okDl = false; }
    UI.open('exportBox', { text: text, dl: okDl });
  };
  UI.modals.exportBox = function (o) {
    return UI.panel('匯出存檔', '<div class="set-row">' + (o.dl ? '已嘗試下載檔案。' : '') + '若下載無效（例如部分 iPhone），請長按下方文字全選並複製，貼到備忘錄保存。</div><textarea class="savebox" id="exportText" readonly>' + U.esc(o.text) + '</textarea>' +
      '<div class="btn-row"><a class="btn" data-a="copyExport">複製</a><a class="btn" data-a="open" data-v="settings">返回</a></div>', { cls: 'mid' });
  };
  UI.actions.copyExport = function () {
    var t = document.getElementById('exportText'); t.removeAttribute('readonly'); t.select(); try { t.setSelectionRange(0, 999999); } catch (e) { }
    var ok = false; try { ok = document.execCommand('copy'); } catch (e2) { } t.setAttribute('readonly', 'readonly');
    UI.toast(ok ? '已複製到剪貼簿' : '無法自動複製，請手動長按全選複製');
  };
  UI.actions.importOpen = function () { UI.open('importBox'); };
  UI.modals.importBox = function () {
    return UI.panel('匯入存檔', '<div class="set-row">選擇先前匯出的 .json 檔，或把存檔文字貼到下方。匯入前會檢查格式，並覆蓋目前進度。</div>' +
      '<input type="file" accept=".json,application/json,text/plain" id="importFile" onchange="MJ.UI.importFile(this)">' +
      '<textarea class="savebox" id="importText" placeholder="在此貼上存檔文字"></textarea>' +
      '<div class="btn-row"><a class="btn" data-a="importPaste">匯入貼上的文字</a><a class="btn" data-a="' + (S.state ? 'open" data-v="settings' : 'close') + '">返回</a></div>', { cls: 'mid' });
  };
  UI.importFile = function (inp) {
    var f = inp.files && inp.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { UI.doImport(String(rd.result)); };
    rd.onerror = function () { UI.toast('讀取檔案失敗', 'bad'); };
    rd.readAsText(f);
  };
  UI.actions.importPaste = function () { UI.doImport(document.getElementById('importText').value); };
  UI.doImport = function (text) {
    var r = S.parse(String(text || '').replace(/^\s+|\s+$/g, ''));
    if (!r.ok) { UI.toast('匯入失敗：' + r.errors.slice(0, 3).join('；'), 'bad'); return; }
    var lead = U.find(r.state.heroes, function (h) { return h.id === 'lead'; });
    UI.confirm('確認匯入', '存檔角色：' + U.esc(r.state.player.name) + '（Lv' + lead.lv + '）<br>匯入後會覆蓋目前進度（目前進度會先備份一份）。', function () {
      if (S.state) S.save(true);
      S.state = r.state; G.tick(); G.commit(); S.save(true);
      UI.modal = null; UI.go('city'); UI.toast('匯入成功', 'good');
    }, '匯入');
  };
  UI.actions.resetSave = function () {
    UI.confirm('重置遊戲', '這會<b>刪除本機所有進度</b>（含備份），無法復原。建議先匯出存檔。', function () {
      UI.confirm('再次確認', '真的要從頭開始嗎？', function () { S.reset(); UI.modal = null; UI.go('newgame'); }, '刪除並重來');
    }, '我要重置');
  };

  // ---------- 新遊戲 ----------
  UI.screens.newgame = function () {
    var g = UI.sel.ngG || 'm', t = UI.sel.ngT || '力耐';
    var look = U.clone(MJ.D.heroes.lead.look); if (g === 'f') { look.g = 'f'; look.hs = 'long'; look.cloth = '#ad1457'; }
    look.art = 'c_lead_' + g;
    var h = '<div class="scr newgame">' + MJ.Art.sky() + '<div class="ng-logo">猛將無雙<small>單機重製版・' + S.RELEASE + '</small></div>' +
      '<div class="frame ng-box"><div class="plaque">創建角色</div><div class="ng-in"><div class="ng-fig"><div class="mc-wrap">' + MJ.Art.magicCircle() + '</div><div class="hero-fig">' + MJ.Art.figure(look, { cape: true }) + '</div></div><div class="ng-form">' +
      '<label>俠名 <input id="ngName" maxlength="8" value="' + U.esc(UI.sel.ngName || '') + '" placeholder="最多 8 字"></label>' +
      '<div class="ng-row">性別：<a class="tog' + (g === 'm' ? ' on' : '') + '" data-a="ngSet" data-v="G:m">男</a><a class="tog' + (g === 'f' ? ' on' : '') + '" data-a="ngSet" data-v="G:f">女</a></div>' +
      '<div class="ng-row">主屬性：';
    U.each(U.keys(MJ.D.config.leadTypes), function (k) { h += '<a class="tog' + (t === k ? ' on' : '') + '" data-a="ngSet" data-v="T:' + k + '">' + k + '</a>'; });
    h += '</div><div class="ng-desc">' + ({ '力耐': '力量與耐力並重，前排肉盾兼輸出（原版截圖主角即為此型）', '力敏': '力量與敏捷，攻擊較高、生命較低', '敏耐': '敏捷與耐力，攻守平均' })[t] + '</div>' +
      '<div class="btn-row"><a class="btn big" data-a="ngStart">踏入江湖</a><a class="btn" data-a="importOpen">匯入存檔</a></div>' +
      (S.storageAvailable() ? '' : '<div class="bad">注意：瀏覽器不允許本機儲存，進度只能靠「匯出存檔」保存。</div>') + '</div></div></div></div>';
    return h;
  };
  UI.actions.ngSet = function (v) { var n = document.getElementById('ngName'); if (n) UI.sel.ngName = n.value; if (v.charAt(0) === 'G') UI.sel.ngG = v.slice(2); else UI.sel.ngT = v.slice(2); UI.render(); };
  UI.actions.ngStart = function () {
    var n = document.getElementById('ngName');
    G.newGame(n ? n.value : '', UI.sel.ngT || '力耐', UI.sel.ngG || 'm');
    UI.go('city'); UI.toast('歡迎來到猛將無雙！', 'good');
  };
})();

</script>
<script>/* js/main.js */
/* 啟動：載入存檔、計時器、自動存檔 */
(function () {
  var UI = MJ.UI, G = MJ.G, S = MJ.S, U = MJ.U;
  MJ.boot = function () {
    G.initData();
    UI.bind();
    if (MJ.Art.injectBg) MJ.Art.injectBg();
    if (UI.bindSound) UI.bindSound();
    var r = S.load();
    if (r.ok) {
      S.state = r.state; G.tick();
      UI.screen = 'city';
      if (r.fromBackup) setTimeout(function () { UI.toast('主存檔損壞，已自動改用備份存檔', 'bad'); }, 300);
    } else {
      if (!r.none) {
        // 存檔損壞且無可用備份：保留原文以便救援
        try { var raw = localStorage.getItem(S.KEY); if (raw) localStorage.setItem(S.KEY + '_corrupt', raw); } catch (e) { }
        setTimeout(function () { UI.toast('存檔無法讀取（' + (r.errors || []).slice(0, 2).join('；') + '），原始資料已另存為 ' + S.KEY + '_corrupt', 'bad'); }, 300);
      }
      UI.screen = 'newgame';
    }
    G.onChange = function () { if (UI.screen !== 'battle' && UI.screen !== 'newgame') UI.refresh(); };
    G.onChat = function () { var c = document.getElementById('chat'); if (c) c.innerHTML = UI.chatHtml(); };
    UI.layout();
    UI.render();
    var lastEnergy = S.state ? S.state.player.energy : 0, secs = 0;
    setInterval(function () {
      if (!S.state) return;
      secs++;
      G.tick();
      var now = U.now();
      var cds = document.getElementsByClassName('cd');
      for (var i = 0; i < cds.length; i++) { var end = +cds[i].getAttribute('data-end'); cds[i].innerHTML = U.dur(Math.max(0, end - now)); }
      var fc = document.getElementById('freeCd'); if (fc) { var fl = G.freeGiftLeft(); if (fl > 0) fc.innerHTML = U.dur(fl); else { var gp = fc.parentNode, ga = gp && gp.parentNode; gp.innerHTML = '免費禮物'; if (ga && !ga.getElementsByClassName('dot').length) { var dt = document.createElement('i'); dt.className = 'dot'; ga.appendChild(dt); } } }
      var rg = document.getElementsByClassName('regen'); if (rg[0]) rg[0].innerHTML = U.dur(G.nextEnergyIn()) + ' 後 +1';
      var busy = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
      var needRender = (S.state.player.energy !== lastEnergy) || (fc && G.freeGiftLeft() <= 0) || (cds.length && U.find(cds, function (c) { return +c.getAttribute('data-end') <= now; }));
      if (needRender && !busy && UI.screen !== 'battle' && UI.screen !== 'newgame') UI.render();
      lastEnergy = S.state.player.energy;
      if (secs % 30 === 0) S.save(false);
    }, 1000);
    function flush() { if (S.state) S.save(false); }
    window.addEventListener('pagehide', flush, false);
    window.addEventListener('beforeunload', flush, false);
    document.addEventListener('visibilitychange', function () { if (document.hidden) flush(); }, false);
    MJ.booted = true;
    // 載入畫面：顯示進度與輪播小提示，最少停留 0.9 秒讓提示可讀
    var ld = document.getElementById('loading'), bar = document.getElementById('ldBar'), tip = document.getElementById('ldTip');
    if (ld) {
      if (bar) bar.style.width = '100%';
      var TIPS = MJ.LOAD_TIPS, ti = 0;
      var tv = setInterval(function () { ti = (ti + 1) % TIPS.length; if (tip) tip.innerHTML = TIPS[ti]; }, 2500);
      setTimeout(function () { ld.className = 'out'; clearInterval(tv); setTimeout(function () { if (ld.parentNode) ld.parentNode.removeChild(ld); }, 450); }, 900);
    }
  };
  // 第一則：A（影片3 載入畫面原文）；其餘：D（本作撰寫）
  MJ.LOAD_TIPS = [
    '小提示：物理攻擊對體力高、法術攻擊對智力高、絕技攻擊對敏捷高的武將，裝備、屬性培養等是不一樣的。',
    '小提示：無雙值滿 100 會自動施放無雙絕技，攻擊與受擊都會累積無雙值。',
    '小提示：出手順序是雙方交替，前排先動，同一列由下往上。',
    '小提示：戰鬥超過 36 回合仍未分出勝負，進攻方判定失敗。',
    '小提示：到神武殿按「最強」可一鍵換上最好的裝備。',
    '小提示：存檔只放在這台裝置的瀏覽器裡，記得在「設置」匯出備份。',
    '小提示：通天塔戰敗沒有任何損失，每天還能領一次塔俸。',
    '小提示：無極幻境是連戰，生命與無雙值會延續到下一波。',
    '小提示：農田離線也會成長，施化肥可以縮短一半的剩餘時間。',
    '小提示：第五章起的首領有多層血條，要打掉每一層才算擊倒。',
    '小提示：右上角的喇叭可以一鍵靜音。'
  ];
})();

</script>

<script>
(function () {
  function t(name, fn) { try { var r = fn(); rep(r === 'warn' ? 'warn' : !!r, name + (typeof r === 'string' && r !== 'warn' ? '：' + r : '')); } catch (e) { rep(false, name + '：' + e.message); } }
  rep(true, '瀏覽器：' + navigator.userAgent);
  t('JSON', function () { return JSON.parse('{"a":1}').a === 1; });
  t('localStorage 可寫入', function () { try { localStorage.setItem('mjws_boottest', '1'); var ok = localStorage.getItem('mjws_boottest') === '1'; localStorage.removeItem('mjws_boottest'); return ok; } catch (e) { return 'warn'; } });
  t('CSS transform', function () { var d = document.createElement('div'); return ('transform' in d.style) || ('webkitTransform' in d.style); });
  t('SVG', function () { return !!document.createElementNS && !!document.createElementNS('http://www.w3.org/2000/svg', 'svg').createSVGRect; });
  var mods = ['U', 'D', 'Art', 'R', 'Battle', 'S', 'G', 'UI'];
  for (var i = 0; i < mods.length; i++) (function (m) { t('模組 MJ.' + m, function () { return !!(window.MJ && MJ[m]); }); })(mods[i]);
  t('MJ.boot 存在', function () { return typeof MJ.boot === 'function'; });
  t('遊戲資料', function () { MJ.G.initData(); return '武將 ' + MJ.D.heroes.list.length + '、關卡 ' + MJ.D.stages.stages.length + '、裝備 ' + MJ.D.equipment.list.length; });
  t('建立測試角色（不寫入存檔）', function () {
    var save = MJ.S.save; MJ.S.save = function () { return true; };
    try { MJ.G.newGame('測試', '力耐', 'm', 1); var l = MJ.G.lead(); return 'Lv' + l.lv + '，生命 ' + MJ.R.derived(l, MJ.S.state).hp; } finally { MJ.S.save = save; }
  });
  t('模擬戰鬥 1-1', function () {
    var save = MJ.S.save; MJ.S.save = function () { return true; };
    try { var r = MJ.G.fight('s1_1'); return r.ok ? (r.win ? '勝利' : '戰敗') + '，' + r.battle.rounds + ' 回合，事件 ' + r.battle.events.length : r.msg; } finally { MJ.S.save = save; MJ.S.state = null; }
  });
  t('畫面繪製（主城 HTML）', function () { MJ.S.state = null; var save = MJ.S.save; MJ.S.save = function () { return true; }; MJ.G.newGame('測試', '力耐', 'm', 1); var h = MJ.UI.screens.city(); MJ.S.save = save; MJ.S.state = null; return h.length > 1000; });
  var bad = 0; for (var j = 0; j < LOG.length; j++) if (LOG[j][0] === false) bad++;
  var p = document.createElement('p'); p.className = bad ? 'bad' : 'ok'; p.innerHTML = bad ? '<b>有 ' + bad + ' 項失敗</b>，請截圖回報。' : '<b>全部通過</b>。可以開啟 <a href="mengjiang.html" style="color:#ffe070">遊戲</a>。';
  document.body.appendChild(p);
  window.BOOT_TEST_DONE = { fail: bad, total: LOG.length };
})();
</script>
