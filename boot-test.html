方排隊",spec:"Tomas t23u",current:"往前走到棋盤盡頭（再走就出界）時，回到自己這一方第一排（目前最前面的我方單位那一欄）的後一欄，留在同一列；敵我雙方都一樣",grade:"C",label:"推測（玩家回憶）",sources:[{s:"TOMAS",q:"小問題修正 / 過去遊戲是每回合雙方持續往前 如果同一排對面敵人死去 一樣一直往前 直到畫面頂部時會統一到第一排後方排隊 敵人與我方都是 / 就不會有時因技能範圍打不到人 卡在中間只能挨打"}],phase:"web2-v11",tentative:true,conflicts:[],note:"「第一排後方」與「同一列」的細節見 v11.board.queue（D）。原話「統一到第一排後方排隊」也可能是指換到別列排隊，待 Tomas 確認"},{id:"v11.board.block",cat:"戰鬥",item:"持續前進時的擋路與卡住穿過",spec:"—",current:"前方那一格是隊友就停下（排隊跟著走）；是敵人就停下來打。卡住穿過：上一回合已經緊貼敵人停下、而且那一回合技能打不到人（等待），這回合前方仍是敵人時，從敵人身邊穿過去，走到同一列再往前第一個空格（到盡頭都沒有空格就回第一排後方排隊）",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v11",tentative:true,conflicts:[],note:"「卡住穿過」是為了做到 Tomas 說的「不會卡在中間只能挨打」而加的本作解讀，原版是否會穿過敵人不確定（實測：不加的話通天塔 90 層一般模型 12 場全部超時，敵人緊貼我方、我方技能打不到相鄰格）"},{id:"v11.board.queue",cat:"戰鬥",item:"走到底的排隊位置與順序",spec:"—",current:"排隊格＝我方其他活著單位裡最前面那一欄的後一欄（同一列）；那格有人就再往後一格，直到自己的底線；後面都滿了才找前面最近的空格；只剩自己一人時回到開場第一排那一欄（我方第 2 欄／敵方第 5 欄）；同一回合多人走到底時依行動順序排，後到的排在後面",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v11",tentative:true,conflicts:[]},{id:"v11.board.stale",cat:"戰鬥",item:"持續前進後的僵局判定",spec:"—",current:"連續 8 回合（走完一整排）雙方都沒有人受到傷害時結束戰鬥，以剩餘血量比例判定：我方比例嚴格大於敵方才算勝（v10 的「沒人走得動」條件在持續前進下不會成立）",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v11",tentative:true,conflicts:[]},{id:"web2.skill.rates",cat:"技能",item:"技能倍率基準",spec:"snA967 表 5：普攻、六等普攻、無雙",current:"61 名武將的 Lv1 普攻、Lv6 普攻與無雙基準採來源表；88 名中其餘未列者維持原本 D 級倍率。",grade:"B",label:"原版（當年攻略記載）",sources:[{s:"W967",q:"表 5：武將普攻、六等普攻與無雙倍率"}],phase:"web2-P3",tentative:false,conflicts:[]},{id:"web2.skill.activeCurve",cat:"技能",item:"普攻技能等級曲線",spec:"Lv1 a+5、Lv6 b+125；Lv6 後固定值每級 +50",current:"Lv1 倍率 a、Lv6 倍率 b；Lv1 固定值 +5、Lv5 +75、Lv6 +125、Lv7 起每級 +50。Lv2–5 倍率依 Lv1/Lv6 線性插值，Lv2–4 固定值依 Lv1/Lv5 線性插值，均為推估。",grade:"C",label:"推測（間接資料）",sources:[{s:"W967",q:"表 5：普攻與六等普攻基準"},{s:"W282",q:"小昭 tooltip 可見 Lv5 +75、Lv6 +125、Lv7 +175、Lv9 +275"}],phase:"web2-P3",note:"中間等級為明示的線性插值政策，非逐級截圖值；Lv5 固定值節點取小昭截圖。",tentative:true,conflicts:[]},{id:"web2.skill.ultProgression",cat:"技能",item:"無雙技能升 al();return}UI.render()};UI.modals={};UI.open=function(name,arg){UI.modal={name:name,arg:arg};UI.renderModal()};UI.close=function(){UI.modal=null;UI.renderModal();if(UI.screen!=="battle")UI.render()};UI.renderModal=function(){var m=$("modal");if(!UI.modal){m.innerHTML="";m.style.display="none";return}var fn=UI.modals[UI.modal.name];m.innerHTML=fn?fn(UI.modal.arg):"";m.style.display="block"};UI.actions.close=function(){UI.close()};UI.actions.go=function(v){UI.go(v)};UI.actions.open=function(v){UI.open(v)};UI.actions.noop=function(){};UI.actions.info=function(v){UI.toast(v)};var toastTimer=null;UI.toast=function(msg,kind){var t=$("toast");t.innerHTML='<div class="toast '+(kind||"")+'">'+U.esc(msg)+"</div>";t.className=UI.screen==="city"?"top":!UI.modal&&(UI.screen==="forge"||UI.screen==="hall"||UI.screen==="recruit")?"low":"";t.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.style.display="none"},2200)};UI.res=function(r,okMsg){if(!r.ok){UI.toast(r.msg,"bad");return false}if(okMsg)UI.toast(okMsg,"good");return true};UI.confirm=function(title,text,onYes,yesLabel){UI._confirmYes=onYes;var c=$("confirm");c.innerHTML='<div class="dim"></div><div class="frame confirm-box"><div class="plaque">'+U.esc(title)+'</div><div class="parch confirm-text">'+text+"</div>"+'<div class="btn-row"><a class="btn red" data-a="confirmYes">'+U.esc(yesLabel||"確定")+'</a><a class="btn" data-a="confirmNo">取消</a></div></div>';c.style.display="block"};UI.actions.confirmYes=function(){$("confirm").style.display="none";var f=UI._confirmYes;UI._confirmYes=null;if(f)f()};UI.actions.confirmNo=function(){$("confirm").style.display="none";UI._confirmYes=null};UI.rewardBox=function(title,lines){UI.confirm(title,'<div class="reward-list">'+(lines.length?U.map(lines,function(l){return'<div class="rw">'+U.esc(l)+"</div>"}).join(""):'<div class="rw">（沒有物品）</div>')+"</div>",null,"好的");var c=$("confirm");var btns=c.getElementsByClassName("btn");if(btns[1])btns[1].style.display="none"};UI.panel=function(title,body,opt){opt=opt||{};return'<div class="dim"'+(opt.noDimClose?"":' data-a="close"')+'></div><div class="frame panel '+(opt.cls||"")+'">'+'<div class="plaque">'+U.esc(title)+'</div><a class="xbtn" data-a="close" aria-label="關閉">×</a>'+'<div class="panel-body">'+body+"</div></div>"};UI.bar=function(cur,max,cls,text){var p=max>0?U.clamp(cur/max,0,1)*100:0;return'<div class="bar '+(cls||"")+'"><i style="width:'+p.toFixed(1)+'%"></i><b>'+(text!=null?text:U.fmt(cur)+"/"+U.fmt(max))+"</b></div>"};UI.qname=function(q){return MJ.D.config.qualityNames[q]};UI.qcls=function(q){return"q"+q};UI.portrait=function(h,opt){opt=opt||{};var def=MJ.R.heroDef(h.id),look=h.id==="lead"?MJ.S.state.player.look:def.look;var q=h.id==="lead"?MJ.R.leadQ(MJ.S.state):def.quality;return'<div class="card '+UI.qcls(q)+(opt.sel?" sel":"")+(opt.cls?" "+opt.cls:"")+'"'+(opt.act?' data-a="'+opt.act+'" data-v="'+(opt.v!=null?opt.v:h.uid)+'"':"")+">"+MJ.Art.portrait(look,q)+'<span class="lvb">'+h.lv+"</span>"+(opt.badge?'<span class="badge">'+opt.badge+"</span>":"")+'<span class="nm">'+U.esc(MJ.G.nameOf(h))+"</span></div>"};UI.qualityChips=function(act,cur){var names=MJ.D.config.equipQualityNames,h='<div class="qkind"><a class="chip'+(cur===""?" on":"")+'" data-a="'+act+'" data-v="">全部</a>';for(var i=0;i<names.length;i++)h+='<a class="chip qc'+i+(String(cur)===String(i)?" on":"")+'" data-a="'+act+'" data-v="'+i+'">'+names[i]+"</a>";return h+"</div>"};UI.pager=function(key,items,per,renderFn,emptyText){var pages=Math.max(1,Math.ceil(items.length/per));var p=U.clamp(UI.page[key]||0,0,pages-1);UI.page[key]=p;var slice=items.slice(p*per,p*per+per),html="";if(!items.length)html='<div class="empty">'+U.esc(emptyText||"空")+"</div>";else U.each(slice,function(it,i){html+=renderFn(it,p*per+i)});return{html:html,nav:'<div class="pager"><a class="pbtn'+(p<=0?" disabled":"")+'" data-a="pg" data-v="'+key+':-1">◀</a><span>'+(p+1)+"/"+pages+'</span><a class="pbtn'+(p>=pages-1?" disabled":" <script>
