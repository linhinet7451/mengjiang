<script>/* js/battle.js */

      var sk = skill;
      if (isUlt) { sk = U.extend({}, skill); sk.ultTotal = { v: 0 }; }
      U.each(foes, function (f) { if (f.hp > 0 && cells.indexOf(f.cell) >= 0) hurt(u, f, sk, false); });
      if (isUlt) ev.push({ t: 'ultEnd', u: u.key, total: sk.ultTotal.v });
      var pc = pending; pending = [];
      U.each(pc, function (p) {
        if (p.a.hp <= 0 || p.b.hp <= 0) return;
        ev.push({ t: 'act', u: p.a.key, skill: '反擊', ult: false, cells: [p.b.cell], side: p.b.side, target: p.b.key, counter: true });
        ev.push({ t: 'text', to: p.a.key, s: '反擊', c: 'red' });
        hurt(p.a, p.b, { mult: 1, flat: 0 }, true);
      });
      if (skill.fx && skill.fx.buffDef) {
        U.each(alive(alliesOf(u)), function (m) { m.defBuff = skill.fx.buffDef; m.defBuffT = 2; ev.push({ t: 'text', to: m.key, s: '物防+' + Math.round(skill.fx.buffDef * 100) + '%', c: 'green' }); });
      }
    }
    var round = 0, winner = null;
    ev.push({ t: 'start', units: U.map(all, snapshot) });
    while (round < maxRounds && !winner) {
      round++;
      ev.push({ t: 'round', n: round });
      var order = B.turnOrder(A, Bs);
      for (var i = 0; i < order.length && !winner; i++) {
        var u = order[i];
        if (u.hp <= 0) continue; // 陣亡單位不行動
        if (u.defBuffT) { u.defBuffT--; if (!u.defBuffT) u.defBuff = 0; }
        if (u.stun) { u.stun = 0; ev.push({ t: 'skip', u: u.key, why: '眩暈' }); continue; }
        if (u.passive === 'liaoshang' && u.hp < u.maxHp && rng() < 0.5) {
          var hv = Math.floor(u.maxHp * 0.08 * u.pm); u.hp = Math.min(u.maxHp, u.hp + hv);
          ev.push({ t: 'text', to: u.key, s: '療傷', c: 'green' }); ev.push({ t: 'heal', to: u.key, amt: hv, hp: u.hp });
        }
        var isUlt = u.rage >= 100;
        if (isUlt) u.rage = 0;
        useSkill(u, isUlt ? u.ult : u.active, isUlt);
        if (u.hp > 0 && !isUlt) gainRage(u, 25 + Math.floor(rng() * 11));
        if (u.hp > 0 && u.passive === 'lianzhan' && alive(foesOf(u)).length && rng() < Math.min(0.5, 0.2 * u.pm)) {
          ev.push({ t: 'text', to: u.key, s: '2連擊', c: 'red' });
          useSkill(u, u.active, false);
        }
        if (!alive(Bs).length) winner = 'A';
        else if (!alive(A).length) winner = 'B';
      }
    }
    var win = winner === 'A';
    ev.push({ t: 'end', win: win, timeout: !winner, rounds: round });
    return {
      win: win, timeout: !winner, rounds: round, events: ev,
      deadA: U.filter(A, function (u) { return u.hp <= 0; }).length,
      units: U.map(all, function (u) { return { key: u.key, side: u.side, cell: u.cell, name: u.name, hp: u.hp, maxHp: u.maxHp, rage: u.rage, hid: u.hid }; })
    };
  };
  return B;
})();

<script>/* js/state.js */
/* 存檔：LocalStorage 自動存檔、手動存檔、匯出/匯入（含驗證）、重置、版本遷移 */
MJ.S = (function () {
  var S = {}, U = MJ.U;
  S.KEY = 'mjws_save';
  S.BACKUP_KEY = 'mjws_save_backup';
  S.VERSION = 4; // v1=第一階段 v2=第二階段養成 v3=第三階段副本與經濟 v4=第四階段音效與拜訪武將
  S.RELEASE = '正式版（第五階段＋奇遇）';
  S.APP = 'mengjiang-remake';
  S.state = null;
  S.lastSave = 0;
  S.storageOk = true;

  function ls() { try { return window.localStorage; } catch (e) { return null; } }
  S.storageAvailable = function () {
    var s = ls(); if (!s) return false;
    try { s.setItem('__mj_t', '1'); s.removeItem('__mj_t'); return true; } catch (e) { return false; }
  };
  // 驗證：回傳錯誤訊息陣列，空陣列代表通過
  S.validate = function (st) {
    var err = [];
    function need(cond, msg) { if (!cond) err.push(msg); }
    need(st && typeof st === 'object', '存檔不是物件');
    if (err.length) return err;
    need(typeof st.version === 'number', '缺少版本號 version');
    need(st.version <= S.VERSION, '存檔版本 ' + st.version + ' 比遊戲新，無法讀取');
    need(st.player && typeof st.player.name === 'string', '缺少玩家資料');
    if (st.player) {
      need(typeof st.player.gold === 'number' && st.player.gold >= 0, '金幣數值錯誤');
      need(typeof st.player.silver === 'number' && st.player.silver >= 0, '銀幣數值錯誤');
      need(typeof st.player.energy === 'number' && st.player.energy >= 0, '精力數值錯誤');
    }
    need(U.isArray(st.heroes) && st.heroes.length > 0, '武將列表錯誤');
    if (U.isArray(st.heroes)) {
      var hasLead = false, uids = {};
      U.each(st.heroes, function (h) {
        if (!h || typeof h.uid !== 'number' || typeof h.lv !== 'number' || h.lv < 1) { err.push('武將資料格式錯誤'); return; }
        if (uids[h.uid]) err.push('武將編號重複'); uids[h.uid] = 1;
        if (h.id === 'lead') hasLead = true;
        else if (MJ.D && !MJ.D.heroIndex[h.id]) err.push('未知武將：' + h.id);
      });
      need(hasLead, '缺少主角');
    }
    need(st.team && st.team.cells && typeof st.team.formation === 'string', '陣容資料錯誤');
    need(st.bag && U.isArray(st.bag.equips) && st.bag.stack && typeof st.bag.stack === 'object', '包裹資料錯誤');
    need(st.stages && typeof st.stages === 'object', '關卡資料錯誤');
    return err;
  };
  // 預設欄位（可重複呼叫、不覆蓋既有值）
  function def(o, k, v) { if (o[k] == null) o[k] = v; return o[k]; }
  S.equipDefaults = function (e) { if (!e) return e; def(e, 'plus', 0); def(e, 'aff', []); def(e, 'gems', []); return e; };
  S.heroDefaults = function (h) {
    def(h, 'eq', {}); def(h, 'sk', { a: 1, u: 1, p: 1 }); def(h, 'py', { str: 0, int: 0, agi: 0, con: 0 }); def(h, 'xf', []); def(h, 'star', 0);
    U.each(U.keys(h.eq), function (k) { S.equipDefaults(h.eq[k]); });
    return h;
  };
  S.applyDefaults = function (st) {
    def(st, 'codex', {}); def(st, 'jiangxing', { lit: 0, pts: 0 });
    def(st, 'counters', {});
    if (st.player) def(st.player, 'xinghun', 0);
    if (st.settings) def(st.settings, 'econ', st.settings.energyMode === 'fast' ? 'fast' : 'std');
    if (st.buildings) def(st.buildings, 'shenbing', 1);
    U.each(st.heroes || [], function (h) { if (h) { S.heroDefaults(h); if (h.id !== 'lead') st.codex[h.id] = 1; } });
    if (st.bag && st.bag.equips) U.each(st.bag.equips, S.equipDefaults);
    U.each(st.mail || [], function (m) { if (m && m.att && m.att.equips) U.each(m.att.equips, S.equipDefaults); });
    if (S.extraDefaults) U.each(S.extraDefaults, function (f) { f(st); });
    return st;
  };
  // 版本升級步驟：S.STEPS[n] 把 vn 轉成 vn+1
  S.STEPS = {
    1: function (st) { if (st.settings && st.settings.energyMode == null) st.settings.energyMode = 'original'; },
    2: function (st) { if (st.settings && st.settings.econ == null) st.settings.econ = st.settings.energyMode === 'fast' ? 'fast' : 'std'; },
    3: function (st) { if (st.settings) { if (st.settings.bgm == null) st.settings.bgm = true; if (st.settings.sfx == null) st.settings.sfx = true; } }
  };
  // 遷移：舊版本存檔逐步升級
  S.migrate = function (st) {
    if (!st || typeof st !== 'object') return st;
    if (!st.version) st.version = 1;
    if (st.version > S.VERSION) return st; // 交給 validate 回報
    if (st.version < S.VERSION && !st.migratedFrom) st.migratedFrom = st.version;
    // 逐版升級步驟（每一步只做該版本需要的轉換；欄位補齊統一交給 applyDefaults）
    for (var v = st.version; v < S.VERSION; v++) if (S.STEPS[v]) { try { S.STEPS[v](st); } catch (e) { /* 單一步驟失敗不影響其餘欄位補齊 */ } }
    S.applyDefaults(st);
    st.version = S.VERSION;
    return st;
  };
  S.wrap = function (st) {
    return { app: S.APP, version: S.VERSION, savedAt: Date.now(), data: st };
  };
  S.parse = function (text) {
    var obj;
    try { obj = JSON.parse(text); } catch (e) { return { ok: false, errors: ['不是有效的 JSON 檔案'] }; }
    if (!obj || obj.app !== S.APP || !obj.data) return { ok: false, errors: ['不是《猛將無雙》重製版的存檔'] };
    var st = S.migrate(obj.data);
    var errs = S.validate(st);
    if (errs.length) return { ok: false, errors: errs };
    return { ok: true, state: st, savedAt: obj.savedAt };
  };
  S.save = function (manual) {
    if (!S.state) return false;
    var s = ls();
    if (!s) { S.storageOk = false; return false; }
    try {
      var text = JSON.stringify(S.wrap(S.state));
      if (manual) { var old = s.getItem(S.KEY); if (old) s.setItem(S.BACKUP_KEY, old); }
      s.setItem(S.KEY, text);
      S.lastSave = Date.now(); S.storageOk = true;
      return true;
    } catch (e) { S.storageOk = false; return false; }
  };
  S.load = function () {
    var s = ls(); if (!s) return { ok: false, none: true };
    var text = null;
    try { text = s.getItem(S.KEY); } catch (e) { }
    if (!text) return { ok: false, none: true };
    var r = S.parse(text);
    if (!r.ok) {
      // 主存檔損壞時嘗試備份
      var b = null; try { b = s.getItem(S.BACKUP_KEY); } catch (e2) { }
      if (b) { var rb = S.parse(b); if (rb.ok) { rb.fromBackup = true; return rb; } }
    }
    return r;
  };
  S.exportText = function () { return JSON.stringify(S.wrap(S.state), null, 1); };
  S.reset = function () {
    var s = ls();
    if (s) { try { s.removeItem(S.KEY); s.removeItem(S.BACKUP_KEY); } catch (e) { } }
    S.state = null;
  };
  return S;
})();

</script>
<script>/* js/game.js */
/* 遊戲動作：所有會改變存檔的操作都在這裡，UI 只呼叫這些函式 */
MJ.G = (function () {
  var G = {}, U = MJ.U, R = MJ.R;
  var SLOTS = R.SLOTS; // 第二階段：6 部位（A：影片中裝備欄位多於 4 格；C：部位名稱）
  G.SLOTS = SLOTS;
  G.SLOT_NAMES = { weapon: '武器', helm: '頭盔', armor: '盔甲', cape: '披風', belt: '腰帶', ring: '飾品' };
  G.BAG_CAP = 60; // D
  G.TIANWANG = ['zhangjiao', 'qiuchuji', 'yuelingshan', 'luzhangke', 'huaxiong', 'caiwenji']; // B：六大天王

  G.lead = function (s) { s = s || st(); return U.find(s.heroes, function (h) { return h.id === 'lead'; }); };

  G.log = function (text, kind) {

  G.commit = function () { MJ.S.save(false); if (G.onChange) G.onChange(); };

  // ---------- 新遊戲 ----------
  G.newGame = function (name, leadType, gender, seed) {
    var rng = U.rng(seed || (U.now() & 0x7fffffff));
    name = String(name || '').replace(/^\s+|\s+$/g, '').slice(0, 8) || '無名俠客';
    if (!C().leadTypes[leadType]) leadType = '力耐';
    var look = U.clone(MJ.D.heroes.lead.look);
    if (gender === 'f') { look.g = 'f'; look.hs = 'long'; look.cloth = '#ad1457'; look.trim = '#ffd54f'; }
    var s = {
      version: MJ.S.VERSION, created: U.now(),
      player: { name: name, gender: gender === 'f' ? 'f' : 'm', leadType: leadType, gold: 50, silver: 3000, energy: R.energyMax(1), energyTs: U.now(), look: look },
      heroes: [], team: { formation: 'fangyuan', cells: {} },
      bag: { stack: {}, equips: [] }, stages: {}, firstClaimed: {},
      recruit: { cands: [], normalUsed: 0, normalDay: U.dayKey(), cd: {}, firstDone: {} },
      buildings: { shenwu: 1, juxian: 1, xukong: 1 },
      training: null, mail: [], tasksClaimed: {}, gifts: { opening: false, sevenDay: [], lastDay: '' },
      stats: { recruits: 0, battles: 0, wins: 0 }, log: [], settings: { speed: 1, rotate: true, energyMode: 'original' },
      nextUid: 1, freeGiftTs: U.now()
    };
    MJ.S.state = s;
    MJ.S.applyDefaults(s);
    var lead = G.newHero('lead', s);
    s.heroes.push(lead);
    // B：新手教學贈送 2 名隨機六大天王
    var pool = G.TIANWANG.slice(), picks = [];
    while (picks.length < 2) { var i = Math.floor(rng() * pool.length); picks.push(pool.splice(i, 1)[0]); }
    U.each(picks, function (id) { s.heroes.push(G.newHero(id, s)); });
    s.team.cells = { 3: s.heroes[0].uid, 0: s.heroes[1].uid, 6: s.heroes[2].uid };
    // 新手白裝
    G.addEquip('wp1', 0, true); G.addEquip('ar1', 0, true);
    G.addItem('jinglitang', 2, true);
    G.rerollCands('init', rng);
    G.log('歡迎來到猛將無雙！' + R.heroDef(picks[0]).name + '、' + R.heroDef(picks[1]).name + ' 前來投奔。', 'sys');
    s.mail.push({ id: 1, title: '江湖新人禮', text: '少俠初入江湖，略備薄禮。', att: { silver: 1000, items: [{ item: 'tufeiling', n: 2 }] }, read: false, claimed: false, t: U.now() });
    G.commit();
    return s;
  };

  G.newHero = function (id, s) {
    s = s || st();
    if (id !== 'lead') { s.codex = s.codex || {}; s.codex[id] = 1; }
    return { uid: s.nextUid++, id: id, lv: 1, exp: 0, eq: {}, sk: { a: 1, u: 1, p: 1 }, py: { str: 0, int: 0, agi: 0, con: 0 }, xf: [], star: 0 };
  };

  // ---------- 精力 ----------
  G.regenMinutes = function () { var s = st(); return C().energyRegenMinutes[s.settings.energyMode === 'fast' ? 'fast' : 'original']; };
  G.tick = function () {
    var s = st(); if (!s) return;
    var max = R.energyMax(G.lead().lv), per = G.regenMinutes() * 60000, now = U.now();
    if (s.player.energy >= max) { s.player.energyTs = now; return; }
    var n = Math.floor((now - s.player.energyTs) / per);
    if (n > 0) { s.player.energy = Math.min(max, s.player.energy + n); s.player.energyTs += n * per; }
    if (s.player.energy >= max) s.player.energyTs = now;
  };
  G.nextEnergyIn = function () { var s = st(); return Math.max(0, s.player.energyTs + G.regenMinutes() * 60000 - U.now()); };

  // ---------- 包裹 ----------
  G.bagUsed = function () { var s = st(); return s.bag.equips.length + U.filter(U.keys(s.bag.stack), function (k) { return s.bag.stack[k] > 0 && k.indexOf('soul:') !== 0; }).length; };
  G.addEquip = function (t, q, silent) {
    var s = st(), e = { uid: s.nextUid++, t: t, q: q || 0, plus: 0, aff: [], gems: [] };
    if (G.bagUsed() >= G.BAG_CAP) { G.mailOverflow({ equips: [e] }); return e; }
    s.bag.equips.push(e);
    return e;
  };
  G.addItem = function (key, n) {
    var s = st();
    if (key.indexOf('soul:') !== 0 && !s.bag.stack[key] && G.bagUsed() >= G.BAG_CAP) { G.mailOverflow({ items: [{ item: key, n: n }] }); return; }
    s.bag.stack[key] = (s.bag.stack[key] || 0) + n;
  };
  G.mailOverflow = function (att) {
    var s = st();
    s.mail.push({ id: s.nextUid++, title: '包裹已滿', text: '包裹空間不足，物品已轉寄郵件。', att: att, read: false, claimed: false, t: U.now() });
  };
  G.itemName = function (key) {
    if (key.indexOf('soul:') === 0) { var d = R.heroDef(key.slice(5)); return (d ? d.name : '?') + '將魂'; }
    if (key.indexOf('eq:') === 0) { var t = R.equipTpl(key.slice(3)); return t ? t.name : key; }
    var it = MJ.D.equipment.items[key]; return it ? it.name : key;
  };
  // 發放獎勵 {gold, silver, items:[{item,n,q}]}，回傳文字列表
  G.grant = function (rw) {
    var s = st(), out = [];
    if (rw.gold) { s.player.gold += rw.gold; out.push('金幣 ×' + rw.gold); }
    if (rw.silver) { s.player.silver += rw.silver; out.push('銀幣 ×' + rw.silver); }
    if (rw.energy) { s.player.energy += rw.energy; out.push('精力 +' + rw.energy); }
    U.each(rw.items || [], function (it) {
      if (it.item.indexOf('eq:') === 0) { G.addEquip(it.item.slice(3), it.q || 0); out.push(C().equipQualityNames[it.q || 0] + '·' + G.itemName(it.item)); }
      else { G.addItem(it.item, it.n || 1); out.push(G.itemName(it.item) + ' ×' + (it.n || 1)); }
    });
    U.each(rw.equips || [], function (e) { if (G.bagUsed() < G.BAG_CAP) s.bag.equips.push(e); else G.mailOverflow({ equips: [e] }); out.push(G.itemName('eq:' + e.t)); });
    return out;
  };

  // ---------- 經驗 / 升級 ----------
  G.addExp = function (h, n) {
    var s = st(), lead = G.lead(), ups = 0;
    if (h.lv >= R.maxLevel) return 0;
    h.exp += n;
    while (h.exp >= R.expNeed(h.lv) && h.lv < R.maxLevel) {
      if (h.id !== 'lead' && h.lv >= lead.lv) { h.exp = Math.min(h.exp, R.expNeed(h.lv) - 1); break; } // B：武將不可超過主角等級
      h.exp -= R.expNeed(h.lv); h.lv++; ups++;
      if (h.id === 'lead') {
        s.player.energy = Math.max(s.player.energy, R.energyMax(h.lv)); // B：主角升級補滿精力
        G.log('主角升到 ' + h.lv + ' 級！精力已補滿。', 'lv');
      }
    }
    return ups;
  };

  // ---------- 陣容 ----------
  G.formation = function () { return MJ.D.formIndex[st().team.formation] || MJ.D.formations[0]; };
  G.teamList = function () {
    var s = st(), out = [];
    U.each(U.keys(s.team.cells), function (c) { var h = G.hero(s.team.cells[c]); if (h) out.push({ cell: +c, hero: h }); });
    out.sort(function (a, b) { return a.cell - b.cell; });
    return out;
  };
  // 第二階段：上陣人數超過陣法格數時開放全部 9 格（A：後期 9 人上陣；D：解鎖方式）
  G.openCells = function () {
    var f = G.formation();
    return R.teamSlots(G.lead().lv) > f.cells.length ? [0, 1, 2, 3, 4, 5, 6, 7, 8] : f.cells;
  };
  G.inTeam = function (uid) { var s = st(); return U.find(U.keys(s.team.cells), function (c) { return s.team.cells[c] === uid; }); };
  G.teamCount = function () { return G.teamList().length; };
  G.setCell = function (cell, uid) {
    var s = st(), f = G.formation();
    if (G.openCells().indexOf(cell) < 0) return fail('此陣法不開放這個位置');
    var h = G.hero(uid); if (!h) return fail('找不到武將');
    var cur = G.inTeam(uid);
    if (cur != null) delete s.team.cells[cur];
    var occupant = s.team.cells[cell];
    if (occupant && cur != null) s.team.cells[cur] = occupant; // 互換
    else if (!occupant && cur == null && G.teamCount() >= R.teamSlots(G.lead().lv)) return fail('出戰人數已達上限（' + R.teamSlots(G.lead().lv) + ' 人）');
    s.team.cells[cell] = uid;
    G.commit(); return ok();
  };
  G.addToTeam = function (uid) {
    var f = G.formation(), s = st();
    if (G.inTeam(uid) != null) return fail('已在陣中');
    if (G.teamCount() >= R.teamSlots(G.lead().lv)) return fail('出戰人數已達上限（' + R.teamSlots(G.lead().lv) + ' 人）');
    var free = U.find(G.openCells(), function (c) { return !s.team.cells[c]; });
    if (free == null) return fail('陣法沒有空位');
    return G.setCell(free, uid);
  };
  G.removeFromTeam = function (uid) {
    var s = st(), c = G.inTeam(uid);
    if (c == null) return fail('不在陣中');
    if (G.hero(uid).id === 'lead') return fail('主角必須出戰');
    delete s.team.cells[c]; G.commit(); return ok();
  };
  G.setFormation = function (fid) {
    var s = st(), f = MJ.D.formIndex[fid]; if (!f) return fail('未知陣法');
    if (f.open && G.lead().lv < f.open) return fail('主角 ' + f.open + ' 級開放此陣法');
    var list = G.teamList(); s.team.formation = fid; s.team.cells = {};
    // 依原順序搬到新陣法可用格
    var oc = G.openCells();
    U.each(list, function (x, i) { if (i < oc.length) s.team.cells[oc[i]] = x.hero.uid; });
    G.commit(); return ok();
  };

  // ---------- 聚賢莊 ----------
  G.recruitKinds = ['normal', 'baijin', 'zijin', 'zhizun'];
  G.rerollCands = function (kind, rng) {
    var s = st(), cfg = C().recruit[kind === 'init' ? 'normal' : kind];
    rng = rng || U.rng((U.now() ^ (s.nextUid * 7919)) >>> 0);
    var owned = {}; U.each(s.heroes, function (h) { owned[h.id] = 1; });
    var out = [], used = {};
    for (var i = 0; i < 4; i++) {
      var q = U.pickWeighted(cfg.odds, rng());
      if (i === 0 && cfg.firstMin && !s.recruit.firstDone[kind]) q = Math.max(q, cfg.firstMin); // B：首次紫金/至尊保底
      var pool = [];
      for (var qq = q; qq >= 0 && !pool.length; qq--) {
        pool = U.filter(MJ.D.heroes.list, function (h) { return h.quality === qq && !owned[h.id] && !used[h.id]; });
      }
      if (!pool.length) break;
      var pick = pool[Math.floor(rng() * pool.length)];
      used[pick.id] = 1; out.push(pick.id);
    }
    if (cfg.firstMin) s.recruit.firstDone[kind] = true;
    s.recruit.cands = out;
    return out;
  };
  G.recruitStatus = function (kind) {
    var s = st(), cfg = C().recruit[kind], now = U.now();
    if (kind === 'normal' && s.recruit.normalDay !== U.dayKey()) { s.recruit.normalDay = U.dayKey(); s.recruit.normalUsed = 0; }
    var cdEnd = s.recruit.cd[kind] || 0;
    return { cfg: cfg, cdLeft: Math.max(0, cdEnd - now), left: kind === 'normal' ? cfg.daily - s.recruit.normalUsed : null };
  };
  G.refresh = function (kind, payGold) {
    var s = st(), stt = G.recruitStatus(kind);
    if (!stt.cfg) return fail('未知刷新方式');
    if (kind === 'normal' && stt.left <= 0) return fail('今日普通刷新次數已用完（每日 ' + stt.cfg.daily + ' 次）');
    var cost = 0;
    if (stt.cdLeft > 0) {
      if (!payGold) return fail('冷卻中，剩餘 ' + U.dur(stt.cdLeft));
      cost = stt.cfg.skipGold;
      if (s.player.gold < cost) return fail('金幣不足（需要 ' + cost + '）');
      s.player.gold -= cost;
    }
    if (kind === 'normal') s.recruit.normalUsed++;
    s.recruit.cd[kind] = U.now() + stt.cfg.cdMin * 60000;
    G.rerollCands(kind);
    G.commit();
    return ok({ cost: cost, cands: s.recruit.cands });
  };
  G.recruitCost = function (id) { return C().recruitCost[R.heroDef(id).quality]; };
  G.recruit = function (id) {
    var s = st(), def = R.heroDef(id);
    if (!def || s.recruit.cands.indexOf(id) < 0) return fail('此武將不在拜訪名單中');
    if (U.find(s.heroes, function (h) { return h.id === id; })) return fail('已擁有此武將');
    if (s.heroes.length >= R.rosterCap(s)) return fail('武將數已滿（' + s.heroes.length + '/' + R.rosterCap(s) + '），請先解僱或升級聚賢莊');
    var cost = G.recruitCost(id);
    if (s.player.silver < cost) return fail('銀幣不足（需要 ' + U.fmt(cost) + '）');
    s.player.silver -= cost;
    var h = G.newHero(id, s);
    s.heroes.push(h);
    s.recruit.cands.splice(s.recruit.cands.indexOf(id), 1);
    s.stats.recruits++;
    G.log('你在聚賢莊招募了【' + C().qualityNames[def.quality] + '】' + def.name + '！', 'recruit');
    G.commit();
    return ok({ hero: h });
  };
  G.dismiss = function (uid) {
    var s = st(), h = G.hero(uid);
    if (!h) return fail('找不到武將');
    if (h.id === 'lead') return fail('主角不能解僱');
    var def = R.heroDef(h.id), n = C().dismissSouls[def.quality];
    // 卸下裝備回包裹
    U.each(SLOTS, function (sl) { if (h.eq[sl]) { if (G.bagUsed() < G.BAG_CAP) s.bag.equips.push(h.eq[sl]); else G.mailOverflow({ equips: [h.eq[sl]] }); } });
    var c = G.inTeam(uid); if (c != null) delete s.team.cells[c];
    s.heroes.splice(s.heroes.indexOf(h), 1);
    if (s.training && s.training.uid === uid) s.training = null;
    if (n > 0) G.addItem('soul:' + h.id, n);
    G.log('解僱了 ' + def.name + (n > 0 ? '，獲得將魂 ×' + n + '。' : '。黑色武將不能遣散成將魂（B：攻略）。'), 'sys');
    G.commit();
    return ok({ souls: n });
  };
  G.summon = function (id) {
    var s = st(), def = R.heroDef(id), have = s.bag.stack['soul:' + id] || 0;
    if (!def) return fail('未知武將');
    if (U.find(s.heroes, function (h) { return h.id === id; })) return fail('已擁有此武將');
    if (have < def.souls) return fail('將魂不足（' + have + '/' + def.souls + '）');
    if (s.heroes.length >= R.rosterCap(s)) return fail('武將數已滿');
    s.bag.stack['soul:' + id] = have - def.souls;
    if (!s.bag.stack['soul:' + id]) delete s.bag.stack['soul:' + id];
    s.heroes.push(G.newHero(id, s));
    G.log('以將魂召喚了 ' + def.name + '！', 'recruit');
    G.commit(); return ok();
  };

  // ---------- 裝備 ----------
  G.equip = function (heroUid, equipUid) {
    var s = st(), h = G.hero(heroUid);
    var e = U.find(s.bag.equips, function (x) { return x.uid === equipUid; });
    if (!h || !e) return fail('找不到武將或裝備');
    var tpl = R.equipTpl(e.t);
    if (h.lv < tpl.lv) return fail('需要等級 ' + tpl.lv);
    s.bag.equips.splice(s.bag.equips.indexOf(e), 1);
    var old = h.eq[tpl.slot];
    h.eq[tpl.slot] = e;
    if (old) s.bag.equips.push(old);
    G.commit(); return ok({ old: old });
  };
  G.unequip = function (heroUid, slot) {
    var s = st(), h = G.hero(heroUid);
    if (!h || !h.eq[slot]) return fail('此部位沒有裝備');
    if (G.bagUsed() >= G.BAG_CAP) return fail('包裹已滿');
    s.bag.equips.push(h.eq[slot]); delete h.eq[slot];
    G.commit(); return ok();
  };
  G.autoEquip = function (heroUid) { // 「最強」按鈕
    var s = st(), h = G.hero(heroUid), changed = 0;
    if (!h) return fail('找不到武將');
    var d = R.derived(h, s);
    U.each(SLOTS, function (slot) {
      var best = h.eq[slot], bestScore = best ? R.equipScore(best) : -1;
      U.each(s.bag.equips, function (e) {
        var tpl = R.equipTpl(e.t);
        if (tpl.slot !== slot || tpl.lv > h.lv) return;
        if (slot === 'weapon') { var wk = { p: 'patk', m: 'matk', j: 'jatk' }[d.dtype]; if (!tpl.stats[wk]) return; }
        var sc = R.equipScore(e);
        if (sc > bestScore) { best = e; bestScore = sc; }
      });
      if (best && best !== h.eq[slot]) {
        s.bag.equips.splice(s.bag.equips.indexOf(best), 1);
        if (h.eq[slot]) s.bag.equips.push(h.eq[slot]);
        h.eq[slot] = best; changed++;
      }
    });
    G.commit(); return ok({ changed: changed });
  };
  G.sellEquip = function (uid) {
    var s = st(), e = U.find(s.bag.equips, function (x) { return x.uid === uid; });
    if (!e) return fail('找不到裝備');
    var p = R.equipSell(e); s.bag.equips.splice(s.bag.equips.indexOf(e), 1); s.player.silver += p;
    G.commit(); return ok({ silver: p });
  };

  // ---------- 道具 ----------
  G.useItem = function (key, heroUid) {
    var s = st(), it = MJ.D.equipment.items[key];
    if (!it || !s.bag.stack[key]) return fail('沒有這個道具');
    var u = it.use, msg = '';
    if (u.energy) { s.player.energy += u.energy; msg = '精力 +' + u.energy; }
    else if (u.silver) { s.player.silver += u.silver; msg = '銀幣 +' + u.silver; }
    else if (u.heroExp) {
      var h = G.hero(heroUid);
      if (!h) return fail('請選擇武將');
      if (h.id === 'lead') return fail('突飛令不能對主角使用');
      var lead = G.lead();
      if (h.lv >= lead.lv && h.exp >= R.expNeed(h.lv) - 1) return fail('武將等級不能超過主角');
      var n = h.lv * u.heroExp; G.addExp(h, n); msg = G.nameOf(h) + ' 經驗 +' + n;
    }
    s.bag.stack[key]--; if (!s.bag.stack[key]) delete s.bag.stack[key];
    G.commit(); return ok({ msg: msg });
  };

  // ---------- 商城 ----------
  G.buy = function (sid) {
    var s = st(), e = U.find(MJ.D.shop, function (x) { return x.id === sid; });
    if (!e) return fail('商品不存在');
    var cur = e.price.silver ? 'silver' : 'gold', p = e.price[cur];
    if (s.player[cur] < p) return fail((cur === 'silver' ? '銀幣' : '金幣') + '不足');
    if (G.bagUsed() >= G.BAG_CAP && (e.item.indexOf('eq:') === 0 || !s.bag.stack[e.item])) return fail('包裹已滿');
    s.player[cur] -= p;
    var got = G.grant({ items: [{ item: e.item, q: e.q, n: e.n || 1 }] });
    G.commit(); return ok({ got: got });
  };

  // ---------- 虛空之門 ----------
  G.stageState = function (id) { return st().stages[id] || { stars: 0, clears: 0 }; };
  G.chapterUnlocked = function (ch) {
    var c = U.find(MJ.D.stages.chapters, function (x) { return x.id === ch; });
    return c && G.lead().lv >= c.lv && G.stageUnlocked('s' + ch + '_1', true);
  };
  G.stageUnlocked = function (id, skipCh) {
    var sg = MJ.D.stageIndex[id]; if (!sg) return false;
    if (!skipCh && !G.chapterUnlocked(sg.ch)) return false;
    if (!sg.unlock) return true;
    if (sg.unlock === 'all3star') {
      return U.filter(MJ.D.stages.stages, function (x) { return x.ch === sg.ch && x.kind !== 'hidden' && G.stageState(x.id).stars >= 3; }).length === 8;
    }
    return G.stageState(sg.unlock).clears > 0;
  };
  G.lockReason = function (id) {
    var sg = MJ.D.stageIndex[id], c = U.find(MJ.D.stages.chapters, function (x) { return x.id === sg.ch; });
    if (G.lead().lv < c.lv) return '需要主角等級 ' + c.lv;
    if (sg.unlock === 'all3star') return '本章其他關卡全部三星後開啟';
    if (sg.unlock) return '需先通關「' + MJ.D.stageIndex[sg.unlock].name + '」';
    return '';
  };
  G.buildEnemy = function (sg) {
    return U.map(sg.enemies, function (e) { return { cell: e.cell, unit: R.enemyUnit(e, sg) }; });
  };
  G.buildTeam = function () {
    var s = st();
    return U.map(G.teamList(), function (x) { return { cell: x.cell, unit: R.heroUnit(x.hero, s) }; });
  };
  G.fight = function (id, seed) {
    var s = st(), sg = MJ.D.stageIndex[id];
    if (!sg) return fail('關卡不存在');
    if (!G.stageUnlocked(id)) return fail('關卡未解鎖：' + G.lockReason(id));
    G.tick();
    if (s.player.energy < sg.energy) return fail('精力不足（需要 ' + sg.energy + '）');
    if (!G.teamCount()) return fail('沒有出戰武將');
    seed = seed || ((U.now() ^ (s.stats.battles * 2654435761)) >>> 0) || 1;
    var team = G.buildTeam(), foes = G.buildEnemy(sg);
    // D（原創防卡關）：越戰越勇——同一關每連敗一次，我方生命與攻擊 +8%，最多 +80%，通關後歸零
    var morale = R.moraleBonus(G.stageState(id).fails || 0);
    if (morale > 0) U.each(team, function (t) { var u = t.unit; u.hp = Math.round(u.hp * (1 + morale)); u.patk = Math.round(u.patk * (1 + morale)); u.matk = Math.round(u.matk * (1 + morale)); u.jatk = Math.round(u.jatk * (1 + morale)); });
    var res = MJ.Battle.run(team, foes, { seed: seed, maxRounds: C().maxRounds, levelSuppression: C().levelSuppression });
    s.stats.battles++;
    var out = { win: res.win, battle: res, stage: sg, team: team, foes: foes, rewards: [], levelUps: [], seed: seed, energyCost: 0, morale: morale };
    var lead = G.lead();
    if (res.win) {
      s.stats.wins++;
      s.player.energy -= sg.energy; out.energyCost = sg.energy;
      var stars = res.deadA === 0 ? 3 : (res.deadA === 1 ? 2 : 1); // D：星級規則
      var ss = s.stages[id] || { stars: 0, clears: 0 };
      var first = ss.clears === 0;
      ss.clears++; ss.stars = Math.max(ss.stars, stars); ss.fails = 0; s.stages[id] = ss;
      out.stars = stars; out.first = first;
      var rng = U.rng(seed ^ 0x5bd1e995);
      var rw = { silver: Math.floor(sg.silver * (G.econ ? G.econ().reward : 1)), items: [] };
      U.each(sg.drops, function (d) { if (rng() < d.chance) rw.items.push({ item: d.item, q: d.q, n: d.n }); });
      out.rewards = G.grant(rw);
      if (first && !s.firstClaimed[id]) {
        s.firstClaimed[id] = true;
        out.firstRewards = G.grant(sg.first);
      }
      // 經驗：全隊獲得（含陣亡）
      U.each(G.teamList(), function (x) {
        var before = x.hero.lv; G.addExp(x.hero, sg.exp);
        if (x.hero.lv > before) out.levelUps.push(G.nameOf(x.hero) + ' Lv' + before + '→' + x.hero.lv);
      });
      out.exp = sg.exp;
      G.log('通關「' + sg.name + '」' + stars + '星' + (first ? '（首通）' : ''), 'battle');
    } else {
      // B：30 級前戰敗不扣精力；之後扣除
      if (lead.lv >= C().noEnergyLossBelowLevel) { s.player.energy -= sg.energy; out.energyCost = sg.energy; }
      var fs = s.stages[id] || { stars: 0, clears: 0 }; fs.fails = (fs.fails || 0) + 1; s.stages[id] = fs;
      out.nextMorale = R.moraleBonus(fs.fails);
      G.log('挑戰「' + sg.name + '」失敗' + (res.timeout ? '（超過 ' + C().maxRounds + ' 回合）' : ''), 'battle');
    }
    G.commit();
    return ok(out);
  };

  // ---------- 訓練（神武殿） ----------
  G.trainRate = function (h) { return Math.floor((h.lv * 2 + 4) * (1 + 0.1 * ((st().buildings.shenwu || 1) - 1))); }; // D：每分鐘經驗
  G.startTrain = function (uid) {
    var s = st(), h = G.hero(uid); if (!h) return fail('找不到武將');
    if (s.training) return fail('訓練位已被佔用');
    s.training = { uid: uid, ts: U.now() }; G.commit(); return ok();
  };
  G.trainGain = function () {
    var s = st(); if (!s.training) return 0; var h = G.hero(s.training.uid); if (!h) return 0;
    var min = Math.min(480, Math.floor((U.now() - s.training.ts) / 60000)); // D：最多累積 8 小時
    return min * G.trainRate(h);
  };
  G.stopTrain = function () {
    var s = st(); if (!s.training) return fail('沒有訓練中的武將');
    var h = G.hero(s.training.uid), n = G.trainGain();
    if (h && n) G.addExp(h, n);
    s.training = null; G.commit(); return ok({ exp: n, name: h ? G.nameOf(h) : '' });
  };

  // ---------- 建築升級 ----------
  G.buildingCost = function (k, lv) { return Math.floor(500 * lv * lv); }; // D
  G.upgradeBuilding = function (k) {
    var s = st(), lv = s.buildings[k] || 1;
    var bc = C().buildings[k];
    if (!bc || bc.phase || k === 'xukong') return fail('此建築不能升級');
    if (bc.open && G.lead().lv < bc.open) return fail('主角 ' + bc.open + ' 級開放');
    if (lv >= G.lead().lv) return fail('建築等級不能超過主角等級');
    var cost = G.buildingCost(k, lv);
    if (s.player.silver < cost) return fail('銀幣不足（需要 ' + U.fmt(cost) + '）');
    s.player.silver -= cost; s.buildings[k] = lv + 1;
    G.log(C().buildings[k].name + ' 升到 ' + (lv + 1) + ' 級', 'sys');
    G.commit(); return ok();
  };

  // ---------- 禮包 / 任務 / 郵件 ----------
  G.freeGiftLeft = function () { return Math.max(0, st().freeGiftTs + C().freeGiftMinutes * 60000 - U.now()); };
  G.claimFreeGift = function () {
    var s = st(); if (G.freeGiftLeft() > 0) return fail('還要等 ' + U.dur(G.freeGiftLeft()));
    s.freeGiftTs = U.now();
    var got = G.grant({ silver: 200 + G.lead().lv * 20, items: Math.random() < 0.3 ? [{ item: 'jinglitang', n: 1 }] : [] });
    G.commit(); return ok({ got: got });
  };
  G.claimOpening = function () { // B：首日送藍裝一套與 50 金
    var s = st(); if (s.gifts.opening) return fail('已領取');
    s.gifts.opening = true;
    var got = G.grant({ gold: 50, items: [{ item: 'eq:wp1', q: 2 }, { item: 'eq:ar1', q: 2 }, { item: 'eq:cp1', q: 2 }, { item: 'eq:bt1', q: 2 }] });
    G.commit(); return ok({ got: got });
  };
  G.SEVEN = [{ silver: 1000 }, { gold: 20 }, { items: [{ item: 'dabuwan', n: 1 }] }, { silver: 3000 }, { items: [{ item: 'tufeiling', n: 3 }] }, { gold: 50 }, { items: [{ item: 'eq:wp6', q: 3 }] }]; // D
  G.sevenDayState = function () {
    var s = st(), days = s.gifts.sevenDay.length, today = U.dayKey();
    return { claimed: days, canClaim: days < 7 && s.gifts.lastDay !== today };
  };
  G.claimSevenDay = function () {
    var s = st(), x = G.sevenDayState(); if (!x.canClaim) return fail(x.claimed >= 7 ? '七日禮包已全部領取' : '今天已領取，明天再來');
    s.gifts.sevenDay.push(U.dayKey()); s.gifts.lastDay = U.dayKey();
    var got = G.grant(G.SEVEN[x.claimed]); G.commit(); return ok({ got: got, day: x.claimed + 1 });
  };
  G.taskDone = function (t) {
    var s = st(), c = t.cond;
    if (c.recruits) return s.stats.recruits >= c.recruits;
    if (c.team) return G.teamCount() >= c.team;
    if (c.clear) return G.stageState(c.clear).clears > 0;
    if (c.level) return G.lead().lv >= c.level;
    if (c.heroes) return s.heroes.length >= c.heroes;
    if (c.equipped) return !!U.find(s.heroes, function (h) { return U.keys(h.eq).length >= c.equipped; });
    return false;
  };
  G.claimTask = function (id) {
    var s = st(), t = U.find(MJ.D.tasks, function (x) { return x.id === id; });
    if (!t) return fail('任務不存在'); if (s.tasksClaimed[id]) return fail('已領取');
    if (!G.taskDone(t)) return fail('任務尚未完成');
    s.tasksClaimed[id] = true; var got = G.grant(t.reward); G.commit(); return ok({ got: got });
  };
  G.claimMail = function (id) {
    var s = st(), m = U.find(s.mail, function (x) { return x.id === id; });
    if (!m) return fail('郵件不存在'); if (m.claimed) return fail('已領取');
    if (m.att && (m.att.equips || (m.att.items && m.att.items.length)) && G.bagUsed() >= G.BAG_CAP) return fail('包裹已滿');
    m.claimed = true; m.read = true; var got = m.att ? G.grant(m.att) : [];
    G.commit(); return ok({ got: got });
  };
  return G;
})();

</script>
<script>/* js/ui.js */
/* UI 核心：舞台縮放/直式旋轉、事件委派、彈窗、提示、分頁、共用元件 */
MJ.UI = (function () {
  var UI = {}, U = MJ.U;
  UI.actions = {};
  UI.page = {};       // 各列表目前頁碼
  UI.sel = {};        // 各畫面選取狀態
  UI.screen = 'city';
  UI.modal = null;    // {name, arg}
  UI.W = 960; UI.H = 600;

  function $(id) { return document.getElementById(id); }
  UI.$ = $;
  UI.q = function () { var C = MJ.D.config; return C; };

  // ---------- 舞台縮放 ----------
  UI.layout = function () {
    var st = $('stage'); if (!st) return;
    var w = window.innerWidth || document.documentElement.clientWidth, h = window.innerHeight || document.documentElement.clientHeight;
    var s = MJ.S.state, rotate = (!s || s.settings.rotate !== false) && h > w * 1.1;
    var scale, tf, left, top;
    if (rotate) {
      scale = Math.min(h / UI.W, w / UI.H);
      left = (w - UI.H * scale) / 2 + UI.H * scale; top = (h - UI.W * scale) / 2;
      tf = 'translate(' + left + 'px,' + top + 'px) rotate(90deg) scale(' + scale + ')';
    } else {
      scale = Math.min(w / UI.W, h / UI.H);
      left = (w - UI.W * scale) / 2; top = (h - UI.H * scale) / 2;
      tf = 'translate(' + left + 'px,' + top + 'px) scale(' + scale + ')';
    }
    st.style.webkitTransform = tf; st.style.transform = tf;
    UI.rotated = rotate; UI.scale = scale;
    document.body.className = rotate ? 'rot' : '';
  };

  // ---------- 事件委派 ----------
  function findAct(el) {
    while (el && el !== document) {
      if (el.getAttribute && el.getAttribute('data-a')) return el;
      el = el.parentNode;
    }
    return null;
  }
  UI.bind = function () {
    var st = $('stage');
    st.addEventListener('click', function (ev) {
      var el = findAct(ev.target); if (!el) return;
      if (el.className && String(el.className).indexOf('disabled') >= 0 && !el.getAttribute('data-force')) { var why = el.getAttribute('data-why'); if (why) UI.toast(why); return; }
      var a = el.getAttribute('data-a'), v = el.getAttribute('data-v');
      var fn = UI.actions[a];
      if (!fn) { UI.toast('（未實作的動作：' + a + '）'); return; }
      ev.preventDefault();
      fn(v, el);
    }, false);
    window.addEventListener('resize', UI.layout, false);
    window.addEventListener('orientationchange', function () { setTimeout(UI.layout, 300); }, false);
  };

  // ---------- 畫面 ----------
  UI.screens = {};
  UI.go = function (name, arg) { UI.screen = name; UI.screenArg = arg; UI.modal = null; UI.render(); };
  UI.render = function () {
    if (!MJ.S.state && UI.screen !== 'newgame') UI.screen = 'newgame';
    var fn = UI.screens[UI.screen];
    $('screen').innerHTML = fn ? fn(UI.screenArg) : '';
    UI.renderModal();
    if (UI.afterRender) { var f = UI.afterRender; UI.afterRender = null; f(); }
  };
  UI.refresh = function () { if (UI.screen === 'battle') { UI.renderModal(); return; } UI.render(); };
  UI.modals = {};
  UI.open = function (name, arg) { UI.modal = { name: name, arg: arg }; UI.renderModal(); };
  UI.close = function () { UI.modal = null; UI.renderModal(); if (UI.screen !== 'battle') UI.render(); };
  UI.renderModal = function () {
    var m = $('modal');
    if (!UI.modal) { m.innerHTML = ''; m.style.display = 'none'; return; }
    var fn = UI.modals[UI.modal.name];
    m.innerHTML = fn ? fn(UI.modal.arg) : '';
    m.style.display = 'block';
  };
  UI.actions.close = function () { UI.close(); };
  UI.actions.go = function (v) { UI.go(v); };
  UI.actions.open = function (v) { UI.open(v); };
  UI.actions.noop = function () { };
  UI.actions.info = function (v) { UI.toast(v); };

  // ---------- 提示 ----------
  var toastTimer = null;
  UI.toast = function (msg, kind) {
    var t = $('toast');
    t.innerHTML = '<div class="toast ' + (kind || '') + '">' + U.esc(msg) + '</div>';
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.display = 'none'; }, 2200);
  };
  UI.res = function (r, okMsg) {
    if (!r.ok) { UI.toast(r.msg, 'bad'); return false; }
    if (okMsg) UI.toast(okMsg, 'good');
    return true;
  };
  // 確認框
  UI.confirm = function (title, text, onYes, yesLabel) {
    UI._confirmYes = onYes;
    var c = $('confirm');
    c.innerHTML = '<div class="dim"></div><div class="frame confirm-box"><div class="plaque">' + U.esc(title) + '</div><div class="parch confirm-text">' + text + '</div>' +
      '<div class="btn-row"><a class="btn red" data-a="confirmYes">' + U.esc(yesLabel || '確定') + '</a><a class="btn" data-a="confirmNo">取消</a></div></div>';
    c.style.display = 'block';
  };
  UI.actions.confirmYes = function () { $('confirm').style.display = 'none'; var f = UI._confirmYes; UI._confirmYes = null; if (f) f(); };
  UI.actions.confirmNo = function () { $('confirm').style.display = 'none'; UI._confirmYes = null; };
  // 獎勵彈窗
  UI.rewardBox = function (title, lines) {
    UI.confirm(title, '<div class="reward-list">' + (lines.length ? U.map(lines, function (l) { return '<div class="rw">' + U.esc(l) + '</div>'; }).join('') : '<div class="rw">（沒有物品）</div>') + '</div>', null, '好的');
    var c = $('confirm'); var btns = c.getElementsByClassName('btn'); if (btns[1]) btns[1].style.display = 'none';
  };

  // ---------- 共用元件 ----------
  UI.panel = function (title, body, opt) {
    opt = opt || {};
    return '<div class="dim"' + (opt.noDimClose ? '' : ' data-a="close"') + '></div><div class="frame panel ' + (opt.cls || '') + '">' +
      '<div class="plaque">' + U.esc(title) + '</div><a class="xbtn" data-a="close" aria-label="關閉">×</a>' +
      '<div class="panel-body">' + body + '</div></div>';
  };
  UI.bar = function (cur, max, cls, text) {
    var p = max > 0 ? U.clamp(cur / max, 0, 1) * 100 : 0;
    return '<div class="bar ' + (cls || '') + '"><i style="width:' + p.toFixed(1) + '%"></i><b>' + (text != null ? text : U.fmt(cur) + '/' + U.fmt(max)) + '</b></div>';
  };
  UI.qname = function (q) { return MJ.D.config.qualityNames[q]; };
  UI.qcls = function (q) { return 'q' + q; };
  UI.portrait = function (h, opt) {
    opt = opt || {};
    var def = MJ.R.heroDef(h.id), look = h.id === 'lead' ? MJ.S.state.player.look : def.look;
    var q = h.id === 'lead' ? 3 : def.quality;
    return '<div class="card ' + UI.qcls(q) + (opt.sel ? ' sel' : '') + (opt.cls ? ' ' + opt.cls : '') + '"' + (opt.act ? ' data-a="' + opt.act + '" data-v="' + (opt.v != null ? opt.v : h.uid) + '"' : '') + '>' +
      MJ.Art.portrait(look, q) + '<span class="lvb">' + h.lv + '</span>' + (opt.badge ? '<span class="badge">' + opt.badge + '</span>' : '') +
      '<span class="nm">' + U.esc(MJ.G.nameOf(h)) + '</span></div>';
  };
  UI.pager = function (key, items, per, renderFn, emptyText) {
    var pages = Math.max(1, Math.ceil(items.length / per));
    var p = U.clamp(UI.page[key] || 0, 0, pages - 1); UI.page[key] = p;
    var slice = items.slice(p * per, p * per + per), html = '';
    if (!items.length) html = '<div class="empty">' + U.esc(emptyText || '空') + '</div>';
    else U.each(slice, function (it, i) { html += renderFn(it, p * per + i); });
    return { html: html, nav: '<div class="pager"><a class="pbtn' + (p <= 0 ? ' disabled' : '') + '" data-a="pg" data-v="' + key + ':-1">◀</a><span>' + (p + 1) + '/' + pages + '</span><a class="pbtn' + (p >= pages - 1 ? ' disabled' : '') + '" data-a="pg" data-v="' + key + ':1">▶</a></div>' };
  };
  UI.actions.pg = function (v) { var a = v.split(':'); UI.page[a[0]] = (UI.page[a[0]] || 0) + (+a[1]); UI.refresh(); };
  UI.equipCell = function (e, opt) {
    opt = opt || {};
    var tpl = MJ.R.equipTpl(e.t), st = MJ.R.equipStats(e);
    var tip = UI.equipLines(st).join(' ');
    return '<div class="ecell eq' + e.q + (opt.sel ? ' sel' : '') + '"' + (opt.act ? ' data-a="' + opt.act + '" data-v="' + e.uid + '"' : '') + ' title="' + U.esc(tpl.name + ' ' + tip) + '">' +
      MJ.Art.icon(tpl.icon, e.q) + '<span class="elv">' + tpl.lv + '</span>' + (e.plus ? '<span class="eplus">+' + e.plus + '</span>' : '') + (e.gems && e.gems.length ? '<span class="egem">' + U.map(e.gems, function () { return '◆'; }).join('') + '</span>' : '') + '<span class="enm">' + U.esc(tpl.name) + '</span></div>';
  };
  UI.STAT_NAMES = { patk: '物攻', matk: '法攻', jatk: '絕技攻', pdef: '物防', mdef: '法防', jdef: '絕技防', hp: '生命', hit: '命中', crit: '暴擊', dodge: '閃避', all: '四維' };
  UI.stars = function (n) { var t = ''; for (var i = 0; i < 5; i++) t += i < n ? '★' : '☆'; return '<span class="stars5">' + t + '</span>'; };
  UI.equipLines = function (st) {
    return U.map(U.keys(st), function (k) { var pct = k === 'hit' || k === 'crit' || k === 'dodge'; return UI.STAT_NAMES[k] + '+' + (pct ? st[k].toFixed(2) + '%' : st[k]); });
  };
  UI.icon = function (n, q) { return MJ.Art.icon(n, q); };
  return UI;
})();

</script>
<script>/* js/ui-city.js */
/* 主城：浮空島建築、左上角色資訊、上方貨幣、禮包、底部功能列、系統訊息 */
(function () {
  var UI = MJ.UI, U = MJ.U, G = MJ.G, R = MJ.R;
  // 建築位置（版面參考 A 級截圖：浮空島 + 瀑布；座標為自訂）
  var B = [
    { k: 'shenwu', x: 360, y: 64, w: 230, act: 'hall' },
    { k: 'juxian', x: 110, y: 112, w: 200, act: 'recruit' },
    { k: 'xukong', x: 640, y: 100, w: 200, act: 'gate' },
    { k: 'tongtian', x: 836, y: 170, w: 120, act: 'tower' },
    { k: 'shenbing', x: 20, y: 300, w: 170, act: 'forge' },
    { k: 'baifang', x: 200, y: 318, w: 150, act: 'arena' },
    { k: 'farm', x: 380, y: 300, w: 190, act: 'farm' },
    { k: 'jiangxing', x: 590, y: 318, w: 150, act: 'jxl' },
    { k: 'wuji', x: 760, y: 318, w: 150, act: 'wuji' }
  ];
  UI.hud = function () {
    var s = MJ.S.state, lead = G.lead(), max = R.energyMax(lead.lv);
    G.tick();
    var h = '<div class="hud-tl frame-s">' +
      '<div class="avatar" data-a="hall">' + MJ.Art.portrait(s.player.look, 3) + '<span class="lvb big">' + lead.lv + '</span></div>' +
      '<div class="hud-info"><div class="pname">' + U.esc(s.player.name) + '</div>' +
      UI.bar(lead.exp, R.expNeed(lead.lv), 'exp', '經驗 ' + lead.exp + '/' + R.expNeed(lead.lv)) +
      '<div class="erow">' + UI.icon('energy') + UI.bar(s.player.energy, max, 'energy', s.player.energy + '/' + max) + '</div>' +
      (s.player.energy < max ? '<div class="regen">' + U.dur(G.nextEnergyIn()) + ' 後 +1</div>' : '') + '</div></div>';
    h += '<div class="hud-top">' +
      '<div class="cur" title="金幣">' + UI.icon('gold') + '<b>' + U.fmt(s.player.gold) + '</b><a class="plus" data-a="info" data-v="單機版沒有儲值；金幣可從任務、首通與禮包取得">+</a></div>' +
      '<div class="cur" title="銀幣">' + UI.icon('silver') + '<b>' + U.fmt(s.player.silver) + '</b></div>' +
      (UI.muteBtn ? UI.muteBtn() : '') +
      '<a class="cur mailbtn" data-a="open" data-v="mail">' + UI.icon('mail') + (U.filter(s.mail, function (m) { return !m.claimed; }).length ? '<i class="dot"></i>' : '') + '</a>' +
      '</div>';
    return h;
  };
  UI.screens.city = function () {
    var s = MJ.S.state, lead = G.lead(), cfg = MJ.D.config;
    var h = '<div class="city">' + MJ.Art.sky();
    U.each(B, function (b) {
      var c = cfg.buildings[b.k], lv = s.buildings[b.k] || 1, locked = lead.lv < c.open, phase = c.phase;
      var tag = phase ? '第' + ['', '一', '二', '三', '四'][phase] + '階段開放' : (locked ? '需要等級 ' + c.open : 'Lv' + lv);
      if (phase && locked) tag = '需要等級 ' + c.open;
      var act = (!phase && !locked && b.act) ? b.act : 'bLocked';
      h += '<div class="bld' + (phase || locked ? ' locked' : '') + '" style="left:' + b.x + 'px;top:' + b.y + 'px;width:' + b.w + 'px;height:' + b.w + 'px" data-a="' + act + '" data-v="' + b.k + '">' +
        MJ.Art.building(b.k) + '<div class="bname"><b>' + U.esc(c.name) + '</b><span>' + U.esc(tag) + '</span></div></div>';
    });
    h += UI.hud();
    // 出戰隊伍
    h += '<div class="team-strip frame-s" data-a="open" data-v="formation"><span class="ts-t">出戰</span>';
    U.each(G.teamList(), function (x) { h += UI.portrait(x.hero, { cls: 'mini' }); });
    h += '<span class="ts-n">' + G.teamCount() + '/' + R.teamSlots(lead.lv) + '</span></div>';
    // 禮包
    var fl = G.freeGiftLeft(), sd = G.sevenDayState();
    h += '<div class="gifts">';
    if (!s.gifts.opening) h += '<a class="gift" data-a="giftOpening">' + UI.icon('gift') + '<span>開服大禮包</span></a>';
    if (sd.claimed < 7) h += '<a class="gift' + (sd.canClaim ? '' : ' dim2') + '" data-a="giftSeven">' + UI.icon('chest') + '<span>七日禮包</span>' + (sd.canClaim ? '<i class="dot"></i>' : '') + '</a>';
    h += '<a class="gift" data-a="giftFree">' + UI.icon('gift') + '<span>' + (fl > 0 ? '<em id="freeCd">' + U.dur(fl) + '</em>' : '免費禮物') + '</span>' + (fl > 0 ? '' : '<i class="dot"></i>') + '</a>';
    h += '<a class="gift" data-a="open" data-v="tasks">' + UI.icon('quest') + '<span>任務</span>' + (UI.taskDot && UI.taskDot() ? '<i class="dot"></i>' : '') + '</a>';
    if (G.signState) { var sgs = G.signState(); h += '<a class="gift' + (sgs.signedToday ? ' dim2' : '') + '" data-a="openSign">' + UI.icon('scroll2') + '<span>簽到</span>' + (sgs.signedToday ? '' : '<i class="dot"></i>') + '</a>'; }
    if (G.qiyuOpen && G.qiyuOpen()) h += '<a class="gift" data-a="open" data-v="qiyu">' + UI.icon('star') + '<span>奇遇</span>' + (UI.qiyuDot && UI.qiyuDot() ? '<i class="dot"></i>' : '') + '</a>';
    h += '</div>';
    // 系統訊息
    h += '<div class="chat" id="chat">' + UI.chatHtml() + '</div>';
    // 底部功能列（A：道具、陣法、日志、郵件、商城、設置）
    h += '<div class="bottombar">';
    U.each([['bag', '道具', 'bag'], ['formation', '陣法', 'formation'], ['log', '日志', 'scroll'], ['mail', '郵件', 'mail'], ['shop', '商城', 'shop'], ['settings', '設置', 'gear']], function (x) {
      h += '<a class="bb" data-a="open" data-v="' + x[0] + '">' + UI.icon(x[2]) + '<span>' + x[1] + '</span></a>';
    });
    h += '</div></div>';
    return h;
  };
  UI.chatHtml = function () {
    var lines = G.chatLines.length ? G.chatLines : ['【系統】歡迎來到猛將無雙（單機重製版）'];
    return U.map(lines.slice(0, 3), function (l) { return '<div>' + U.esc(l) + '</div>'; }).join('');
  };
  UI.actions.bLocked = function (k) {
    var c = MJ.D.config.buildings[k];
    UI.toast(c.name + '：' + (G.lead().lv < c.open ? '需要等級 ' + c.open + '。' : '') + (c.phase ? '此功能預定於第' + ['', '一', '二', '三', '四'][c.phase] + '階段開放。' : ''));
  };
  UI.actions.hall = function () { UI.go('hall'); };
  UI.actions.recruit = function () { UI.go('recruit'); };
  UI.actions.gate = function () { UI.go('gate'); };
  UI.actions.city = function () { UI.go('city'); };
  UI.actions.giftOpening = function () { var r = G.claimOpening(); if (UI.res(r)) { UI.render(); UI.rewardBox('開服大禮包', r.got); } };
  UI.actions.giftSeven = function () { var r = G.claimSevenDay(); if (UI.res(r)) { UI.render(); UI.rewardBox('七日禮包 第 ' + r.day + ' 天', r.got); } };
  UI.actions.giftFree = function () { var r = G.claimFreeGift(); if (UI.res(r)) { UI.render(); UI.rewardBox('免費禮物', r.got); } };
})();

</script>
<script>/* js/ui-recruit.js */
/* 聚賢莊：刷新、拜訪（招募）、機率、結果動畫、解僱、將魂召喚 */
(function () {
  var UI = MJ.UI, U = MJ.U, G = MJ.G, R = MJ.R;
  var TYPE_TIP = { '力敏': '物理．敏捷', '力耐': '物理．耐力', '智敏': '法術．敏捷', '智耐': '法術．耐力' };
  function candCard(id, i) {
    var d = R.heroDef(id), h = { id: id, lv: 1, eq: {} }, p = R.primary(h), cost = G.recruitCost(id);
    var s = MJ.S.state, afford = s.player.silver >= cost;
    return '<div class="cand ' + UI.qcls(d.quality) + (UI.sel.justRefreshed ? ' flip-in' : '') + '" style="-webkit-animation-delay:' + (i * 0.12) + 's;animation-delay:' + (i * 0.12) + 's">' +
      '<div class="cand-q">' + UI.qname(d.quality) + '</div>' +
      '<div class="cand-art">' + MJ.Art.portrait(d.look, d.quality) + '</div>' +
      '<div class="cand-name">' + U.esc(d.name) + '</div>' +
      '<div class="cand-type">' + d.type + '（' + TYPE_TIP[d.type] + '）</div>' +
      '<table class="mini-stats"><tr><td>力量</td><td>' + p.str + '</td><td>智力</td><td>' + p.int + '</td></tr><tr><td>敏捷</td><td>' + p.agi + '</td><td>耐力</td><td>' + p.con + '</td></tr></table>' +
      '<div class="cand-skill">技能：' + U.esc(d.active.name) + '／' + U.esc(d.ult.name) + (d.passive ? '<br>被動：' + MJ.D.heroes.passives[d.passive].name : '') + '</div>' +
      '<a class="btn small' + (afford ? '' : ' disabled') + '" data-a="doRecruit" data-v="' + id + '" data-why="銀幣不足（需要 ' + U.fmt(cost) + '）">拜訪 ' + UI.icon('silver') + U.fmt(cost) + '</a></div>';
  }
  UI.screens.recruit = function () {
    var s = MJ.S.state, cfg = MJ.D.config, tab = UI.sel.recTab || 'cands';
    var h = '<div class="scr recruit-scr">' + UI.hud();
    h += '<div class="frame bigframe"><div class="plaque">聚賢莊 Lv' + (s.buildings.juxian || 1) + '</div><a class="xbtn" data-a="city">×</a>';
    h += '<div class="tabs"><a class="tab' + (tab === 'cands' ? ' on' : '') + '" data-a="recTab" data-v="cands">拜訪武將</a><a class="tab' + (tab === 'roster' ? ' on' : '') + '" data-a="recTab" data-v="roster">我的武將</a><a class="tab' + (tab === 'souls' ? ' on' : '') + '" data-a="recTab" data-v="souls">將魂召喚</a></div>';
    h += '<div class="parch inner">';
    if (tab === 'cands') {
      h += '<div class="rec-left">';
      U.each(G.recruitKinds, function (k) {
        var x = G.recruitStatus(k), c = x.cfg;
        var label = x.cdLeft > 0 ? '冷卻 <em class="cd" data-end="' + (s.recruit.cd[k]) + '">' + U.dur(x.cdLeft) + '</em>' : '可刷新';
        var sub = k === 'normal' ? '今日剩餘 ' + x.left + '/' + c.daily : '';
        var pay = x.cdLeft > 0 ? '（花 ' + c.skipGold + ' 金立即刷新）' : '';
        h += '<a class="rbtn rk-' + k + ((k === 'normal' && x.left <= 0) ? ' disabled' : '') + '" data-a="doRefresh" data-v="' + k + '" data-why="今日普通刷新次數已用完">' +
          '<b>' + c.name + '</b><span>' + label + '</span><span class="sub">' + sub + pay + '</span></a>';
      });
      h += '<a class="link" data-a="showOdds">查看品質機率</a></div>';
      h += '<div class="cands">' + (s.recruit.cands.length ? U.map(s.recruit.cands, candCard).join('') : '<div class="empty">名單已空，請刷新</div>') + '</div>';
      UI.sel.justRefreshed = false;
    } else if (tab === 'roster') {
      var list = s.heroes.slice();
      var pg = UI.pager('roster', list, 10, function (hh) {
        var sel = UI.sel.rosterUid === hh.uid;
        return UI.portrait(hh, { act: 'rosterSel', sel: sel, badge: G.inTeam(hh.uid) != null ? '陣' : '' });
      });
      h += '<div class="roster-grid">' + pg.html + '</div>' + pg.nav;
      var hs = G.hero(UI.sel.rosterUid);
      h += '<div class="roster-info">武將數 ' + s.heroes.length + '/' + R.rosterCap(s) + '　';
      if (hs) {
        var d = R.heroDef(hs.id);
        h += '已選：<b>' + U.esc(G.nameOf(hs)) + '</b> Lv' + hs.lv + '　';
        if (hs.id !== 'lead') h += '<a class="btn small red" data-a="doDismiss" data-v="' + hs.uid + '">' + (MJ.D.config.dismissSouls[d.quality] ? '解僱（得將魂 ×' + MJ.D.config.dismissSouls[d.quality] + '）' : '解僱（黑色不得將魂）') + '</a>';
        else h += '（主角不可解僱）';
      } else h += '點選武將可解僱，解僱後獲得該武將將魂。';
      h += '</div>';
    } else {
      var souls = U.filter(U.keys(s.bag.stack), function (k) { return k.indexOf('soul:') === 0 && s.bag.stack[k] > 0; });
      var pg2 = UI.pager('souls', souls, 8, function (k) {
        var id = k.slice(5), d = R.heroDef(id), have = s.bag.stack[k], owned = U.find(s.heroes, function (x) { return x.id === id; });
        return '<div class="soulrow ' + UI.qcls(d.quality) + '">' + MJ.Art.portrait(d.look, d.quality) + '<div><b>' + U.esc(d.name) + '</b>（' + UI.qname(d.quality) + '）<br>將魂 ' + have + '/' + d.souls + '</div>' +
          '<a class="btn small' + (owned || have < d.souls ? ' disabled' : '') + '" data-a="doSummon" data-v="' + id + '" data-why="' + (owned ? '已擁有此武將' : '將魂不足') + '">召喚</a></div>';
      }, '尚無將魂。解僱武將或在虛空之門戰鬥可獲得將魂。');
      h += '<div class="soul-list">' + pg2.html + '</div>' + pg2.nav;
    }
    h += '</div></div></div>';
    return h;
  };
  UI.actions.recTab = function (v) { UI.sel.recTab = v; UI.render(); };
  UI.actions.doRefresh = function (k) {
    var x = G.recruitStatus(k);
    if (x.cdLeft > 0) {
      UI.confirm('立即刷新', '冷卻剩餘 ' + U.dur(x.cdLeft) + '。<br>花費 <b>' + x.cfg.skipGold + ' 金幣</b> 立即' + x.cfg.name + '？', function () {
        var r = G.refresh(k, true); if (UI.res(r)) { UI.sel.justRefreshed = true; UI.render(); }
      });
      return;
    }
    var r = G.refresh(k, false); if (UI.res(r)) { UI.sel.justRefreshed = true; UI.render(); }
  };
  // A（官方圖）：招募確認視窗標題「招募武將」、按鈕「立即招募」
  UI.actions.doRecruit = function (id) {
    var d = R.heroDef(id), cost = G.recruitCost(id);
    UI.confirm('招募武將', '<div class="rc-box">' + MJ.Art.portrait(d.look, d.quality) + '<div>是否花費 <b>' + U.fmt(cost) + ' 銀幣</b> 招募<br><span class="qtag ' + UI.qcls(d.quality) + '">' + UI.qname(d.quality) + '</span> <b>' + U.esc(d.name) + '</b>（' + d.type + '）？<br><small>武將數 ' + MJ.S.state.heroes.length + '/' + R.rosterCap(MJ.S.state) + '</small></div></div>', function () {
      var r = G.recruit(id); if (!UI.res(r)) return;
      UI.render(); UI.open('recruitResult', r.hero.uid);
    }, '立即招募');
  };
  UI.modals.recruitResult = function (uid) {
    var h = G.hero(uid), d = R.heroDef(h.id), p = R.primary(h);
    return '<div class="dim" data-a="close"></div><div class="reveal ' + UI.qcls(d.quality) + '">' +
      '<div class="rays"></div><div class="reveal-stand"><div class="mc-wrap">' + MJ.Art.magicCircle() + '</div><div class="aura-wrap">' + MJ.Art.aura(d.quality) + '</div><div class="hero-fig">' + MJ.Art.figure(d.look) + '</div></div>' +
      '<div class="reveal-text"><span class="qtag ' + UI.qcls(d.quality) + '">' + UI.qname(d.quality) + '</span> ' + U.esc(d.name) + ' 加入麾下！</div>' +
      '<div class="reveal-sub">力量 ' + p.str + '　智力 ' + p.int + '　敏捷 ' + p.agi + '　耐力 ' + p.con + '</div>' +
      '<div class="btn-row"><a class="btn" data-a="recToTeam" data-v="' + uid + '">加入出戰</a><a class="btn" data-a="close">好的</a></div></div>';
  };
  UI.actions.recToTeam = function (uid) { var r = G.addToTeam(+uid); if (UI.res(r, '已加入出戰隊伍')) UI.close(); };
  UI.actions.showOdds = function () {
    var cfg = MJ.D.config, t = '<table class="odds"><tr><th></th>' + U.map(cfg.qualityNames, function (q, i) { return '<th class="q' + i + 't">' + q + '</th>'; }).join('') + '<th>冷卻</th></tr>';
    U.each(G.recruitKinds, function (k) {
      var c = cfg.recruit[k];
      t += '<tr><td>' + c.name + '</td>' + U.map(c.odds, function (o) { return '<td>' + (o * 100).toFixed(1) + '%</td>'; }).join('') + '<td>' + (c.cdMin >= 1440 ? c.cdMin / 1440 + ' 天' : c.cdMin + ' 分') + '</td></tr>';
    });
    t += '</table><p class="note">刷新種類與冷卻：B（巴哈姆特攻略）。機率：D（原作未公開，本作自訂）。首次紫金／至尊刷新保底藍／紫：B。</p>';
    UI.confirm('品質機率', t, null, '知道了');
    var btns = UI.$('confirm').getElementsByClassName('btn'); if (btns[1]) btns[1].style.display = 'none';
  };
  UI.actions.rosterSel = function (uid) { UI.sel.rosterUid = +uid; UI.render(); };
  UI.actions.doDismiss = function (uid) {
    var h = G.hero(+uid);
    UI.confirm('解僱武將', '確定解僱 <b>' + U.esc(G.nameOf(h)) + '</b>？身上裝備會放回包裹。', function () {
      var r = G.dismiss(+uid); if (UI.res(r, r.souls ? '獲得將魂 ×' + r.souls : '已解僱（黑色武將不得將魂）')) { UI.sel.rosterUid = null; UI.render(); }
    }, '解僱');
  };
  UI.actions.doSummon = function (id) { var r = G.summon(id); if (UI.res(r, '召喚成功')) UI.render(); };
})();

</script>
<script>/* js/ui-hall.js */
/* 神武殿：裝備／技能／訓練（版面依 A 級截圖：左屬性、中人物與四格裝備、右包裹、下方武將列） */
(function () {
  var UI = MJ.UI, U = MJ.U, G = MJ.G, R = MJ.R;
  var SN = G.SLOT_NAMES;
  function pct(v) { return (v || 0).toFixed(2); }
  function patternGrid(p) {
    var cells = p === 'all' || p === 'healAll' ? [0, 1, 2, 3, 4, 5, 6, 7, 8] : MJ.Battle.patternCells(p, 3);
    var h = '<div class="pgrid">';
    for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++) { var i = r * 3 + c; h += '<i class="' + (cells.indexOf(i) >= 0 ? (p === 'healAll' ? 'on heal' : 'on') : '') + (i === 3 && p !== 'all' && p !== 'healAll' ? ' tgt' : '') + '"></i>'; }
    return h + '</div>';
  }
  UI.patternGrid = patternGrid;
  UI.screens.hall = function () {
    var s = MJ.S.state, tab = UI.sel.hallTab || 'equip';
    var h0 = G.hero(UI.sel.hallUid) || G.lead(); UI.sel.hallUid = h0.uid;
    var d = R.derived(h0, s), def = R.heroDef(h0.id), type = R.typeOf(h0, s);
    var h = '<div class="scr hall-scr">';
    h += '<div class="frame bigframe hall"><div class="plaque">神武殿</div><a class="xbtn" data-a="city">×</a>';
    var bs = R.battleStats(h0, s);
    h += '<div class="tabs">' + U.map([['equip', '裝備'], ['skill', '技能'], ['peiyang', '培養'], ['xinfa', '心法'], ['star', '升階'], ['train', '訓練']], function (t) { return '<a class="tab' + (tab === t[0] ? ' on' : '') + '" data-a="hallTab" data-v="' + t[0] + '">' + t[1] + '</a>'; }).join('') + '</div>';
    // 左：屬性
    h += '<div class="parch statpanel"><div class="sp-name">' + U.esc(G.nameOf(h0)) + (h0.id === 'lead' ? '(主)' : '') + ' <span>Lv' + h0.lv + '</span></div>' +
      '<div class="sp-type">' + type + (h0.id === 'lead' ? '．主角' : '．' + UI.qname(def.quality) + '品') + '</div>' +
      UI.bar(h0.exp, R.expNeed(h0.lv), 'exp', h0.exp + '/' + R.expNeed(h0.lv)) +
      '<table class="stats">' +
      '<tr><td>力量</td><td>' + d.str + '</td><td>智力</td><td>' + d.int + '</td></tr>' +
      '<tr><td>敏捷</td><td>' + d.agi + '</td><td>耐力</td><td>' + d.con + '</td></tr>' +
      '<tr class="sep"><td>物攻</td><td>' + d.patk + '</td><td>法攻</td><td>' + d.matk + '</td></tr>' +
      '<tr><td>絕攻</td><td>' + d.jatk + '</td><td>生命</td><td>' + d.hp + '</td></tr>' +
      '<tr><td>物防</td><td>' + d.pdef + '</td><td>法防</td><td>' + d.mdef + '</td></tr>' +
      '<tr><td>絕防</td><td>' + d.jdef + '</td><td>命中</td><td>' + pct(d.hit) + '</td></tr>' +
      '<tr><td>暴擊</td><td>' + pct(d.crit) + '</td><td>閃避</td><td>' + pct(d.dodge) + '</td></tr></table>' +
      '<div class="sp-team">傷害：' + MJ.D.config.damageTypes[d.dtype] + (h0.star ? '　' + UI.stars(h0.star) : '') + '<br>含全隊加成：攻 ' + Math.max(bs.patk, bs.matk, bs.jatk) + '　命 ' + bs.hp + '</div>' +
      '<div class="sp-btns">' + (G.inTeam(h0.uid) != null ? (h0.id === 'lead' ? '<span class="tagok">出戰中</span>' : '<a class="btn small" data-a="hallRest" data-v="' + h0.uid + '">休息</a>') : '<a class="btn small" data-a="hallJoin" data-v="' + h0.uid + '">出戰</a>') +
      (h0.id !== 'lead' && s.bag.stack.tufeiling ? '<a class="btn small" data-a="useTufei" data-v="' + h0.uid + '">突飛令 ×' + s.bag.stack.tufeiling + '</a>' : '') + '</div></div>';
    // 中
    h += '<div class="hall-center"><div class="starry"></div><div class="rock"></div><div class="mc-wrap">' + MJ.Art.magicCircle() + '</div><div class="aura-wrap">' + MJ.Art.aura(h0.id === 'lead' ? 3 : def.quality) + '</div><div class="hero-fig">' + MJ.Art.figure(h0.id === 'lead' ? s.player.look : def.look, { cape: h0.id === 'lead' }) + '</div>';
    if (tab === 'equip') {
      U.each(G.SLOTS, function (sl, i) {
        var e = h0.eq[sl];
        h += '<div class="eslot es' + i + '">' + (e ? UI.equipCell(e, { act: 'slotClick' }) .replace('data-v="' + e.uid + '"', 'data-v="' + sl + '"') : '<div class="ecell empty-slot" data-a="info" data-v="' + SN[sl] + '：從右側包裹點選裝備">' + SN[sl] + '</div>') + '</div>';
      });
      h += '<div class="hc-btns"><a class="btn small" data-a="autoEq" data-v="' + h0.uid + '">最強</a><a class="btn small" data-a="open" data-v="heroDetail">詳情</a></div>';
    }
    h += '</div>';
    // 右
    h += '<div class="parch rightpanel">';
    if (tab === 'equip') {
      var et = UI.sel.bagSlot || 'weapon';
      h += '<div class="tabs small">' + U.map(G.SLOTS, function (sl) { return '<a class="tab' + (et === sl ? ' on' : '') + '" data-a="bagSlot" data-v="' + sl + '">' + SN[sl] + '</a>'; }).join('') + '</div>';
      var items = U.filter(s.bag.equips, function (e) { return R.equipTpl(e.t).slot === et; });
      items.sort(function (a, b) { return R.equipScore(b) - R.equipScore(a); });
      var pg = UI.pager('hallbag', items, 12, function (e) { return UI.equipCell(e, { act: 'bagPick', sel: UI.sel.bagPick === e.uid }); }, '沒有' + SN[et]);
      h += '<div class="egrid">' + pg.html + '</div>' + pg.nav;
      var pick = U.find(s.bag.equips, function (e) { return e.uid === UI.sel.bagPick; });
      if (pick) {
        var tpl = R.equipTpl(pick.t), cur = h0.eq[tpl.slot];
        h += '<div class="einfo"><b class="eqt' + pick.q + '">' + MJ.D.config.equipQualityNames[pick.q] + '．' + U.esc(tpl.name) + (pick.plus ? ' +' + pick.plus : '') + '</b>（需 Lv' + tpl.lv + '）<br>' + UI.equipLines(R.equipStats(pick)).join('　') +
          (cur ? '<br><span class="cmp">目前：' + UI.equipLines(R.equipStats(cur)).join('　') + '</span>' : '') +
          '<div class="btn-row"><a class="btn small' + (h0.lv < tpl.lv ? ' disabled' : '') + '" data-why="需要等級 ' + tpl.lv + '" data-a="doEquip" data-v="' + pick.uid + '">穿上</a><a class="btn small red" data-a="doSell" data-v="' + pick.uid + '">賣出 ' + R.equipSell(pick) + ' 銀</a></div></div>';
      }
    } else if (UI.hallTabs[tab]) {
      h += UI.hallTabs[tab](h0, s, def);
    } else {
      var tr = s.training, th = tr && G.hero(tr.uid);
      h += '<div class="train"><b>訓練位</b>（神武殿 Lv' + (s.buildings.shenwu || 1) + '）<br>';
      if (th) {
        h += U.esc(G.nameOf(th)) + ' 訓練中：每分鐘經驗 +' + G.trainRate(th) + '<br>已累積 <b>' + G.trainGain() + '</b> 經驗（最多 8 小時）<div class="btn-row"><a class="btn small" data-a="stopTrain">結束訓練並領取</a></div>';
      } else {
        h += '目前無人訓練。<br>' + U.esc(G.nameOf(h0)) + ' 每分鐘可得經驗 +' + G.trainRate(h0) + '<div class="btn-row"><a class="btn small" data-a="startTrain" data-v="' + h0.uid + '">讓 ' + U.esc(G.nameOf(h0)) + ' 開始訓練</a></div>';
      }
      var lv = s.buildings.shenwu || 1;
      h += '<hr><b>升級神武殿</b>：訓練速度 +10%／級<br>費用 ' + U.fmt(G.buildingCost('shenwu', lv)) + ' 銀幣<div class="btn-row"><a class="btn small" data-a="upBld" data-v="shenwu">升級</a></div>';
      h += '<p class="note">訓練經驗數值：D（自訂）。武將等級不能超過主角（B）。</p></div>';
    }
    h += '</div>';
    // 下：武將列
    var list = s.heroes.slice();
    var pgh = UI.pager('hallheroes', list, 8, function (x) { return UI.portrait(x, { act: 'hallSel', sel: x.uid === h0.uid, badge: G.inTeam(x.uid) != null ? '陣' : '' }); });
    var locked = Math.max(0, 8 - (pgh.html.split('class="card').length - 1));
    var lockHtml = ''; for (var i = 0; i < Math.min(locked, R.rosterCap(s) - s.heroes.length); i++) lockHtml += '<div class="card lockslot"><span>將</span></div>';
    var power = 0; U.each(G.teamList(), function (x) { power += R.power(x.hero, s); });
    h += '<div class="hall-bottom"><div class="hrow">' + pgh.html + lockHtml + '</div>' + pgh.nav +
      '<div class="hb-info">武將數 ' + s.heroes.length + '/' + R.rosterCap(s) + '<br>戰鬥力 <b>' + U.fmt(power) + '</b></div><a class="btn" data-a="city">返回</a></div>';
    h += '</div></div>';
    return h;
  };
  UI.actions.hallTab = function (v) { UI.sel.hallTab = v; UI.render(); };
  UI.actions.hallSel = function (v) { UI.sel.hallUid = +v; UI.sel.bagPick = null; UI.render(); };
  UI.actions.bagSlot = function (v) { UI.sel.bagSlot = v; UI.sel.bagPick = null; UI.page.hallbag = 0; UI.render(); };
  UI.actions.bagPick = function (v) { UI.sel.bagPick = +v; UI.render(); };
  UI.actions.doEquip = function (v) { var r = G.equip(UI.sel.hallUid, +v); if (UI.res(r, '已穿上')) { UI.sel.bagPick = null; UI.render(); } };
  UI.actions.slotClick = function (slot) {
    var h = G.hero(UI.sel.hallUid), e = h.eq[slot], tpl = R.equipTpl(e.t);
    UI.confirm(SN[slot], '<b class="eqt' + e.q + '">' + U.esc(tpl.name) + (e.plus ? ' +' + e.plus : '') + '</b><br>' + UI.equipLines(R.equipStats(e)).join('　') + (e.gems && e.gems.length ? '<br>寶石：' + U.map(e.gems, function (g) { return G.itemName(g); }).join('、') : ''), function () {
      var r = G.unequip(h.uid, slot); if (UI.res(r, '已卸下')) UI.render();
    }, '卸下');
  };
  UI.actions.autoEq = function (v) { var r = G.autoEquip(+v); if (UI.res(r, r.changed ? '已換上最強裝備（' + r.changed + ' 件）' : '目前已是最佳搭配')) UI.render(); };
  UI.actions.doSell = function (v) { var r = G.sellEquip(+v); if (UI.res(r, '獲得 ' + r.silver + ' 銀幣')) { UI.sel.bagPick = null; UI.render(); } };
  UI.actions.hallJoin = function (v) { if (UI.res(G.addToTeam(+v), '已加入出戰')) UI.render(); };
  UI.actions.hallRest = function (v) { if (UI.res(G.removeFromTeam(+v), '已下陣休息')) UI.render(); };
  UI.actions.useTufei = function (v) { var r = G.useItem('tufeiling', +v); if (UI.res(r, r.msg)) UI.render(); };
  UI.actions.startTrain = function (v) { if (UI.res(G.startTrain(+v), '開始訓練')) UI.render(); };
  UI.actions.stopTrain = function () { var r = G.stopTrain(); if (UI.res(r, r.name + ' 獲得 ' + r.exp + ' 經驗')) UI.render(); };
  UI.actions.upBld = function (k) { if (UI.res(G.upgradeBuilding(k), '升級成功')) UI.render(); };
  UI.modals.heroDetail = function () {
    var s = MJ.S.state, h0 = G.hero(UI.sel.hallUid), def = R.heroDef(h0.id);
    var t = '<div class="parch detail"><b>' + U.esc(G.nameOf(h0)) + '</b>（' + U.esc(def.faction) + '）<br>' +
      '品質：' + (h0.id === 'lead' ? '主角' : UI.qname(def.quality)) + '　類型：' + R.typeOf(h0, s) + '<br>' +
      '每級成長：力 ' + (h0.id === 'lead' ? MJ.D.config.leadTypes[R.leadTypeOf(s)].growth.str : def.growth.str) + '　智 ' + (h0.id === 'lead' ? MJ.D.config.leadTypes[R.leadTypeOf(s)].growth.int : def.growth.int) + '　敏 ' + (h0.id === 'lead' ? MJ.D.config.leadTypes[R.leadTypeOf(s)].growth.agi : def.growth.agi) + '　耐 ' + (h0.id === 'lead' ? MJ.D.config.leadTypes[R.leadTypeOf(s)].growth.con : def.growth.con) + '<br>' +
      '單人戰鬥力（D 估算）：' + U.fmt(R.power(h0, s)) + '<br>資料等級：' + U.esc(def.grade || '') +
      '傷害類型：' + MJ.D.config.damageTypes[R.derived(h0, s).dtype] + '　升階：' + (h0.star || 0) + '/5<br>' +
      '<p class="note">屬性公式：物攻 = 力量×5+5（力系）、物防 = 力×0.5+耐×0.67、法防 = 智×0.5+耐×0.42、生命 = 耐×20+等級×13（C，依 A 級截圖 Lv6 數值反推，完全吻合）。絕技攻 = 敏×5+5（敏耐型）、絕技防 = 敏×0.6+耐×0.3（D）。培養、升階、心法加成在四維/屬性內；將星錄、圖鑑、陣法為全隊加成，只在戰鬥時套用（D）。</p></div>';
    return UI.panel('武將詳情', t, { cls: 'narrow' });
  };
})();

</script>
<script>/* js/ui-gate.js */
/* 虛空之門：章節路線圖 → 3×3 關卡格（A：宣傳片）→ 出戰視窗 */
(function () {
  var UI = MJ.UI, U = MJ.U, G = MJ.G, R = MJ.R;
  var NODE = [[150, 400], [370, 300], [590, 380], [800, 250]];
  var KIND = { normal: '普通', elite: '精英', boss: '王關', hidden: '隱藏' };
  UI.screens.gate = function () {
    var s = MJ.S.state, ch = UI.sel.gateCh;
    var h = '<div class="scr gate-scr"><div class="voidbg"></div>' + UI.hud();
    if (!ch) {
      h += '<div class="frame bigframe gate"><div class="plaque">虛空之門</div><a class="xbtn" data-a="city">×</a><div class="map">';
      h += '<svg class="art path" viewBox="0 0 900 480"><path d="M150 400 Q260 300 370 300 Q480 300 590 380 Q700 450 800 250" stroke="#f6e7c8" stroke-width="10" fill="none" stroke-dasharray="4 16" stroke-linecap="round"/></svg>';
      var curCh = 1; U.each(MJ.D.stages.chapters, function (c) { if (G.chapterUnlocked(c.id)) curCh = c.id; });
      var chs = MJ.D.stages.chapters, vols = Math.ceil(chs.length / 4);
      if (UI.sel.gateVol == null) UI.sel.gateVol = Math.floor((curCh - 1) / 4);
      var vol = Math.min(vols - 1, UI.sel.gateVol);
      U.each(chs.slice(vol * 4, vol * 4 + 4), function (c, i) {

      var ci2 = el('cutin'); if (ci2 && e.ult) ci2.className = 'cutin on small';
      if (e.ult) { var sk2 = el('bskill'); if (sk2) { sk2.innerHTML = U.esc(e.skill); sk2.className = 'b-skill on'; } flash(me.side === 'A' ? 'gold' : 'blue'); shake(true); }
      highlight(e.side, e.cells, e.heal ? 'heal' : 'warn', T(e.ult ? 900 : 520));
      var tgtKey = e.target, melee = !e.heal && isMelee(me.u) && e.pattern !== 'all';
      if (ue) ue.className = ue.className.replace(/ acting/g, '') + ' acting';
      if (melee && tgtKey && BT.units[tgtKey] && ue) {
        var tp = pos(BT.units[tgtKey].side, BT.units[tgtKey].cell), mp = pos(me.side, me.cell);
        var dx = tp.x - mp.x + (me.side === 'A' ? -70 : 70), dy = tp.y - mp.y;
        setTimeout(function () { ue.style.webkitTransform = ue.style.transform = 'translate(' + dx + 'px,' + dy + 'px)'; }, T(150));
      } else if (!e.heal && tgtKey && BT.units[tgtKey]) {
        // 遠程／法術：投射光球
        var a = pos(me.side, me.cell), b = pos(BT.units[tgtKey].side, BT.units[tgtKey].cell), fx = el('fx');
        if (fx) {
          var o = document.createElement('div'); o.className = 'orb ' + (me.u.phys ? 'arrow' : 'magic');
          o.style.left = (a.x - 14) + 'px'; o.style.top = (a.y - 70) + 'px'; fx.appendChild(o);
          setTimeout(function () { o.style.webkitTransform = o.style.transform = 'translate(' + (b.x - a.x) + 'px,' + (b.y - a.y) + 'px)'; }, T(150));
          setTimeout(function () { if (o.parentNode) o.parentNode.removeChild(o); }, T(450));
        }
      }
      var impact = T(e.ult ? 520 : 420);
      setTimeout(function () {
        var k = 0;
        U.each(group, function (g) { setTimeout(function () { if (BT && !BT.done) applyEv(g); }, T(k * 45)); if (g.t === 'hit' || g.t === 'heal') k++; });
        setTimeout(function () {
          if (ue) { ue.style.webkitTransform = ue.style.transform = ''; ue.className = ue.className.replace(/ acting/g, ''); }
        }, T(260 + k * 45));
        BT.timer = setTimeout(function () {
          if (e.ult) { var ci3 = el('cutin'); if (ci3) ci3.className = 'cutin'; var sk3 = el('bskill'); if (sk3) sk3.className = 'b-skill'; BT.ultTotal = null; }
          step();
        }, T(e.ult ? 900 : 560) + T(k * 45));
      }, impact);
    }, t0);
  }
  function next(ms) { BT.timer = setTimeout(step, ms); }
  function finish() {
    if (!BT || BT.done) return;
    BT.done = true;
    clearTimeout(BT.timer);
    // 以模擬結果校正最終畫面
    U.each(BT.r.battle.units, function (u) { setHp(u.key, u.hp); setDead(u.key, u.hp <= 0); });
    var ci = el('cutin'); if (ci) ci.className = 'cutin';
    setTimeout(showResult, 300);
  }
  UI.battleFinish = finish;
  function showResult() {
    var r = BT.r, s = MJ.S.state, h;
    var b = el('bresult'); if (!b) return;
    var btEl = el('bt'); if (btEl && btEl.className.indexOf('ended') < 0) btEl.className += ' ended';
    sfx(r.win ? 'win' : 'lose');
    if (UI.battleResultMusic) UI.battleResultMusic();
    if (r.mode && UI.modeResult) { if (!r.win && btEl) btEl.className += ' lost'; b.innerHTML = UI.modeResult(r); return; }
    if (r.win) {
      var stars = ''; for (var i = 0; i < 3; i++) stars += '<i class="' + (i < r.stars ? 'on' : '') + '">★</i>';
      h = '<div class="dim"></div><div class="result win"><div class="banner">勝 利</div><div class="rstars">' + stars + '</div><div class="parch rbody">' +
        '<div>回合數：' + r.battle.rounds + '　消耗精力：' + r.energyCost + '</div>' +
        '<div>全隊經驗 +' + r.exp + '</div>' +
        (r.levelUps.length ? '<div class="lvup">升級！' + U.esc(r.levelUps.join('、')) + '</div>' : '') +
        '<div class="rw-h">戰利品</div><div class="reward-list">' + U.map(r.rewards, function (x) { return '<div class="rw">' + U.esc(x) + '</div>'; }).join('') + '</div>' +
        (r.firstRewards ? '<div class="rw-h">首通獎勵</div><div class="reward-list">' + U.map(r.firstRewards, function (x) { return '<div class="rw first">' + U.esc(x) + '</div>'; }).join('') + '</div>' : '') +
        '</div>';
    } else {
      var bt = el('bt'); if (bt) bt.className += ' lost';
      var lead = G.lead();
      h = '<div class="dim"></div><div class="result lose"><div class="banner">戰 敗</div><div class="parch rbody">' +
        '<div>' + (r.battle.timeout ? '已達 ' + MJ.D.config.maxRounds + ' 回合上限，判定進攻方失敗。' : '我方全軍覆沒。') + '</div>' +
        '<div>' + (r.energyCost ? '消耗精力 ' + r.energyCost : '主角 ' + MJ.D.config.noEnergyLossBelowLevel + ' 級前戰敗不扣精力。') + '　沒有獲得任何獎勵。</div>' +
        (r.nextMorale ? '<div class="morale">越戰越勇：下次挑戰本關，我方生命／攻擊 +' + Math.round(r.nextMorale * 100) + '%</div>' : '') +
        '<div class="rw-h">如何提升戰鬥力</div><div class="tips">・到神武殿培養武將：按「最強」換上更好的裝備、安排訓練<br>・重打已通關的關卡累積經驗<br>・在聚賢莊招募更高品質的武將<br>・調整陣法，把耐打的武將放在前排</div></div>';
    }
    var sg = r.stage;
    h += '<div class="btn-row"><a class="btn" data-a="bAgain" data-v="' + sg.id + '">再戰一次</a><a class="btn" data-a="bBack">返回關卡</a><a class="btn" data-a="bCity">回主城</a></div></div>';
    b.innerHTML = h;
  }
  UI.actions.bSpeed = function () { BT.speed = BT.speed === 1 ? 2 : 1; MJ.S.state.settings.speed = BT.speed; MJ.S.save(); var e = el('bspeed'); if (e) e.innerHTML = BT.speed + 'x'; };
  UI.actions.bSkip = function () {
    if (!BT || BT.done) return;
    clearTimeout(BT.timer);
    // 把剩餘事件寫進戰報
    for (; BT.i < BT.ev.length; BT.i++) { var lg = evLog(BT.ev[BT.i]); if (lg) addLog(lg); }
    var fx = el('fx'); if (fx) fx.innerHTML = '';
    finish();
  };
  UI.actions.bLog = function () { BT.showLog = !BT.showLog; var l = el('blog'); if (l) l.className = 'blog' + (BT.showLog ? ' on' : ''); };
  UI.actions.bGrid = function (v, a) { BT.showGrid = !BT.showGrid; var b = el('bt'); if (b) b.className = b.className.replace(/ showgrid/g, '') + (BT.showGrid ? ' showgrid' : ''); a.className = 'zhen' + (BT.showGrid ? ' on' : ''); };
  UI.actions.bFormula = function () { UI.toast(MJ.Battle.FORMULA_NOTE); var t = el('toast'); if (t) { clearTimeout(UI._ft); } };
  UI.actions.bAgain = function (id) { BT.done = true; var r = G.fight(id); if (!r.ok) { UI.toast(r.msg, 'bad'); return; } UI.startBattle(r); };
  UI.actions.bBack = function () { if (BT) { BT.done = true; if (BT.r.stage.ch) UI.sel.gateCh = BT.r.stage.ch; } BT = null; UI.go('gate'); };
  UI.actions.bCity = function () { if (BT) BT.done = true; BT = null; UI.go('city'); };
  UI.battleState = function () { return BT; };
})();

</script>
<script>/* js/ui-misc.js */
/* 其他視窗：道具、陣法、日志、郵件、商城、設置、任務；新遊戲畫面 */

          '<a class="btn small" data-a="sellEq" data-v="' + e.uid + '">賣出 ' + R.equipSell(e) + '</a></div>';

      }, '沒有魂魄');
    }
    b += '<div class="rows">' + pg.html + '</div>' + pg.nav;
    return UI.panel('道具', b, { cls: 'mid' });
  };
  UI.actions.useItem = function (k) {
    var it = MJ.D.equipment.items[k];
    if (!it.use && !it.xinfa) { UI.toast(it.name + '：' + it.desc); return; }
    if (it.xinfa || it.use.heroExp) { UI.open('pickHero', k); return; }
    var r = G.useItem(k); if (UI.res(r, r.msg)) UI.renderModal();
  };
  UI.modals.pickHero = function (k) {
    var s = S.state, xf = MJ.D.equipment.items[k].xinfa, list = U.filter(s.heroes, function (h) { return xf || h.id !== 'lead'; });
    var pg = UI.pager('pickP', list, 8, function (h) { return UI.portrait(h, { act: 'useOn', v: k + ':' + h.uid }); }, '沒有可使用的武將');
    return UI.panel('選擇武將（' + MJ.D.equipment.items[k].name + '）', '<div class="cards">' + pg.html + '</div>' + pg.nav + '<div class="btn-row"><a class="btn" data-a="open" data-v="bag">返回</a></div>', { cls: 'mid' });
  };
  UI.actions.useOn = function (v) { var a = v.split(':'); var r = G.useItem(a[0], +a[1]); if (UI.res(r, r.msg)) UI.renderModal(); };
  UI.actions.sellEq = function (uid) { var r = G.sellEquip(+uid); if (UI.res(r, '賣出，獲得銀幣 ' + r.silver)) UI.renderModal(); };

  // ---------- 陣法 ----------
  UI.modals.formation = function () {
    var s = S.state, f = G.formation(), slots = R.teamSlots(G.lead().lv), selH = UI.sel.fHero;
    var b = '<div class="form-wrap"><div class="form-list">';
    var lv = G.lead().lv, oc = G.openCells();
    U.each(MJ.D.formations, function (x) {
      var bon = U.map(U.keys(x.bonus || {}), function (k) { return UI.STAT_NAMES[k] + '+' + x.bonus[k] + '%'; }).join(' ');
      b += '<a class="fl' + (x.id === f.id ? ' on' : '') + (x.open > lv ? ' dim2' : '') + '" data-a="setForm" data-v="' + x.id + '"><b>' + U.esc(x.name) + (x.open > lv ? '（' + x.open + '級）' : '') + '</b><small>' + U.esc(x.desc) + '<br>全隊 ' + bon + '</small></a>';
    });
    b += '</div><div class="form-mid"><div class="fm-h">出戰 ' + G.teamCount() + '/' + slots + '　<small>（' + U.map(MJ.D.config.teamSlotsByLevel.slice(1), function (x) { return x[0]; }).join('/') + ' 級各 +1 人，最多 9 人）</small></div><div class="fgrid"><span class="fg-dir">敵方 ▶</span>';
    for (var r = 0; r < 3; r++) for (var c = 2; c >= 0; c--) {
      var cell = r * 3 + c, open = oc.indexOf(cell) >= 0, uid = s.team.cells[cell], h = uid && G.hero(uid);
      b += '<div class="fcell' + (open ? '' : ' closed') + (h && h.uid === selH ? ' sel' : '') + '"' + (open ? ' data-a="fCell" data-v="' + cell + '"' : '') + '>' +
        (h ? UI.portrait(h, { cls: 'mini' }) : (open ? '<span class="fc-e">空位</span>' : '<span class="fc-e">未開放</span>')) + '<i class="fc-n">' + ['前', '中', '後'][c] + '</i></div>';
    }
    b += '</div><div class="fm-tip">先點右側武將或陣中武將，再點格子放入／互換。第 1 列（最右）為前排。<br>出手順序：雙方交替，前列先、同列由下往上。</div></div>';
    var list = s.heroes.slice().sort(function (a, b2) { return b2.lv - a.lv; });
    var pg = UI.pager('formP', list, 8, function (h) {
      var inT = G.inTeam(h.uid) != null;
      return '<div class="fh">' + UI.portrait(h, { act: 'fPick', sel: h.uid === selH, badge: inT ? '陣' : '' }) +
        (h.id === 'lead' ? '<span class="fh-b dim2">主角</span>' : (inT ? '<a class="fh-b" data-a="fOut" data-v="' + h.uid + '">下陣</a>' : '<a class="fh-b" data-a="fIn" data-v="' + h.uid + '">上陣</a>')) + '</div>';
    });
    b += '<div class="form-roster"><div class="cards">' + pg.html + '</div>' + pg.nav + '</div></div>';
    return UI.panel('陣法', b, { cls: 'wide' });
  };
  UI.actions.setForm = function (id) { if (UI.res(G.setFormation(id))) UI.renderModal(); };
  UI.actions.fPick = function (uid) { uid = +uid; UI.sel.fHero = UI.sel.fHero === uid ? null : uid; UI.renderModal(); };

    var r = G.setCell(cell, UI.sel.fHero); if (UI.res(r)) { UI.sel.fHero = null; UI.renderModal(); }

  UI.modals.log = function () {

    return UI.panel('日志', '<div class="rows">' + pg.html + '</div>' + pg.nav, { cls: 'mid' });
