s:[],phase:"web2-v10",tentative:true,conflicts:[]},{id:"v10.board.frontline",cat:"戰鬥",item:"不能越過敵方最前線",spec:"—",current:"往前時不能踏進「敵方最前面活人所在欄」或更後面的欄（避免兩軍穿過彼此）（只用於規則 v10 的舊戰鬥／重播；v11 取消，改為持續前進）",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v10",tentative:true,conflicts:[]},{id:"v10.board.stale",cat:"戰鬥",item:"僵局以血量比例判定",spec:"—",current:"沒人能再移動、且沒人打得到任何敵人（無雙只在怒氣滿 100 時算）時結束戰鬥：我方剩餘血量比例嚴格大於敵方才算勝（規則 v10；v11 改用 v11.board.stale）",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v10",tentative:true,conflicts:[]},{id:"v10.board.waitrage",cat:"戰鬥",item:"等待不加怒氣",spec:"—",current:"因為打不到而原地等待（wait）不給怒氣",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v10",tentative:true,conflicts:[]},{id:"v10.formation.fill",cat:"陣容",item:"換陣法時的換位順序",spec:"—",current:"依舊陣法格子順序把武將依序放進新陣法的格子（每個人都會跟著陣形換位）",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v10",tentative:true,conflicts:[]},{id:"jx.upgrade.slots",cat:"聚賢莊",item:"聚賢莊升級增加武將欄位",spec:"sn41",current:"聚賢莊可在「我的武將」分頁升級，升級後武將上限增加",grade:"B",label:"原版（當年攻略記載）",sources:[{s:"S1",q:"聚賢莊 (開放等級>>初期就開放) (任務需要在升) 功能:刷新武將 建築升級可以提升武將欄位+經驗池經驗上限+武將遣散返回經驗值"}],phase:"web2-v10",tentative:false,conflicts:[],note:"另有百科類簡介（newton，C～B）：「聚賢莊可以升級，而玩家能招募的武將的數量和聚賢莊的等級也有關係」。經驗池上限、遣散返還經驗兩項本作尚未做"},{id:"jx.upgrade.numbers",cat:"聚賢莊",item:"聚賢莊升級數字",spec:"—",current:"武將上限＝5＋(聚賢莊等級−1)；升級費用 500×目前等級² 銀幣；聚賢莊等級不能超過主角等級；只會變多，舊存檔武將不會被移除",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v10",tentative:true,conflicts:[]},{id:"v11.board.advance",cat:"戰鬥",item:"每回合雙方持續往前（規則 v11）",spec:"Tomas t23u",current:"每回合開始時雙方所有活著的單位往前一格；同一列對面的敵人死了也繼續往前，不再停在敵方最前線前面（取消 v10.board.frontline）；只會往前，不換列（v10.board.rowfixed 照舊）；攻擊範圍（普攻、主動、無雙）一律從自己當下所在的格子往前算",grade:"C",label:"推測（玩家回憶）",sources:[{s:"TOMAS",q:"小問題修正 / 過去遊戲是每回合雙方持續往前 如果同一排對面敵人死去 一樣一直往前 直到畫面頂部時會統一到第一排後方排隊 敵人與我方都是 / 就不會有時因技能範圍打不到人 卡在中間只能挨打"}],phase:"web2-v11",tentative:true,conflicts:[]},{id:"v11.board.wrap",cat:"戰鬥",item:"走到底回到我方第一排後方排隊",spec:"Tomas t23u",current:"往前走到棋盤盡頭（再走就出界）時，回到自己這一方第一排（目前最前面的我方單位那一欄）的後一欄，留在同一列；敵我雙方都一樣",grade:"C",label:"推測（玩家回憶）",sources:[{s:"TOMAS",q:"小問題修正 / 過去遊戲是每回合雙方持續往前 如果同一排對面敵人死去 一樣一直往前 直到畫面頂部時會統一到第一排後方排隊 敵人與我方都是 / 就不會有時因技能範圍打不到人 卡在中間只能挨打"}],phase:"web2-v11",tentative:true,conflicts:[],note:"「第一排後方」與「同一列」的細節見 v11.board.queue（D）。原話「統一到第一排後方排隊」也可能是指換到別列排隊，待 Tomas 確認"},{id:"v11.board.block",cat:"戰鬥",item:"持續前進時的擋路與卡住穿過",spec:"—",current:"前方那一格是隊友就停下（排隊跟著走）；是敵人就停下來打。卡住穿過：上一回合已經緊貼敵人停下、而且那一回合技能打不到人（等待），這回合前方仍是敵人時，從敵人身邊穿過去，走到同一列再往前第一個空格（到盡頭都沒有空格就回第一排後方排隊）",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v11",tentative:true,conflicts:[],note:"「卡住穿過」是為了做到 Tomas 說的「不會卡在中間只能挨打」而加的本作解讀，原版是否會穿過敵人不確定（實測：不加的話通天塔 90 層一般模型 12 場全部超時，敵人緊貼我方、我方技能打不到相鄰格）"},{id:"v11.board.queue",cat:"戰鬥",item:"走到底的排隊位置與順序",spec:"—",current:"排隊格＝我方其他活著單位裡最前面那一欄的後一欄（同一列）；那格有人就再往後一格，直到自己的底線；後面都滿了才找前面最近的空格；只剩自己一人時回到開場第一排那一欄（我方第 2 欄／敵方第 5 欄）；同一回合多人走到底時依行動順序排，後到的排在後面",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v11",tentative:true,conflicts:[]},{id:"v11.board.stale",cat:"戰鬥",item:"持續前進後的僵局判定",spec:"—",current:"連續 8 回合（走完一整排）雙方都沒有人受到傷害時結束戰鬥，以剩餘血量比例判定：我方比例嚴格大於敵方才算勝（v10 的「沒人走得動」條件在持續前進下不會成立）",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v11",tentative:true,conflicts:[]},{id:"web2.skill.rates",cat:"技能",item:"技能倍率基準",spec:"snA967 表 5：普攻、六等普攻、無雙",current:"61 名武將的 Lv1 普攻、Lv6 普攻與無雙基準採來源表；88 名中其餘未列者維持原本 D 級倍率。",grade:"B",label:"原版（當年攻略記載）",sources:[{s:"W967",q:"表 5：武將普攻、六等普攻與無雙倍率"}],phase:"web2-P3",tentative:false,conflicts:[]},{id:"web2.skill.activeCurve",cat:"技能",item:"普攻技能等級曲線",spec:"Lv1 a+5、Lv6 b+125；Lv6 後固定值每級 +50",current:"Lv1 倍率 a、Lv6 倍率 b；Lv1 固定值 +5、Lv5 +75、Lv6 +125、Lv7 起每級 +50。Lv2–5 倍率依 Lv1/Lv6 線性插值，Lv2–4 固定值依 Lv1/Lv5 線性插值，均為推估。",grade:"C",label:"推測（間接資料）",sources:[{s:"W967",q:"表 5：普攻與六等普攻基準"},{s:"W282",q:"小昭 tooltip 可見 Lv5 +75、Lv6 +125、Lv7 +175、Lv9 +275"}],phase:"web2-P3",note:"中間等級為明示的線性插值政策，非逐級截圖值；Lv5 固定值節點取小昭截圖。",tentative:true,conflicts:[]},{id:"web2.skill.ultProgression",cat:"技能",item:"無雙技能升級曲線",spec:"無雙基準 c+10",current:"來源替換無雙基準倍率與固定值；升級時沿用既有 6% 倍率／10% 固定值成長，因來源未提供完整逐級表，仍屬本作 D 級曲線。",grade  d≤10 倍率 1；d>10 時倍率 = max(0.10, 1 − 0.05 × (d − 10))，每多 1 級 −5%，最低 10%；門檻取 config.levelSuppression（=10）。命中判定（90%＋命中−閃避，最低 20%）不變。戰鬥 log 與傷害浮字標示「壓制 ×倍率」。例外：v6 以前戰報重播仍用舊必定未命中規則（opt.oldSuppression），勝負與回合數與當時相同。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-09 Tomas 指示：等級壓制改傷害遞減，等差 >10 每多 1 級 −5%，最低 10%。"}],conflicts:[],tentative:true,phase:"WL-3",note:"取代舊 B 級規則「目標高於攻擊者 10 級以上必定未命中」（僅見於 battle.js FORMULA_NOTE，無獨立考證條目，故無舊條目可刪；歷史脈絡保留於此條目與 FORMULA_NOTE）。"},{id:"boss.affix",cat:"戰鬥",item:"首領詞綴：王關／隱藏關首領隨機詞綴",spec:"本作設計",current:"WL-4（2026-11-09 Tomas 指示）：虛空之門王關與隱藏關的首領每場帶一個詞綴，詞綴池 5 個——嗜血（吸血 10%）、荊棘（反彈所受傷害 15%）、疾風（敏捷 +30%、先手）、堅岩（物防法防 +20%）、狂怒（血量低於 50% 時攻擊 +15%，與狂暴疊加，<30% 時合計 +35%）。詞綴由戰鬥種子派生（B.pickAffix，獨立亂數流，不消耗戰鬥亂數；同一種子同一關詞綴相同；禁用 Math.random）。關卡面板（出戰視窗）戰前顯示詞綴名與效果，戰鬥中首領頭像旁也有詞綴標籤，開場戰鬥 log 顯示「詞綴·某名」。普通關與精英關不上詞綴（精英關首領雖也是 boss 模板，但只認關卡 kind 為 boss／hidden）。詞綴只影響首領本人，不影響小兵。狂暴由直接賦值改為累加，才能與狂怒疊加。疾風的先手為行動順序最前（本作行動順序本來只看站位，敏捷不影響順序）；疾風同時把絕技攻防一併 +30%，否則敏捷在戰鬥中不起作用。詞綴不寫入存檔（由種子派生）。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-09 Tomas 指示：首領詞綴先做（改動最小、只動王關、戰前可見、可直接量測）；詞綴池 5 個，每場一個。"}],conflicts:[],tentative:true,phase:"WL-4",note:"原版沒有首領詞綴，純原創 D 級；數值未經原版考證，上線前以 tools/balance.js 帶詞綴王關量測對照弱勢隊勝率變化。"},{id:"mode.limitedRounds",cat:"玩法",item:"限回合挑戰：已通關關卡 12 回合內打贏",spec:"本作設計",current:"WL-5（2026-11-09 Tomas 指示）：只開放給已通關的關卡（重打舊關的挑戰模式，不影響首次通關流程與進度）。挑戰條件為 12 回合內打贏（maxRounds 已是 Battle.run 參數，直接用它）。獎勵：銀幣 +50%（以該關正常銀幣獎勵為基數）；首次挑戰成功另給金幣 +5（每關只領一次）。無死亡挑戰成功：整場我方無人陣亡，多一次將魂掉落判定（沿用該關 drops 裡的將魂、同一條戰鬥種子亂數流重擲一次，禁用 Math.random）。戰前在關卡面板（出戰視窗）寫明挑戰規則與獎勵，進戰鬥用的就是同一組條件。挑戰失敗（12 回合內未打贏或全滅）不影響該關原本的通關紀錄（clears／stars 不動）與越戰越勇計數（fails 不加）；獎勵在結算時一次發放，不重發。挑戰紀錄存在存檔 chal[id] = { cleared, gold }（加法性欄位，舊存檔由 S.applyDefaults 補齊，存檔 v12 不變）。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-09 Tomas 指示：限回合挑戰第二做（零平衡風險、給老玩家重打舊關的理由）；12 回合內打贏，銀幣 +50%，首次挑戰成功金幣 +5，無死亡多一次將魂掉落。"}],conflicts:[],tentative:true,phase:"WL-5",note:"原版沒有此模式，純原創 D 級；不動既有戰鬥數值與主線進度，平衡以 tools/balance.js 量測既有量測與基線相同、另量測挑戰模式代表關卡通關率。"},{id:"battle.reinforce",cat:"戰鬥",item:"增援波次：王關／隱藏關首領血量首次低於 50% 時 2 名同章小兵加入戰場",spec:"本作設計",current:"WL-6（2026-11-09 Tomas 指示）：王關／隱藏關才有，每場最多觸發一次。首領血量首次低於 50% 時觸發，2 名同章小兵（等級取該關第一名小兵的等級，由戰鬥種子派生，獨立亂數流，禁用 Math.random）加入戰場，進場時飄字「敵軍增援！」。有空格立刻進場（大棋盤優先敵方後排 bx 7→6→5，每欄由上而下）；滿編時待命，之後敵方小兵陣亡空出格子時立即補進該格，直到補滿 2 名或戰鬥結束；戰鬥結束前始終沒有空格，增援就不出現。增援小兵不上詞綴。觸發與進場都不吃亂數，同一組輸入重跑事件完全相同，戰報重播一致。戰前在關卡面板寫明增援規則。增援不寫入存檔（由種子派生，存檔 v12 不變）。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-09 Tomas 指示：增援波次第三做（戲劇效果最強，但要先處理滿編空格與戰報重播）；首領血量首次低於 50% 時 2 名同章小兵增援，進場飄字「敵軍增援！」。"}],conflicts:[],tentative:true,phase:"WL-6",note:"原版沒有增援波次，純原創 D 級；不動既有戰鬥數值，平衡以 tools/balance.js 量測王關／隱藏關＋精英關在增援下的勝率變化。"},{id:"battle.randomFoes",cat:"戰鬥",item:"隨機敵方組合：精英／王關／隱藏關的小兵由戰鬥種子重抽",spec:"本作設計",current:"WL-6（2026-11-09 Tomas 指示）：精英／王關／隱藏關的小兵組合由戰鬥種子重抽（首領固定不變），每場可能不同。小兵池為同一章各關用過的非首領敵人模板（去重、依模板 id 排序）；同種小兵最多 3 名；小兵等級與站位不變，只換種類。獨立亂數流（seed ^ 0x6d2b79f5），不消耗戰鬥亂數；同一種子同一關組合相同，重播一致。戰前在關卡面板寫明隨機並顯示本次抽出的小兵組合（與實戰同一顆待用種子）。普通關不重抽。隨機組合不寫入存檔（由種子派生，存檔 v12 不變）。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-09 Tomas 指示：隨機敵方組合第四做；精英／王關／隱藏關小兵重抽，首領固定，同種小兵最多 3 名。"}],conflicts:[],tentative:true,phase:"WL-6",note:"原版沒有隨機敵方組合，純原創 D 級；不動既有戰鬥數值，平衡以 tools/balance.js 量測精英／王關／隱藏關在隨機組合下的勝率變化。"},{id:"mode.doubleChallenge",cat:"玩法",item:"×2 挑戰：已通關關卡敵方攻防血 ×2、正常 36 回合",spec:"本作設計",current:"WL-7（2026-11-10 Tomas 指示）：保留 WL-5 限回合挑戰，另加一個給後期／練很勤玩家的挑戰模式，只開放給已通關的關卡（重打舊關的挑戰模式，不影響首次通關流程與進度）。敵方首領＋小兵全部 ×2（含隨機組合抽出的小兵與增援進場的小兵），翻倍：物攻／法攻／絕技攻、物防／法防／絕技防、血量、無雙固定傷害；不翻倍：命中／閃避（敵人本來就是 0，且命中公式 90% + (命中−閃避)% 夾在 [20%,100%]，翻倍差距會把命中率推向上下限變成純運氣）、爆擊（王關 5、小兵 0，爆擊是機率不是攻防血）、敏捷（決定行動順序，翻倍會讓敵方幾乎每回合先手；敏捷衍生的絕技攻防已在翻倍清單裡）、等級（牽動等級壓制曲線與敵人成長曲線，翻倍無意義）、血條層數（血量 ×2 已把總血量翻倍）。回合數為正常 36 回合（不是 12 回合）。王關的 ×2 與 WL-4 詞綴、WL-6 增援＋隨機組合疊加（先翻倍再套詞綴，詞綴百分比疊在翻倍後的數值上；增援小兵不上詞綴）。獎勵沿用限回合挑戰結構：銀幣 +50%（以該關正常銀幣獎勵為基數）；首次挑戰成功另給金幣 +5（每關只領一次）；無死亡挑戰成功多一次將魂掉落判定（沿用該關 drops 裡的將魂、同一條戰鬥種子亂數流重擲一次，禁用 Math.random）。戰前在關卡面板（出戰視窗）寫明挑戰規則與獎勵，進戰鬥用的就是同一組條件；戰鬥中敵方頭像旁顯示 ×2 標籤、戰鬥標題顯示（×2 挑戰）、開場戰報事件寫「敵方數值 ×2」。挑戰失敗（36 回合內未打贏或全滅）不影響該關原本的通關紀錄（clears／stars 不動）與越戰越勇計數（fails 不加）；「再戰一次」重複同一模式；限回合挑戰與 ×2 挑戰不能同時進行。挑戰紀錄存在存檔 chal2[id] = { cleared, gold }（加法性欄位，舊存檔由 S.applyDefaults 補齊，存檔 v12 不變）。倍率是確定性乘法（Math.floor 取整），不吃亂數、不開新亂數流，沿用現有的待用種子機制；同一種子同一模式重打，勝負／回合／獎勵／戰鬥事件完全相同。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-10 Tomas 指示：保留 12 回合挑戰，另外加 ×2 模式（敵方所有數值合理翻倍），給玩到後期／練很勤的玩家挑戰；36 回合（不是 12 回合）。"}],conflicts:[],tentative:true,phase:"WL-7",note:"原版沒有此模式，純原創 D 級；不動既有戰鬥數值與主線進度，平衡以 tools/balance.js 量測 ×2 模式代表關卡通關率。"},{id:"balance.bossScale",cat:"平衡",item:"主線精英／王／隱藏關章節倍率：敵方攻防血 × 章節倍率",spec:"本作設計",current:"WL-8（2026-11-10 Tomas 指示）：主線精英／王／隱藏關的敵方攻防血 × 本章倍率，逼玩家養成裝備技能。倍率表（config.bossScale，依章 1–10）：1.20、1.65、2.45、2.30、2.65、3.60、3.50、2.95、2.60、2.30。校準前（tools/balance.js §§1–8，12 種子）：一般隊同級主線 90 關與精英／王／隱藏 40 關全部 100%（詞綴＋增援＋隨機組合全疊加亦然）；弱勢隊只有 s1_8 58%、s1_9 75% 兩關不到 100%；只有完全不養成隊才在 73/90 關卡關——投資程度在弱勢到一般之間幾乎不影響勝負。校準方法：先以固定倍率掃描各章翻轉點（章節平均勝率約 0.75 時的倍率：ch1 約 1.3、ch2 約 1.7、ch3 約 2.45、ch4 約 2.3、ch5 約 2.65、ch6 約 3.6、ch7 約 3.5、ch8 約 2.95、ch9 約 2.6、ch10 約 2.3；各章翻轉點差異極大，因為隊伍強度在上陣人數／品質階層處階梯跳升、敵人成長曲線已在高級補償），再按章取表；第一章取 1.20（略低於翻轉點 1.3，避免第一個精英關 s1_4 被壓到約 13% 而擋住新手）。不動：命中／閃避／爆擊／敏捷／等級／血條層數；普通關不套；通天塔（floor）與無極幻境（wave）不套；增援與隨機組合經 enemyUnit 產生，同樣套用；與 ×2 挑戰、王關詞綴疊加時先套章節倍率再翻倍／套詞綴。注意：勝率隨敵方強度呈雙峰分布（關卡多在 100% 或驟降至 50% 以下），章節平均 70–80% 不代表每關都在 70–80%——部分關卡低於 50%、部分仍 100%，見 docs/balance-wl8-*.txt 的逐關表。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-10 Tomas 指示：主線要加難度——現在只要等級到了就全過，裝備技能不升也過得了，要的是「裝備技能不升就卡關」；一般隊同級打精英／王／隱藏關勝率目標 70–80%（Tomas 2026-11-10 12:45 由 85–95% 上調），普通關維持 100%。"}],conflicts:[],tentative:true,phase:"WL-8",note:"原版無此機制，純原創 D 級；不動戰鬥規則（命中／爆擊／怒氣／壓制曲線）、玩家成長、獎勵與經濟。校準方法與量測結果見 docs/balance-wl8-*.txt/.json；單關勝率分布不均（見 current），章節平均為校準目標。"},{id:"balance.maxTeam",cat:"平衡",item:"最高理論隊伍模型（max）：該章可達的養成上限，用來驗證 ×2 挑戰是否打得動",spec:"本作設計",current:"WL-8 補修（2026-11-10 Tomas 指示：×2 調整成「同等級、武將全部裝備技能等都達到該章最高理論值」的隊伍打得過）。max 模型（tools/balance.js profile('max')，D 級）：最高品質武將（品質 4）、當級最好裝備（gearLv＝關卡等級，裝備最高 Lv54）與最高品質（紫 q3）、強化拉滿（plus＝主角等級：神兵坊等級上限＝主角等級，銀幣成本不計）、技能升滿（sk＝min(10, 等級)：9 級＋「突破·神」升 10 級，技能等級不能超過武將等級）、圖鑑全收（codex＝87：88 名武將扣主角，獎勵封頂 15%）、培養拉滿（py＝培養上限 floor(10+1.5×等級)，四維全滿）、將星 5 星（star＝5，全屬性 +30%）、主角升階（leadQ：Lv<20 為 2、20–59 為 3、60+ 為 4）、上陣人數拉滿（8 人上限）。不建模：心法／寶石／裝備洗鍊屬性（所有檔次皆不建模，故 max 是保守估計——真實全滿隊伍只會更強）。量測結果（tools/balance.js §10，12 種子）：max 同級打 ×2（現況 mult 2、不封頂）40 關精英／王／隱藏關全部 100%（原組合與隨機組合＋增援實戰口徑皆然），章節王關 10 關也全部 100%——遠高於 Tomas 定的標準（每關 >0%、王關 ≥25%）。主因：max 隊數值約為一般隊的 2.8–3.0 倍（Lv75 攻擊 225,338 對 79,726、血量 1,557,880 對 527,133），足以抵銷 ×2 的翻倍。候選 A（mult 1.5）、B（總倍率上限 4）、C（1.5＋上限 4）量測同樣全部 100%，改動無意義。結論：×2 不用改（mult 維持 2、不封頂），遊戲零改動；本輪只加量測模型與本條目。×2 仍比一般模式難（額外倍率 2 > 1）。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-10 Tomas 指示：×2 調整成「同等級、武將全部裝備技能等都達到該章最高理論值」的隊伍打得過；×2 本來就是挑戰，難一點沒差，但不能完全無法通關。"}],conflicts:[],tentative:true,phase:"WL-8",note:"量測模型專用條目，不動遊戲規則與數值；量測結果見 docs/balance-wl8-after.txt/.json §10（wl8fix）。"},{id:"mode.randomEvents",cat:"玩法",item:"關卡內隨機事件（WL-9）：每場主線戰鬥由戰鬥種子抽一個事件，四種——濃霧（命中 −10，第 1–3 回合）、落石（每回合隨機一格受傷，最大生命 15%）、戰鼓（攻擊 +10%，第 1–3 回合）、夜戰（閃避 +5，全場）",spec:"本作設計",current:"WL-9（2026-11-10 Tomas 指示：繼續做隨機事件，驚喜難度路線圖第 5 項）。D 級原創，非原版。設計：每場主線戰鬥（普通／精英／王／隱藏關）由戰鬥種子派生一個事件（獨立亂數流 seed ^ 0x3c6ef372，不消耗戰鬥亂數與詞綴／組合亂數；同一種子同一關事件相同，關卡面板與實戰一致，戰報重播一致）。事件對雙方公平：命中／閃避／攻擊修正作用於雙方；落石每回合隨機一名活著的單位（雙方皆可能中招），傷害為該單位最大生命 15%（至少 1），不觸發反彈／吸血／狂暴。戰前在關卡面板顯示事件名稱與效果，開場以橫幅顯示，結算行亦列出。適用範圍決定（量測）：主線全部關卡都套用（含王／隱藏關，與詞綴＋增援＋隨機組合疊加）；通天塔／無極幻境／武林大會／藏寶窟不經 G.fight，不套事件。量測方法：tools/balance.js §11（12 種子；四種事件 × 40 關精英／王／隱藏關＋8 關代表普通關，一般隊與弱勢隊；基線為 WL-8 第 1 節無事件原組合）。量測結果（§11，12 種子）：王系關一般隊 78%→79%（章平均 72–86%，與 WL-8 的 71–85% 同幅；弱勢 4%→4%）；普通關 100%→100%；四種事件王系關平均：濃霧 78%／落石 80%／戰鼓 78%／夜戰 82%（波動 ±4%，在預期 ±10% 內）；s1_8 全疊加（詞綴＋隨機＋增援）92%→期望 90%；十章王關 +5 級帶事件最低 85%，無新硬牆。結論：事件套用全部主線關卡（含王／隱藏關），不破壞 WL-8 的 70–80% 帶。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-10 Tomas 指示：繼續做隨機事件（驚喜難度路線圖第 5 項）。四種事件的數值與持續回合為 2026-11-09 分析設計，repo 內無更細的 WL-9 規格，以本條目為準。"}],conflicts:[],tentative:true,phase:"WL-9",note:"量測結果見 docs/balance-wl9-after.txt/.json §11（wl9events）。"},{id:"arena.topTeam",cat:"玩法",item:"拜訪武將固定第六組頂尖隊伍（WL-9）：等級＝主角等級、練度拉滿的固定隊伍，挑戰次數不限、勝利銀幣按第 25 名＋等級×10、不影響排名",spec:"本作設計",current:"WL-9（2026-11-10 Tomas 指示：拜訪武將固定新增一個第六組隊伍，隊伍等級與玩家當前等級相同，但是所有武將都是頂尖的，包含裝備等級跟寶石等等，讓玩家隨時可挑戰當下最頂尖可能是怎樣；此組合武將也可變動）。D 級原創，非原版。設計：固定第六組顯示在同一挑戰列表（紫框＋「頂尖／固定」標籤，與名次隊伍區分），等級＝主角等級（動態跟隨）。頂尖＝該等級理論最強（G.arenaTopFoe，D 級）：最高品質武將（品質 4，40 名可挑滿 8 人）、當級最好裝備且最高品質（紫 q3）、強化拉滿（plus＝等級）、技能升滿（sk＝min(10, 等級)：9 級＋突破·神升 10 級）、將星 5 星（全屬性 +30%）、培養拉滿（py＝培養上限 floor(10+1.5×等級)，四維全滿）、圖鑑全收（codex＝87，獎勵封頂 15%）。寶石／心法／洗鍊：戰鬥引擎有建模（rules.js：R.equipStats 處理 e.gems 與 e.aff、R.derived 處理 h.xf），一併拉滿——每件裝備 3 孔（紫裝），每孔不同種類：攻擊寶石 Lv5（665，全三攻；Lv6 是 D 級倒退值 618.44，不用）、生命寶石 Lv6、物防寶石 Lv6；洗鍊每條取上限（主攻 1.4、血 8、物防 0.8，乘 (裝備等級+5)）；心法 2 槽（Lv>=60 才開第二槽）：主攻心法 Lv100（狂風／北冥／葵花，依主攻類型）＋九陰真經 Lv100（全屬性 +1.5%/級）。暴擊寶石不納入（gem_crit_6＝1636 是 D 級退化值，必爆擊無上限）；命中／閃避無寶石。組合由 s.arena.topSeed 抽（同一種子同一等級組合相同），勝場後重抽（與挑戰列表刷新同步）；敗場不重抽（可重試）。規則：挑戰次數不限；勝利銀幣＝第 25 名一般獎勵（660）＋主角等級×10；不影響排名；失敗不扣任何東西；戰報可重播（v7、pvp，與名次隊伍同格式）。與 tools/balance.js 的 max 模型同源，但 max 不建模寶石／心法／洗鍊，故頂尖隊伍比 max 模型更強——max 是保守估計（見 balance.maxTeam）。量測方法：tools/balance.js §12（12 種子；一般隊／max 隊同級打各等級頂尖隊伍）。量測結果（§12，12 種子）：一般隊同級打頂尖隊伍 0%（Lv1–99 全部 0%）；max 隊同級亦 0%（全部等級）。戰力對比（種子 1 的組合）：Lv25 頂尖 476,539 對一般 38,594（×12.35）、對 max 102,383（×4.65）；Lv90 頂尖 3,485,838 對一般 472,490（×7.38）、對 max 1,461,650（×2.38）。頂尖比 max 強主因：max 不建模寶石／心法／洗鍊（見 balance.maxTeam），頂尖全數拉滿；低等級差距更大（Lv8 頂尖／max ×18.22），因寶石是固定數值（攻擊寶石 Lv5 每件 +665），在低等級主導戰力。結論：如實回報，不調弱——頂尖隊伍就是當下最強的展示。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-10 Tomas 指示：拜訪武將這裡固定新增一個第六組隊伍，隊伍等級與玩家當前等級相同，但是所有武將都是頂尖的，包含裝備等級跟寶石等等，讓玩家隨時可挑戰當下最頂尖可能是怎樣；此組合武將也可變動（頂尖中的武將隨機調整）。"}],conflicts:[],tentative:true,phase:"WL-9",note:"量測結果見 docs/balance-wl9-after.txt/.json §12（wl9top）。"},{id:"arena.rankTop",cat:"玩法",item:"拜訪武將名次隊伍隨機刷成頂尖隊伍（WL-9）：五組名次隊伍各獨立 25% 機率刷成頂尖，等級 1–99 隨機、練度拉滿，勝利銀幣＝該名次一般獎勵＋等級×10、不影響排名",spec:"本作設計",current:"WL-9（2026-11-10 Tomas 補充：另外五組名次隊伍也要偶爾出現頂尖隊伍）。D 級原創，非原版。設計：五組名次隊伍（玩家排名往上 5 名）各獨立 25% 機率刷成頂尖隊伍（不用一定有，也可能多組同時是）；刷成頂尖時等級 1–99 隨機（第二抽決定等級）、練度為該等級拉滿的頂尖（與固定第六組同一建造器 G.arenaTopFoe，見 arena.topTeam）。顯示：紫框＋「頂尖」標籤，並顯示實際等級（1–99）；名次位置維持該組原本的位置。抽取用種子（列表種子 ^ 名次常數，獨立亂數流；第一抽決定是否頂尖、第二抽決定等級）：同一列表種子同一名次結果相同，面板與實戰一致、戰報重播可重現（戰報存陣容快照）。列表種子初始值 2809（驗證：以此種子抽，第 1–30 名全部不刷成頂尖，新存檔／舊存檔的第一份挑戰列表與舊版完全一致）；每次勝場後重抽（打贏的頂尖隊伍不會留在列表上被重複刷銀幣）；敗場不重抽（可重試）。獎勵：勝利銀幣＝該名次一般獎勵＋隊伍等級×10（等級越高越難，獎勵越高；Lv99 約 +990）；不影響排名（與第六組一致）；失敗不扣任何東西；戰報可重播。武林大會對陣表沿用舊版 arenaFoe（不刷頂尖），不影響武林大會。量測方法：tools/balance.js §12（2000 顆列表種子 × 5 名次量測機率與等級分布；12 種子量測一般隊／max 隊同級打各等級頂尖隊伍勝率）。量測結果（§12）：2000 顆列表種子 × 30 名次，整體刷出率 24.6%（14,782/60,000），各名次 22.9–26.6%，接近目標 25%；等級分布 14,782 次，最小 1、最大 99，十分位大致均勻（每 10 級約 1,450–1,550 次；91–99 為 9 級，1,319 次）。同級勝率見 arena.topTeam（一般隊與 max 隊皆 0%，Lv99 以 Lv90 玩家打亦 0%）。結論：如實回報——Lv99 頂尖隊伍是驚喜／展示性質，玩家可以不挑戰它。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-10 Tomas 補充：另外五組名次隊伍也要偶爾出現頂尖隊伍，每一組獨立 25% 機率刷成頂尖隊伍，等級不限、1–99 級都有可能，但是練度是該等級拉滿的頂尖；顯示上要能看出它是頂尖隊伍並顯示它實際的等級；抽取必須用種子，列表穩定、戰報重播可重現；每次列表刷新時重抽；勝利銀幣應反映實際難度；不影響玩家排名。"}],conflicts:[],tentative:true,phase:"WL-9",note:"量測結果見 docs/balance-wl9-after.txt/.json §12（wl9top）。"},{id:"mode.equipDropLv1",cat:"玩法",item:"戰鬥獎勵裝備掉落一律 Lv1（WL-10）：掉落品質／顏色／機率不變，等級全部從 Lv1 開始，玩家在神兵坊升級裝備等級",spec:"本作設計",current:"WL-10（2026-11-10 Tomas 決定：戰鬥獎勵可拿到不同顏色的武器，但等級都是從 Lv1 開始，玩家可在神兵坊升級武器等級；現在掉 Lv10 紫色腰帶、強化升滿，到 30 級就不能用，前面強化全浪費）。D 級原創，非原版。設計：stages.json 全部 200 條裝備掉落引用模板等級一律 Lv1——180 條關卡掉落（普通白 q0@25%＋綠 q1@8%、精英綠@50%＋藍 q2@20%、王／隱藏藍@50%＋紫 q3@35%）＋20 條首通獎勵藍裝（q2，Lv6–54→Lv1）；品質／機率／數量不變，掉落判定（G.fight，seed ^ 0x5bd1e995）與發放（G.grant → G.addEquip）不動，種子決定性不變。通天塔首通藍裝一併改 Lv1（sys6.js G.towerFloor）；紫裝碎片合成維持玩家等級（G.fragCombine 不動）。商店／七日禮包／開局禮包不動。量測見 docs/balance-wl10-after.txt/.json §13。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-10 Tomas 決定：戰鬥獎勵可拿到不同顏色的武器，但等級都是從 Lv1 開始，玩家可在神兵坊升級武器等級（不然現在掉 Lv10 紫色腰帶強化升滿，到 30 級就不能用，前面強化浪費了）。"}],conflicts:[],tentative:true,phase:"WL-10",note:"量測結果見 docs/balance-wl10-after.txt/.json §13（wl10）。"},{id:"forge.upgradeLevel",cat:"神兵坊",item:"神兵坊升級裝備等級（WL-10）：第 5 個頁籤「升級」，一次升一檔，費用 60×(目標等級+5) 銀，成功率 100%，上限＝主角等級",spec:"本作設計",current:"WL-10（2026-11-10 Tomas 批准設計，21:14「沒問題」）。D 級原創，非原版。設計：神兵坊第 5 個頁籤「升級」（ui-p2.js，沿用選裝備面板與強化式流程）；引擎 G.upgradeEquip（sys2.js，G.enhance 旁邊）。一次升一檔：e.t 換成同家族下一檔模板（前綴不變，等級數字變大；R.nextEquipTier，檔次表 [1,6,12,18,24,30,36,42,48,54]）；plus／q／gems／aff 全部保留，數值由 R.equipStats 現算（強化為比例制，換模板後按新基礎值重算，投資零浪費）；洗煉屬性保留原值不重洗（玩家可再洗，費用按新等級算）；名稱隨模板變，面板顯示升級後名稱與數值預覽。費用：60×(目標等級+5) 銀／步（config.upgrade.silverK＝60；Lv1→54 全程每件 18,900、全套 151,200）；成功率 100%（與建築升級一致）。上限：目標等級 ≤ 主角等級（且 ≤ Lv54 模板上限）；穿戴中的裝備取穿戴者等級。神兵坊等級當上限已證不可行（Tomas 神兵坊 Lv28、裝備已 Lv54）。洗煉待確認（washPending）時擋下升級。現有裝備全部 grandfathered、不動；存檔 v12 不動、零遷移、零新欄位。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-10 Tomas 批准 WL-10 設計（費用 60×(目標等級+5)、上限＝主角等級、成功率 100%、名稱隨模板變加預覽、洗煉屬性保留原值、通天塔首通藍裝亦改 Lv1、商店／七日禮包不動、一次升一檔）。"}],conflicts:[],tentative:true,phase:"WL-10",note:"量測結果見 docs/balance-wl10-after.txt/.json §13（wl10）。"},{id:"balance.towerScale",cat:"平衡",item:"通天塔成長倍率（WL-11）：F50 起每 10 層敵方攻防血 ×1.15",spec:"本作設計",current:"WL-11（2026-11-10 Tomas 定案，23:35 選擇推薦方案：塔 ×1.15 自 F50 起）。D 級原創，非原版。設計：config.towerScale＝{mult: 1.15, from: 50}；R.enemyUnit 內套用，倍率＝1.15^floor((f−50)/10)（F50 ×1.00、F60 ×1.15、F100 ×2.01、F150 ×4.05）；只乘攻防血＋絕技 flat，不動命中／閃避／爆擊／敏捷／等級／層數；只套 stage.floor != null（塔），與主線 bossScale 互斥。原「舊關卡完全不變」原則取消：F50–100 對一般隊變難（F100 typ@69 100%→0%，約 Lv75 才打得過）；校準目標 vet@69 F150 0%／max@80 F150 100%（單層）。量測見 docs/balance-wl11-after.txt/.json §14。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-10 Tomas 定案：塔 towerScale ×1.15，自 F50 起（附錄 E 推薦方案；原 §4 建議 ×1.12 自 F101 起已取代）。"}],conflicts:[],tentative:true,phase:"WL-11",note:"量測結果見 docs/balance-wl11-after.txt/.json §14（wl11）。"},{id:"balance.wujiScale",cat:"平衡",item:"無極幻境成長倍率（WL-11）：W50 起每 10 波敵方攻防血 ×1.08",spec:"本作設計",current:"WL-11（2026-11-10 Tomas 定案，23:35 選擇推薦方案：幻境 ×1.08 自 W50 起）。D 級原創，非原版。設計：config.wujiScale＝{mult: 1.08, from: 50}；R.enemyUnit 內套用，倍率＝1.08^floor((W−50)/10)（W50 ×1.00、W120 ×1.71、W200 ×3.17）；只乘攻防血＋絕技 flat，不動命中／閃避／爆擊／敏捷／等級／層數；只套 stage.wave != null（幻境），與主線 bossScale 互斥。舊末波 W120 全隊仍 100% 不變；校準目標 w5 全程 max@80 40/40。量測見 docs/balance-wl11-after max80 33%（最佳抽籤 50%）、max82 72%；vet@80／typ@80／max@69 皆 0%。嚴格的「max78=0% 且 max80≥50%」單點門檻量測證明不可達（隊伍抽籤雜訊大於等級效應），故門檻為帶狀 Lv78–82，接受之（不加硬性等級鎖）。一般模式 s13_8 門檻約 max@67（max@65 33%、max@69 100%），與 ×2 門檻相差約 13 級為數學必然，接受之（開放決策 OD-1）。量測見 docs/balance-wl12-after.txt/.json §15。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-10 Tomas 決定：最終王關 ×2 模式門檻剛好在滿裝 80 級（×2 指 ×2 挑戰模式）。"}],conflicts:[],tentative:true,phase:"WL-12",note:"量測結果見 docs/balance-wl12-after.txt/.json §15（wl12）。"},{id:"stages.ch11_13",cat:"關卡",item:"虛空之門 ch11 桃花島／ch12 崑崙之巔／ch13 天外天（WL-12）：27 關，等級、敵池、首領、獎勵皆 D 級原創",spec:"本作設計",current:"WL-12（2026-11-10 Tomas 批准設計，23:49 指示多加一點，採 3 章）。D 級原創，非原版。設計：ch11 桃花島（解鎖 Lv79）Lv79–85、ch12 崑崙之巔（解鎖 Lv80）Lv85–89、ch13 天外天（解鎖 Lv80）Lv89–90；最終王關 s13_8 天外天之巔 Lv90（呂布）、最終隱藏 s13_9 劍魔洞 Lv90（獨孤求敗）。名稱仿原版武俠地名風格；王／隱藏皆復用既有名敵人（WL-2 前例），無新美術。敵池沿用（ch11 mg_*＋xl_qibing、ch12 xl_*＋dz_qinwei／lj_moushi、ch13 cj_*＋dz_qinwei）；掉落按關卡類型、皆 Lv1 模板（WL-10 規則），王／隱藏裝備 q2@50%＋q3@35%；銀幣／經驗按 ch9/ch10 公式延伸。ch13 首通里程碑：首通 s13_9 一次性金 300＋紫裝碎片 ×20。Lv90 敵人上限下 3 章為合理上限（每章 ~4 級跨度；4 章每章只剩 ~3 級，不建議）。另 OD-5：ch9/ch10 王／隱藏裝備掉落同步修正為 q2@50%＋q3@35%（與 ch1–8 一致；WL-2 擴充時的寫法不一致）。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-10 Tomas 批准 WL-12 設計：虛空之門加 ch11–13（多加一點），最終王關 ×2 門檻在滿裝 80 級。"}],conflicts:[],tentative:true,phase:"WL-12",note:"量測結果見 docs/balance-wl12-after.txt/.json §15（wl12）。"},{id:"ui.skillBookUse",cat:"養成",item:"技能書使用：道具欄點「使用」開選將＋選技能視窗",spec:"本作設計",current:"WL-13（2026-11-11 玩家實測 #4）：道具欄技能書的「使用」按鈕原本只顯示說明浮條，沒有選將、選技能入口，技能書無法從道具使用。改為點「使用」開選將 picker（可對主角用），再開選技能 picker（主動／無雙／被動，顯示目前等級與費用：銀幣＋技能書／神技卷），確認後呼叫既有 G.skillUp 扣書扣銀並做全部檢查；升級規則、費用、等級上限皆沿用既有 G.skillUpCost／G.skillUp。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-11 玩家實測 #4：技能書「使用」按鈕是死的；2026-11-11 Tomas 定 A＋B 一起做。"}],conflicts:[],tentative:true,phase:"WL-13",note:"原版技能升級入口未證實；本輪只補道具欄入口，不改升級規則與費用。"},{id:"train.capAbsorbable",cat:"養成",item:"訓練封頂：先算可吸收經驗，滿了灰掉按鈕、引擎擋下不扣銀",spec:"本作設計",current:"WL-13（2026-11-11 玩家實測 #16）：訓練在武將等級等於主角且本級經驗將滿時仍收費，給的經驗幾乎全被上限吃掉。新增 G.trainAbsorbable(h)：按 G.addExp 封頂語意算到主角等級上限為止可吸收的經驗（逐級加總 expNeed，末級只計到 expNeed-1）；可吸收為 0 時訓練按鈕灰掉並提示「武將等級已達主角等級上限」，G.trainNow 同樣擋下不扣銀；否則按鈕旁顯示預計實際可獲得經驗。訓練經驗公式與費用不變。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-11 玩家實測 #16：訓練在等級封頂時仍收費、經驗幾乎全浪費；2026-11-11 Tomas 定 A＋B 一起做。"}],conflicts:[],tentative:true,phase:"WL-13",note:"原版訓練數值未證實；本輪只補封頂檢查，不改經驗公式與費用。"},{id:"wuji.autoDelay10",cat:"玩法",item:"無極幻境自動接續等待 3 秒→10 秒",spec:"本作設計",current:"WL-13（2026-11-11 玩家實測 #17）：波次間 3 秒自動開打，結算板「停止」來不及按，殘血被拖進下一波。UI.AUTO_DELAY 3000→10000，保留自動接續功能，只延長等待；相關文案同步改為約 10 秒。通天塔沿用同一延遲。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-11 玩家實測 #17：無極幻境波次間「停止」按不到；2026-11-11 Tomas 定 A＋B 一起做。"}],conflicts:[],tentative:true,phase:"WL-13",note:"WL-3 由 1.2 秒放寬到 3 秒（WebKit 結算布局較慢）；WL-13 再放寬到 10 秒。"},{id:"autoEquip.dtype",cat:"養成",item:"「最強」武器按武將實際技能傷害類型（dtype）篩選，嚴格版、無 fallback",spec:"本作設計",current:"WL-13（2026-11-11 玩家實測 #18）：「最強」武器篩選按武將 dtype 要求對應攻擊屬性。規則：已穿符合 dtype 的武器時只考慮同類武器；已穿異屬性武器且包裹有符合者時，符合者直接取代（不拿異屬性評分當門檻——R.equipScore 是三攻合計，同檔異屬性武器同分會卡住符合武器）；已穿異屬性武器且無符合者時維持現狀；未穿武器且無符合武器時留空，不以評分制裝異屬性武器。初版曾加 fallback（未穿且無符合者時不篩屬性、按評分挑最高者），同輪 A/B 驗證有代價（標準敗 +501、加速 79/117 vs 嚴格版 86/117），Tomas 2026-11-11 定拿掉 fallback、採嚴格版。其餘 7 部位、等級限制、R.equipScore、裝備數值不變。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-11 玩家實測 #18：「最強」只看物攻，法攻武將拿不到武器；2026-11-11 Tomas 定 A＋B 一起做，2026-11-11 晚間定拿掉 fallback、採嚴格版。"}],conflicts:[],tentative:true,phase:"WL-13",note:"技能定義本身沒有傷害種類欄位，實戰傷害分流按 dtype 取攻；本條只定武器篩選，不改傷害分流。"},{id:"farm.startSeed",cat:"養成",item:"開局送搖錢樹苗 ×1",spec:"本作設計",current:"WL-13（2026-11-11 玩家實測 #20）：農田種子初始全是 ×0，新手無法立刻種一次。新存檔預設 bag.stack.seed_yin = 1（搖錢樹苗：銀幣種 300 銀最便宜，收成銀幣 Lv1 即有用；已有數量不覆蓋；舊存檔載入時同樣補 1 顆，加法性）。農田文案同步統一為立即成熟版（化肥：收成 +50%）。",grade:"D",label:"本作設計（暫定）",sources:[{s:"SPEC",q:"2026-11-11 玩家實測 #20：農田種子初始全是 ×0；2026-11-11 Tomas 定 A＋B 一起做。"}],conflicts:[],tentative:true,phase:"WL-13",note:"原版農田種子取得方式未證實；本輪只補開局 1 顆種子，不改種子價格與收成公式。"},{id:"wash.cancelRefund",cat:"養成",item:"洗煉「放棄」退還洗煉石 ×1",spec:"本作設計",current:"WL-   t('CSS transform', function () { var d = document.createElement('div'); return ('transform' in d.style) || ('webkitTransform' in d.style); });
  t('SVG', function () { return !!document.createElementNS && !!document.createElementNS('http://www.w3.org/2000/svg', 'svg').createSVGRect; });
  var mods = ['U', 'D', 'Art', 'R', 'Battle', 'S', 'G', 'UI'];
  for (var i = 0; i < mods.length; i++) (function (m) { t('模組 MJ.' + m, function () { return !!(window.MJ && MJ[m]); }); })(mods[i]);
  t('MJ.boot 存在', function () { return typeof MJ.boot === 'function'; });
  t('遊戲資料', function () { MJ.G.initData(); return '武將 ' + MJ.D.heroes.list.length + '、關卡 ' + MJ.D.stages.stages.length + '、裝備 ' + MJ.D.equipment.list.length; });
  t('建立測試角色（不寫入存檔）', function () {
    var save = MJ.S.save; MJ.S.save = function () { return true; };
    try { MJ.G.newGame('測試', '力耐', 'm', 1); var l = MJ.G.lead(); return 'Lv' + l.lv + '，生命 ' + MJ.R.derived(l, MJ.S.state).hp; } finally { MJ.S.save = save; }
  });
  t('模擬戰鬥 1-1', function () {
    var save = MJ.S.save; MJ.S.save = function () { return true; };
    try { var r = MJ.G.fight('s1_1'); return r.ok ? (r.win ? '勝利' : '戰敗') + '，' + r.battle.rounds + ' 回合，事件 ' + r.battle.events.length : r.msg; } finally { MJ.S.save = save; MJ.S.state = null; }
  });
  t('畫面繪製（主城 HTML）', function () { MJ.S.state = null; var save = MJ.S.save; MJ.S.save = function () { return true; }; MJ.G.newGame('測試', '力耐', 'm', 1); var h = MJ.UI.screens.city(); MJ.S.save = save; MJ.S.state = null; return h.length > 1000; });
  var bad = 0; for (var j = 0; j < LOG.length; j++) if (LOG[j][0] === false) bad++;
  var p = document.createElement('p'); p.className = bad ? 'bad' : 'ok'; p.innerHTML = bad ? '<b>有 ' + bad + ' 項失敗</b>，請截圖回報。' : '<b>全部通過</b>。可以開啟 <a href="mengjiang.html" style="color:#ffe070">遊戲</a>。';
  document.body.appendChild(p);
  window.BOOT_TEST_DONE = { fail: bad, total: LOG.length };
})();
