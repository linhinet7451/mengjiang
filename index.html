        (r.nextMorale ? '<div class="morale">越戰越勇：下次挑戰本關，我方生命／攻擊 +' + Math.round(r.nextMorale * 100) + '%</div>' : '') +
        '<div class="rw-h">如何提升戰鬥力</div><div class="tips">・到神武殿培養武將：按「最強」換上更好的裝備、安排訓練<br>・重打已通關的關卡累積經驗<br>・在聚賢莊招募更高品質的武將<br>・調整陣法，把耐打的武將放在前排</div></div>';
    }
    var sg = r.stage;
    h += '<div class="btn-row"><a class="btn" data-a="bAgain" data-v="' + sg.id + '">再戰一次</a><a class="btn" data-a="bBack">返回關卡</a><a class="btn" data-a="bCity">回主城</a></div></div>';
    b.innerHTML = h;
  }
  UI.actions.bSpeed = function () { BT.speed = BT.speed === 1 ? 2 : 1; MJ.S.state.settings.speed = BT.speed; MJ.S.save(); var e = el('bspeed'); if (e) e.innerHTML = BT.speed + 'x'; };
  UI.actions.bSkip = function () {
    if (!BT || BT.done) return;
    clearTimeout(BT.timer);
    // 把剩餘事件寫進戰報
    for (; BT.i < BT.ev.length; BT.i++) { var lg = evLog(BT.ev[BT.i]); if (lg) addLog(lg); }
    var fx = el('fx'); if (fx) fx.innerHTML = '';
    finish();
  };
  UI.actions.bLog = function () { BT.showLog = !BT.showLog; var l = el('blog'); if (l) l.className = 'blog' + (BT.showLog ? ' on' : ''); };
  UI.actions.bGrid = function (v, a) { BT.showGrid = !BT.showGrid; var b = el('bt'); if (b) b.className = b.className.replace(/ showgrid/g, '') + (BT.showGrid ? ' showgrid' : ''); a.className = 'zhen' + (BT.showGrid ? ' on' : ''); };
  UI.actions.bFormula = function () { UI.toast(MJ.Battle.FORMULA_NOTE); var t = el('toast'); if (t) { clearTimeout(UI._ft); } };
  UI.actions.bAgain = function (id) { BT.done = true; var r = G.fight(id); if (!r.ok) { UI.toast(r.msg, 'bad'); return; } UI.startBattle(r); };
  UI.actions.bBack = function () { if (BT) { BT.done = true; if (BT.r.stage.ch) UI.sel.gateCh = BT.r.stage.ch; } BT = null; UI.go('gate'); };
  UI.actions.bCity = function () { if (BT) BT.done = true; BT = null; UI.go('city'); };
  UI.battleState = function () { return BT; };
})();

</script>
<script>/* js/ui-misc.js */
/* 其他視窗：道具、陣法、日志、郵件、商城、設置、任務；新遊戲畫面 */
(function () {
  var UI = MJ.UI, U = MJ.U, G = MJ.G, R = MJ.R, S = MJ.S;
  function tabs(key, list, cur) {
    return '<div class="tabs">' + U.map(list, function (t) { return '<a class="tab' + (t[0] === cur ? ' on' : '') + '" data-a="mtab" data-v="' + key + ':' + t[0] + '">' + t[1] + '</a>'; }).join('') + '</div>';
  }
  UI.actions.mtab = function (v) { var a = v.split(':'); UI.sel[a[0]] = a[1]; UI.page[a[0] + 'P'] = 0; UI.renderModal(); };

  // ---------- 道具（包裹） ----------
  UI.modals.bag = function () {
    var s = S.state, tab = UI.sel.bag || 'items', b = tabs('bag', [['items', '道具'], ['equips', '裝備'], ['souls', '魂魄']], tab);
    b += '<div class="bag-cap">包裹 ' + G.bagUsed() + '/' + G.BAG_CAP + '　（包裹滿時新物品會寄到郵件）</div>';
    var list, pg;
    if (tab === 'items') {
      list = U.filter(U.keys(s.bag.stack), function (k) { return k.indexOf('soul:') !== 0 && s.bag.stack[k] > 0; });
      pg = UI.pager('bagP', list, 6, function (k) {
        var it = MJ.D.equipment.items[k];
        return '<div class="row-item">' + UI.icon(it.icon, it.color) + '<div class="ri-t"><b>' + U.esc(it.name) + ' ×' + s.bag.stack[k] + '</b><small>' + U.esc(it.desc) + '</small></div>' +
          '<a class="btn small" data-a="useItem" data-v="' + k + '">使用</a></div>';
      }, '沒有道具');
    } else if (tab === 'equips') {
      pg = UI.pager('bagP', s.bag.equips, 6, function (e) {
        var tpl = R.equipTpl(e.t);
        return '<div class="row-item">' + UI.equipCell(e) + '<div class="ri-t"><b class="eqt' + e.q + '">' + MJ.D.config.equipQualityNames[e.q] + '·' + U.esc(tpl.name) + '</b><small>需要 Lv' + tpl.lv + '　' + U.esc(UI.equipLines(R.equipStats(e)).join('　')) + '</small></div>' +
          '<a class="btn small" data-a="sellEq" data-v="' + e.uid + '">賣出 ' + R.equipSell(e) + '</a></div>';
      }, '沒有閒置裝備（穿裝備請到神武殿）');
    } else {
      list = U.filter(U.keys(s.bag.stack), function (k) { return k.indexOf('soul:') === 0 && s.bag.stack[k] > 0; });
      pg = UI.pager('bagP', list, 6, function (k) {
        var d = R.heroDef(k.slice(5));
        return '<div class="row-item">' + UI.icon('soul', d.quality) + '<div class="ri-t"><b>' + U.esc(d.name) + ' 魂魄 ×' + s.bag.stack[k] + '</b><small>集滿 ' + d.souls + ' 個可在聚賢莊召喚（不佔包裹格）</small></div></div>';
      }, '沒有魂魄');
    }
    b += '<div class="rows">' + pg.html + '</div>' + pg.nav;
    return UI.panel('道具', b, { cls: 'mid' });
  };
  UI.actions.useItem = function (k) {
    var it = MJ.D.equipment.items[k];
    if (!it.use && !it.xinfa) { UI.toast(it.name + '：' + it.desc); return; }
    if (it.xinfa || it.use.heroExp) { UI.open('pickHero', k); return; }
    var r = G.useItem(k); if (UI.res(r, r.msg)) UI.renderModal();
  };
  UI.modals.pickHero = function (k) {
    var s = S.state, xf = MJ.D.equipment.items[k].xinfa, list = U.filter(s.heroes, function (h) { return xf || h.id !== 'lead'; });
    var pg = UI.pager('pickP', list, 8, function (h) { return UI.portrait(h, { act: 'useOn', v: k + ':' + h.uid }); }, '沒有可使用的武將');
    return UI.panel('選擇武將（' + MJ.D.equipment.items[k].name + '）', '<div class="cards">' + pg.html + '</div>' + pg.nav + '<div class="btn-row"><a class="btn" data-a="open" data-v="bag">返回</a></div>', { cls: 'mid' });
  };
  UI.actions.useOn = function (v) { var a = v.split(':'); var r = G.useItem(a[0], +a[1]); if (UI.res(r, r.msg)) UI.renderModal(); };
  UI.actions.sellEq = function (uid) { var r = G.sellEquip(+uid); if (UI.res(r, '賣出，獲得銀幣 ' + r.silver)) UI.renderModal(); };

  // ---------- 陣法 ----------
  UI.modals.formation = function () {
    var s = S.state, f = G.formation(), slots = R.teamSlots(G.lead().lv), selH = UI.sel.fHero;
    var b = '<div class="form-wrap"><div class="form-list">';
    var lv = G.lead().lv, oc = G.openCells();
    U.each(MJ.D.formations, function (x) {
      var bon = U.map(U.keys(x.bonus || {}), function (k) { return UI.STAT_NAMES[k] + '+' + x.bonus[k] + '%'; }).join(' ');
      b += '<a class="fl' + (x.id === f.id ? ' on' : '') + (x.open > lv ? ' dim2' : '') + '" data-a="setForm" data-v="' + x.id + '"><b>' + U.esc(x.name) + (x.open > lv ? '（' + x.open + '級）' : '') + '</b><small>' + U.esc(x.desc) + '<br>全隊 ' + bon + '</small></a>';
    });
    b += '</div><div class="form-mid"><div class="fm-h">出戰 ' + G.teamCount() + '/' + slots + '　<small>（' + U.map(MJ.D.config.teamSlotsByLevel.slice(1), function (x) { return x[0]; }).join('/') + ' 級各 +1 人，最多 9 人）</small></div><div class="fgrid"><span class="fg-dir">敵方 ▶</span>';
    for (var r = 0; r < 3; r++) for (var c = 2; c >= 0; c--) {
      var cell = r * 3 + c, open = oc.indexOf(cell) >= 0, uid = s.team.cells[cell], h = uid && G.hero(uid);
      b += '<div class="fcell' + (open ? '' : ' closed') + (h && h.uid === selH ? ' sel' : '') + '"' + (open ? ' data-a="fCell" data-v="' + cell + '"' : '') + '>' +
        (h ? UI.portrait(h, { cls: 'mini' }) : (open ? '<span class="fc-e">空位</span>' : '<span class="fc-e">未開放</span>')) + '<i class="fc-n">' + ['前', '中', '後'][c] + '</i></div>';
    }
    b += '</div><div class="fm-tip">先點右側武將或陣中武將，再點格子放入／互換。第 1 列（最右）為前排。<br>出手順序：雙方交替，前列先、同列由下往上。</div></div>';
    var list = s.heroes.slice().sort(function (a, b2) { return b2.lv - a.lv; });
    var pg = UI.pager('formP', list, 8, function (h) {
      var inT = G.inTeam(h.uid) != null;
      return '<div class="fh">' + UI.portrait(h, { act: 'fPick', sel: h.uid === selH, badge: inT ? '陣' : '' }) +
        (h.id === 'lead' ? '<span class="fh-b dim2">主角</span>' : (inT ? '<a class="fh-b" data-a="fOut" data-v="' + h.uid + '">下陣</a>' : '<a class="fh-b" data-a="fIn" data-v="' + h.uid + '">上陣</a>')) + '</div>';
    });
    b += '<div class="form-roster"><div class="cards">' + pg.html + '</div>' + pg.nav + '</div></div>';
    return UI.panel('陣法', b, { cls: 'wide' });
  };
  UI.actions.setForm = function (id) { if (UI.res(G.setFormation(id))) UI.renderModal(); };
  UI.actions.fPick = function (uid) { uid = +uid; UI.sel.fHero = UI.sel.fHero === uid ? null : uid; UI.renderModal(); };
  UI.actions.fCell = function (cell) {
    cell = +cell; var s = S.state, occ = s.team.cells[cell];
    if (!UI.sel.fHero) { if (occ) { UI.sel.fHero = occ; UI.renderModal(); } else UI.toast('請先選擇武將'); return; }
    var r = G.setCell(cell, UI.sel.fHero); if (UI.res(r)) { UI.sel.fHero = null; UI.renderModal(); }
  };
  UI.actions.fIn = function (uid) { if (UI.res(G.addToTeam(+uid))) UI.renderModal(); };
  UI.actions.fOut = function (uid) { if (UI.res(G.removeFromTeam(+uid))) UI.renderModal(); };

  // ---------- 日志 ----------
  UI.modals.log = function () {
    var s = S.state;
    var pg = UI.pager('logP', s.log, 9, function (l) { var d = new Date(l.t); return '<div class="logl"><small>' + U.pad2(d.getMonth() + 1) + '/' + U.pad2(d.getDate()) + ' ' + U.pad2(d.getHours()) + ':' + U.pad2(d.getMinutes()) + '</small> ' + U.esc(l.text) + '</div>'; }, '還沒有紀錄');
    return UI.panel('日志', '<div class="rows">' + pg.html + '</div>' + pg.nav, { cls: 'mid' });
  };

  // ---------- 郵件 ----------
  UI.modals.mail = function () {
    var s = S.state, list = s.mail.slice().reverse();
    var pg = UI.pager('mailP', list, 5, function (m) {
      var parts = [];
      if (m.att) { if (m.att.gold) parts.push('金幣 ×' + m.att.gold); if (m.att.silver) parts.push('銀幣 ×' + m.att.silver); U.each(m.att.items || [], function (it) { parts.push(G.itemName(it.item) + ' ×' + (it.n || 1)); }); U.each(m.att.equips || [], function (e) { parts.push(R.equipTpl(e.t).name); }); }
      return '<div class="row-item">' + UI.icon('mail') + '<div class="ri-t"><b>' + U.esc(m.title) + '</b><small>' + U.esc(m.text) + (parts.length ? '<br>附件：' + U.esc(parts.join('、')) : '') + '</small></div>' +
        (parts.length ? (m.claimed ? '<span class="dim2">已領取</span>' : '<a class="btn small" data-a="claimMail" data-v="' + m.id + '">領取</a>') : '') + '</div>';
    }, '沒有郵件');
    return UI.panel('郵件', '<div class="rows">' + pg.html + '</div>' + pg.nav, { cls: 'mid' });
  };
  UI.actions.claimMail = function (id) { var r = G.claimMail(+id); if (UI.res(r)) { UI.renderModal(); UI.rewardBox('領取成功', r.got); } };

  // ---------- 任務 ----------
  UI.modals.tasks = function () {
    var s = S.state;
    var pg = UI.pager('taskP', MJ.D.tasks, 5, function (t) {
      var done = G.taskDone(t), cl = s.tasksClaimed[t.id], rw = [];
      if (t.reward.gold) rw.push('金幣 ×' + t.reward.gold); if (t.reward.silver) rw.push('銀幣 ×' + t.reward.silver);
      U.each(t.reward.items || [], function (it) { rw.push(G.itemName(it.item) + ' ×' + (it.n || 1)); });
      return '<div class="row-item">' + UI.icon('quest') + '<div class="ri-t"><b>' + U.esc(t.name) + '</b><small>' + U.esc(t.desc) + '<br>獎勵：' + U.esc(rw.join('、')) + '</small></div>' +
        (cl ? '<span class="dim2">已完成</span>' : (done ? '<a class="btn small" data-a="claimTask" data-v="' + t.id + '">領取</a>' : '<span class="dim2">未完成</span>')) + '</div>';
    });
    return UI.panel('任務', '<div class="rows">' + pg.html + '</div>' + pg.nav, { cls: 'mid' });
  };
  UI.actions.claimTask = function (id) { var r = G.claimTask(id); if (UI.res(r)) { UI.renderModal(); UI.rewardBox('任務完成', r.got); } };

  // ---------- 商城 ----------
  UI.modals.shop = function () {
    var s = S.state;
    var pg = UI.pager('shopP', MJ.D.shop, 6, function (e) {
      var nm, ic, sub = '';
      if (e.item.indexOf('eq:') === 0) { var tpl = R.equipTpl(e.item.slice(3)); nm = MJ.D.config.equipQualityNames[e.q || 0] + '·' + tpl.name; ic = UI.equipCell({ t: tpl.id, q: e.q || 0, uid: 0 }); sub = '需要 Lv' + tpl.lv + '　' + UI.equipLines(R.equipStats({ t: tpl.id, q: e.q || 0 })).join('　'); }
      else { var it = MJ.D.equipment.items[e.item]; nm = it.name + (e.n > 1 ? ' ×' + e.n : ''); ic = UI.icon(it.icon, it.color); sub = it.desc; }
      var cur = e.price.silver ? 'silver' : 'gold';
      return '<div class="row-item">' + ic + '<div class="ri-t"><b>' + U.esc(nm) + '</b><small>' + U.esc(sub) + '</small></div><a class="btn small" data-a="buy" data-v="' + e.id + '">' + UI.icon(cur) + U.fmt(e.price[cur]) + '</a></div>';
    });
    return UI.panel('商城', '<div class="shop-note">單機重製版：只用遊戲內貨幣，沒有任何真實付費。</div><div class="rows">' + pg.html + '</div>' + pg.nav, { cls: 'mid' });
  };
  UI.actions.buy = function (id) { var r = G.buy(id); if (UI.res(r, '購得 ' + r.got.join('、'))) UI.renderModal(); };

  // ---------- 設置（存檔管理） ----------
  UI.modals.settings = function () {
    var s = S.state, st = s.settings;
    var b = '<div class="set-grid"><div class="set-col"><div class="set-h">存檔</div>' +
      '<div class="set-row">狀態：' + (S.storageAvailable() ? '本機儲存可用' + (S.lastSave ? '，上次存檔 ' + new Date(S.lastSave).toLocaleTimeString() : '') : '<b class="bad">瀏覽器不允許本機儲存（例如私密瀏覽），請記得匯出存檔</b>') + '</div>' +
      '<div class="btn-row left"><a class="btn" data-a="saveNow">手動存檔</a><a class="btn" data-a="exportSave">匯出存檔</a><a class="btn" data-a="importOpen">匯入存檔</a></div>' +
      '<div class="set-row small">每 30 秒及每次操作後自動存檔。手動存檔會先備份上一份存檔。</div>' +
      '<div class="btn-row left"><a class="btn red" data-a="resetSave">重置遊戲</a></div></div>' +
      '<div class="set-col"><div class="set-h">遊戲</div>' +
      '<div class="set-row">戰鬥速度：<a class="tog' + (st.speed === 1 ? ' on' : '') + '" data-a="setOpt" data-v="speed:1">1x</a><a class="tog' + (st.speed === 2 ? ' on' : '') + '" data-a="setOpt" data-v="speed:2">2x</a></div>' +
      '<div class="set-row">經濟模式：<a class="tog' + (st.econ !== 'fast' ? ' on' : '') + '" data-a="setEcon" data-v="std">標準</a><a class="tog' + (st.econ === 'fast' ? ' on' : '') + '" data-a="setEcon" data-v="fast">單機加速</a><br><small>標準：精力每 6 分鐘 1 點，農田／訓練原速。單機加速：精力每 1 分鐘、農田 4 倍速、訓練 2 倍、戰鬥銀幣與塔俸 ×1.5（D）。</small></div>' +
      (UI.soundRows ? UI.soundRows() : '') +
      '<div class="set-row">手機直向時自動旋轉橫向：<a class="tog' + (st.rotate !== false ? ' on' : '') + '" data-a="setOpt" data-v="rotate:1">開</a><a class="tog' + (st.rotate === false ? ' on' : '') + '" data-a="setOpt" data-v="rotate:0">關</a></div>' +
      '<div class="set-row small">版本：' + S.RELEASE + '　存檔格式 v' + S.VERSION + '<br>本作為粉絲重製的單機版，所有美術均以程式繪製，與原版營運商無關。</div></div></div>';
    return UI.panel('設置', b, { cls: 'mid' });
  };
  UI.actions.setOpt = function (v) {
    var a = v.split(':'), st = S.state.settings;
    if (a[0] === 'speed') st.speed = +a[1];
    else if (a[0] === 'rotate') st.rotate = a[1] === '1';
    else if (a[0] === 'energyMode') { G.tick(); st.energyMode = a[1]; S.state.player.energyTs = U.now(); }
    G.commit(); UI.layout(); UI.renderModal();
  };
  UI.actions.saveNow = function () { UI.toast(S.save(true) ? '已存檔' : '存檔失敗：瀏覽器不允許本機儲存，請改用匯出', S.storageOk ? 'good' : 'bad'); UI.renderModal(); };
  UI.actions.exportSave = function () {
    var text = S.exportText(), name = 'mengjiang-save-' + U.dayKey() + '.json', okDl = false;
    try {
      if (window.Blob && window.URL && URL.createObjectURL) {
        var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name;
        document.body.appendChild(a); a.click(); setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 500); okDl = true;
      }
    } catch (e) { okDl = false; }
    UI.open('exportBox', { text: text, dl: okDl });
  };
  UI.modals.exportBox = function (o) {
    return UI.panel('匯出存檔', '<div class="set-row">' + (o.dl ? '已嘗試下載檔案。' : '') + '若下載無效（例如部分 iPhone），請長按下方文字全選並複製，貼到備忘錄保存。</div><textarea class="savebox" id="exportText" readonly>' + U.esc(o.text) + '</textarea>' +
      '<div class="btn-row"><a class="btn" data-a="copyExport">複製</a><a class="btn" data-a="open" data-v="settings">返回</a></div>', { cls: 'mid' });
  };
  UI.actions.copyExport = function () {
    var t = document.getElementById('exportText'); t.removeAttribute('readonly'); t.select(); try { t.setSelectionRange(0, 999999); } catch (e) { }
    var ok = false; try { ok = document.execCommand('copy'); } catch (e2) { } t.setAttribute('readonly', 'readonly');
    UI.toast(ok ? '已複製到剪貼簿' : '無法自動複製，請手動長按全選複製');
  };
  UI.actions.importOpen = function () { UI.open('importBox'); };
  UI.modals.importBox = function () {
    return UI.panel('匯入存檔', '<div class="set-row">選擇先前匯出的 .json 檔，或把存檔文字貼到下方。匯入前會檢查格式，並覆蓋目前進度。</div>' +
      '<input type="file" accept=".json,application/json,text/plain" id="importFile" onchange="MJ.UI.importFile(this)">' +
      '<textarea class="savebox" id="importText" placeholder="在此貼上存檔文字"></textarea>' +
      '<div class="btn-row"><a class="btn" data-a="importPaste">匯入貼上的文字</a><a class="btn" data-a="' + (S.state ? 'open" data-v="settings' : 'close') + '">返回</a></div>', { cls: 'mid' });
  };
  UI.importFile = function (inp) {
    var f = inp.files && inp.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { UI.doImport(String(rd.result)); };
    rd.onerror = function () { UI.toast('讀取檔案失敗', 'bad'); };
    rd.readAsText(f);
  };
  UI.actions.importPaste = function () { UI.doImport(document.getElementById('importText').value); };
  UI.doImport = function (text) {
    var r = S.parse(String(text || '').replace(/^\s+|\s+$/g, ''));
    if (!r.ok) { UI.toast('匯入失敗：' + r.errors.slice(0, 3).join('；'), 'bad'); return; }
    var lead = U.find(r.state.heroes, function (h) { return h.id === 'lead'; });
    UI.confirm('確認匯入', '存檔角色：' + U.esc(r.state.player.name) + '（Lv' + lead.lv + '）<br>匯入後會覆蓋目前進度（目前進度會先備份一份）。', function () {
      if (S.state) S.save(true);
      S.state = r.state; G.tick(); G.commit(); S.save(true);
      UI.modal = null; UI.go('city'); UI.toast('匯入成功', 'good');
    }, '匯入');
  };
  UI.actions.resetSave = function () {
    UI.confirm('重置遊戲', '這會<b>刪除本機所有進度</b>（含備份），無法復原。建議先匯出存檔。', function () {
      UI.confirm('再次確認', '真的要從頭開始嗎？', function () { S.reset(); UI.modal = null; UI.go('newgame'); }, '刪除並重來');
    }, '我要重置');
  };

  // ---------- 新遊戲 ----------
  UI.screens.newgame = function () {
    var g = UI.sel.ngG || 'm', t = UI.sel.ngT || '力耐';
    var look = U.clone(MJ.D.heroes.lead.look); if (g === 'f') { look.g = 'f'; look.hs = 'long'; look.cloth = '#ad1457'; }
    var h = '<div class="scr newgame">' + MJ.Art.sky() + '<div class="ng-logo">猛將無雙<small>單機重製版・' + S.RELEASE + '</small></div>' +
      '<div class="frame ng-box"><div class="plaque">創建角色</div><div class="ng-in"><div class="ng-fig"><div class="mc-wrap">' + MJ.Art.magicCircle() + '</div><div class="hero-fig">' + MJ.Art.figure(look, { cape: true }) + '</div></div><div class="ng-form">' +
      '<label>俠名 <input id="ngName" maxlength="8" value="' + U.esc(UI.sel.ngName || '') + '" placeholder="最多 8 字"></label>' +
      '<div class="ng-row">性別：<a class="tog' + (g === 'm' ? ' on' : '') + '" data-a="ngSet" data-v="G:m">男</a><a class="tog' + (g === 'f' ? ' on' : '') + '" data-a="ngSet" data-v="G:f">女</a></div>' +
      '<div class="ng-row">主屬性：';
    U.each(U.keys(MJ.D.config.leadTypes), function (k) { h += '<a class="tog' + (t === k ? ' on' : '') + '" data-a="ngSet" data-v="T:' + k + '">' + k + '</a>'; });
    h += '</div><div class="ng-desc">' + ({ '力耐': '力量與耐力並重，前排肉盾兼輸出（原版截圖主角即為此型）', '力敏': '力量與敏捷，攻擊較高、生命較低', '敏耐': '敏捷與耐力，攻守平均' })[t] + '</div>' +
      '<div class="btn-row"><a class="btn big" data-a="ngStart">踏入江湖</a><a class="btn" data-a="importOpen">匯入存檔</a></div>' +
      (S.storageAvailable() ? '' : '<div class="bad">注意：瀏覽器不允許本機儲存，進度只能靠「匯出存檔」保存。</div>') + '</div></div></div></div>';
    return h;
  };
  UI.actions.ngSet = function (v) { var n = document.getElementById('ngName'); if (n) UI.sel.ngName = n.value; if (v.charAt(0) === 'G') UI.sel.ngG = v.slice(2); else UI.sel.ngT = v.slice(2); UI.render(); };
  UI.actions.ngStart = function () {
    var n = document.getElementById('ngName');
    G.newGame(n ? n.value : '', UI.sel.ngT || '力耐', UI.sel.ngG || 'm');
    UI.go('city'); UI.toast('歡迎來到猛將無雙！', 'good');
  };
})();

</script>
<script>/* js/ui-p2.js */
/* 第二階段介面：神武殿 技能／培養／心法／升階 分頁、神兵坊、將星錄、圖鑑 */
(function () {
  var UI = MJ.UI, U = MJ.U, G = MJ.G, R = MJ.R;
  function C() { return MJ.D.config; }
  function have(k) { return MJ.S.state.bag.stack[k] || 0; }
  function itemsLine(o) { return U.map(U.keys(o), function (k) { return G.itemName(k) + ' ' + have(k) + '/' + o[k]; }).join('　'); }
  UI.hallTabs = {};

  // ---------- 技能 ----------
  function skillRow(h0, w, base, sub) {
    var lv = R.skillLv(h0, w), x = w === 'p' ? null : R.skillOf(h0, w), cost = G.skillUpCost(h0, w), shen = lv > C().skill.maxLv;
    var lab = G.SKILL_NAMES[w], out = '<div class="skill3' + (shen ? ' shen' : '') + '"><div class="sk-lab">' + lab.charAt(0) + '<br>' + lab.charAt(1) + '</div>';
    if (w === 'p') {
      var ps = base ? MJ.D.heroes.passives[base] : null;
      out += '<div class="pgrid none"></div><div class="sk-d">' + (ps ? '<b>' + ps.name + (shen ? '·神' : '') + '</b> <span class="sklv">' + (shen ? '神' : 'Lv' + lv) + '</span><br>' + U.esc(ps.desc) + '<br><small>效果 ×' + R.passiveMul(h0).toFixed(2) + '</small>' : '<b>無</b><br><small>此武將沒有被動技能</small>');
    } else {
      out += UI.patternGrid(x.pattern) + '<div class="sk-d"><b>' + U.esc(x.name) + '</b> <span class="sklv">' + (shen ? '神' : 'Lv' + lv) + '</span><br>範圍：' + MJ.D.heroes.patterns[x.pattern] + '　倍率：' + (x.pattern === 'healAll' ? '治療 ' : '') + Math.round(x.mult * 100) + '%' + (x.flat ? ' + ' + x.flat : '') +
        (x.fx && x.fx.stun ? '　' + Math.round(x.fx.stun * 100) + '% 眩暈' : '') + (x.fx && x.fx.armorBreak ? '　' + Math.round(x.fx.armorBreak * 100) + '% 破甲' : '') + (x.fx && x.fx.buffDef ? '　全隊物防 +' + Math.round(x.fx.buffDef * 100) + '%' : '') + '<br><small>' + sub + '</small>';
    }
    if ((w !== 'p' || base) && cost) out += '<div class="sk-up"><small>' + U.fmt(cost.silver) + ' 銀　' + itemsLine(cost.items) + '</small><a class="btn small" data-a="skUp" data-v="' + w + '">' + (lv === C().skill.maxLv ? '突破·神' : '升級') + '</a></div>';
    return out + '</div></div>';
  }
  UI.hallTabs.skill = function (h0, s, def) {
    var h = skillRow(h0, 'a', def.active, '每次行動施放') + skillRow(h0, 'u', def.ult, '無雙值滿 100 時施放') + skillRow(h0, 'p', def.passive, '');
    return h + '<p class="note">三技能欄（A：官方圖）。「·神」階（A：影片 3）。升級倍率 +6%/級、·神 +20%、被動效果 +8%/級（D）。技能等級不可超過武將等級。</p>';
  };
  UI.actions.skUp = function (w) { var r = G.skillUp(UI.sel.hallUid, w); if (UI.res(r, r.shen ? '技能突破為「·神」！' : '技能升到 ' + r.lv + ' 級')) UI.render(); };

  // ---------- 培養 ----------
  UI.hallTabs.peiyang = function (h0, s) {
    var cap = R.peiyangCap(h0), p = h0.py, pend = h0.pyPending, N = { str: '力量', int: '智力', agi: '敏捷', con: '耐力' };
    var h = '<div class="py"><b>培養</b>：消耗培養丹，隨機改變四維加成（每項上限 ' + cap + '，隨等級提高）<table class="stats py-t"><tr><th></th><th>目前</th>' + (pend ? '<th>新結果</th>' : '') + '</tr>';
    U.each(['str', 'int', 'agi', 'con'], function (a) {
      var dlt = pend ? pend[a] - p[a] : 0;
      h += '<tr><td>' + N[a] + '</td><td>+' + p[a] + '</td>' + (pend ? '<td class="' + (dlt > 0 ? 'up' : dlt < 0 ? 'down' : '') + '">+' + pend[a] + (dlt ? '（' + (dlt > 0 ? '+' : '') + dlt + '）' : '') + '</td>' : '') + '</tr>';
    });
    h += '</table>';
    if (pend) h += '<div class="btn-row"><a class="btn small" data-a="pyOk">保留</a><a class="btn small red" data-a="pyNo">放棄</a></div>';
    else {
      var c = C().peiyang;
      h += '<div class="btn-row"><a class="btn small" data-a="pyDo" data-v="normal">普通培養</a><a class="btn small" data-a="pyDo" data-v="strong">加強培養</a></div>' +
        '<small>普通：培養丹×' + c.normal.dan + '＋' + U.fmt(c.normal.silver) + ' 銀（' + c.normal.lo + '～+' + c.normal.hi + '）<br>加強：培養丹×' + c.strong.dan + '＋' + U.fmt(c.strong.silver) + ' 銀（' + c.strong.lo + '～+' + c.strong.hi + '）<br>持有培養丹：' + have('peiyangdan') + '</small>';
    }
    return h + '<p class="note">培養功能：B（攻略提及神武殿培養）；數值、上限：D。</p></div>';
  };
  UI.actions.pyDo = function (m) { var r = G.peiyang(UI.sel.hallUid, m); if (UI.res(r)) UI.render(); };
  UI.actions.pyOk = function () { if (UI.res(G.peiyangAccept(UI.sel.hallUid), '已保留培養結果')) UI.render(); };
  UI.actions.pyNo = function () { if (UI.res(G.peiyangCancel(UI.sel.hallUid), '已放棄')) UI.render(); };

  // ---------- 心法 ----------
  UI.hallTabs.xinfa = function (h0, s) {
    var n = R.xinfaSlots(h0), h = '<div class="xf"><b>心法</b>（欄位 ' + n + '/3，於 ' + C().xinfaSlots.join('/') + ' 級開放）';
    for (var i = 0; i < 3; i++) {
      var x = h0.xf[i], c = x && C().xinfa[x.id];
      if (x) {
        var cost = G.xinfaUpCost(x);
        h += '<div class="row-item xf-row">' + UI.icon('scroll2') + '<div class="ri-t"><b>' + c.name + ' Lv' + x.lv + '</b><small>' + c.desc + '（目前 +' + (c.flat ? (c.flat * x.lv).toFixed(1) : c.pct * x.lv + '%') + '）' + (x.lv < C().xinfaMax ? '<br>升級：殘頁 ' + have('xinfacanye') + '/' + cost.pages + '　' + U.fmt(cost.silver) + ' 銀' : '<br>已滿級') + '</small></div>' +
          (x.lv < C().xinfaMax ? '<a class="btn small" data-a="xfUp" data-v="' + i + '">升級</a>' : '') + '<a class="btn small red" data-a="xfForget" data-v="' + i + '">遺忘</a></div>';
      } else if (i < n) h += '<div class="row-item xf-row empty">空欄位</div>';
      else h += '<div class="row-item xf-row empty dim2">' + C().xinfaSlots[i] + ' 級開放</div>';
    }
    var books = U.filter(U.keys(s.bag.stack), function (k) { return k.indexOf('xf_') === 0 && s.bag.stack[k] > 0; });
    h += '<b>可修練秘笈</b><div class="xf-books">' + (books.length ? U.map(books, function (k) { var it = MJ.D.equipment.items[k]; return '<a class="btn small" data-a="xfLearn" data-v="' + it.xinfa + '">' + C().xinfa[it.xinfa].name + ' ×' + s.bag.stack[k] + '</a>'; }).join('') : '<small>沒有秘笈（王關、隱藏關、商城可取得）</small>') + '</div>';
    return h + '<p class="note">心法：B（攻略提及）；種類與效果：D。遺忘會退回秘笈，但等級歸零。</p></div>';
  };
  UI.actions.xfLearn = function (id) { var r = G.xinfaLearn(UI.sel.hallUid, id); if (UI.res(r, r.msg)) UI.render(); };
  UI.actions.xfUp = function (i) { var r = G.xinfaUp(UI.sel.hallUid, +i); if (UI.res(r, '心法升到 ' + r.lv + ' 級')) UI.render(); };
  UI.actions.xfForget = function (i) { UI.confirm('遺忘心法', '確定遺忘？秘笈會退回包裹，但已升的等級會消失。', function () { if (UI.res(G.xinfaForget(UI.sel.hallUid, +i), '已遺忘，秘笈已退回')) UI.render(); }, '遺忘'); };

  // ---------- 升階（將魂） ----------
  UI.hallTabs.star = function (h0, s) {
    var h = '<div class="xf"><b>將魂升階</b>　' + UI.stars(h0.star || 0) + '<br>';
    if (h0.id === 'lead') return h + '<small>主角沒有將魂，請以裝備、培養、心法提升。</small></div>';
    var k = 'soul:' + h0.id, cost = R.starCost(h0), max = C().star.max;
    h += '每階四維 +' + Math.round(C().star.perStar * 100) + '%（目前 +' + Math.round((h0.star || 0) * C().star.perStar * 100) + '%）<br>';
    if ((h0.star || 0) < max) h += '下一階需要 ' + R.heroDef(h0.id).name + ' 將魂：<b>' + have(k) + '/' + cost + '</b><div class="btn-row"><a class="btn small" data-a="starUp">升階</a></div>';
    else h += '<b>已達最高階</b>';
    h += '<small>將魂來源：重複招募的武將解僱、王關／隱藏關掉落、農田英魂草。多餘將魂可在將星錄換成星魂。</small>';
    return h + '<p class="note">將魂：A（截圖有「將魂」道具）；升階規則與數值：D。</p></div>';
  };
  UI.actions.starUp = function () { var r = G.starUp(UI.sel.hallUid); if (UI.res(r, '升到 ' + r.star + ' 階！')) UI.render(); };

  // ---------- 神兵坊 ----------
  function allEquips() {
    var s = MJ.S.state, out = [];
    U.each(s.heroes, function (h) { U.each(R.SLOTS, function (sl) { if (h.eq[sl]) out.push({ e: h.eq[sl], h: h }); }); });
    U.each(s.bag.equips, function (e) { out.push({ e: e }); });
    return out;
  }
  UI.actions.forge = function () { UI.go('forge'); };
  UI.screens.forge = function () {
    var s = MJ.S.state, tab = UI.sel.forgeTab || 'enhance', lv = s.buildings.shenbing || 1;
    var list = allEquips();
    if (UI.sel.forgeWorn) list = U.filter(list, function (x) { return x.h; });
    list.sort(function (a, b) { return R.equipScore(b.e) - R.equipScore(a.e); });
    var pick = U.find(list, function (x) { return x.e.uid === UI.sel.forgeUid; }) || list[0];
    if (pick) UI.sel.forgeUid = pick.e.uid;
    var h = '<div class="scr hall-scr"><div class="frame bigframe hall forge"><div class="plaque">神兵坊</div><a class="xbtn" data-a="city">×</a>';
    h += '<div class="tabs">' + U.map([['enhance', '強化'], ['wash', '洗煉'], ['gem', '鑲嵌'], ['combine', '寶石合成']], function (t) { return '<a class="tab' + (tab === t[0] ? ' on' : '') + '" data-a="forgeTab" data-v="' + t[0] + '">' + t[1] + '</a>'; }).join('') + '</div>';
    // 左：裝備列表
    h += '<div class="parch fg-list"><div class="tabs small"><a class="tab' + (UI.sel.forgeWorn ? ' on' : '') + '" data-a="forgeWorn" data-v="1">已穿戴</a><a class="tab' + (!UI.sel.forgeWorn ? ' on' : '') + '" data-a="forgeWorn" data-v="0">全部</a></div>';
    var pg = UI.pager('forgeP', list, 15, function (x) { return '<div class="fg-it">' + UI.equipCell(x.e, { act: 'forgePick', sel: pick && x.e.uid === pick.e.uid }) + (x.h ? '<span class="fg-who">' + U.esc(G.nameOf(x.h)) + '</span>' : '') + '</div>'; }, '沒有裝備');
    h += '<div class="egrid">' + pg.html + '</div>' + pg.nav + '</div>';
    // 右：操作
    h += '<div class="parch fg-main">';
    if (tab === 'combine') h += combinePanel(s);
    else if (!pick) h += '沒有裝備。';
    else {
      var e = pick.e, tpl = R.equipTpl(e.t);
      h += '<div class="fg-head">' + UI.equipCell(e) + '<div><b class="eqt' + e.q + '">' + C().equipQualityNames[e.q] + '．' + U.esc(tpl.name) + (e.plus ? ' +' + e.plus : '') + '</b>' + (pick.h ? '（' + U.esc(G.nameOf(pick.h)) + ' 穿戴中）' : '') +
        '<br>' + UI.equipLines(R.equipStats(e)).join('　') + '</div></div>';
      if (tab === 'enhance') {
        var cap = R.enhanceCap(s), next = U.extend({}, e); next.plus = (e.plus || 0) + 1;
        h += '<div class="fg-box">強化等級 <b>+' + (e.plus || 0) + '</b> / 上限 +' + cap + '（＝神兵坊等級）<br>';
        if ((e.plus || 0) < cap) h += '強化後：' + UI.equipLines(R.equipStats(next)).join('　') + '<br>成功率 <b>' + Math.round(R.enhanceChance(e) * 100) + '%</b>　費用 ' + U.fmt(R.enhanceCost(e)) + ' 銀（失敗只扣銀幣，不會掉級）<div class="btn-row"><a class="btn" data-a="doEnhance">強化</a></div>';
        else h += '<b>已達上限，請升級神兵坊</b>';
        h += '</div>';
      } else if (tab === 'wash') {
        var n = C().wash.counts[e.q];
        h += '<div class="fg-box">附加屬性（' + n + ' 條，依品質）：<br>' + (e.aff && e.aff.length ? UI.equipLines(affObj(e.aff)).join('　') : '<small>尚未洗煉</small>');
        if (e.washPending) h += '<br><b>新結果：</b>' + UI.equipLines(affObj(e.washPending)).join('　') + '<div class="btn-row"><a class="btn small" data-a="washOk">保留</a><a class="btn small red" data-a="washNo">放棄</a></div>';
        else if (n) h += '<br>費用：洗煉石 ' + have('xilianshi') + '/1　' + U.fmt(G.washCost(e)) + ' 銀<div class="btn-row"><a class="btn" data-a="doWash">洗煉</a></div>';
        else h += '<br><small>白色裝備沒有附加屬性。</small>';
        h += '</div>';
      } else {
        var sk = R.sockets(e), gems = e.gems || [];
        h += '<div class="fg-box">孔位 ' + gems.length + '/' + sk + '（依品質 1/1/2/3）<div class="gem-slots">';
        for (var i = 0; i < sk; i++) h += gems[i] ? '<a class="gem-s on" data-a="gemOut" data-v="' + i + '">' + UI.icon('gem', MJ.D.equipment.items[gems[i]].color) + '<small>' + G.itemName(gems[i]) + '</small></a>' : '<span class="gem-s">空孔</span>';
        h += '</div>';
        var mine = U.filter(U.keys(s.bag.stack), function (k) { return k.indexOf('gem_') === 0 && s.bag.stack[k] > 0; });
        h += '<b>包裹寶石</b>（點選鑲嵌）<div class="gem-bag">' + (mine.length ? U.map(mine, function (k) { var it = MJ.D.equipment.items[k]; return '<a class="gem-b" data-a="gemIn" data-v="' + k + '">' + UI.icon('gem', it.color) + '<small>' + it.name + '×' + s.bag.stack[k] + '<br>' + UI.equipLines(it.gem.stats)[0] + '</small></a>'; }).join('') : '<small>沒有寶石</small>') + '</div>';
        h += '<small>摘除寶石：有摘除符（' + have('zhaochufu') + '）可保留寶石，否則寶石碎裂。同類寶石每件限 1 顆。</small></div>';
      }
    }
    h += '<div class="fg-bld">神兵坊 Lv' + lv + '　升級費用 ' + U.fmt(G.buildingCost('shenbing', lv)) + ' 銀 <a class="btn small" data-a="upBld" data-v="shenbing">升級</a></div>';
    h += '<p class="note">強化／洗煉／鑲嵌／寶石合成：B（攻略提及神兵坊功能）；成功率、數值：D。</p></div>';
    h += '<div class="fg-foot"><a class="btn" data-a="city">返回</a></div></div></div>';
    return h;
  };
  function affObj(list) { var o = {}; U.each(list, function (a) { o[a.k] = Math.round(((o[a.k] || 0) + a.v) * 100) / 100; }); return o; }
  function combinePanel(s) {
    var mine = U.filter(U.keys(s.bag.stack), function (k) { return k.indexOf('gem_') === 0 && s.bag.stack[k] > 0; }), c = C().gemCombine;
    var h = '<div class="fg-box"><b>寶石合成</b>：' + c.n + ' 顆同級寶石 → 1 顆下一級<div class="rows">';
    h += mine.length ? U.map(mine, function (k) {
      var it = MJ.D.equipment.items[k], can = it.gem.lv < C().gemMaxLv;
      return '<div class="row-item">' + UI.icon('gem', it.color) + '<div class="ri-t"><b>' + it.name + ' ×' + s.bag.stack[k] + '</b><small>' + UI.equipLines(it.gem.stats).join(' ') + (can ? '　合成費 ' + U.fmt(c.silver[it.gem.lv - 1]) + ' 銀' : '　最高級') + '</small></div>' + (can ? '<a class="btn small' + (s.bag.stack[k] < c.n ? ' disabled' : '') + '" data-why="需要 ' + c.n + ' 顆" data-a="gemComb" data-v="' + k + '">合成</a>' : '') + '</div>';
    }).join('') : '<small>沒有寶石</small>';
    return h + '</div></div>';
  }
  UI.actions.forgeTab = function (v) { UI.sel.forgeTab = v; UI.render(); };
  UI.actions.forgeWorn = function (v) { UI.sel.forgeWorn = v === '1'; UI.page.forgeP = 0; UI.render(); };
  UI.actions.forgePick = function (v) { UI.sel.forgeUid = +v; UI.render(); };
  UI.actions.doEnhance = function () { var r = G.enhance(UI.sel.forgeUid); if (r.ok) UI.toast(r.success ? '強化成功！+' + r.plus : '強化失敗（裝備不掉級）', r.success ? 'good' : 'bad'); else UI.res(r); UI.render(); };
  UI.actions.doWash = function () { if (UI.res(G.wash(UI.sel.forgeUid))) UI.render(); };
  UI.actions.washOk = function () { if (UI.res(G.washAccept(UI.sel.forgeUid), '已保留')) UI.render(); };
  UI.actions.washNo = function () { if (UI.res(G.washCancel(UI.sel.forgeUid), '已放棄')) UI.render(); };
  UI.actions.gemIn = function (k) { if (UI.res(G.socket(UI.sel.forgeUid, k), '鑲嵌成功')) UI.render(); };
  UI.actions.gemOut = function (i) {
    var fu = have('zhaochufu') > 0;
    UI.confirm('摘除寶石', fu ? '使用 1 張摘除符，寶石將退回包裹。' : '<b>沒有摘除符，摘除後寶石會碎裂！</b>確定嗎？', function () {
      var r = G.unsocket(UI.sel.forgeUid, +i, fu); if (UI.res(r, r.kept ? '寶石已退回包裹' : '寶石已碎裂')) UI.render();
    }, '摘除');
  };
  UI.actions.gemComb = function (k) { var r = G.gemCombine(k); if (UI.res(r, '合成：' + G.itemName(r.to))) UI.render(); };

  // ---------- 將星錄 ----------
  UI.actions.jxl = function () { UI.go('jxl'); };
  UI.screens.jxl = function () {
    var s = MJ.S.state, lit = s.jiangxing.lit, bon = R.teamBonus(s);
    var h = '<div class="scr hall-scr"><div class="frame bigframe hall jxl"><div class="plaque">將星錄</div><a class="xbtn" data-a="city">×</a>';
    // 星盤
    h += '<div class="jx-map"><svg viewBox="0 0 400 400" class="art jx-svg"><circle cx="200" cy="200" r="180" fill="none" stroke="#5a4a8a" stroke-width="2"/><circle cx="200" cy="200" r="120" fill="none" stroke="#3a3a6a" stroke-width="1.5"/>';
    var ring = Math.floor(lit / 28), base = ring * 28;
    for (var i = 0; i < 28; i++) {
      var a = (i / 28) * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? 150 : 172, x = 200 + Math.cos(a) * rr, y = 200 + Math.sin(a) * rr, on = base + i < lit;
      if (i) { var a0 = ((i - 1) / 28) * Math.PI * 2 - Math.PI / 2, r0 = (i - 1) % 2 ? 150 : 172; h += '<line x1="' + (200 + Math.cos(a0) * r0).toFixed(1) + '" y1="' + (200 + Math.sin(a0) * r0).toFixed(1) + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="' + (on ? '#ffd54f' : '#4a4a7a') + '" stroke-width="' + (on ? 2 : 1) + '"/>'; }
      h += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (on ? 9 : 6) + '" fill="' + (on ? '#ffe082' : '#3a3a6a') + '" stroke="' + (base + i === lit ? '#fff' : '#8a7ac8') + '" stroke-width="2"' + (on ? ' class="jx-on"' : '') + '/>';
      h += '<text x="' + x.toFixed(1) + '" y="' + (y + 4).toFixed(1) + '" font-size="9" text-anchor="middle" fill="' + (on ? '#5a3a00' : '#cfc8ff') + '">' + C().jiangxing.names[i] + '</text>';
    }
    h += '<text x="200" y="190" font-size="26" text-anchor="middle" fill="#ffe082" font-weight="bold">' + lit + '/' + R.jxMax + '</text><text x="200" y="218" font-size="14" text-anchor="middle" fill="#cfc8ff">已點亮將星</text></svg></div>';
    // 右側
    h += '<div class="parch jx-side">';
    if (lit < R.jxMax) { var nx = R.jxStar(lit); h += '<b>下一顆：' + nx.name + '</b><br>全隊 ' + UI.STAT_NAMES[nx.k] + ' +' + nx.pct + '%<br>需要星魂 <b>' + s.player.xinghun + '/' + nx.cost + '</b><div class="btn-row"><a class="btn" data-a="jxLight">點亮</a></div>'; }
    else h += '<b>將星已全部點亮！</b>';
    h += '<hr><b>目前全隊加成</b>（將星＋圖鑑＋陣法）<br><small>' + (U.keys(bon).length ? U.map(U.keys(bon), function (k) { return UI.STAT_NAMES[k] + ' +' + bon[k] + '%'; }).join('　') : '無') + '</small>';
    var souls = U.filter(U.keys(s.bag.stack), function (k) { return k.indexOf('soul:') === 0 && s.bag.stack[k] > 0; });
    h += '<hr><b>獻祭將魂換星魂</b>（白1 綠2 藍4 紫8 橙16 點/個）<div class="rows jx-souls">' + (souls.length ? U.map(souls, function (k) {
      var d = R.heroDef(k.slice(5)), n = s.bag.stack[k];
      return '<div class="row-item">' + UI.icon('soul', d.quality) + '<div class="ri-t"><b>' + U.esc(d.name) + ' ×' + n + '</b></div><a class="btn small" data-a="jxSac" data-v="' + k.slice(5) + ':1">獻祭1</a>' + (n > 1 ? '<a class="btn small" data-a="jxSac" data-v="' + k.slice(5) + ':' + n + '">全部</a>' : '') + '</div>';
    }).join('') : '<small>沒有將魂</small>') + '</div>';
    h += '<div class="btn-row"><a class="btn small" data-a="open" data-v="codex">圖鑑（' + G.codexCount() + '/' + MJ.D.heroes.list.length + '）</a><a class="btn small" data-a="city">返回</a></div>';
    h += '<p class="note">將星錄：A（建築存在）；二十八宿名稱：中國傳統星官；加成與消耗：D。</p></div></div></div>';
    return h;
  };
  UI.actions.jxLight = function () { var r = G.lightStar(); if (UI.res(r, '點亮「' + (r.star && r.star.name) + '」')) UI.render(); };
  UI.actions.jxSac = function (v) {
    var a = v.split(':'), d = R.heroDef(a[0]);
    UI.confirm('獻祭將魂', '把 ' + a[1] + ' 個「' + U.esc(d.name) + '」將魂換成 ' + C().soulValue[d.quality] * a[1] + ' 星魂？（將魂也可用於召喚或升階）', function () {
      var r = G.sacrificeSoul(a[0], +a[1]); if (UI.res(r, '星魂 +' + r.pts)) UI.render();
    }, '獻祭');
  };

  // ---------- 圖鑑 ----------
  UI.modals.codex = function () {
    var s = MJ.S.state, q = UI.sel.codexQ == null ? -1 : UI.sel.codexQ;
    var list = U.filter(MJ.D.heroes.list, function (d) { return q < 0 || d.quality === q; });
    list.sort(function (a, b) { return b.quality - a.quality; });
    var n = G.codexCount(), bon = Math.min(C().codexMax, n * C().codexPer);
    var b = '<div class="tabs small">' + U.map([[-1, '全部'], [4, '橙'], [3, '紫'], [2, '藍'], [1, '綠'], [0, '白']], function (t) { return '<a class="tab' + (q === t[0] ? ' on' : '') + '" data-a="codexQ" data-v="' + t[0] + '">' + t[1] + '</a>'; }).join('') + '</div>';
    b += '<div class="cdx-h">已收錄 <b>' + n + '/' + MJ.D.heroes.list.length + '</b>　全隊四維戰鬥屬性 +' + (Math.round(bon * 100) / 100) + '%（每名 +' + C().codexPer + '%，上限 ' + C().codexMax + '%，D）</div>';
    var pg = UI.pager('codexP', list, 18, function (d) {
      var got = !!s.codex[d.id];
      return '<div class="cdx' + (got ? '' : ' no') + '" data-a="codexInfo" data-v="' + d.id + '">' + MJ.Art.portrait(d.look, d.quality) + '<span class="nm">' + (got ? U.esc(d.name) : '？？？') + '</span></div>';
    });
    b += '<div class="cdx-grid">' + pg.html + '</div>' + pg.nav;
    return UI.panel('武將圖鑑', b, { cls: 'wide' });
  };
  UI.actions.codexQ = function (v) { UI.sel.codexQ = +v; UI.page.codexP = 0; UI.renderModal(); };
  UI.actions.codexInfo = function (id) {
    var d = R.heroDef(id), got = !!MJ.S.state.codex[id];
    if (!got) { UI.toast('尚未收錄：' + UI.qname(d.quality) + '品．' + d.faction + '（招募或以將魂召喚後收錄）'); return; }
    var ps = d.passive ? MJ.D.heroes.passives[d.passive] : null;
    UI.toast(d.name + '｜' + UI.qname(d.quality) + '．' + d.type + '｜主動 ' + d.active.name + (d.ult ? '／無雙 ' + d.ult.name : '') + (ps ? '／被動 ' + ps.name : '') + '｜資料 ' + (d.grade || ''));
  };
})();

</script>
<script>/* js/ui-p3.js */
/* 第三階段介面：通天塔、無極幻境（三欄挑戰面板）、農田、任務（主線／每日／成就／簽到）、經濟模式 */
(function () {
  var UI = MJ.UI, U = MJ.U, G = MJ.G, R = MJ.R;
  function C() { return MJ.D.config; }
  function S() { return MJ.S.state; }

  // 獎勵物件 → 文字列表（不發放）
  UI.rwText = function (rw) {
    var out = [];
    if (!rw) return out;
    if (rw.gold) out.push('金幣 ×' + rw.gold);
    if (rw.silver) out.push('銀幣 ×' + U.fmt(rw.silver));
    U.each(rw.items || [], function (it) {
      if (it.item.indexOf('eq:') === 0) out.push(C().equipQualityNames[it.q || 0] + '·' + G.itemName(it.item));
      else out.push(G.itemName(it.item) + ' ×' + (it.n || 1));
    });
    return out;
  };
  function rwHtml(lines, cls) { return '<div class="reward-list">' + U.map(lines, function (x) { return '<div class="rw' + (cls ? ' ' + cls : '') + '">' + U.esc(x) + '</div>'; }).join('') + '</div>'; }
  function foeSummary(sg) {
    var lead = U.find(sg.enemies, function (e) { return e.leader; }), tpl = lead ? MJ.D.stages.enemies[lead.e] : null;
    return sg.enemies.length + ' 名敵將　Lv' + sg.enemies[sg.enemies.length - 1].lv + (tpl ? '　首領：' + tpl.name : '');
  }

  // =================== 通天塔 ===================
  UI.screens.tower = function () {
    var s = S(), best = s.tower.best, next = Math.min(best + 1, G.TOWER_MAX), sg = G.towerFloor(next);
    var h = '<div class="scr hall-scr"><div class="frame bigframe hall towerf"><div class="plaque">通天塔</div><a class="xbtn" data-a="city">×</a>';
    // 塔身：顯示目前附近的 7 層
    var lo = Math.max(1, Math.min(next - 3, G.TOWER_MAX - 6));
    h += '<div class="tw-art"><svg viewBox="0 0 300 470" class="art"><defs><linearGradient id="twg" x1="0" x2="1"><stop offset="0" stop-color="#6a4a8a"/><stop offset=".5" stop-color="#9a7ac8"/><stop offset="1" stop-color="#5a3a7a"/></linearGradient></defs>';
    h += '<path d="M150 4 L162 34 L138 34 Z" fill="#ffd54f"/>';
    for (var i = 6; i >= 0; i--) {
      var f = lo + i, y = 40 + (6 - i) * 60, w = 120 + i * 0 + (6 - i) * 14, x = 150 - w / 2, cur = f === next && best < G.TOWER_MAX, done = f <= best;
      h += '<path d="M' + (x - 14) + ' ' + (y + 14) + ' L' + (x + w + 14) + ' ' + (y + 14) + ' L' + (x + w) + ' ' + y + ' L' + x + ' ' + y + ' Z" fill="#3a2a10"/>';
      h += '<rect x="' + x + '" y="' + (y + 14) + '" width="' + w + '" height="44" fill="' + (cur ? '#ffcf5a' : 'url(#twg)') + '" stroke="#2a1a40" stroke-width="2"/>';
      h += '<rect x="' + (150 - 12) + '" y="' + (y + 26) + '" width="24" height="32" rx="12" fill="' + (done ? '#ffe9a0' : '#2a1a3a') + '"/>';
      h += '<text x="' + (x + 8) + '" y="' + (y + 42) + '" font-size="15" font-weight="bold" fill="' + (cur ? '#5a2a00' : '#fff') + '">' + f + '</text>';
      if (f % 10 === 0) h += '<text x="' + (x + w - 8) + '" y="' + (y + 42) + '" font-size="13" text-anchor="end" fill="#ff8a65">王</text>';
      else if (f % 5 === 0) h += '<text x="' + (x + w - 8) + '" y="' + (y + 42) + '" font-size="13" text-anchor="end" fill="#ffd54f">精</text>';
      if (done) h += '<text x="' + (x + w - 8) + '" y="' + (y + 56) + '" font-size="10" text-anchor="end" fill="#c8ffc8">已登</text>';
    }
    h += '<rect x="60" y="460" width="180" height="10" fill="#4a3a20"/></svg></div>';
    // 右側資訊
    h += '<div class="parch tw-side">';
    h += '<div class="tw-best">最高紀錄：第 <b>' + best + '</b> 層 / ' + G.TOWER_MAX + '</div>' + UI.bar(best, G.TOWER_MAX, 'tw-bar', best + '/' + G.TOWER_MAX);
    if (best >= G.TOWER_MAX) h += '<div class="fg-box"><b>已登上塔頂！</b></div>';
    else {
      h += '<div class="fg-box"><b>' + U.esc(sg.name) + '</b>（' + ({ normal: '一般', elite: '精英', boss: '首領' })[sg.kind] + '　景：' + U.esc(sg.chName) + '）<br>' + U.esc(foeSummary(sg)) +
        '<div class="rw-h">首次登頂獎勵</div>' + rwHtml(UI.rwText(sg.first).concat(['星魂 +' + sg.xinghun, '全隊經驗 +' + sg.exp]), 'first') +
        '<div class="btn-row"><a class="btn" data-a="twFight">挑　戰</a></div></div>';
    }
    var sw = G.towerSweepReward(), swDone = s.tower.sweepDay === U.dayKey();
    h += '<div class="fg-box tw-sweep"><b>每日塔俸</b>（依最高層數，每天一次）<br>' + (best ? U.esc(UI.rwText(sw).join('、')) : '至少通過第 1 層才能領取') +
      '<div class="btn-row"><a class="btn small' + (swDone || !best ? ' disabled' : '') + '" data-a="twSweep">' + (swDone ? '今日已領' : '領取') + '</a></div></div>';
    h += '<p class="note">通天塔挑戰不消耗精力；戰敗沒有懲罰。建築：A；樓層內容、獎勵：D。</p></div></div></div>';
    return h;
  };
  UI.actions.tower = function () { UI.go('tower'); };
  UI.actions.twFight = function () { var r = G.towerFight(); if (!UI.res(r)) return; UI.startBattle(r); };
  UI.actions.twSweep = function () { var r = G.towerSweep(); if (UI.res(r)) { UI.render(); UI.rewardBox('每日塔俸', r.got); } };

  // =================== 無極幻境 ===================
  UI.screens.wuji = function () {
    var s = S(), lead = G.lead();
    var h = '<div class="scr hall-scr"><div class="frame bigframe hall wujif"><div class="plaque">無極幻境</div><a class="xbtn" data-a="city">×</a>';
    h += '<div class="wj-tip">連續挑戰多波敵軍，<b>生命與怒氣會延續到下一波</b>。每通過一波都有獎勵，全部通過另有寶箱。</div><div class="wj-cards">';
    U.each(G.WUJI, function (t, i) {
      var locked = lead.lv < t.open, left = G.wujiLeft(t.id), boss = G.wujiWave(t, t.waves - 1, 1);
      var bu = R.enemyUnit(boss.enemies[0], boss);
      h += '<div class="wj-card wj' + i + (locked ? ' locked' : '') + '"><div class="wj-h">' + U.esc(t.name) + '</div>' +
        '<div class="wj-fig">' + MJ.Art.figure(bu.look, { enemy: true, cape: true }) + '</div>' +
        '<div class="wj-b">推薦等級 <b>' + (t.lv + t.waves) + '</b><br>波數 <b>' + t.waves + '</b>　敵軍 Lv' + t.lv + '～' + (t.lv + (t.waves - 1) * 2) + '<br>' +
        '今日次數 <b>' + Math.max(0, left) + '/' + t.daily + '</b>' +
        '<div class="rw-h">全破寶箱</div><small>' + U.esc(UI.rwText(t.bonus).join('、')) + '</small>' +
        (s.wuji.first[t.id] ? '' : '<div class="rw-h">首次全破</div><small class="wj-first">' + U.esc(UI.rwText(t.first).join('、')) + '</small>') + '</div>' +
        (locked ? '<div class="wj-lock">主角 ' + t.open + ' 級開放</div>' : '<div class="btn-row"><a class="btn' + (left > 0 ? '' : ' disabled') + '" data-a="wjGo" data-v="' + t.id + '">挑　戰</a></div>') + '</div>';
    });
    h += '</div><p class="note wj-note">無極幻境：A（建築存在）；三欄挑戰面板版面參考影片 3；波數、敵軍、獎勵：D。累計全破 ' + s.wuji.clears + ' 次。</p></div></div>';
    return h;
  };
  UI.actions.wuji = function () { UI.go('wuji'); };
  UI.actions.wjGo = function (id) {
    var r = G.wujiRun(id); if (!UI.res(r)) return;
    UI.wujiPlay(r, 0);
  };
  UI.wujiPlay = function (run, i) {
    var w = run.waves[i];
    UI.startBattle({ mode: 'wuji', run: run, idx: i, win: w.win, battle: w.battle, stage: w.stage, team: w.team, foes: w.foes, rewards: [], levelUps: [], energyCost: 0 });
  };
  UI.actions.wjNext = function () { var b = UI.battleState(); if (!b) return; b.done = true; UI.wujiPlay(b.r.run, b.r.idx + 1); };
  UI.actions.wjSum = function () { var b = UI.battleState(); if (!b) return; var el = document.getElementById('bresult'); if (el) el.innerHTML = UI.modeResult(b.r, true); };

  // 戰鬥結算（通天塔／無極幻境）
  UI.modeResult = function (r, summary) {
    var h, lead = G.lead();
    var tips = '<div class="rw-h">如何提升戰鬥力</div><div class="tips">・到神武殿升級技能、培養、修練心法<br>・到神兵坊強化與鑲嵌寶石<br>・在將星錄點亮將星（全隊加成）<br>・調整陣法，把耐打的武將放在前排</div>';
    if (r.mode === 'tower') {
      var f = r.stage.floor;
      if (r.win) h = '<div class="dim"></div><div class="result win"><div class="banner">登 頂</div><div class="parch rbody"><div>成功登上通天塔第 <b>' + f + '</b> 層！回合數：' + r.battle.rounds + '</div>' +
        (r.exp ? '<div>全隊經驗 +' + r.exp + '</div>' : '') + (r.levelUps.length ? '<div class="lvup">升級！' + U.esc(r.levelUps.join('、')) + '</div>' : '') +
        '<div class="rw-h">首次登頂獎勵</div>' + rwHtml(r.rewards, 'first') + '</div>';
      else h = '<div class="dim"></div><div class="result lose"><div class="banner">戰 敗</div><div class="parch rbody"><div>第 ' + f + ' 層的守軍太強了。' + (r.battle.timeout ? '（超過 ' + C().maxRounds + ' 回合）' : '') + '通天塔戰敗沒有任何損失。</div>' + tips + '</div>';
      h += '<div class="btn-row">' + (r.win && S().tower.best < G.TOWER_MAX ? '<a class="btn" data-a="bTower" data-v="1">下一層</a>' : '') + (!r.win ? '<a class="btn" data-a="bTower" data-v="1">再戰一次</a>' : '') + '<a class="btn" data-a="bTower">返回通天塔</a><a class="btn" data-a="bCity">回主城</a></div></div>';
      return h;
    }
    // 無極幻境
    var run = r.run, t = run.tier, last = r.idx === run.waves.length - 1;
    if (!summary && r.win && !last) {
      return '<div class="dim"></div><div class="result win"><div class="banner">第 ' + (r.idx + 1) + ' 波 勝</div><div class="parch rbody"><div>' + U.esc(t.name) + '：第 ' + (r.idx + 1) + '/' + t.waves + ' 波通過。</div>' +
        '<div>存活的武將會帶著目前的生命與怒氣進入下一波。</div>' +
        '<div>本波獎勵：銀幣 ×' + U.fmt(r.stage.silver) + '　全隊經驗 +' + r.stage.exp + '</div></div>' +
        '<div class="btn-row"><a class="btn" data-a="wjNext">下一波</a><a class="btn" data-a="wjSum">略過，看結算</a></div></div>';
    }
    h = '<div class="dim"></div><div class="result ' + (run.full ? 'win' : 'lose') + '"><div class="banner">' + (run.full ? '全 破' : '結 算') + '</div><div class="parch rbody">' +
      '<div>' + U.esc(t.name) + '：通過 <b>' + run.cleared + '/' + t.waves + '</b> 波' + (run.full ? '，全部擊破！' : '。') + '</div>' +
      (run.exp ? '<div>全隊經驗 +' + run.exp + '</div>' : '') + (run.levelUps.length ? '<div class="lvup">升級！' + U.esc(run.levelUps.join('、')) + '</div>' : '') +
      '<div class="rw-h">獲得獎勵</div>' + (run.rewards.length ? rwHtml(run.rewards) : '<div>沒有通過任何一波，沒有獎勵。</div>') +

      U.each(['日', '一', '二', '三', '四', '五', '六'], function (w) { body += '<span class="sg-w">' + w + '</span>'; });

      body += '</div></div><div class="sg-side"><b>今日獎勵</b><br><small>' + U.esc(UI.rwText(G.SIGN_REWARD[x.count % G.SIGN_REWARD.length]).join('、')) + '</small>' +
        '<div class="btn-row">' + (x.signedToday ? '<a class="btn disabled">今日已簽</a>' : '<a class="btn" data-a="signDo">簽　到</a>') + '</div>' +
        (x.canMakeup ? '<div class="btn-row"><a class="btn small" data-a="signMk">補簽（' + G.SIGN_MAKEUP_GOLD + ' 金）</a></div>' : '') + '<hr><b>累計簽到獎勵</b><div class="rows">';
      U.each([7, 14, 21, 28], function (n) {

      });
      body += '</div></div></div><p class="note">每月重置；補簽需先完成當天簽到。獎勵：D。</p>';
    }
    return UI.panel('任務', body, { cls: 'wide task-p' });
  };
  UI.actions.taskTab = function (v) { UI.sel.taskTab = v; UI.renderModal(); };
  UI.actions.claimDaily = function (id) { var r = G.claimDaily(id); if (UI.res(r)) { UI.renderModal(); UI.rewardBox('每日任務', r.got); } };

<script>/* js/audio.js */
/* 第四階段：原創程序化音樂與音效（WebAudio 即時合成，不含任何音檔）
   - 每個場景一首以五聲音階自動編排的循環曲（主城／關卡選擇／戰鬥／首領戰／勝利／戰敗／通天塔與幻境／聚賢莊／農田）
   - 音色：古箏式撥弦、嗩吶式簧管、鐘鈴、二胡式滑音、笛子式氣聲
   - 音效：點擊、命中、暴擊、無雙、治療、陣亡、勝利、戰敗、獲得、招募
   - 瀏覽器規定須在使用者第一次點擊後才能發聲；不支援 WebAudio 時全部靜默略過 */
(function () {
  var MJ = window.MJ, A = MJ.Audio = {};
  // ---------- 純資料：曲目設定與旋律產生（可在 Node 測試） ----------
  // 音高以「距 A4 的半音數」表示
  var SCALES = { gong: [0, 2, 4, 7, 9], yu: [0, 3, 5, 7, 10], shang: [0, 2, 5, 7, 10] };
  A.SONGS = {
    city:    { bpm: 84,  root: -2, mode: 'gong',  seed: 11, lead: 'pluck', drums: 0, pad: 1, bass: 1, density: 0.55 },
    battle:  { bpm: 132, root: -5, mode: 'yu',    seed: 23, lead: 'reed',  drums: 2, pad: 0, bass: 2, density: 0.8 },
    boss:    { bpm: 144, root: -7, mode: 'yu',    seed: 37, lead: 'reed',  drums: 3, pad: 1, bass: 2, density: 0.9 },
    mystic:  { bpm: 70,  root: -4, mode: 'shang', seed: 41, lead: 'bell',  drums: 1, pad: 1, bass: 1, density: 0.45 },
    recruit: { bpm: 100, root: 0,  mode: 'gong',  seed: 53, lead: 'bell',  drums: 1, pad: 1, bass: 1, density: 0.6 },
    farm:    { bpm: 92,  root: 3,  mode: 'gong',  seed: 67, lead: 'pluck', drums: 0, pad: 0, bass: 1, density: 0.5 },
    title:   { bpm: 76,  root: -2, mode: 'yu',    seed: 79, lead: 'pluck', drums: 1, pad: 1, bass: 1, density: 0.5, lead2: 'dizi' },
    // 關卡選擇：緊張的行軍感（羽調、低音雙拍、輕鼓）
    gate:    { bpm: 112, root: -6, mode: 'yu',    seed: 89, lead: 'reed',  drums: 1, pad: 1, bass: 2, density: 0.6 },
    // 勝利：明亮的宮調、鑼鼓、鈴聲
    victory: { bpm: 120, root: 0,  mode: 'gong',  seed: 97, lead: 'bell',  drums: 2, pad: 1, bass: 1, density: 0.85, lead2: 'dizi' },
    // 戰敗：緩慢的二胡式滑音（羽調）
    defeat:  { bpm: 60,  root: -5, mode: 'yu',    seed: 103, lead: 'erhu', drums: 0, pad: 1, bass: 1, density: 0.45 }
  };
  // 主城：古箏（撥弦）主旋律＋笛子副旋律
  A.SONGS.city.lead2 = 'dizi';
  A.SCENE_OF = { newgame: 'title', city: 'city', battle: 'battle', tower: 'mystic', wuji: 'mystic', juxian: 'recruit', recruit: 'recruit', farm: 'farm', arena: 'mystic', gate: 'gate' };
  function rng(seed) { var x = seed * 9301 + 49297; return function () { x = (x * 9301 + 49297) % 233280; return x / 233280; }; }
  // 產生 64 步（4 小節×16 分音符）的旋律、低音、鼓點
  A.pattern = function (name) {
    var sg = A.SONGS[name] || A.SONGS.city, r = rng(sg.seed), sc = SCALES[sg.mode];
    var steps = 64, mel = [], bass = [], drum = [], deg = 5, motif = [];
    // 先產生 1 小節動機，第 2、4 小節變奏重複，第 3 小節自由發展（傳統「起承轉合」的簡化）
    for (var i = 0; i < 16; i++) {
      var on = i % 4 === 0 ? r() < 0.9 : (i % 2 === 0 ? r() < sg.density : r() < sg.density * 0.35);
      if (on) { deg += Math.floor(r() * 5) - 2; if (deg < 2) deg = 2 + Math.floor(r() * 2); if (deg > 10) deg = 9 - Math.floor(r() * 2); }
      motif.push(on ? deg : null);
    }
    for (var b = 0; b < 4; b++) for (var j = 0; j < 16; j++) {
      var d = motif[j];
      if (b === 1 && d !== null && j >= 8) d = d + (j % 4 === 0 ? 1 : 0);
      if (b === 2) { d = (j % 2 === 0 && r() < sg.density) ? 3 + Math.floor(r() * 7) : null; if (j === 0) d = 7; }
      if (b === 3 && j >= 12) d = j === 12 ? 5 : null; // 收束到主音
      mel.push(d === null || d === undefined ? null : sg.root + 12 + sc[d % 5] + 12 * Math.floor(d / 5) - 12);
    }
    var prog = [0, 3, 4, 0]; // 以音階度數表示的低音進行
    for (var k = 0; k < steps; k++) {
      var bar = Math.floor(k / 16), st = k % 16, root = sg.root - 24 + sc[prog[bar] % 5];
      bass.push(sg.bass === 2 ? (st % 2 === 0 ? root + (st % 8 === 6 ? 7 : 0) : null) : (st % 8 === 0 ? root : null));
      var dr = null;
      if (sg.drums >= 1 && st % 8 === 0) dr = 'taiko';
      if (sg.drums >= 2 && (st === 4 || st === 12)) dr = 'snare';
      if (sg.drums >= 2 && st % 2 === 1 && r() < 0.35) dr = 'tick';
      if (sg.drums >= 3 && (st === 14 || st === 15) && bar === 3) dr = 'taiko';
      if (sg.drums === 1 && st !== 0) dr = st === 8 && r() < 0.5 ? 'tick' : null;
      drum.push(dr);
    }
    // 副旋律（笛子）：在第 2、4 小節的強拍上，取主旋律高八度長音，形成呼應
    var mel2 = [];
    for (var m = 0; m < steps; m++) {
      var bb = Math.floor(m / 16), ss = m % 16, src = null;
      if (sg.lead2 && (bb === 1 || bb === 3) && ss % 8 === 0) { for (var q = m; q >= m - 3 && q >= 0; q--) if (mel[q] !== null) { src = mel[q]; break; } if (src === null) src = sg.root + 12 + sc[(bb + ss) % 5]; src += 12; }

    if (r.replay) h += '<div>' + (r.win ? '這場戰鬥你獲勝了。' : '這場戰鬥你落敗了。') + '回合數：' + r.battle.rounds + '</div><div>重播依存下的雙方陣容與亂數種子重新演算' + (r.consistent ? '，結果與當時一致。' : '。') + '</div>';

<script>/* js/ui-p5.js */
/* 加碼玩法介面：奇遇（華容道／觀星台／玄機盤）。美術全部為程式繪製的原創 SVG／CSS。 */
(function () {

  // ---------- 華容道 ----------

  function hrdHtml() {

  }
  UI.actions.hrdLv = function (v) { if (UI.res(G.hrdStart(+v))) { UI.sel.hrdSel = null; UI.renderModal(); } };
  UI.actions.hrdSel = function (v) { UI.sel.hrdSel = +v; UI.renderModal(); };
  function afterMove(r) {

  UI.actions.hrdDir = function (v) {

  };
  UI.actions.hrdTo = function (v) {

    var p = G.hrd().cur[sel], z = G.HRD_SIZE[p.t], r = Math.floor(i / 4), c = i % 4, dr = 0, dc = 0;
    if (r < p.r) dr = -1; else if (r >= p.r + z[0]) dr = 1;
    if (c < p.c) dc = -1; else if (c >= p.c + z[1]) dc = 1;
    if (Math.abs(dr) + Math.abs(dc) !== 1) { UI.toast('只能往上下左右移動一格', 'bad'); return; }

  };
  UI.actions.hrdUndo = function () { if (UI.res(G.hrdUndo())) UI.renderModal(); };
  UI.actions.hrdReset = function () { if (UI.res(G.hrdReset())) { UI.sel.hrdSel = null; UI.renderModal(); } };

  // ---------- 觀星台 ----------
  var DIPPER = [[90, 70], [160, 60], [215, 95], [270, 120], [340, 110], [395, 60], [440, 120]];
  function starHtml() {
    var x = G.starState(), out = '<div class="star-wrap"><svg class="sky" viewBox="0 0 520 230" width="520" height="230">';
    out += '<defs><radialGradient id="skyg" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#283593"/><stop offset="1" stop-color="#0b0f2e"/></radialGradient></defs><rect width="520" height="230" rx="10" fill="url(#skyg)"/>';
    for (var i = 0; i < 40; i++) { var sx = (i * 137) % 510 + 5, sy = (i * 71) % 220 + 5; out += '<circle cx="' + sx + '" cy="' + sy + '" r="' + (i % 3 ? 0.8 : 1.4) + '" fill="#fff" opacity="' + (0.3 + (i % 5) / 10) + '"/>'; }
    out += '<polyline points="' + U.map(DIPPER, function (p) { return p.join(','); }).join(' ') + ' 395,60" fill="none" stroke="#9fa8da" stroke-width="1.5" stroke-dasharray="4 4" opacity=".7"/>';
    out += '<path d="M60 230 L60 214 L120 214 L120 202 L400 202 L400 214 L460 214 L460 230Z" fill="#37474f" stroke="#ffd54f" stroke-width="1.5"/><path d="M246 202 L246 186 L274 186 L274 202" fill="#263238" stroke="#ffd54f"/><circle cx="260" cy="178" r="7" fill="none" stroke="#ffd54f" stroke-width="2"/>';
    out += '</svg><div class="dipper">' + U.map(DIPPER, function (p, i) {
      var last = x.last && x.last.star === G.STAR_NAMES[i];
      return '<a class="star-pt' + (last ? ' last' : '') + (x.left > 0 ? '' : ' off') + '" data-a="starDraw" data-v="' + i + '" style="left:' + (p[0] - 16) + 'px;top:' + (p[1] - 16) + 'px"><i></i><small>' + G.STAR_NAMES[i] + '</small></a>';

    out += '<div>今天還能觀星 <b>' + x.left + '</b> 次　' + (x.left > 0 ? (x.free ? '<span class="good">本次免費</span>' : '本次花費 ' + x.cost + ' 金') : '明天再來') + '　（點北斗七星任一顆）</div>';
    if (x.last) { var ll = G.starLuck(x.last.luck); out += '<div class="star-last">上次：' + x.last.star + '星 → <b class="luck-' + ll.id + '">' + ll.name + '</b>　「' + ll.poem + '」</div>'; }
    out += '<div class="small">運勢機率：' + U.map(G.STAR_LUCK, function (l) { return l.name + ' ' + l.w + '%（經驗 +' + l.exp + '%）'; }).join('、') + '。選哪顆星不影響機率。當天取最好的一次。全部為 D 級（原創）。</div></div>';

  }
  UI.actions.starDraw = function (v) {
    var r = G.starDraw(+v); if (!UI.res(r)) return;
    sfx(r.luck.id === 'daji' ? 'win' : 'coin');
    UI.renderModal();
    UI.rewardBox(r.star + '星 · ' + r.luck.name, ['「' + r.luck.poem + '」', '今日星運：' + r.todayLuck.name + '（經驗 +' + r.todayLuck.exp + '%）'].concat(r.rewards));
  };

  // ---------- 玄機盤 ----------
  var WHEEL_COL = ['#c62828', '#f9a825', '#6a1b9a', '#1565c0', '#2e7d32', '#ef6c00', '#00838f', '#5d4037', '#ad1457', '#283593', '#558b2f', '#4527a0'];
  function wheelSvg(rot) {

    for (var i = 0; i < n; i++) {
      var a0 = (i / n) * 2 * Math.PI - Math.PI / 2 - Math.PI / n, a1 = a0 + 2 * Math.PI / n;

    return out;
  }
  function wheelHtml() {
    var x = G.wheelState(), rot = UI._wheelRot || 0;
    var out = '<div class="wheel-wrap"><div class="wheel-box"><div class="wheel" id="wheel" style="-webkit-transform:rotate(' + rot + 'deg);transform:rotate(' + rot + 'deg)">' + wheelSvg() + '</div><div class="wheel-ptr"></div></div>';

<script>/* js/main.js */
/* 啟動：載入存檔、計時器、自動存檔 */
(function () {
  var UI = MJ.UI, G = MJ.G, S = MJ.S, U = MJ.U;
  MJ.boot = function () {
    G.initData();
    UI.bind();
    if (UI.bindSound) UI.bindSound();
    var r = S.load();
    if (r.ok) {
      S.state = r.state; G.tick();
      UI.screen = 'city';
      if (r.fromBackup) setTimeout(function () { UI.toast('主存檔損壞，已自動改用備份存檔', 'bad'); }, 300);
    } else {
      if (!r.none) {
        // 存檔損壞且無可用備份：保留原文以便救援
        try { var raw = localStorage.getItem(S.KEY); if (raw) localStorage.setItem(S.KEY + '_corrupt', raw); } catch (e) { }
        setTimeout(function () { UI.toast('存檔無法讀取（' + (r.errors || []).slice(0, 2).join('；') + '），原始資料已另存為 ' + S.KEY + '_corrupt', 'bad'); }, 300);
      }
      UI.screen = 'newgame';
    }
    G.onChange = function () { if (UI.screen !== 'battle' && UI.screen !== 'newgame') UI.refresh(); };
    G.onChat = function () { var c = document.getElementById('chat'); if (c) c.innerHTML = UI.chatHtml(); };
    UI.layout();
    UI.render();
    var lastEnergy = S.state ? S.state.player.energy : 0, secs = 0;
    setInterval(function () {
      if (!S.state) return;
      secs++;
      G.tick();
      var now = U.now();
      var cds = document.getElementsByClassName('cd');
      for (var i = 0; i < cds.length; i++) { var end = +cds[i].getAttribute('data-end'); cds[i].innerHTML = U.dur(Math.max(0, end - now)); }
      var fc = document.getElementById('freeCd'); if (fc) { var fl = G.freeGiftLeft(); if (fl > 0) fc.innerHTML = U.dur(fl); else { var gp = fc.parentNode, ga = gp && gp.parentNode; gp.innerHTML = '免費禮物'; if (ga && !ga.getElementsByClassName('dot').length) { var dt = document.createElement('i'); dt.className = 'dot'; ga.appendChild(dt); } } }
      var rg = document.getElementsByClassName('regen'); if (rg[0]) rg[0].innerHTML = U.dur(G.nextEnergyIn()) + ' 後 +1';
      var busy = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
      var needRender = (S.state.player.energy !== lastEnergy) || (fc && G.freeGiftLeft() <= 0) || (cds.length && U.find(cds, function (c) { return +c.getAttribute('data-end') <= now; }));
      if (needRender && !busy && UI.screen !== 'battle' && UI.screen !== 'newgame') UI.render();
      lastEnergy = S.state.player.energy;
      if (secs % 30 === 0) S.save(false);
    }, 1000);
    function flush() { if (S.state) S.save(false); }
    window.addEventListener('pagehide', flush, false);
    window.addEventListener('beforeunload', flush, false);
    document.addEventListener('visibilitychange', function () { if (document.hidden) flush(); }, false);
    MJ.booted = true;
    // 載入畫面：顯示進度與輪播小提示，最少停留 0.9 秒讓提示可讀
    var ld = document.getElementById('loading'), bar = document.getElementById('ldBar'), tip = document.getElementById('ldTip');
    if (ld) {
      if (bar) bar.style.width = '100%';
      var TIPS = MJ.LOAD_TIPS, ti = 0;
      var tv = setInterval(function () { ti = (ti + 1) % TIPS.length; if (tip) tip.innerHTML = TIPS[ti]; }, 2500);
      setTimeout(function () { ld.className = 'out'; clearInterval(tv); setTimeout(function () { if (ld.parentNode) ld.parentNode.removeChild(ld); }, 450); }, 900);
    }
  };
  // 第一則：A（影片3 載入畫面原文）；其餘：D（本作撰寫）
  MJ.LOAD_TIPS = [
    '小提示：物理攻擊對體力高、法術攻擊對智力高、絕技攻擊對敏捷高的武將，裝備、屬性培養等是不一樣的。',
    '小提示：無雙值滿 100 會自動施放無雙絕技，攻擊與受擊都會累積無雙值。',
    '小提示：出手順序是雙方交替，前排先動，同一列由下往上。',
    '小提示：戰鬥超過 36 回合仍未分出勝負，進攻方判定失敗。',
    '小提示：到神武殿按「最強」可一鍵換上最好的裝備。',
