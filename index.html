/* ---------- 第四階段：戰場武將腳下金色法陣、高品質光焰、命中火花、無雙閃光 ---------- */
.bcirc{position:absolute;left:6px;bottom:-2px;width:80px;height:22px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,246,190,.85) 0,rgba(240,190,60,.55) 38%,rgba(160,100,10,.0) 70%);box-shadow:0 0 0 2px rgba(255,224,120,.75),inset 0 0 0 6px rgba(255,236,150,.25);pointer-events:none}
.bcirc:after{content:"";position:absolute;left:14px;top:4px;right:14px;bottom:4px;border-radius:50%;border:1.5px dashed rgba(255,240,170,.85)}
.bu.sideB .bcirc{background:radial-gradient(ellipse at center,rgba(255,220,200,.7) 0,rgba(210,70,40,.45) 38%,rgba(120,20,10,0) 70%);box-shadow:0 0 0 2px rgba(255,150,110,.7)}
.bu.sideB .bcirc:after{border-color:rgba(255,200,170,.8)}
.bcirc.boss{left:-6px;width:104px;height:26px;bottom:-4px}
.bu.acting .bcirc:after{-webkit-animation:aimring .72s linear infinite;box-shadow:0 0 8px #fd6}
@-webkit-keyframes aimring{to{-webkit-transform:rotate(1turn)}}
.baura{position:absolute;left:10px;top:0;width:72px;height:110px;border-radius:50% 50% 40% 40%;pointer-events:none;opacity:.8;-webkit-animation:baura 1.6s ease-in-out infinite;animation:baura 1.6s ease-in-out infinite}
.baura.q3{background:radial-gradient(ellipse at 50% 65%,rgba(110,180,255,.0) 20%,rgba(90,160,255,.55) 50%,rgba(40,80,200,0) 72%)}
.baura.q4{background:radial-gradient(ellipse at 50% 65%,rgba(220,120,255,.0) 18%,rgba(200,100,255,.7) 48%,rgba(120,30,200,0) 72%);box-shadow:0 -6px 18px rgba(190,90,255,.35)}
@-webkit-keyframes baura{50%{opacity:.45;-webkit-transform:scale(1.06,1.1)}}@keyframes baura{50%{opacity:.45;transform:scale(1.06,1.1)}}
.bu.dead .baura{-webkit-animation:none;animation:none}
.battle.shakebig{-webkit-animation:shakebig .45s;animation:shakebig .45s}
@-webkit-keyframes shakebig{15%{-webkit-transform:translate(-10px,6px)}30%{-webkit-transform:translate(9px,-6px)}45%{-webkit-transform:translate(-7px,-4px)}60%{-webkit-transform:translate(6px,4px)}80%{-webkit-transform:translate(-3px,2px)}}
@keyframes shakebig{15%{transform:translate(-10px,6px)}30%{transform:translate(9px,-6px)}45%{transform:translate(-7px,-4px)}60%{transform:translate(6px,4px)}80%{transform:translate(-3px,2px)}}
.bflash{position:absolute;left:0;top:0;width:960px;height:600px;-webkit-animation:bflash .45s ease-out forwards;animation:bflash .45s ease-out forwards}
.bflash.gold{background:radial-gradient(ellipse at 50% 50%,rgba(255,250,210,.9),rgba(255,200,60,.35) 60%,rgba(255,160,0,0))}
.bflash.blue{background:radial-gradient(ellipse at 50% 50%,rgba(230,240,255,.9),rgba(90,120,255,.35) 60%,rgba(40,60,255,0))}
@-webkit-keyframes bflash{from{opacity:1}to{opacity:0}}@keyframes bflash{from{opacity:1}to{opacity:0}}
.spark{position:absolute;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,240,160,.9) 18%,rgba(255,150,40,.5) 40%,rgba(255,80,0,0) 65%);-webkit-animation:spark .35s ease-out forwards;animation:spark .35s ease-out forwards}
.spark.crit{background:radial-gradient(circle,#fff 0,rgba(255,250,120,1) 20%,rgba(255,60,20,.7) 45%,rgba(200,0,0,0) 70%)}
@-webkit-keyframes spark{from{-webkit-transform:scale(.3);opacity:1}to{-webkit-transform:scale(1.5);opacity:0}}@keyframes spark{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
/* 低效能模式（設置）：關閉光焰動畫與火花 */
.lowfx .baura{-webkit-animation:none;animation:none}.lowfx .spark,.lowfx .bflash{display:none}

/* =====================================================================
   UI 美化 v2（art2）：金邊雕飾框、木紋／宣紙面板、朱漆與翠玉按鈕、卷軸標題、
   系統中文字型（不使用 CDN）。圖示改為原創 AI 生成圖（無圖時退回 SVG）。
   ===================================================================== */
html,body{font-family:"PingFang TC","Heiti TC","Microsoft JhengHei","Noto Sans CJK TC","Noto Sans TC","Source Han Sans TC",sans-serif}
.plaque,.bname b,.b-title,.tab,.btn.big,.ci-combo,.result .banner,.tw-side h3{font-family:"BiauKai","Kaiti TC","STKaiti","KaiTi","DFKai-SB","Songti TC","Noto Serif CJK TC","PingFang TC",serif}
.art.icon.iimg{display:inline-block;vertical-align:middle;line-height:0;position:relative}
.art.icon.iimg img{display:block;width:100%;height:100%;-o-object-fit:contain;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
/* 金邊雕飾框：雙層金線＋四角金色護角 */
.frame{border:3px solid #f0cf6e;box-shadow:0 0 0 2px #4a2e08,0 0 0 4px #b98a2e,0 0 0 5px #3a2406,inset 0 0 0 2px rgba(80,60,10,.55),inset 0 0 18px rgba(30,20,0,.45),0 10px 26px rgba(0,0,0,.55)}
.frame:before{content:"";position:absolute;left:2px;top:2px;right:2px;bottom:2px;border:1px solid rgba(255,232,160,.55);border-radius:7px;pointer-events:none;
 background:linear-gradient(#fff0b8,#c8902a) left top/22px 4px no-repeat,linear-gradient(90deg,#fff0b8,#c8902a) left top/4px 22px no-repeat,
 linear-gradient(#fff0b8,#c8902a) right top/22px 4px no-repeat,linear-gradient(90deg,#c8902a,#fff0b8) right top/4px 22px no-repeat,
 linear-gradient(#c8902a,#fff0b8) left bottom/22px 4px no-repeat,linear-gradient(90deg,#fff0b8,#c8902a) left bottom/4px 22px no-repeat,
 linear-gradient(#c8902a,#fff0b8) right bottom/22px 4px no-repeat,linear-gradient(90deg,#c8902a,#fff0b8) right bottom/4px 22px no-repeat}
.frame-s{border-color:#efcd6a;box-shadow:0 0 0 1px #4a2e08,0 0 0 3px rgba(185,138,46,.85),inset 0 1px 0 rgba(255,240,180,.35),0 4px 10px rgba(0,0,0,.45)}
.parch,.panel-body{border-color:#b08a3a;box-shadow:inset 0 0 0 1px rgba(255,250,225,.6),inset 0 0 16px rgba(140,100,30,.35),0 1px 0 rgba(255,240,190,.3)}
/* 翠玉按鈕（一般）與朱漆按鈕（重要） */
.btn{background:linear-gradient(#a6eab2 0,#4fbf70 14%,#278f50 56%,#176a3a 100%);border:2px solid #f2d272;border-radius:7px;box-shadow:0 0 0 1px #3a2a08,inset 0 1px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,40,12,.35),0 3px 4px rgba(0,0,0,.45);text-shadow:0 1px 1px #053516,0 0 3px #053516}
.btn.red{background:linear-gradient(#ffb08e 0,#e8502e 15%,#b5220f 58%,#7c1007 100%);text-shadow:0 1px 1px #4a0800,0 0 3px #4a0800}
.btn.disabled,.disabled{-webkit-filter:grayscale(1);filter:grayscale(1)}
.sbtn{background:linear-gradient(#a6eab2 0,#4fbf70 14%,#278f50 56%,#176a3a 100%);border-color:#f2d272;box-shadow:0 0 0 1px #3a2a08,inset 0 1px 0 rgba(255,255,255,.5),0 3px 4px rgba(0,0,0,.45)}
.xbtn{background:radial-gradient(circle at 45% 35%,#ff9a72,#d0381c 45%,#7a1206);border:2px solid #f6d77a;box-shadow:0 0 0 2px #4a2006,0 3px 5px rgba(0,0,0,.55)}
/* 分頁：木紋暗色，選中為宣紙金邊 */
.tab{color:#f6e8b8;background:linear-gradient(#7a5a2a,#4e3414);border-color:#caa04c;text-shadow:0 1px 1px #000;box-shadow:inset 0 1px 0 rgba(255,230,160,.3)}
.tab.on{color:#6a2a00;background:linear-gradient(#fff8d8,#eedb9e);border-color:#f2d272;text-shadow:none;box-shadow:inset 0 1px 0 #fff,0 -2px 6px rgba(255,220,120,.35)}
/* 卷軸標題：朱漆底＋金邊＋兩端卷軸 */
.plaque{background:linear-gradient(#c2452a 0,#8e2010 50%,#64140a 100%);border:2px solid #f6d77a;box-shadow:0 0 0 2px #4a2006,inset 0 1px 0 rgba(255,210,170,.45),inset 0 -2px 0 rgba(40,0,0,.35),0 4px 8px rgba(0,0,0,.55);color:#fff3c4;text-shadow:0 1px 0 #4a0800,0 0 4px #4a0800;letter-spacing:5px}
.plaque:before,.plaque:after{content:"";position:absolute;top:-5px;bottom:-5px;width:12px;border-radius:5px;background:linear-gradient(90deg,#3a2008,#9a6a2a 45%,#3a2008);border:1px solid #f0cf6e;box-shadow:0 2px 3px rgba(0,0,0,.5)}
.plaque:before{left:-14px}.plaque:after{right:-14px}
.b-title{background:linear-gradient(#c2452a,#7a1a0a);border-color:#f6d77a;box-shadow:0 0 0 2px #4a2006,0 3px 6px rgba(0,0,0,.5);letter-spacing:3px}
/* 建築名牌與貨幣列：木牌金邊 */
.bname b{background:linear-gradient(#8a5f28,#5a3812 60%,#45280a);border-color:#f0cf6e;box-shadow:0 0 0 1px #2a1604,inset 0 1px 0 rgba(255,230,160,.35),0 2px 4px rgba(0,0,0,.5);letter-spacing:2px}
.cur{background:linear-gradient(rgba(96,64,24,.94),rgba(52,32,10,.94));border-color:#f0cf6e}
/* 通天塔：原創 AI 生成塔圖 */
.tw-art.timg{overflow:hidden;border:3px solid #f0cf6e;border-radius:8px;box-shadow:0 0 0 2px #4a2e08,0 6px 16px rgba(0,0,0,.55);background:#1a1030 center/cover no-repeat}
.tw-art .tw-floors{position:absolute;left:0;right:0;bottom:8px;display:flex;display:-webkit-flex;-webkit-flex-direction:column-reverse;flex-direction:column-reverse;align-items:center;-webkit-align-items:center;gap:3px}
.tw-fl{min-width:150px;padding:2px 10px;font-size:13px;font-weight:bold;text-align:center;color:#fff;background:rgba(30,16,50,.72);border:1px solid rgba(255,220,140,.6);border-radius:4px;text-shadow:0 1px 1px #000}
.tw-fl.done{color:#c8ffc8}.tw-fl.cur{color:#5a2a00;background:linear-gradient(#ffe69a,#f0b840);border-color:#fff3c0;box-shadow:0 0 10px #ffd040}
.tw-fl em{font-style:normal;margin-left:6px;color:#ff9a70}.tw-fl.cur em{color:#a02000}
/* 主城提示訊息改到畫面上方中央，不再蓋住「農田」名牌 */
#toast.top{top:10px;bottom:auto}#toast.top .toast{max-width:330px}

/* =====================================================================
   戰鬥演出 v2（art2）：武將放大、突進/回位、受擊閃白＋擊退、三種傷害光效、
   暴擊數字、陣亡淡出、高解析無雙 cut-in。省電模式（.lowfx）只保留簡化版。
   ===================================================================== */
.bu{width:112px;height:142px;-webkit-transition:-webkit-transform .18s cubic-bezier(.3,.1,.3,1),opacity .8s ease-in;transition:transform .18s cubic-bezier(.3,.1,.3,1),opacity .8s ease-in}
.bfig{left:4px;top:14px;width:104px;height:128px}
.bu.boss .bfig{left:-12px;top:-6px;width:136px;height:154px}
.bhp{left:24px;width:64px}
.bcirc{left:14px;width:84px;height:24px}
.bcirc.boss{left:-2px;width:116px;height:28px}
.baura{left:18px;top:2px;width:76px;height:136px}
.bu.windup .bfig{-webkit-transform:translateX(-8px) scale(.96,1.03);transform:translateX(-8px) scale(.96,1.03);-webkit-transition:-webkit-transform .12s;transition:transform .12s}
.bu.sideB.windup .bfig{-webkit-transform:scaleX(-1) translateX(-8px) scale(.96,1.03);transform:scaleX(-1) translateX(-8px) scale(.96,1.03)}
.bu.lunge .bfig{-webkit-filter:drop-shadow(0 0 8px #fff6a0) drop-shadow(-14px 0 6px rgba(255,255,255,.35));filter:drop-shadow(0 0 8px #fff6a0) drop-shadow(-14px 0 6px rgba(255,255,255,.35))}
/* 受擊：閃白＋往後擊退 */
.bu.sideA.hurt .bfig{-webkit-animation:kbA .32s ease-out;animation:kbA .32s ease-out}
.bu.sideB.hurt .bfig{-webkit-animation:kbB .32s ease-out;animation:kbB .32s ease-out}
.bu.sideA.hurt.crit .bfig{-webkit-animation:kbA2 .42s ease-out;animation:kbA2 .42s ease-out}
.bu.sideB.hurt.crit .bfig{-webkit-animation:kbB2 .42s ease-out;animation:kbB2 .42s ease-out}
@-webkit-keyframes kbA{0%{-webkit-filter:brightness(3) saturate(0)}25%{-webkit-transform:translateX(-12px);-webkit-filter:brightness(2.2) sepia(1) hue-rotate(-40deg) saturate(4)}55%{-webkit-transform:translateX(3px)}100%{-webkit-transform:none;-webkit-filter:none}}
@keyframes kbA{0%{filter:brightness(3) saturate(0)}25%{transform:translateX(-12px);filter:brightness(2.2) sepia(1) hue-rotate(-40deg) saturate(4)}55%{transform:translateX(3px)}100%{transform:none;filter:none}}
@-webkit-keyframes kbB{0%{-webkit-transform:scaleX(-1);-webkit-filter:brightness(3) saturate(0)}25%{-webkit-transform:scaleX(-1) translateX(-12px);-webkit-filter:brightness(2.2) sepia(1) hue-rotate(-40deg) saturate(4)}55%{-webkit-transform:scaleX(-1) translateX(3px)}100%{-webkit-transform:scaleX(-1);-webkit-filter:none}}
@keyframes kbB{0%{transform:scaleX(-1);filter:brightness(3) saturate(0)}25%{transform:scaleX(-1) translateX(-12px);filter:brightness(2.2) sepia(1) hue-rotate(-40deg) saturate(4)}55%{transform:scaleX(-1) translateX(3px)}100%{transform:scaleX(-1);filter:none}}
@-webkit-keyframes kbA2{0%{-webkit-filter:brightness(4) saturate(0)}20%{-webkit-transform:translate(-24px,-4px) rotate(-4deg)}40%{-webkit-transform:translate(6px,0)}60%{-webkit-transform:translate(-4px,0)}100%{-webkit-transform:none;-webkit-filter:none}}
@keyframes kbA2{0%{filter:brightness(4) saturate(0)}20%{transform:translate(-24px,-4px) rotate(-4deg)}40%{transform:translate(6px,0)}60%{transform:translate(-4px,0)}100%{transform:none;filter:none}}
@-webkit-keyframes kbB2{0%{-webkit-transform:scaleX(-1);-webkit-filter:brightness(4) saturate(0)}20%{-webkit-transform:scaleX(-1) translate(-24px,-4px) rotate(-4deg)}40%{-webkit-transform:scaleX(-1) translate(6px,0)}60%{-webkit-transform:scaleX(-1) translate(-4px,0)}100%{-webkit-transform:scaleX(-1);-webkit-filter:none}}

個大棋盤 攻擊位置 都要符合角色設定（包含主動 無雙等）雙方人物每個回合往前 但不能上下移動"}],phase:"web2-v10",tentative:true,conflicts:[]},{id:"v10.board.gap",cat:"戰鬥",item:"開戰時兩軍間隔 2 欄",spec:"—",current:"A 方站 0～2 欄、B 方站 5～7 欄，中間空 2 欄",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v10",tentative:true,conflicts:[]},{id:"v10.board.frontline",cat:"戰鬥",item:"不能越過敵方最前線",spec:"—",current:"往前時不能踏進「敵方最前面活人所在欄」或更後面的欄（避免兩軍穿過彼此）（只用於規則 v10 的舊戰鬥／重播；v11 取消，改為持續前進）",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v10",tentative:true,conflicts:[]},{id:"v10.board.stale",cat:"戰鬥",item:"僵局以血量比例判定",spec:"—",current:"沒人能再移動、且沒人打得到任何敵人（無雙只在怒氣滿 100 時算）時結束戰鬥：我方剩餘血量比例嚴格大於敵方才算勝（規則 v10；v11 改用 v11.board.stale）",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v10",tentative:true,conflicts:[]},{id:"v10.board.waitrage",cat:"戰鬥",item:"等待不加怒氣",spec:"—",current:"因為打不到而原地等待（wait）不給怒氣",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v10",tentative:true,conflicts:[]},{id:"v10.formation.fill",cat:"陣容",item:"換陣法時的換位順序",spec:"—",current:"依舊陣法格子順序把武將依序放進新陣法的格子（每個人都會跟著陣形換位）",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v10",tentative:true,conflicts:[]},{id:"jx.upgrade.slots",cat:"聚賢莊",item:"聚賢莊升級增加武將欄位",spec:"sn41",current:"聚賢莊可在「我的武將」分頁升級，升級後武將上限增加",grade:"B",label:"原版（當年攻略記載）",sources:[{s:"S1",q:"聚賢莊 (開放等級>>初期就開放) (任務需要在升) 功能:刷新武將 建築升級可以提升武將欄位+經驗池經驗上限+武將遣散返回經驗值"}],phase:"web2-v10",tentative:false,conflicts:[],note:"另有百科類簡介（newton，C～B）：「聚賢莊可以升級，而玩家能招募的武將的數量和聚賢莊的等級也有關係」。經驗池上限、遣散返還經驗兩項本作尚未做"},{id:"jx.upgrade.numbers",cat:"聚賢莊",item:"聚賢莊升級數字",spec:"—",current:"武將上限＝5＋(聚賢莊等級−1)；升級費用 500×目前等級² 銀幣；聚賢莊等級不能超過主角等級；只會變多，舊存檔武將不會被移除",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v10",tentative:true,conflicts:[]},{id:"v11.board.advance",cat:"戰鬥",item:"每回合雙方持續往前（規則 v11）",spec:"Tomas t23u",current:"每回合開始時雙方所有活著的單位往前一格；同一列對面的敵人死了也繼續往前，不再停在敵方最前線前面（取消 v10.board.frontline）；只會往前，不換列（v10.board.rowfixed 照舊）；攻擊範圍（普攻、主動、無雙）一律從自己當下所在的格子往前算",grade:"C",label:"推測（玩家回憶）",sources:[{s:"TOMAS",q:"小問題修正 / 過去遊戲是每回合雙方持續往前 如果同一排對面敵人死去 一樣一直往前 直到畫面頂部時會統一到第一排後方排隊 敵人與我方都是 / 就不會有時因技能範圍打不到人 卡在中間只能挨打"}],phase:"web2-v11",tentative:true,conflicts:[]},{id:"v11.board.wrap",cat:"戰鬥",item:"走到底回到我方第一排後方排隊",spec:"Tomas t23u",current:"往前走到棋盤盡頭（再走就出界）時，回到自己這一方第一排（目前最前面的我方單位那一欄）的後一欄，留在同一列；敵我雙方都一樣",grade:"C",label:"推測（玩家回憶）",sources:[{s:"TOMAS",q:"小問題修正 / 過去遊戲是每回合雙方持續往前 如果同一排對面敵人死去 一樣一直往前 直到畫面頂部時會統一到第一排後方排隊 敵人與我方都是 / 就不會有時因技能範圍打不到人 卡在中間只能挨打"}],phase:"web2-v11",tentative:true,conflicts:[],note:"「第一排後方」與「同一列」的細節見 v11.board.queue（D）。原話「統一到第一排後方排隊」也可能是指換到別列排隊，待 Tomas 確認"},{id:"v11.board.block",cat:"戰鬥",item:"持續前進時的擋路與卡住穿過",spec:"—",current:"前方那一格是隊友就停下（排隊跟著走）；是敵人就停下來打。卡住穿過：上一回合已經緊貼敵人停下、而且那一回合技能打不到人（等待），這回合前方仍是敵人時，從敵人身邊穿過去，走到同一列再往前第一個空格（到盡頭都沒有空格就回第一排後方排隊）",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v11",tentative:true,conflicts:[],note:"「卡住穿過」是為了做到 Tomas 說的「不會卡在中間只能挨打」而加的本作解讀，原版是否會穿過敵人不確定（實測：不加的話通天塔 90 層一般模型 12 場全部超時，敵人緊貼我方、我方技能打不到相鄰格）"},{id:"v11.board.queue",cat:"戰鬥",item:"走到底的排隊位置與順序",spec:"—",current:"排隊格＝我方其他活著單位裡最前面那一欄的後一欄（同一列）；那格有人就再往後一格，直到自己的底線；後面都滿了才找前面最近的空格；只剩自己一人時回到開場第一排那一欄（我方第 2 欄／敵方第 5 欄）；同一回合多人走到底時依行動順序排，後到的排在後面",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v11",tentative:true,conflicts:[]},{id:"v11.board.stale",cat:"戰鬥",item:"持續前進後的僵局判定",spec:"—",current:"連續 8 回合（走完一整排）雙方都沒有人受到傷害時結束戰鬥，以剩餘血量比例判定：我方比例嚴格大於敵方才算勝（v10 的「沒人走得動」條件在持續前進下不會成立）",grade:"D",label:"本作設計（暫定）",sources:[],phase:"web2-v11",tentative:true,conflicts:[]},{id:"web2.skill.rates",cat:"技能",item:"技能倍率基準",spec:"snA967 表 5：普攻、六等普攻、無雙",current:"61 名武將的 Lv1 普攻、Lv6 普攻與無雙基準採來源表；88 名中其餘未列者維持原本 D 級倍率。",grade:"B",label:"原版（當年攻略記載）",sources:[{s:"W967",q:"表 5：武將普攻、六等普攻與無雙倍率"}],phase:"web2-P3",tentative:false,conflicts:[]},{id:"web2.skill.activeCurve",cat:"技能",item:"普攻技能等級曲線",spec:"Lv1 a+5、Lv6 b+125；Lv6 後固定值每級 +50",current:"Lv1 倍率 a、Lv6 倍率 b；Lv1 固定值 +5、Lv5 +75、Lv6 +125、Lv7 起每級 +50。Lv2–5 倍率依 Lv1/Lv6 線性插值，Lv2–4 固定值依 Lv1/Lv5 線性插值，均為推估。",grade:"C",label:"推測（間接資料）",sources:[{s:"W967",q:"表 5：普攻與六等普攻基準"},{s:"W282",q:"小昭 tooltip 可見 Lv5 +75、Lv6 +125、Lv7 +175、Lv9 +275"}],phase:"web2-P3",
