    d.claimed[id] = true; d.act += q.act;
    var got = G.grant(q.reward); got.push('活躍度 +' + q.act);
    G.commit(); return ok({ got: got });
  };
  G.claimDailyChest = function (id) {
    var c = U.find(G.DAILY_CHEST, function (x) { return x.id === id; }); if (!c) return fail('寶箱不存在');
    var d = G.daily();
    if (d.chest[id]) return fail('今天已領取');
    if (d.act < c.need) return fail('活躍度不足（需要 ' + c.need + '）');
    d.chest[id] = true; var got = G.grant(c.reward); G.commit(); return ok({ got: got });
  };

  // ---------- 成就（多階段，每階只能領一次） ----------
  G.ACH = [
    { id: 'a_win', name: '百戰百勝', desc: '戰鬥勝利', tiers: [10, 100, 500, 2000], val: function (s) { return s.stats.wins || 0; } },
    { id: 'a_rec', name: '招賢納士', desc: '招募武將', tiers: [5, 30, 100], val: function (s) { return s.stats.recruits || 0; } },
    { id: 'a_codex', name: '群英譜', desc: '圖鑑收錄武將', tiers: [10, 30, 60], val: function () { return G.codexCount(); } },
    { id: 'a_lv', name: '一代宗師', desc: '主角等級', tiers: [20, 40, 60, 80], val: function () { return G.lead().lv; } },
    { id: 'a_stars', name: '星羅棋布', desc: '虛空之門累計星數', tiers: [30, 108, 216], val: function (s) { var n = 0; U.each(U.keys(s.stages), function (k) { n += s.stages[k].stars || 0; }); return n; } },
    { id: 'a_tower', name: '凌雲之志', desc: '通天塔最高層', tiers: [10, 30, 60, 100], val: function (s) { return s.tower.best; } },
    { id: 'a_wuji', name: '幻境行者', desc: '無極幻境全波次通關', tiers: [1, 10, 50], val: function (s) { return s.wuji.clears; } },
    { id: 'a_farm', name: '春耕秋收', desc: '農田收成', tiers: [10, 50, 200], val: function (s) { return s.counters.harvest || 0; } },
    { id: 'a_enh', name: '千錘百鍊', desc: '強化成功', tiers: [10, 50, 200], val: function (s) { return s.counters.enhance || 0; } },
    { id: 'a_sign', name: '持之以恆', desc: '累計簽到天數', tiers: [7, 30, 100], val: function (s) { return s.sign.total; } }
  ];
  G.ACH_GOLD = [20, 50, 100, 200];
  G.achState = function (a) {
    var s = st(), got = s.ach[a.id] || 0, v = a.val(s);
    return { tier: got, done: got >= a.tiers.length, need: a.tiers[Math.min(got, a.tiers.length - 1)], val: v, can: got < a.tiers.length && v >= a.tiers[got], gold: G.ACH_GOLD[Math.min(got, 3)] };
  };
  G.claimAch = function (id) {
    var a = U.find(G.ACH, function (x) { return x.id === id; }); if (!a) return fail('成就不存在');
    var x = G.achState(a);
    if (x.done) return fail('已全部完成');
    if (!x.can) return fail('尚未達成（' + x.val + '/' + x.need + '）');
    st().ach[id] = x.tier + 1;
    var got = G.grant({ gold: x.gold }); G.log('達成成就「' + a.name + '」第 ' + (x.tier + 1) + ' 階', 'sys');
    G.commit(); return ok({ got: got });
  };
  G.achPending = function () { return U.filter(G.ACH, function (a) { return G.achState(a).can; }).length; };

  // ---------- 簽到（每月；累計 7/14/21/28 天另有獎勵） ----------
  function monthKey(t) { var d = new Date(t || now()); return d.getFullYear() + '-' + (d.getMonth() + 1); }
  G.SIGN_REWARD = [{ silver: 1000 }, { items: [{ item: 'jinglitang', n: 1 }] }, { silver: 1500 }, { items: [{ item: 'peiyangdan', n: 2 }] }, { items: [{ item: 'jinengshu', n: 1 }] }, { silver: 2000 }, { gold: 20 }];
  G.SIGN_BONUS = { 7: { gold: 30 }, 14: { items: [{ item: 'shenjishu', n: 1 }] }, 21: { gold: 50, items: [{ item: 'xilianshi', n: 3 }] }, 28: { gold: 100, items: [{ item: 'seed_soul', n: 2 }] } };
  G.signState = function () {
    var s = st(), m = monthKey();
    if (s.sign.month !== m) { s.sign.month = m; s.sign.days = []; s.sign.bonus = {}; }
    var today = new Date(now()).getDate(), d = new Date(now());
    var dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    var signed = hasDay(s.sign.days, today);
    return { today: today, daysInMonth: dim, count: s.sign.days.length, signedToday: signed, days: s.sign.days, canMakeup: signed && s.sign.days.length < today, bonus: s.sign.bonus };
  };
  function hasDay(arr, d) { for (var i = 0; i < arr.length; i++) if (arr[i] === d) return true; return false; }
  G.sign = function () {
    var x = G.signState(), s = st();
    if (hasDay(s.sign.days, x.today)) return fail('今天已簽到');
    var rw = G.SIGN_REWARD[x.count % G.SIGN_REWARD.length];
    s.sign.days.push(x.today); s.sign.total++;

    var got = G.grant(rw); G.commit(); return ok({ got: got, n: x.count + 1 });
  };
  G.SIGN_MAKEUP_GOLD = 10;
  G.signMakeup = function () {
    var x = G.signState(), s = st();
    if (!hasDay(s.sign.days, x.today)) return fail('請先完成今天的簽到');
    var miss = 0; for (var d = 1; d <= x.today; d++) if (!hasDay(s.sign.days, d)) { miss = d; break; }
    if (!miss) return fail('本月沒有漏簽的日子');
    if (s.player.gold < G.SIGN_MAKEUP_GOLD) return fail('金幣不足（補簽需要 ' + G.SIGN_MAKEUP_GOLD + ' 金）');
    s.player.gold -= G.SIGN_MAKEUP_GOLD;
    var rw = G.SIGN_REWARD[x.count % G.SIGN_REWARD.length];
    s.sign.days.push(miss); s.sign.total++;
    var got = G.grant(rw); G.commit(); return ok({ got: got, day: miss });
  };
  G.claimSignBonus = function (n) {
    n = +n; var x = G.signState(), s = st();
    if (!G.SIGN_BONUS[n]) return fail('沒有這個獎勵');
    if (s.sign.bonus[n]) return fail('已領取');
    if (x.count < n) return fail('本月累計簽到 ' + n + ' 天才能領取');
    s.sign.bonus[n] = true; var got = G.grant(G.SIGN_BONUS[n]); G.commit(); return ok({ got: got });
  };

  // ---------- 農田（真實時間；以時間戳計算，關閉遊戲後仍會成長） ----------

    seed_yin: { hours: 4, kind: 'silver' },
    seed_exp: { hours: 6, kind: 'exp' },
    seed_gem: { hours: 8, kind: 'gem' },
    seed_soul: { hours: 12, kind: 'soul' }
  };
  G.farmLv = function () { return st().buildings.farm || 1; };
  G.farmPlots = function () { return Math.min(9, 3 + Math.floor(G.farmLv() / 3)); };
  G.farmDur = function (seed) {
    var h = G.SEEDS[seed].hours, cut = Math.min(0.3, 0.02 * (G.farmLv() - 1));
    return Math.floor(h * 3600000 * (1 - cut) / G.econ().farm);
  };
  function plot(i) { var s = st(); return s.farm.plots[i] || null; }
  G.plotState = function (i) {
    var p = plot(i); if (!p) return { empty: true };

  };
  G.plant = function (i, seed) {
    i = +i; var s = st();
    if (!(i >= 0 && i < G.farmPlots())) return fail('這塊田尚未開墾（農田升級可開墾更多）');
    if (plot(i)) return fail('這塊田已經種了作物');
    if (!G.SEEDS[seed]) return fail('這不是種子');
    if (have(seed) < 1) return fail('沒有' + G.itemName(seed));
    take(seed, 1);
    s.farm.plots[i] = { seed: seed, ts: now(), dur: G.farmDur(seed), fert: false };
    G.commit(); return ok();
  };
  G.fertilize = function (i) {
    i = +i; var p = plot(i), x = G.plotState(i);

    if (p.fert) return fail('這一季已經施過肥了');
    if (have('huafei') < 1) return fail('沒有化肥');

    var el = Math.max(0, now() - p.ts); p.dur = el + Math.ceil((p.dur - el) / 2); p.fert = true;
    G.commit(); return ok();
  };
  G.harvestYield = function (seed) {
    var lv = G.lead().lv, k = 1 + 0.05 * (G.farmLv() - 1);
    switch (G.SEEDS[seed].kind) {
      case 'silver': return { silver: Math.floor((1500 + lv * 120) * k) };
      case 'exp': return { exp: Math.floor((300 + lv * 40) * k) };
      case 'gem': return { gem: 1 + (G.farmLv() >= 10 ? 1 : 0) };
      default: return { soul: 3 + Math.floor(G.farmLv() / 10) };
    }
  };
  G.harvest = function (i, rng) {
    i = +i; var s = st(), p = plot(i), x = G.plotState(i);
    if (!p) return fail('這塊田沒有作物');
    if (!x.ready) return fail('作物尚未成熟（還要 ' + U.dur(x.left) + '）');
    rng = rng || Math.random;
    var y = G.harvestYield(p.seed), got = [];
    s.farm.plots[i] = null; // 先清空，避免重複收成
    if (y.silver) got = got.concat(G.grant({ silver: y.silver }));
    if (y.exp) { var L = G.lead(), b = L.lv; G.addExp(L, y.exp); got.push('主角經驗 +' + y.exp + (L.lv > b ? '（升到 ' + L.lv + ' 級）' : '')); }
    if (y.gem) { var gk = 'gem_' + GEMK[Math.floor(rng() * 6)] + '_' + y.gem; got = got.concat(G.grant({ items: [{ item: gk, n: 1 }] })); }
    if (y.soul) {
      var pool = U.filter(s.heroes, function (h) { return h.id !== 'lead'; });
      var id = pool.length ? pool[Math.floor(rng() * pool.length)].id : MJ.D.heroes[Math.floor(rng() * MJ.D.heroes.length)].id;
      got = got.concat(G.grant({ items: [{ item: 'soul:' + id, n: y.soul }] }));
    }
    G.bump('harvest');
    G.commit(); return ok({ got: got });
  };
  G.harvestAll = function (rng) {
    var got = [], n = 0;
    for (var i = 0; i < G.farmPlots(); i++) if (G.plotState(i).ready) { var r = G.harvest(i, rng); if (r.ok) { n++; got = got.concat(r.got); } }
    if (!n) return fail('沒有成熟的作物');

  };

  // ---------- 敵軍產生（通天塔、無極幻境共用） ----------
  function chapterOf(i) { var cs = MJ.D.stages.chapters; return cs[((i % cs.length) + cs.length) % cs.length]; }
  function cellsFor(n, r) {
    var pref = [[1, 4, 7], [0, 4, 8, 1, 7], [0, 3, 6, 4, 1, 7], [3, 0, 6, 4, 2, 8, 5]][Math.floor(r * 4)];
    var all = [0, 3, 6, 1, 4, 7, 2, 5, 8], out = [];
    U.each(pref.concat(all), function (c) { if (out.length < n && out.indexOf(c) < 0) out.push(c); });
    return out;
  }
  G.makeFoes = function (o) { // o: {ch, count, lv, kind, seed, depth}
    var rng = U.rng(o.seed || 1), ch = o.ch, en = [];
    var cells = cellsFor(o.count, rng());
    if (o.kind !== 'normal') {
      en.push({ e: o.kind === 'elite' ? ch.elite[Math.floor(rng() * 2)] : ch.boss, cell: 4, lv: o.lv + 1, leader: 1 });
      cells = U.filter(cells, function (c) { return c !== 4; }).slice(0, o.count - 1);
    }
    U.each(cells, function (c) { en.push({ e: ch.pool[Math.floor(rng() * ch.pool.length)], cell: c, lv: o.lv }); });
    return { kind: o.kind, enemies: en, depth: o.depth || 0 };
  };

  // ---------- 通天塔 ----------
  G.TOWER_MAX = 100;
  G.towerFloor = function (f) {
    var kind = f % 10 === 0 ? 'boss' : (f % 5 === 0 ? 'elite' : 'normal');
    var ch = chapterOf(Math.floor((f - 1) / 10));
    var sg = G.makeFoes({ ch: ch, count: Math.min(9, 3 + Math.floor(f / 8)), lv: Math.min(R.maxLevel, 18 + Math.round(f * 0.62)), kind: kind, seed: f * 7919, depth: Math.floor(f / 20) + 3 });
    sg.id = 'tw' + f; sg.name = '通天塔．第 ' + f + ' 層'; sg.floor = f; sg.bg = ch.bg; sg.chName = ch.name;
    var rw = { silver: 500 + f * 80, items: [{ item: f % 2 ? 'peiyangdan' : 'jinengshu', n: 1 + Math.floor(f / 25) }] };
    if (f % 5 === 0) rw.items.push({ item: 'gem_' + GEMK[(f / 5) % 6] + '_' + Math.min(5, 1 + Math.floor(f / 20)), n: 1 });
    if (f % 10 === 0) { rw.gold = 20 + f / 2; rw.items.push({ item: 'xf_' + XF[(f / 10) % XF.length], n: 1 }); }
    if (f % 25 === 0) rw.items.push({ item: 'shenjishu', n: 1 });
    sg.first = rw; sg.xinghun = 5 + Math.floor(f / 10) * 2; sg.exp = 20 + f * 10;
    return sg;
  };
  G.towerFight = function (seed) {
    var s = st(), lead = G.lead(), cfg = C().buildings.tongtian;
    if (lead.lv < cfg.open) return fail('通天塔需要主角 ' + cfg.open + ' 級');
    if (s.tower.best >= G.TOWER_MAX) return fail('已登上塔頂');
    if (!G.teamCount()) return fail('沒有出戰武將');

    seed = seed || seedOf();
    var team = G.buildTeam(), foes = G.buildEnemy(sg);
    var res = MJ.Battle.run(team, foes, { seed: seed, maxRounds: C().maxRounds, levelSuppression: C().levelSuppression });
    s.stats.battles++; G.bump('towerTry');
    var out = { mode: 'tower', win: res.win, battle: res, stage: sg, team: team, foes: foes, rewards: [], levelUps: [], seed: seed, energyCost: 0 };
    if (res.win) {
      s.stats.wins++;
      if (f > s.tower.best) { // 只有首次登上新的一層才給獎勵（不重複）
        s.tower.best = f;
        out.rewards = G.grant(sg.first);
        s.player.xinghun = (s.player.xinghun || 0) + sg.xinghun; out.rewards.push('星魂 +' + sg.xinghun);
        U.each(G.teamList(), function (x) { var b = x.hero.lv; G.addExp(x.hero, sg.exp); if (x.hero.lv > b) out.levelUps.push(G.nameOf(x.hero) + ' Lv' + b + '→' + x.hero.lv); });
        out.exp = sg.exp;
      }
      G.log('登上通天塔第 ' + f + ' 層', 'battle');
    } else G.log('通天塔第 ' + f + ' 層挑戰失敗', 'battle');
    G.commit(); return ok(out);
  };
  G.towerSweepReward = function () {
    var b = st().tower.best;
    return { silver: Math.floor(b * 150 * G.econ().reward), items: b >= 10 ? [{ item: 'peiyangdan', n: Math.floor(b / 10) }] : [] };
  };
  G.towerSweep = function () {
    var s = st();
    if (s.tower.best < 1) return fail('至少要通過第 1 層才能領取每日塔俸');
    if (s.tower.sweepDay === U.dayKey()) return fail('今天已領取，明天再來');
    s.tower.sweepDay = U.dayKey();
    var got = G.grant(G.towerSweepReward()); G.commit(); return ok({ got: got });
  };

  // ---------- 無極幻境（連續波次，血量與怒氣延續） ----------
  G.WUJI = [
    { id: 'w1', name: '初窺之境', open: 12, lv: 14, waves: 3, daily: 2, chs: [1, 2], bonus: { items: [{ item: 'jinengshu', n: 2 }, { item: 'peiyangdan', n: 2 }] }, first: { gold: 50 } },
    { id: 'w2', name: '登堂之境', open: 25, lv: 30, waves: 5, daily: 2, chs: [3, 4], bonus: { items: [{ item: 'jinengshu', n: 3 }, { item: 'xinfacanye', n: 2 }, { item: 'gem_atk_2', n: 1 }] }, first: { gold: 100, items: [{ item: 'shenjishu', n: 1 }] } },
    { id: 'w3', name: '化境', open: 42, lv: 44, waves: 7, daily: 2, chs: [5, 6, 7], bonus: { items: [{ item: 'shenjishu', n: 1 }, { item: 'xinfacanye', n: 3 }, { item: 'gem_hp_3', n: 1 }] }, first: { gold: 200, items: [{ item: 'seed_soul', n: 2 }] } }
  ];
  G.wujiTier = function (id) { return U.find(G.WUJI, function (t) { return t.id === id; }); };
  G.wujiLeft = function (id) { var t = G.wujiTier(id), d = G.daily(); return t ? t.daily - (d.wuji[id] || 0) : 0; };
  G.wujiWave = function (t, w, seed) {
    var last = w === t.waves - 1, ch = chapterOf(t.chs[w % t.chs.length] - 1);
    var sg = G.makeFoes({ ch: ch, count: Math.min(9, 3 + w), lv: t.lv + w, kind: last ? 'boss' : (w === Math.floor(t.waves / 2) ? 'elite' : 'normal'), seed: seed + w * 101, depth: t.lv >= 40 ? 5 : 0 });
    sg.name = t.name + '．第 ' + (w + 1) + '/' + t.waves + ' 波'; sg.bg = ch.bg; sg.id = t.id;
    sg.silver = Math.floor((200 + (t.lv + w * 2) * 25) * G.econ().reward); sg.exp = (t.lv + w * 2) * 8; // 獎勵沿用原本曲線
    return sg;
  };
  G.wujiRun = function (id, seed) {
    var s = st(), t = G.wujiTier(id); if (!t) return fail('沒有這個幻境');
    if (G.lead().lv < t.open) return fail(t.name + '需要主角 ' + t.open + ' 級');
    if (G.wujiLeft(id) <= 0) return fail('今天的挑戰次數已用完（每日 ' + t.daily + ' 次）');
    if (!G.teamCount()) return fail('沒有出戰武將');
    seed = seed || seedOf();
    G.daily().wuji[id] = (G.daily().wuji[id] || 0) + 1; G.bump('wujiTry');
    var team = G.buildTeam(), waves = [], silver = 0, exp = 0, cleared = 0;
    for (var w = 0; w < t.waves; w++) {
      var sg = G.wujiWave(t, w, seed), foes = G.buildEnemy(sg);
      var cur = U.map(team, function (x) { return { cell: x.cell, unit: x.unit }; });
      var res = MJ.Battle.run(cur, foes, { seed: (seed + w * 977) >>> 0, maxRounds: C().maxRounds, levelSuppression: C().levelSuppression });
      s.stats.battles++;
      waves.push({ battle: res, team: cur, foes: foes, stage: sg, win: res.win });
      if (!res.win) break;
      s.stats.wins++; cleared++; silver += sg.silver; exp += sg.exp;
      // 下一波：存活者帶著剩餘生命與怒氣
      var next = [];
      U.each(res.units, function (u) {
        if (u.side !== 'A' || u.hp <= 0) return;
        var src = U.find(cur, function (x) { return x.cell === u.cell; });
        var nu = U.extend({}, src.unit); nu.curHp = u.hp; nu.curRage = u.rage;
        next.push({ cell: u.cell, unit: nu });
      });
      team = next;
    }
    var full = cleared === t.waves, out = { mode: 'wuji', tier: t, waves: waves, cleared: cleared, full: full, rewards: [], levelUps: [], firstRewards: null };
    if (silver) out.rewards = out.rewards.concat(G.grant({ silver: silver }));
    if (exp) {
      U.each(G.teamList(), function (x) { var b = x.hero.lv; G.addExp(x.hero, exp); if (x.hero.lv > b) out.levelUps.push(G.nameOf(x.hero) + ' Lv' + b + '→' + x.hero.lv); });
      out.exp = exp;
    }
    if (full) {
      s.wuji.clears++;
      out.rewards = out.rewards.concat(G.grant(t.bonus));
      if (!s.wuji.first[id]) { s.wuji.first[id] = true; out.firstRewards = G.grant(t.first); }
    }
    G.log(t.name + '：通過 ' + cleared + '/' + t.waves + ' 波' + (full ? '（全破）' : ''), 'battle');
    G.commit(); return ok(out);
  };

  // ---------- 任務條件擴充 ----------
  var oldDone = G.taskDone;
  G.taskDone = function (t) {
    var c = t.cond, s = st();
    if (c.harvest) return (s.counters.harvest || 0) >= c.harvest;
    if (c.wuji) return s.wuji.clears >= c.wuji;
    return oldDone(t);
  };
})(MJ.G);

</script>
<script>/* js/sys4.js */
/* 第四階段（選做）：拜訪武將（名將切磋．單機 AI 競技場）＋戰報重播
   原作「拜訪武將」為社群玩法（拜訪好友的武將），單機版改為挑戰 30 支 AI 名將隊伍的排名賽。
   規則、對手陣容、獎勵全部為 D 級（自訂）。 */
(function (G) {
  var U = MJ.U, R = MJ.R;
  function C() { return MJ.D.config; }
  function st() { return MJ.S.state; }
  function ok(o) { o = o || {}; o.ok = true; return o; }
  function fail(msg) { return { ok: false, msg: msg }; }
  function def(o, k, v) { if (o[k] == null) o[k] = v; return o[k]; }
  G.ARENA_N = 30; G.ARENA_TRIES = 5; G.ARENA_RECS = 6; G.ARENA_OPEN = 8;
  MJ.S.extraDefaults = MJ.S.extraDefaults || [];
  MJ.S.extraDefaults.push(function (s) {
    def(s, 'arena', {});
    def(s.arena, 'rank', G.ARENA_N + 1); def(s.arena, 'best', G.ARENA_N + 1);
    def(s.arena, 'day', ''); def(s.arena, 'tries', G.ARENA_TRIES); def(s.arena, 'rewardDay', ''); def(s.arena, 'recs', []);
    def(s.arena, 'wins', 0);
    if (s.settings) { def(s.settings, 'bgm', true); def(s.settings, 'sfx', true); }
  });
  var TITLES = ['天下無雙', '一代宗師', '萬人敵', '絕世名將', '武林盟主', '江湖霸主', '沙場宿將', '少年英雄', '人中龍鳳', '蓋世豪傑'];
  // 對手：依排名決定等級、人數、品質與裝備（排名越前越強）
  G.arenaFoe = function (rank) {
    var rng = U.rng(rank * 7717 + 13), N = G.ARENA_N, t = (N - rank) / (N - 1); // 0（第 30 名）～1（第 1 名）
    var lv = Math.max(1, Math.min(R.maxLevel, Math.round(8 + t * 72)));
    var count = R.teamSlots(lv);
    // 對手養成程度介於「弱勢」與「一般」玩家之間（見 tools/balance.js）
    var qMin = lv < 15 ? 1 : (lv < 35 ? 2 : 3), qMax = lv < 15 ? 2 : 3, tops = lv >= 60 ? 2 : (lv >= 45 ? 1 : 0);
    var all = MJ.D.heroes.list || MJ.D.heroes;
    var pool = U.filter(all, function (h) { return h.quality >= qMin && h.quality <= qMax; });
    var top = U.filter(all, function (h) { return h.quality === 4; });
    var picks = [], used = {};
    function take(list) { for (var g = 0; g < 50; g++) { var h = list[Math.floor(rng() * list.length)]; if (!used[h.id]) { used[h.id] = 1; picks.push(h); return; } } }
    for (var k0 = 0; k0 < tops; k0++) take(top);
    while (picks.length < count) take(pool);
    picks.sort(function (a, b) { return b.quality - a.quality; });
    var cap = picks[0], plus = Math.floor(lv / 8), eqQ = lv < 25 ? 0 : (lv < 50 ? 1 : 2), skl = Math.min(9, 1 + Math.floor(lv / 8));
    var heroes = U.map(picks, function (d, i) {
      var h = { uid: -(i + 1), id: d.id, lv: lv, exp: 0, eq: {}, sk: { a: skl, u: skl, p: skl }, py: { str: 0, int: 0, agi: 0, con: 0 }, xf: [], star: 0 };
      var dt = R.dtypeOf(d.type);
      U.each(R.SLOTS, function (slot) {
        var best = null;
        U.each(MJ.D.equipment.list, function (e) {
          if (e.slot !== slot || e.lv > lv) return;
          if (slot === 'weapon' && e.id.charAt(1) !== { p: 'p', m: 'm', j: 'j' }[dt]) return;
          if (!best || e.lv > best.lv) best = e;
        });
        if (best) h.eq[slot] = { uid: -100 - i, t: best.id, q: eqQ, plus: plus, aff: [], gems: [] };
      });
      return h;
    });
    // 隊伍編制：前排放耐打的（耐力型），後排放其他
    var cellsFront = [1, 4, 7, 0, 3, 6, 2, 5, 8];
    var order = heroes.slice().sort(function (a, b) { var da = MJ.D.heroIndex[a.id], db = MJ.D.heroIndex[b.id]; return (db.type.indexOf('耐') >= 0) - (da.type.indexOf('耐') >= 0); });
    var fake = { player: { name: cap.name }, codex: {}, jiangxing: { lit: Math.max(0, Math.floor((lv - 16) * 0.5)) }, team: { formation: '' } };
    var n = Math.floor(3 + lv * 0.6); for (var k = 0; k < n; k++) fake.codex['x' + k] = 1;
    var foes = U.map(order, function (h, i) { var u = R.heroUnit(h, fake); return { cell: cellsFront[i], unit: u }; });
    var power = 0; U.each(order, function (h) { power += R.power(h, fake); });
    return { rank: rank, name: cap.name + '軍', title: TITLES[rank % TITLES.length], lv: lv, count: count, cap: cap, foes: foes, power: power };
  };
  G.myPower = function () { var s = st(), p = 0; U.each(G.teamList(), function (x) { p += R.power(x.hero, s); }); return p; };
  G.arenaState = function () {
    var a = st().arena, d = U.dayKey(U.now());
    if (a.day !== d) { a.day = d; a.tries = G.ARENA_TRIES; }
    return a;
  };
  // 可挑戰的對手：自己前面 5 名（未上榜時為第 30～26 名）
  G.arenaList = function () {
    var a = G.arenaState(), out = [];
    for (var r = a.rank - 1; r >= Math.max(1, a.rank - 5); r--) out.push(r);
    return out;
  };
  G.arenaWinReward = function (target) { return { silver: 300 + (G.ARENA_N + 1 - target) * 60 }; };
  G.arenaDailyReward = function (rank) {
    if (rank > G.ARENA_N) return null;
    var rw = { silver: 1000 + (G.ARENA_N + 1 - rank) * 200, xinghun: Math.max(1, Math.ceil((G.ARENA_N + 1 - rank) / 3)) };
    if (rank <= 10) rw.gold = 11 - rank + 5;
    return rw;
  };
  function snap(team) { return JSON.parse(JSON.stringify(team)); }
  G.arenaFight = function (target, seed) {
    var s = st(), a = G.arenaState(), lead = G.lead();
    if (lead.lv < G.ARENA_OPEN) return fail('拜訪武將需要主角 ' + G.ARENA_OPEN + ' 級');
    if (!G.teamCount()) return fail('沒有出戰武將');
    if (a.tries <= 0) return fail('今天的挑戰次數已用完（每天 ' + G.ARENA_TRIES + ' 次）');
    target = +target;
    if (G.arenaList().indexOf(target) < 0) return fail('只能挑戰排名在你前面 5 名以內的對手');
    seed = seed || (((U.now() ^ ((s.stats.battles + 11) * 2654435761)) >>> 0) || 1);
    var foe = G.arenaFoe(target), team = G.buildTeam();
    var tSnap = snap(team), fSnap = snap(foe.foes);
    var res = MJ.Battle.run(team, foe.foes, { seed: seed, maxRounds: C().maxRounds, levelSuppression: C().levelSuppression });
    a.tries--; s.stats.battles++;
    var before = a.rank, rewards = [];
    if (res.win) {
      s.stats.wins++; a.wins++;
      if (target < a.rank) a.rank = target;
      var silver = G.arenaWinReward(target).silver;
      rewards = G.grant({ silver: silver });
      if (a.rank < a.best) { // 首次達到更高排名：一次性金幣（不重複）
        var gold = (Math.min(a.best, G.ARENA_N + 1) - a.rank) * 2;
        a.best = a.rank; rewards = rewards.concat(G.grant({ gold: gold }));
      }
      G.log('拜訪武將：擊敗第 ' + target + ' 名「' + foe.name + '」，排名 ' + (before > G.ARENA_N ? '未上榜' : before) + ' → ' + a.rank, 'battle');
    } else G.log('拜訪武將：挑戰第 ' + target + ' 名「' + foe.name + '」失敗', 'battle');
    if (G.bump) G.bump('arena');
    var rec = { ts: U.now(), target: target, name: foe.name, win: res.win, seed: seed, before: before, after: a.rank, team: tSnap, foes: fSnap, rounds: res.rounds };
    a.recs.unshift(rec); if (a.recs.length > G.ARENA_RECS) a.recs.length = G.ARENA_RECS;
    G.commit();
    var sg = { id: 'arena' + target, name: '拜訪武將．' + foe.name, kind: 'boss', bg: MJ.D.stages.chapters[(target) % MJ.D.stages.chapters.length].bg };
    return ok({ mode: 'arena', win: res.win, battle: res, stage: sg, team: team, foes: foe.foes, rewards: rewards, levelUps: [], energyCost: 0, foe: foe, before: before, after: a.rank, seed: seed });
  };
  // 重播：以存下的雙方陣容快照與亂數種子重新模擬（結果與當時完全相同）
  G.arenaReplay = function (i) {
    var a = st().arena, rec = a.recs[+i];
    if (!rec) return fail('找不到這場戰報');
    var res = MJ.Battle.run(snap(rec.team), snap(rec.foes), { seed: rec.seed, maxRounds: C().maxRounds, levelSuppression: C().levelSuppression });
    var sg = { id: 'arena' + rec.target, name: '重播．' + rec.name, kind: 'boss', bg: MJ.D.stages.chapters[rec.target % MJ.D.stages.chapters.length].bg };
    return ok({ mode: 'arena', replay: true, win: res.win, consistent: res.win === rec.win && res.rounds === rec.rounds, battle: res, stage: sg, team: snap(rec.team), foes: snap(rec.foes), rewards: [], levelUps: [], energyCost: 0, before: rec.before, after: rec.after, rec: rec });
  };
  G.arenaClaimDaily = function () {
    var a = G.arenaState(), d = U.dayKey(U.now());
    if (a.rank > G.ARENA_N) return fail('尚未上榜，先擊敗任一位對手');
    if (a.rewardDay === d) return fail('今天已領取排名獎勵');
    a.rewardDay = d;
    var rw = G.arenaDailyReward(a.rank), got = G.grant(rw);
    st().player.xinghun = (st().player.xinghun || 0) + rw.xinghun; got.push('星魂 +' + rw.xinghun);
    G.commit(); return ok({ got: got });
  };
})(MJ.G);

</script>
<script>/* js/sys5.js */
/* 加碼玩法（原創，全部 D 級）：華容道（滑塊解謎）、觀星台（每日觀星運勢）、玄機盤（轉盤）
   華容道使用的是公有領域的傳統益智遊戲規則與經典「橫刀立馬」布局；其餘關卡布局由本作以程式搜尋產生並驗證可解。 */
(function (G) {
  var U = MJ.U;
  function st() { return MJ.S.state; }
  function ok(o) { o = o || {}; o.ok = true; return o; }
  function fail(msg) { return { ok: false, msg: msg }; }
  function def(o, k, v) { if (o[k] == null) o[k] = v; return o[k]; }
  function today() { return U.dayKey(); }
  function rnd(rng) { return rng ? rng() : Math.random(); }
  function lvl() { return G.lead().lv; }
  G.QIYU_OPEN = 5;

  MJ.S.extraDefaults = MJ.S.extraDefaults || [];
  MJ.S.extraDefaults.push(function (s) {
    def(s, 'qiyu', {});
    var q = s.qiyu;
    def(q, 'hrd', {}); def(q.hrd, 'lv', 0); def(q.hrd, 'cur', null); def(q.hrd, 'moves', 0); def(q.hrd, 'hist', []); def(q.hrd, 'best', {}); def(q.hrd, 'day', ''); def(q.hrd, 'solves', 0);
    def(q, 'star', {}); def(q.star, 'day', ''); def(q.star, 'draws', 0); def(q.star, 'luck', null); def(q.star, 'last', null); def(q.star, 'total', 0);
    def(q, 'wheel', {}); def(q.wheel, 'day', ''); def(q.wheel, 'free', 0); def(q.wheel, 'pity', 0); def(q.wheel, 'spins', 0); def(q.wheel, 'last', null);
  });
  function Q() { return st().qiyu; }
  G.qiyuOpen = function () { return lvl() >= G.QIYU_OPEN; };

  // =================== 華容道 ===================
  // 棋盤 4 欄 × 5 列；C＝曹操 2×2、H＝關羽 1×2（橫）、V＝直立武將 2×1、S＝兵 1×1。曹操移到底部中央（第 4 列第 2 欄起）即從出口脫身。
  G.HRD_SIZE = { C: [2, 2], H: [1, 2], V: [2, 1], S: [1, 1] };
  G.HRD_NAMES = { C: ['曹操'], H: ['關羽'], V: ['張飛', '趙雲', '馬超', '黃忠'], S: ['兵', '兵', '兵', '兵'] };
  // min：以 tools/hrd-solve.js 廣度優先搜尋算出的最少「格步」（每移動一格算一步）
  G.HRD = [
    { id: 'h1', name: '初出許都', min: 12, p: [['V', 0, 3], ['C', 2, 0], ['V', 0, 2], ['V', 0, 1], ['H', 3, 2], ['V', 0, 0], ['S', 2, 2], ['S', 4, 0], ['S', 4, 2], ['S', 2, 3]] },
    { id: 'h2', name: '曹營夜走', min: 30, p: [['V', 0, 1], ['C', 2, 2], ['V', 2, 1], ['V', 0, 0], ['H', 4, 2], ['V', 2, 0], ['S', 1, 3], ['S', 4, 0], ['S', 4, 1], ['S', 0, 3]] },
    { id: 'h3', name: '雲長截道', min: 50, p: [['V', 1, 1], ['C', 0, 2], ['V', 3, 1], ['V', 1, 0], ['H', 2, 2], ['V', 3, 0], ['S', 0, 0], ['S', 3, 2], ['S', 3, 3], ['S', 0, 1]] },
    { id: 'h4', name: '狹路相逢', min: 70, p: [['V', 1, 0], ['C', 0, 2], ['V', 2, 1], ['V', 3, 0], ['H', 3, 2], ['V', 0, 1], ['S', 0, 0], ['S', 4, 1], ['S', 2, 3], ['S', 4, 3]] },
    { id: 'h5', name: '兵臨絕境', min: 90, p: [['V', 0, 1], ['C', 0, 2], ['V', 3, 3], ['V', 1, 0], ['H', 2, 2], ['V', 3, 1], ['S', 3, 0], ['S', 3, 2], ['S', 4, 0], ['S', 4, 2]] },
    { id: 'h6', name: '橫刀立馬', min: 116, p: [['V', 0, 0], ['C', 0, 1], ['V', 0, 3], ['V', 2, 0], ['H', 2, 1], ['V', 2, 3], ['S', 3, 1], ['S', 3, 2], ['S', 4, 0], ['S', 4, 3]] }
  ];
  G.hrdFirstReward = function (i) { return { gold: 10 + i * 10, items: [{ item: 'jinengshu', n: 1 + i }, { item: 'peiyangdan', n: 2 + i * 2 }] }; };
  G.hrdDailyReward = function () { return { silver: 300 * lvl(), items: [{ item: 'jinglitang', n: 1 }] }; };
  function boardOf(i) {
    var cnt = {};
    return U.map(G.HRD[i].p, function (x) { var k = x[0]; cnt[k] = (cnt[k] || 0); var n = G.HRD_NAMES[k][cnt[k]++] || ''; return { t: k, r: x[1], c: x[2], n: n }; });
  }
  G.hrdGrid = function (b) {
    var g = []; for (var i = 0; i < 20; i++) g.push(-1);
    U.each(b, function (p, i) { var z = G.HRD_SIZE[p.t]; for (var r = 0; r < z[0]; r++) for (var c = 0; c < z[1]; c++) g[(p.r + r) * 4 + p.c + c] = i; });
    return g;
  };
  G.hrdUnlocked = function (i) { var h = Q().hrd; return i === 0 || !!h.best[G.HRD[i - 1].id]; };
  G.hrd = function () { var h = Q().hrd; if (!h.cur) { h.cur = boardOf(h.lv); h.moves = 0; h.hist = []; } return h; };
  G.hrdStart = function (i) {
    if (!G.qiyuOpen()) return fail('主角 ' + G.QIYU_OPEN + ' 級開放');
    if (!G.HRD[i]) return fail('沒有這個布局');
    if (!G.hrdUnlocked(i)) return fail('先破解上一關「' + G.HRD[i - 1].name + '」');
    var h = Q().hrd; h.lv = i; h.cur = boardOf(i); h.moves = 0; h.hist = []; G.commit(); return ok();
  };
  G.hrdCanMove = function (pi, dr, dc) {
    var h = G.hrd(), b = h.cur, p = b[pi]; if (!p) return false;
    var z = G.HRD_SIZE[p.t], nr = p.r + dr, nc = p.c + dc;
    if (nr < 0 || nc < 0 || nr + z[0] > 5 || nc + z[1] > 4) return false;
    var g = G.hrdGrid(b);
    for (var r = 0; r < z[0]; r++) for (var c = 0; c < z[1]; c++) { var v = g[(nr + r) * 4 + nc + c]; if (v !== -1 && v !== pi) return false; }
    return true;
  };
  G.hrdSolved = function (b) { return !!U.find(b || G.hrd().cur, function (p) { return p.t === 'C' && p.r === 3 && p.c === 1; }); };
  G.hrdMove = function (pi, dr, dc) {
    if (!G.qiyuOpen()) return fail('主角 ' + G.QIYU_OPEN + ' 級開放');
    if (Math.abs(dr) + Math.abs(dc) !== 1) return fail('一次只能移動一格');
    var h = G.hrd();
    if (G.hrdSolved(h.cur)) return fail('已經破解，請重來或挑戰下一關');
    if (!G.hrdCanMove(pi, dr, dc)) return fail('那裡被擋住了');
    var p = h.cur[pi]; h.hist.push([pi, p.r, p.c]); if (h.hist.length > 300) h.hist.shift();
    p.r += dr; p.c += dc; h.moves++;
    var out = { moved: true, solved: false };
    if (G.hrdSolved(h.cur)) {
      var lvd = G.HRD[h.lv], id = lvd.id, first = !h.best[id];
      out.solved = true; out.moves = h.moves; out.min = lvd.min;
      out.stars = h.moves <= Math.ceil(lvd.min * 1.3) ? 3 : (h.moves <= lvd.min * 2 ? 2 : 1);
      if (!h.best[id] || h.moves < h.best[id]) h.best[id] = h.moves;
      h.solves++;
      out.rewards = [];
      if (first) out.rewards = out.rewards.concat(G.grant(G.hrdFirstReward(h.lv)));
      if (h.day !== today()) { h.day = today(); out.rewards = out.rewards.concat(G.grant(G.hrdDailyReward())); out.daily = true; }
      out.first = first;
      G.log('華容道「' + lvd.name + '」' + h.moves + ' 步破解', 'sys');
    }
    G.commit(); return ok(out);
  };
  G.hrdUndo = function () {
    var h = G.hrd(); if (!h.hist.length) return fail('沒有可以還原的步數');
    if (G.hrdSolved(h.cur)) return fail('已經破解');
    var x = h.hist.pop(), p = h.cur[x[0]]; p.r = x[1]; p.c = x[2]; h.moves++; // 悔棋也算一步
    G.commit(); return ok();
  };
  G.hrdReset = function () { return G.hrdStart(G.hrd().lv); };

  // =================== 觀星台 ===================
  // 每天免費觀星 1 次，之後每次 10 金（每天最多 3 次）。結果決定「今日星運」：當天虛空之門勝利時全隊額外經驗 %，取當天最好的一次。
  G.STAR_NAMES = ['天樞', '天璇', '天璣', '天權', '玉衡', '開陽', '搖光'];
  G.STAR_LUCK = [
    { id: 'daji', name: '大吉', w: 8, exp: 20, poem: '紫微高照，所向披靡。' },
    { id: 'zhongji', name: '中吉', w: 22, exp: 12, poem: '將星明亮，宜出征。' },
    { id: 'xiaoji', name: '小吉', w: 35, exp: 8, poem: '雲開見月，步步為營。' },
    { id: 'ping', name: '平', w: 25, exp: 5, poem: '星象平穩，勤練不輟。' },
    { id: 'moji', name: '末吉', w: 10, exp: 3, poem: '晦中有明，厚積薄發。' }
  ];
  G.STAR_MAX = 3; G.STAR_GOLD = 10;
  function starDay() { var x = Q().star; if (x.day !== today()) { x.day = today(); x.draws = 0; x.luck = null; } return x; }
  G.starState = function () { var x = starDay(); return { draws: x.draws, left: G.STAR_MAX - x.draws, free: x.draws === 0, cost: x.draws === 0 ? 0 : G.STAR_GOLD, luck: x.luck ? G.starLuck(x.luck) : null, last: x.last }; };
  G.starLuck = function (id) { return U.find(G.STAR_LUCK, function (l) { return l.id === id; }); };
  G.starReward = function (l) {
    var k = G.STAR_LUCK.indexOf(l), L = lvl();
    var rw = { silver: (5 - k) * 100 * L, items: [] };
    if (k <= 1) rw.items.push({ item: 'peiyangdan', n: 3 - k });
    if (k === 0) rw.gold = 20;
    rw.items.push({ item: ['jinengshu', 'xilianshi', 'xinfacanye', 'huafei', 'jinglitang'][k], n: 1 });
    return rw;
  };
  G.starDraw = function (starIdx, rng) {
    if (!G.qiyuOpen()) return fail('主角 ' + G.QIYU_OPEN + ' 級開放');
    var x = starDay(), s = st();
    if (x.draws >= G.STAR_MAX) return fail('今天已觀星 ' + G.STAR_MAX + ' 次，明天再來');
    var cost = x.draws === 0 ? 0 : G.STAR_GOLD;
    if (s.player.gold < cost) return fail('金幣不足（需要 ' + cost + '）');
    s.player.gold -= cost;
    var tot = 0, r, l = null; U.each(G.STAR_LUCK, function (a) { tot += a.w; });
    r = rnd(rng) * tot; U.each(G.STAR_LUCK, function (a) { if (!l) { r -= a.w; if (r < 0) l = a; } }); l = l || G.STAR_LUCK[G.STAR_LUCK.length - 1];
    x.draws++; x.total++;
    var prev = x.luck ? G.starLuck(x.luck) : null;
    if (!prev || l.exp > prev.exp) x.luck = l.id;
    var rewards = G.grant(G.starReward(l));
    x.last = { star: G.STAR_NAMES[starIdx] || G.STAR_NAMES[0], luck: l.id };
    G.log('觀星台：' + x.last.star + '星 ' + l.name, 'sys');
    G.commit();
    return ok({ luck: l, star: x.last.star, rewards: rewards, cost: cost, todayLuck: G.starLuck(x.luck) });
  };
  G.starExpBonus = function () { var s = st(); if (!s || !s.qiyu) return 0; var x = s.qiyu.star; if (x.day !== today() || !x.luck) return 0; var l = G.starLuck(x.luck); return l ? l.exp : 0; };
  // 虛空之門勝利時套用星運經驗加成
  var fight0 = G.fight;
  G.fight = function (id, seed) {
    var out = fight0.apply(G, arguments);
    if (out && out.win && out.exp) {
      var pct = G.starExpBonus();
      if (pct > 0) {
        var extra = Math.floor(out.exp * pct / 100);
        if (extra > 0) { U.each(G.teamList(), function (x) { G.addExp(x.hero, extra); }); out.starExp = extra; out.starPct = pct; G.commit(); }
      }
    }
    return out;
  };

  // =================== 玄機盤 ===================
  // 12 格轉盤；每天免費 1 次，之後花銀幣（隨主角等級）。保底：連續 10 次沒有轉到「玄機大獎」，第 10 次必中。
  G.WHEEL = [
    { id: 'big', name: '玄機大獎', w: 2, rw: function (L) { return { gold: 100, items: [{ item: 'gem_atk_3', n: 1 }, { item: 'shenjishu', n: 1 }] }; } },
    { id: 'gold', name: '金幣 30', w: 6, rw: function () { return { gold: 30 }; } },
    { id: 'silverL', name: '大筆銀幣', w: 8, rw: function (L) { return { silver: 1500 * L }; } },
    { id: 'silverS', name: '銀幣', w: 16, rw: function (L) { return { silver: 400 * L }; } },
    { id: 'energy', name: '精力湯 ×2', w: 10, rw: function () { return { items: [{ item: 'jinglitang', n: 2 }] }; } },
    { id: 'book', name: '技能書 ×2', w: 10, rw: function () { return { items: [{ item: 'jinengshu', n: 2 }] }; } },
    { id: 'pill', name: '培養丹 ×5', w: 10, rw: function () { return { items: [{ item: 'peiyangdan', n: 5 }] }; } },
    { id: 'stone', name: '洗煉石 ×2', w: 9, rw: function () { return { items: [{ item: 'xilianshi', n: 2 }] }; } },
    { id: 'gem', name: '2 級寶石', w: 7, rw: function (L, rng) { var k = ['atk', 'hp', 'pdef', 'mdef', 'jdef', 'crit'][Math.floor(rnd(rng) * 6)]; return { items: [{ item: 'gem_' + k + '_2', n: 1 }] }; } },
    { id: 'page', name: '心法殘頁 ×3', w: 8, rw: function () { return { items: [{ item: 'xinfacanye', n: 3 }] }; } },
    { id: 'token', name: '突飛令', w: 6, rw: function () { return { items: [{ item: 'tufeiling', n: 1 }] }; } },
    { id: 'seed', name: '靈石花種 ×2', w: 8, rw: function () { return { items: [{ item: 'seed_gem', n: 2 }] }; } }
  ];
  G.WHEEL_PITY = 10;
  function wheelDay() { var w = Q().wheel; if (w.day !== today()) { w.day = today(); w.free = 1; } return w; }
  G.wheelCost = function () { return 500 + 100 * lvl(); };
  G.wheelState = function () { var w = wheelDay(); return { free: w.free > 0, cost: w.free > 0 ? 0 : G.wheelCost(), pity: w.pity, pityLeft: G.WHEEL_PITY - w.pity, spins: w.spins, last: w.last }; };
  G.wheelOdds = function () { var tot = 0; U.each(G.WHEEL, function (a) { tot += a.w; }); return U.map(G.WHEEL, function (a) { return { id: a.id, name: a.name, pct: Math.round(a.w / tot * 1000) / 10 }; }); };
  G.wheelSpin = function (rng) {
    if (!G.qiyuOpen()) return fail('主角 ' + G.QIYU_OPEN + ' 級開放');
    var w = wheelDay(), s = st(), free = w.free > 0, cost = free ? 0 : G.wheelCost();
    if (s.player.silver < cost) return fail('銀幣不足（需要 ' + U.fmt(cost) + '）');
    if (free) w.free--; else s.player.silver -= cost;
    var idx;
    if (w.pity >= G.WHEEL_PITY - 1) idx = 0;
    else { var tot = 0; U.each(G.WHEEL, function (a) { tot += a.w; }); var r = rnd(rng) * tot; idx = G.WHEEL.length - 1; for (var i = 0; i < G.WHEEL.length; i++) { r -= G.WHEEL[i].w; if (r < 0) { idx = i; break; } } }
    var pz = G.WHEEL[idx];
    w.pity = idx === 0 ? 0 : w.pity + 1; w.spins++; w.last = idx;
    var rewards = G.grant(pz.rw(lvl(), rng));
    G.log('玄機盤轉到「' + pz.name + '」', 'sys');
    G.commit();
    return ok({ idx: idx, prize: pz, rewards: rewards, cost: cost, free: free, pity: idx === 0 && w.spins > 0 });
  };
})(MJ.G);

</script>
<script>/* js/ui.js */
/* UI 核心：舞台縮放/直式旋轉、事件委派、彈窗、提示、分頁、共用元件 */
MJ.UI = (function () {
  var UI = {}, U = MJ.U;
  UI.actions = {};
  UI.page = {};       // 各列表目前頁碼
  UI.sel = {};        // 各畫面選取狀態
  UI.screen = 'city';
  UI.modal = null;    // {name, arg}
  UI.W = 960; UI.H = 600;

  function $(id) { return document.getElementById(id); }
  UI.$ = $;
  UI.q = function () { var C = MJ.D.config; return C; };

  // ---------- 舞台縮放 ----------
  UI.layout = function () {
    var st = $('stage'); if (!st) return;
    var w = window.innerWidth || document.documentElement.clientWidth, h = window.innerHeight || document.documentElement.clientHeight;
    var s = MJ.S.state, rotate = (!s || s.settings.rotate !== false) && h > w * 1.1;
    var scale, tf, left, top;
    if (rotate) {
      scale = Math.min(h / UI.W, w / UI.H);
      left = (w - UI.H * scale) / 2 + UI.H * scale; top = (h - UI.W * scale) / 2;
      tf = 'translate(' + left + 'px,' + top + 'px) rotate(90deg) scale(' + scale + ')';
    } else {
      scale = Math.min(w / UI.W, h / UI.H);
      left = (w - UI.W * scale) / 2; top = (h - UI.H * scale) / 2;
      tf = 'translate(' + left + 'px,' + top + 'px) scale(' + scale + ')';
    }
    st.style.webkitTransform = tf; st.style.transform = tf;
    UI.rotated = rotate; UI.scale = scale;
    document.body.className = rotate ? 'rot' : '';
  };

  // ---------- 事件委派 ----------
  function findAct(el) {
    while (el && el !== document) {
      if (el.getAttribute && el.getAttribute('data-a')) return el;
      el = el.parentNode;
    }
    return null;
  }
  UI.bind = function () {
    var st = $('stage');
    st.addEventListener('click', function (ev) {
      var el = findAct(ev.target); if (!el) return;
      if (el.className && String(el.className).indexOf('disabled') >= 0 && !el.getAttribute('data-force')) { var why = el.getAttribute('data-why'); if (why) UI.toast(why); return; }
      var a = el.getAttribute('data-a'), v = el.getAttribute('data-v');
      var fn = UI.actions[a];
      if (!fn) { UI.toast('（未實作的動作：' + a + '）'); return; }
      ev.preventDefault();
      fn(v, el);
    }, false);
    window.addEventListener('resize', UI.layout, false);
    window.addEventListener('orientationchange', function () { setTimeout(UI.layout, 300); }, false);
  };

  // ---------- 畫面 ----------
  UI.screens = {};
  UI.go = function (name, arg) { UI.screen = name; UI.screenArg = arg; UI.modal = null; UI.render(); };
  UI.render = function () {
    if (!MJ.S.state && UI.screen !== 'newgame') UI.screen = 'newgame';
    var fn = UI.screens[UI.screen];
    $('screen').innerHTML = fn ? fn(UI.screenArg) : '';
    UI.renderModal();
    if (UI.afterRender) { var f = UI.afterRender; UI.afterRender = null; f(); }
  };
  UI.refresh = function () { if (UI.screen === 'battle') { UI.renderModal(); return; } UI.render(); };
  UI.modals = {};
  UI.open = function (name, arg) { UI.modal = { name: name, arg: arg }; UI.renderModal(); };
  UI.close = function () { UI.modal = null; UI.renderModal(); if (UI.screen !== 'battle') UI.render(); };
  UI.renderModal = function () {
    var m = $('modal');
    if (!UI.modal) { m.innerHTML = ''; m.style.display = 'none'; return; }
    var fn = UI.modals[UI.modal.name];
    m.innerHTML = fn ? fn(UI.modal.arg) : '';
    m.style.display = 'block';
  };
  UI.actions.close = function () { UI.close(); };
  UI.actions.go = function (v) { UI.go(v); };
  UI.actions.open = function (v) { UI.open(v); };
  UI.actions.noop = function () { };
  UI.actions.info = function (v) { UI.toast(v); };

  // ---------- 提示 ----------
  var toastTimer = null;
  UI.toast = function (msg, kind) {
    var t = $('toast');
    t.innerHTML = '<div class="toast ' + (kind || '') + '">' + U.esc(msg) + '</div>';
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.style.display = 'none'; }, 2200);
  };
  UI.res = function (r, okMsg) {
    if (!r.ok) { UI.toast(r.msg, 'bad'); return false; }
    if (okMsg) UI.toast(okMsg, 'good');
    return true;
  };
  // 確認框
  UI.confirm = function (title, text, onYes, yesLabel) {
    UI._confirmYes = onYes;
    var c = $('confirm');
    c.innerHTML = '<div class="dim"></div><div class="frame confirm-box"><div class="plaque">' + U.esc(title) + '</div><div class="parch confirm-text">' + text + '</div>' +
      '<div class="btn-row"><a class="btn red" data-a="confirmYes">' + U.esc(yesLabel || '確定') + '</a><a class="btn" data-a="confirmNo">取消</a></div></div>';
    c.style.display = 'block';
  };
  UI.actions.confirmYes = function () { $('confirm').style.display = 'none'; var f = UI._confirmYes; UI._confirmYes = null; if (f) f(); };
  UI.actions.confirmNo = function () { $('confirm').style.display = 'none'; UI._confirmYes = null; };
  // 獎勵彈窗
  UI.rewardBox = function (title, lines) {
    UI.confirm(title, '<div class="reward-list">' + (lines.length ? U.map(lines, function (l) { return '<div class="rw">' + U.esc(l) + '</div>'; }).join('') : '<div class="rw">（沒有物品）</div>') + '</div>', null, '好的');
    var c = $('confirm'); var btns = c.getElementsByClassName('btn'); if (btns[1]) btns[1].style.display = 'none';
  };

  // ---------- 共用元件 ----------
  UI.panel = function (title, body, opt) {
    opt = opt || {};
    return '<div class="dim"' + (opt.noDimClose ? '' : ' data-a="close"') + '></div><div class="frame panel ' + (opt.cls || '') + '">' +
      '<div class="plaque">' + U.esc(title) + '</div><a class="xbtn" data-a="close" aria-label="關閉">×</a>' +
      '<div class="panel-body">' + body + '</div></div>';
  };
  UI.bar = function (cur, max, cls, text) {
    var p = max > 0 ? U.clamp(cur / max, 0, 1) * 100 : 0;
    return '<div class="bar ' + (cls || '') + '"><i style="width:' + p.toFixed(1) + '%"></i><b>' + (text != null ? text : U.fmt(cur) + '/' + U.fmt(max)) + '</b></div>';
  };
  UI.qname = function (q) { return MJ.D.config.qualityNames[q]; };
  UI.qcls = function (q) { return 'q' + q; };
  UI.portrait = function (h, opt) {
    opt = opt || {};
    var def = MJ.R.heroDef(h.id), look = h.id === 'lead' ? MJ.S.state.player.look : def.look;
    var q = h.id === 'lead' ? 3 : def.quality;
    return '<div class="card ' + UI.qcls(q) + (opt.sel ? ' sel' : '') + (opt.cls ? ' ' + opt.cls : '') + '"' + (opt.act ? ' data-a="' + opt.act + '" data-v="' + (opt.v != null ? opt.v : h.uid) + '"' : '') + '>' +
      MJ.Art.portrait(look, q) + '<span class="lvb">' + h.lv + '</span>' + (opt.badge ? '<span class="badge">' + opt.badge + '</span>' : '') +
      '<span class="nm">' + U.esc(MJ.G.nameOf(h)) + '</span></div>';
  };
  UI.pager = function (key, items, per, renderFn, emptyText) {
    var pages = Math.max(1, Math.ceil(items.length / per));
    var p = U.clamp(UI.page[key] || 0, 0, pages - 1); UI.page[key] = p;
    var slice = items.slice(p * per, p * per + per), html = '';
    if (!items.length) html = '<div class="empty">' + U.esc(emptyText || '空') + '</div>';
    else U.each(slice, function (it, i) { html += renderFn(it, p * per + i); });
    return { html: html, nav: '<div class="pager"><a class="pbtn' + (p <= 0 ? ' disabled' : '') + '" data-a="pg" data-v="' + key + ':-1">◀</a><span>' + (p + 1) + '/' + pages + '</span><a class="pbtn' + (p >= pages - 1 ? ' disabled' : '') + '" data-a="pg" data-v="' + key + ':1">▶</a></div>' };
  };
  UI.actions.pg = function (v) { var a = v.split(':'); UI.page[a[0]] = (UI.page[a[0]] || 0) + (+a[1]); UI.refresh(); };
  UI.equipCell = function (e, opt) {
    opt = opt || {};
    var tpl = MJ.R.equipTpl(e.t), st = MJ.R.equipStats(e);
    var tip = UI.equipLines(st).join(' ');
    return '<div class="ecell eq' + e.q + (opt.sel ? ' sel' : '') + '"' + (opt.act ? ' data-a="' + opt.act + '" data-v="' + e.uid + '"' : '') + ' title="' + U.esc(tpl.name + ' ' + tip) + '">' +
      MJ.Art.icon(tpl.icon, e.q) + '<span class="elv">' + tpl.lv + '</span>' + (e.plus ? '<span class="eplus">+' + e.plus + '</span>' : '') + (e.gems && e.gems.length ? '<span class="egem">' + U.map(e.gems, function () { return '◆'; }).join('') + '</span>' : '') + '<span class="enm">' + U.esc(tpl.name) + '</span></div>';
  };
  UI.STAT_NAMES = { patk: '物攻', matk: '法攻', jatk: '絕技攻', pdef: '物防', mdef: '法防', jdef: '絕技防', hp: '生命', hit: '命中', crit: '暴擊', dodge: '閃避', all: '四維' };
  UI.stars = function (n) { var t = ''; for (var i = 0; i < 5; i++) t += i < n ? '★' : '☆'; return '<span class="stars5">' + t + '</span>'; };
  UI.equipLines = function (st) {
    return U.map(U.keys(st), function (k) { var pct = k === 'hit' || k === 'crit' || k === 'dodge'; return UI.STAT_NAMES[k] + '+' + (pct ? st[k].toFixed(2) + '%' : st[k]); });
  };
  UI.icon = function (n, q) { return MJ.Art.icon(n, q); };
  return UI;
})();

</script>
<script>/* js/ui-city.js */
/* 主城：浮空島建築、左上角色資訊、上方貨幣、禮包、底部功能列、系統訊息 */
(function () {
  var UI = MJ.UI, U = MJ.U, G = MJ.G, R = MJ.R;
  // 建築位置（版面參考 A 級截圖：浮空島 + 瀑布；座標為自訂）
  var B = [
    { k: 'shenwu', x: 360, y: 64, w: 230, act: 'hall' },
    { k: 'juxian', x: 110, y: 112, w: 200, act: 'recruit' },
    { k: 'xukong', x: 640, y: 100, w: 200, act: 'gate' },
    { k: 'tongtian', x: 836, y: 170, w: 120, act: 'tower' },
    { k: 'shenbing', x: 20, y: 300, w: 170, act: 'forge' },
    { k: 'baifang', x: 200, y: 318, w: 150, act: 'arena' },
    { k: 'farm', x: 380, y: 300, w: 190, act: 'farm' },
    { k: 'jiangxing', x: 590, y: 318, w: 150, act: 'jxl' },
    { k: 'wuji', x: 760, y: 318, w: 150, act: 'wuji' }
  ];
  UI.hud = function () {
    var s = MJ.S.state, lead = G.lead(), max = R.energyMax(lead.lv);
    G.tick();
    var h = '<div class="hud-tl frame-s">' +
      '<div class="avatar" data-a="hall">' + MJ.Art.portrait(s.player.look, 3) + '<span class="lvb big">' + lead.lv + '</span></div>' +
      '<div class="hud-info"><div class="pname">' + U.esc(s.player.name) + '</div>' +
      UI.bar(lead.exp, R.expNeed(lead.lv), 'exp', '經驗 ' + lead.exp + '/' + R.expNeed(lead.lv)) +
      '<div class="erow">' + UI.icon('energy') + UI.bar(s.player.energy, max, 'energy', s.player.energy + '/' + max) + '</div>' +
      (s.player.energy < max ? '<div class="regen">' + U.dur(G.nextEnergyIn()) + ' 後 +1</div>' : '') + '</div></div>';
    h += '<div class="hud-top">' +
      '<div class="cur" title="金幣">' + UI.icon('gold') + '<b>' + U.fmt(s.player.gold) + '</b><a class="plus" data-a="info" data-v="單機版沒有儲值；金幣可從任務、首通與禮包取得">+</a></div>' +
      '<div class="cur" title="銀幣">' + UI.icon('silver') + '<b>' + U.fmt(s.player.silver) + '</b></div>' +
      (UI.muteBtn ? UI.muteBtn() : '') +
      '<a class="cur mailbtn" data-a="open" data-v="mail">' + UI.icon('mail') + (U.filter(s.mail, function (m) { return !m.claimed; }).length ? '<i class="dot"></i>' : '') + '</a>' +
      '</div>';
    return h;
  };
  UI.screens.city = function () {
    var s = MJ.S.state, lead = G.lead(), cfg = MJ.D.config;
    var h = '<div class="city">' + MJ.Art.sky();
    U.each(B, function (b) {
      var c = cfg.buildings[b.k], lv = s.buildings[b.k] || 1, locked = lead.lv < c.open, phase = c.phase;
      var tag = phase ? '第' + ['', '一', '二', '三', '四'][phase] + '階段開放' : (locked ? '需要等級 ' + c.open : 'Lv' + lv);
      if (phase && locked) tag = '需要等級 ' + c.open;
      var act = (!phase && !locked && b.act) ? b.act : 'bLocked';
      h += '<div class="bld' + (phase || locked ? ' locked' : '') + '" style="left:' + b.x + 'px;top:' + b.y + 'px;width:' + b.w + 'px;height:' + b.w + 'px" data-a="' + act + '" data-v="' + b.k + '">' +
        MJ.Art.building(b.k) + '<div class="bname"><b>' + U.esc(c.name) + '</b><span>' + U.esc(tag) + '</span></div></div>';
    });
    h += UI.hud();
    // 出戰隊伍
    h += '<div class="team-strip frame-s" data-a="open" data-v="formation"><span class="ts-t">出戰</span>';
    U.each(G.teamList(), function (x) { h += UI.portrait(x.hero, { cls: 'mini' }); });
    h += '<span class="ts-n">' + G.teamCount() + '/' + R.teamSlots(lead.lv) + '</span></div>';
    // 禮包
    var fl = G.freeGiftLeft(), sd = G.sevenDayState();
    h += '<div class="gifts">';
    if (!s.gifts.opening) h += '<a class="gift" data-a="giftOpening">' + UI.icon('gift') + '<span>開服大禮包</span></a>';
    if (sd.claimed < 7) h += '<a class="gift' + (sd.canClaim ? '' : ' dim2') + '" data-a="giftSeven">' + UI.icon('chest') + '<span>七日禮包</span>' + (sd.canClaim ? '<i class="dot"></i>' : '') + '</a>';
    h += '<a class="gift" data-a="giftFree">' + UI.icon('gift') + '<span>' + (fl > 0 ? '<em id="freeCd">' + U.dur(fl) + '</em>' : '免費禮物') + '</span>' + (fl > 0 ? '' : '<i class="dot"></i>') + '</a>';
    h += '<a class="gift" data-a="open" data-v="tasks">' + UI.icon('quest') + '<span>任務</span>' + (UI.taskDot && UI.taskDot() ? '<i class="dot"></i>' : '') + '</a>';
    if (G.signState) { var sgs = G.signState(); h += '<a class="gift' + (sgs.signedToday ? ' dim2' : '') + '" data-a="openSign">' + UI.icon('scroll2') + '<span>簽到</span>' + (sgs.signedToday ? '' : '<i class="dot"></i>') + '</a>'; }
    if (G.qiyuOpen && G.qiyuOpen()) h += '<a class="gift" data-a="open" data-v="qiyu">' + UI.icon('star') + '<span>奇遇</span>' + (UI.qiyuDot && UI.qiyuDot() ? '<i class="dot"></i>' : '') + '</a>';
    h += '</div>';
    // 系統訊息
    h += '<div class="chat" id="chat">' + UI.chatHtml() + '</div>';
    // 底部功能列（A：道具、陣法、日志、郵件、商城、設置）
    h += '<div class="bottombar">';
    U.each([['bag', '道具', 'bag'], ['formation', '陣法', 'formation'], ['log', '日志', 'scroll'], ['mail', '郵件', 'mail'], ['shop', '商城', 'shop'], ['settings', '設置', 'gear']], function (x) {
      h += '<a class="bb" data-a="open" data-v="' + x[0] + '">' + UI.icon(x[2]) + '<span>' + x[1] + '</span></a>';
    });
    h += '</div></div>';
    return h;
  };
  UI.chatHtml = function () {
    var lines = G.chatLines.length ? G.chatLines : ['【系統】歡迎來到猛將無雙（單機重製版）'];
    return U.map(lines.slice(0, 3), function (l) { return '<div>' + U.esc(l) + '</div>'; }).join('');
  };
  UI.actions.bLocked = function (k) {
    var c = MJ.D.config.buildings[k];
    UI.toast(c.name + '：' + (G.lead().lv < c.open ? '需要等級 ' + c.open + '。' : '') + (c.phase ? '此功能預定於第' + ['', '一', '二', '三', '四'][c.phase] + '階段開放。' : ''));
  };
  UI.actions.hall = function () { UI.go('hall'); };
  UI.actions.recruit = function () { UI.go('recruit'); };
  UI.actions.gate = function () { UI.go('gate'); };
  UI.actions.city = function () { UI.go('city'); };
  UI.actions.giftOpening = function () { var r = G.claimOpening(); if (UI.res(r)) { UI.render(); UI.rewardBox('開服大禮包', r.got); } };
  UI.actions.giftSeven = function () { var r = G.claimSevenDay(); if (UI.res(r)) { UI.render(); UI.rewardBox('七日禮包 第 ' + r.day + ' 天', r.got); } };
  UI.actions.giftFree = function () { var r = G.claimFreeGift(); if (UI.res(r)) { UI.render(); UI.rewardBox('免費禮物', r.got); } };
})();

</script>
<script>/* js/ui-recruit.js */
/* 聚賢莊：刷新、拜訪（招募）、機率、結果動畫、解僱、將魂召喚 */
(function () {
  var UI = MJ.UI, U = MJ.U, G = MJ.G, R = MJ.R;
  var TYPE_TIP = { '力敏': '物理．敏捷', '力耐': '物理．耐力', '智敏': '法術．敏捷', '智耐': '法術．耐力' };
  function candCard(id, i) {
    var d = R.heroDef(id), h = { id: id, lv: 1, eq: {} }, p = R.primary(h), cost = G.recruitCost(id);
    var s = MJ.S.state, afford = s.player.silver >= cost;
    return '<div class="cand ' + UI.qcls(d.quality) + (UI.sel.justRefreshed ? ' flip-in' : '') + '" style="-webkit-animation-delay:' + (i * 0.12) + 's;animation-delay:' + (i * 0.12) + 's">' +
      '<div class="cand-q">' + UI.qname(d.quality) + '</div>' +
      '<div class="cand-art">' + MJ.Art.portrait(d.look, d.quality) + '</div>' +
      '<div class="cand-name">' + U.esc(d.name) + '</div>' +
      '<div class="cand-type">' + d.type + '（' + TYPE_TIP[d.type] + '）</div>' +
      '<table class="mini-stats"><tr><td>力量</td><td>' + p.str + '</td><td>智力</td><td>' + p.int + '</td></tr><tr><td>敏捷</td><td>' + p.agi + '</td><td>耐力</td><td>' + p.con + '</td></tr></table>' +
      '<div class="cand-skill">技能：' + U.esc(d.active.name) + '／' + U.esc(d.ult.name) + (d.passive ? '<br>被動：' + MJ.D.heroes.passives[d.passive].name : '') + '</div>' +
      '<a class="btn small' + (afford ? '' : ' disabled') + '" data-a="doRecruit" data-v="' + id + '" data-why="銀幣不足（需要 ' + U.fmt(cost) + '）">拜訪 ' + UI.icon('silver') + U.fmt(cost) + '</a></div>';
  }
  UI.screens.recruit = function () {
    var s = MJ.S.state, cfg = MJ.D.config, tab = UI.sel.recTab || 'cands';
    var h = '<div class="scr recruit-scr">' + UI.hud();
    h += '<div class="frame bigframe"><div class="plaque">聚賢莊 Lv' + (s.buildings.juxian || 1) + '</div><a class="xbtn" data-a="city">×</a>';
    h += '<div class="tabs"><a class="tab' + (tab === 'cands' ? ' on' : '') + '" data-a="recTab" data-v="cands">拜訪武將</a><a class="tab' + (tab === 'roster' ? ' on' : '') + '" data-a="recTab" data-v="roster">我的武將</a><a class="tab' + (tab === 'souls' ? ' on' : '') + '" data-a="recTab" data-v="souls">將魂召喚</a></div>';
    h += '<div class="parch inner">';
    if (tab === 'cands') {
      h += '<div class="rec-left">';
      U.each(G.recruitKinds, function (k) {
        var x = G.recruitStatus(k), c = x.cfg;
        var label = x.cdLeft > 0 ? '冷卻 <em class="cd" data-end="' + (s.recruit.cd[k]) + '">' + U.dur(x.cdLeft) + '</em>' : '可刷新';
        var sub = k === 'normal' ? '今日剩餘 ' + x.left + '/' + c.daily : '';
        var pay = x.cdLeft > 0 ? '（花 ' + c.skipGold + ' 金立即刷新）' : '';
        h += '<a class="rbtn rk-' + k + ((k === 'normal' && x.left <= 0) ? ' disabled' : '') + '" data-a="doRefresh" data-v="' + k + '" data-why="今日普通刷新次數已用完">' +
          '<b>' + c.name + '</b><span>' + label + '</span><span class="sub">' + sub + pay + '</span></a>';
      });
      h += '<a class="link" data-a="showOdds">查看品質機率</a></div>';
      h += '<div class="cands">' + (s.recruit.cands.length ? U.map(s.recruit.cands, candCard).join('') : '<div class="empty">名單已空，請刷新</div>') + '</div>';
      UI.sel.justRefreshed = false;
    } else if (tab === 'roster') {
      var list = s.heroes.slice();
      var pg = UI.pager('roster', list, 10, function (hh) {
        var sel = UI.sel.rosterUid === hh.uid;
        return UI.portrait(hh, { act: 'rosterSel', sel: sel, badge: G.inTeam(hh.uid) != null ? '陣' : '' });
      });
      h += '<div class="roster-grid">' + pg.html + '</div>' + pg.nav;
      var hs = G.hero(UI.sel.rosterUid);
      h += '<div class="roster-info">武將數 ' + s.heroes.length + '/' + R.rosterCap(s) + '　';
      if (hs) {
        var d = R.heroDef(hs.id);
        h += '已選：<b>' + U.esc(G.nameOf(hs)) + '</b> Lv' + hs.lv + '　';
        if (hs.id !== 'lead') h += '<a class="btn small red" data-a="doDismiss" data-v="' + hs.uid + '">' + (MJ.D.config.dismissSouls[d.quality] ? '解僱（得將魂 ×' + MJ.D.config.dismissSouls[d.quality] + '）' : '解僱（黑色不得將魂）') + '</a>';
        else h += '（主角不可解僱）';
      } else h += '點選武將可解僱，解僱後獲得該武將將魂。';
      h += '</div>';
    } else {
      var souls = U.filter(U.keys(s.bag.stack), function (k) { return k.indexOf('soul:') === 0 && s.bag.stack[k] > 0; });
      var pg2 = UI.pager('souls', souls, 8, function (k) {
        var id = k.slice(5), d = R.heroDef(id), have = s.bag.stack[k], owned = U.find(s.heroes, function (x) { return x.id === id; });
        return '<div class="soulrow ' + UI.qcls(d.quality) + '">' + MJ.Art.portrait(d.look, d.quality) + '<div><b>' + U.esc(d.name) + '</b>（' + UI.qname(d.quality) + '）<br>將魂 ' + have + '/' + d.souls + '</div>' +
          '<a class="btn small' + (owned || have < d.souls ? ' disabled' : '') + '" data-a="doSummon" data-v="' + id + '" data-why="' + (owned ? '已擁有此武將' : '將魂不足') + '">召喚</a></div>';
      }, '尚無將魂。解僱武將或在虛空之門戰鬥可獲得將魂。');
      h += '<div class="soul-list">' + pg2.html + '</div>' + pg2.nav;
    }
    h += '</div></div></div>';
    return h;
  };
  UI.actions.recTab = function (v) { UI.sel.recTab = v; UI.render(); };
  UI.actions.doRefresh = function (k) {
    var x = G.recruitStatus(k);
    if (x.cdLeft > 0) {
      UI.confirm('立即刷新', '冷卻剩餘 ' + U.dur(x.cdLeft) + '。<br>花費 <b>' + x.cfg.skipGold + ' 金幣</b> 立即' + x.cfg.name + '？', function () {
        var r = G.refresh(k, true); if (UI.res(r)) { UI.sel.justRefreshed = true; UI.render(); }
      });
      return;
    }
    var r = G.refresh(k, false); if (UI.res(r)) { UI.sel.justRefreshed = true; UI.render(); }
  };
  // A（官方圖）：招募確認視窗標題「招募武將」、按鈕「立即招募」
  UI.actions.doRecruit = function (id) {
    var d = R.heroDef(id), cost = G.recruitCost(id);
    UI.confirm('招募武將', '<div class="rc-box">' + MJ.Art.portrait(d.look, d.quality) + '<div>是否花費 <b>' + U.fmt(cost) + ' 銀幣</b> 招募<br><span class="qtag ' + UI.qcls(d.quality) + '">' + UI.qname(d.quality) + '</span> <b>' + U.esc(d.name) + '</b>（' + d.type + '）？<br><small>武將數 ' + MJ.S.state.heroes.length + '/' + R.rosterCap(MJ.S.state) + '</small></div></div>', function () {
      var r = G.recruit(id); if (!UI.res(r)) return;
      UI.render(); UI.open('recruitResult', r.hero.uid);
    }, '立即招募');
  };
  UI.modals.recruitResult = function (uid) {
    var h = G.hero(uid), d = R.heroDef(h.id), p = R.primary(h);
    return '<div class="dim" data-a="close"></div><div class="reveal ' + UI.qcls(d.quality) + '">' +
      '<div class="rays"></div><div class="reveal-stand"><div class="mc-wrap">' + MJ.Art.magicCircle() + '</div><div class="aura-wrap">' + MJ.Art.aura(d.quality) + '</div><div class="hero-fig">' + MJ.Art.figure(d.look) + '</div></div>' +
      '<div class="reveal-text"><span class="qtag ' + UI.qcls(d.quality) + '">' + UI.qname(d.quality) + '</span> ' + U.esc(d.name) + ' 加入麾下！</div>' +
      '<div class="reveal-sub">力量 ' + p.str + '　智力 ' + p.int + '　敏捷 ' + p.agi + '　耐力 ' + p.con + '</div>' +
      '<div class="btn-row"><a class="btn" data-a="recToTeam" data-v="' + uid + '">加入出戰</a><a class="btn" data-a="close">好的</a></div></div>';
  };
  UI.actions.recToTeam = function (uid) { var r = G.addToTeam(+uid); if (UI.res(r, '已加入出戰隊伍')) UI.close(); };
  UI.actions.showOdds = function () {
    var cfg = MJ.D.config, t = '<table class="odds"><tr><th></th>' + U.map(cfg.qualityNames, function (q, i) { return '<th class="q' + i + 't">' + q + '</th>'; }).join('') + '<th>冷卻</th></tr>';
    U.each(G.recruitKinds, function (k) {
      var c = cfg.recruit[k];
      t += '<tr><td>' + c.name + '</td>' + U.map(c.odds, function (o) { return '<td>' + (o * 100).toFixed(1) + '%</td>'; }).join('') + '<td>' + (c.cdMin >= 1440 ? c.cdMin / 1440 + ' 天' : c.cdMin + ' 分') + '</td></tr>';
    });
    t += '</table><p class="note">刷新種類與冷卻：B（巴哈姆特攻略）。機率：D（原作未公開，本作自訂）。首次紫金／至尊刷新保底藍／紫：B。</p>';
    UI.confirm('品質機率', t, null, '知道了');
    var btns = UI.$('confirm').getElementsByClassName('btn'); if (btns[1]) btns[1].style.display = 'none';
  };
  UI.actions.rosterSel = function (uid) { UI.sel.rosterUid = +uid; UI.render(); };

</script>
<script>/* js/ui-hall.js */

      '<tr><td>物防</td><td>' + d.pdef + '</td><td>法防</td><td>' + d.mdef + '</td></tr>' +
      '<tr><td>絕防</td><td>' + d.jdef + '</td><td>命中</td><td>' + pct(d.hit) + '</td></tr>' +

      h += '<div class="train"><b>訓練位</b>（神武殿 Lv' + (s.buildings.shenwu || 1) + '）<br>';
      if (th) {
        h += U.esc(G.nameOf(th)) + ' 訓練中：每分鐘經驗 +' + G.trainRate(th) + '<br>已累積 <b>' + G.trainGain() + '</b> 經驗（最多 8 小時）<div class="btn-row"><a class="btn small" data-a="stopTrain">結束訓練並領取</a></div>';
      } else {

      }

      h += '<p class="note">訓練經驗數值：D（自訂）。武將等級不能超過主角（B）。</p></div>';
    }
    h += '</div>';
    // 下：武將列
    var list = s.heroes.slice();
    var pgh = UI.pager('hallheroes', list, 8, function (x) { return UI.portrait(x, { act: 'hallSel', sel: x.uid === h0.uid, badge: G.inTeam(x.uid) != null ? '陣' : '' }); });

    h += '</div></div>';

  };
  UI.actions.hallTab = function (v) { UI.sel.hallTab = v; UI.render(); };
  UI.actions.hallSel = function (v) { UI.sel.hallUid = +v; UI.sel.bagPick = null; UI.render(); };
  UI.actions.bagSlot = function (v) { UI.sel.bagSlot = v; UI.sel.bagPick = null; UI.page.hallbag = 0; UI.render(); };
  UI.actions.bagPick = function (v) { UI.sel.bagPick = +v; UI.render(); };

  UI.actions.autoEq = function (v) { var r = G.autoEquip(+v); if (UI.res(r, r.changed ? '已換上最強裝備（' + r.changed + ' 件）' : '目前已是最佳搭配')) UI.render(); };
  UI.actions.doSell = function (v) { var r = G.sellEquip(+v); if (UI.res(r, '獲得 ' + r.silver + ' 銀幣')) { UI.sel.bagPick = null; UI.render(); } };

  UI.actions.hallRest = function (v) { if (UI.res(G.removeFromTeam(+v), '已下陣休息')) UI.render(); };

</script>
<script>/* js/ui-gate.js */
/* 虛空之門：章節路線圖 → 3×3 關卡格（A：宣傳片）→ 出戰視窗 */
(function () {
  var UI = MJ.UI, U = MJ.U, G = MJ.G, R = MJ.R;
  var NODE = [[150, 400], [370, 300], [590, 380], [800, 250]];
  var KIND = { normal: '普通', elite: '精英', boss: '王關', hidden: '隱藏' };
  UI.screens.gate = function () {
    var s = MJ.S.state, ch = UI.sel.gateCh;
    var h = '<div class="scr gate-scr"><div class="voidbg"></div>' + UI.hud();
    if (!ch) {
      h += '<div class="frame bigframe gate"><div class="plaque">虛空之門</div><a class="xbtn" data-a="city">×</a><div class="map">';
      h += '<svg class="art path" viewBox="0 0 900 480"><path d="M150 400 Q260 300 370 300 Q480 300 590 380 Q700 450 800 250" stroke="#f6e7c8" stroke-width="10" fill="none" stroke-dasharray="4 16" stroke-linecap="round"/></svg>';
      var curCh = 1; U.each(MJ.D.stages.chapters, function (c) { if (G.chapterUnlocked(c.id)) curCh = c.id; });
      var chs = MJ.D.stages.chapters, vols = Math.ceil(chs.length / 4);
      if (UI.sel.gateVol == null) UI.sel.gateVol = Math.floor((curCh - 1) / 4);
      var vol = Math.min(vols - 1, UI.sel.gateVol);
      U.each(chs.slice(vol * 4, vol * 4 + 4), function (c, i) {
        var open = G.chapterUnlocked(c.id), st3 = 0, cl = 0;
        U.each(MJ.D.stages.stages, function (x) { if (x.ch === c.id) { var ss = G.stageState(x.id); st3 += ss.stars; if (ss.clears) cl++; } });
        h += '<div class="cnode' + (open ? '' : ' locked') + '" style="left:' + (NODE[i][0] - 70) + 'px;top:' + (NODE[i][1] - 90) + 'px" data-a="' + (open ? 'gateCh' : 'info') + '" data-v="' + (open ? c.id : '第' + c.id + '章「' + c.name + '」：需要主角等級 ' + c.lv + '，並通關上一章王關') + '">' +
          (c.id === curCh ? '<div class="arrow" title="目前進度"></div>' : '') + '<div class="cn-orb" style="background:' + c.bg + '">' + (open ? '<span>' + c.id + '</span>' : '<span>鎖</span>') + '</div><div class="cn-name">' + U.esc(c.name) + '</div><div class="cn-sub">' + (open ? '★' + st3 + '/27　通關 ' + cl + '/9' : '需要 Lv' + c.lv) + '</div></div>';
      });
      if (vols > 1) h += '<div class="gate-vol">' + (vol > 0 ? '<a class="btn small" data-a="gateVol" data-v="' + (vol - 1) + '">◀ 上一卷</a>' : '') + '<b>第' + ['一', '二', '三'][vol] + '卷</b>' + (vol < vols - 1 ? '<a class="btn small" data-a="gateVol" data-v="' + (vol + 1) + '">下一卷 ▶</a>' : '') + '</div>';
      h += '</div><div class="gate-tip">消耗精力挑戰關卡；主角 30 級前戰敗不扣精力（B）。</div></div>';
    } else {
      var c = U.find(MJ.D.stages.chapters, function (x) { return x.id === ch; });
      h += '<div class="frame bigframe gate"><div class="plaque">第' + c.id + '章．' + U.esc(c.name) + '</div><a class="xbtn" data-a="gateBack">×</a>';
      h += '<div class="parch ch-desc">' + U.esc(c.desc) + '</div><div class="sgrid">';
      U.each(U.filter(MJ.D.stages.stages, function (x) { return x.ch === ch; }), function (sg) {
        var open = G.stageUnlocked(sg.id), ss = G.stageState(sg.id), stars = '';
        for (var i = 0; i < 3; i++) stars += '<i class="' + (i < ss.stars ? 'on' : '') + '">★</i>';
        var e = MJ.D.stages.enemies[U.find(sg.enemies, function (x) { return x.leader; }) ? U.find(sg.enemies, function (x) { return x.leader; }).e : sg.enemies[0].e];
        h += '<div class="snode k-' + sg.kind + (open ? '' : ' locked') + '" data-a="' + (open ? 'stagePop' : 'info') + '" data-v="' + (open ? sg.id : G.lockReason(sg.id)) + '">' +
          '<div class="sn-art">' + (open ? MJ.Art.portrait({ g: e.look[0], skin: e.look[1], hair: e.look[2], hs: e.look[3], beard: e.look[4], cloth: e.look[5], trim: e.look[6], wp: e.look[7] }, sg.kind === 'normal' ? 1 : (sg.kind === 'elite' ? 3 : 4), { enemy: true }) : '<div class="lockart">？</div>') + '</div>' +
          '<div class="sn-name">' + U.esc(sg.name) + ' <small>' + ch + '-' + (sg.idx + 1) + '</small></div><div class="sn-kind">' + KIND[sg.kind] + '</div><div class="stars">' + stars + '</div></div>';
      });
      h += '</div></div>';
    }
    return h + '</div>';
  };
  UI.actions.gateCh = function (v) { UI.sel.gateCh = +v; UI.render(); };
  UI.actions.gateVol = function (v) { UI.sel.gateVol = +v; UI.render(); };
  UI.actions.gateBack = function () { UI.sel.gateCh = null; UI.render(); };
  UI.actions.stagePop = function (v) { UI.open('stage', v); };
  UI.modals.stage = function (id) {
    var sg = MJ.D.stageIndex[id], ss = G.stageState(id), s = MJ.S.state;
    var leader = U.find(sg.enemies, function (x) { return x.leader; }) || sg.enemies[0];
    var b = '<div class="stage-pop"><div class="sp-l"><div class="egrid3">';
    for (var r = 0; r < 3; r++) for (var c = 2; c >= 0; c--) {
      var cell = r * 3 + c, en = U.find(sg.enemies, function (x) { return x.cell === cell; });
      if (en) { var t = MJ.D.stages.enemies[en.e]; b += '<div class="eg' + (en.leader ? ' boss' : '') + '">' + MJ.Art.portrait({ g: t.look[0], skin: t.look[1], hair: t.look[2], hs: t.look[3], beard: t.look[4], cloth: t.look[5], trim: t.look[6], wp: t.look[7] }, en.leader ? 4 : 1, { enemy: true }) + '<span>' + en.lv + '</span></div>'; }
      else b += '<div class="eg none"></div>';
    }
    b += '</div><div class="note">敵方站位（右側為前排）</div></div><div class="sp-r">';
    b += '<div class="row"><b>' + U.esc(MJ.D.stages.enemies[leader.e].name) + '</b>　等級 ' + leader.lv + '</div>';
