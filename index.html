<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>猛將無雙．單機重製版</title>
<style>
/* 猛將無雙 單機重製版 — 樣式
   配色參考官方截圖（A）：橄欖綠／卡其羊皮紙面板、金銅色鑲邊；圖形與程式為原創 */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1a1408;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif;color:#3a2a10;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input,textarea,select{-webkit-user-select:text;user-select:text;font-family:inherit}
a{cursor:pointer;color:inherit;text-decoration:none}
#stage{position:absolute;left:0;top:0;width:960px;height:600px;overflow:hidden;-webkit-transform-origin:0 0;transform-origin:0 0;background:#2a2210}
#screen,#modal,#confirm,#toast{position:absolute;left:0;top:0;width:960px;height:600px}
#modal{z-index:50;display:none}#confirm{z-index:80;display:none}#toast{z-index:120;display:none;pointer-events:none;height:auto;top:auto;bottom:96px}
.art{display:block;width:100%;height:100%}
.dim{position:absolute;left:0;top:0;width:960px;height:600px;background:rgba(10,8,0,.55)}
.note{font-size:12px;color:#6a5a30;margin:6px 0;line-height:1.4}
.empty{padding:30px;text-align:center;color:#7a6a40}
small{font-size:.85em}
hr{border:0;border-top:1px solid #b8a468;margin:8px 0}

/* ---------- 框與面板（橄欖綠框＋金邊＋羊皮紙） ---------- */
.frame{position:absolute;background:linear-gradient(#7d8b34,#5b6820);border:3px solid #d9b45a;border-radius:10px;box-shadow:0 0 0 2px #5a3e10,inset 0 0 0 2px #a8b860,0 8px 24px rgba(0,0,0,.5)}
.frame-s{background:linear-gradient(rgba(110,124,44,.95),rgba(76,88,26,.95));border:2px solid #d9b45a;border-radius:8px;box-shadow:0 0 0 1px #5a3e10,0 3px 8px rgba(0,0,0,.4)}
.parch{background:linear-gradient(#f2e7c0,#e2d29c);border:2px solid #a88a40;border-radius:6px;box-shadow:inset 0 0 12px rgba(150,120,50,.35)}
.plaque{position:absolute;left:50%;top:-16px;-webkit-transform:translateX(-50%);transform:translateX(-50%);min-width:170px;padding:5px 26px;text-align:center;font-size:18px;font-weight:bold;color:#fff6d0;letter-spacing:3px;background:linear-gradient(#8a2e18,#5e1a0a);border:2px solid #e8c870;border-radius:6px;box-shadow:0 0 0 2px #5a3e10,0 3px 6px rgba(0,0,0,.5);text-shadow:0 1px 2px #000;white-space:nowrap;z-index:3}
.xbtn{position:absolute;right:-10px;top:-12px;width:36px;height:36px;line-height:30px;text-align:center;font-size:26px;font-weight:bold;color:#fff;background:radial-gradient(#d04a2a,#7a1a08);border:2px solid #e8c870;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.5);z-index:5}
.panel{left:50%;top:50%;width:760px;max-height:540px;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);padding:26px 14px 14px}
.panel.narrow{width:520px}.panel.narrow2{width:640px}.panel.wide{width:900px}
.panel-body{background:linear-gradient(#f2e7c0,#e2d29c);border:2px solid #a88a40;border-radius:6px;padding:12px;max-height:470px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.bigframe{left:20px;top:84px;width:920px;height:502px;padding:30px 12px 12px}
.inner{position:absolute;left:12px;right:12px;top:72px;bottom:12px;padding:10px;overflow:hidden}

/* ---------- 按鈕（橄欖綠金邊，紅為重要動作） ---------- */
.btn{display:inline-block;min-width:84px;padding:7px 16px;margin:3px;text-align:center;font-size:15px;font-weight:bold;color:#fffbe6;background:linear-gradient(#a8b850,#6a7a22 55%,#56651a);border:2px solid #e2c060;border-radius:6px;box-shadow:0 0 0 1px #4a3a10,0 2px 3px rgba(0,0,0,.45);text-shadow:0 1px 1px #2a2a00,0 0 2px #2a2a00;white-space:nowrap;vertical-align:middle;min-height:36px;line-height:20px}
.btn:active{-webkit-transform:translateY(1px);transform:translateY(1px);filter:brightness(.92)}
.btn.red{background:linear-gradient(#e0704a,#b03418 55%,#8a2410)}
.btn.small{min-width:0;padding:5px 10px;font-size:13px;min-height:30px;line-height:18px}
.btn.big{font-size:20px;padding:10px 34px;letter-spacing:3px}
.btn.disabled,.disabled{filter:grayscale(1);opacity:.6}
.btn .art.icon{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin:0 2px}
.btn-row{text-align:center;margin-top:8px}
.link{display:block;margin-top:10px;color:#6a3a00;text-decoration:underline;font-size:13px;text-align:center}
.tabs{display:flex;display:-webkit-flex;gap:4px;margin:0 0 6px 6px}
.tab{padding:6px 20px;font-size:15px;font-weight:bold;color:#e8e0b0;background:linear-gradient(#6a7426,#48521a);border:2px solid #b89a48;border-bottom:0;border-radius:8px 8px 0 0;min-height:34px}
.tab.on{color:#5a2a00;background:linear-gradient(#fff4c8,#ead8a0);border-color:#e8c870}
.tabs.small .tab{padding:4px 10px;font-size:13px;min-height:28px}
.pager{text-align:center;margin:4px 0;font-size:14px}
.pager span{display:inline-block;min-width:50px}
.pbtn{display:inline-block;width:36px;height:30px;line-height:28px;text-align:center;color:#fff;background:linear-gradient(#a8b850,#5a6a1c);border:2px solid #d9b45a;border-radius:6px}

/* ---------- 品質色（白綠藍紫金） ---------- */
.q0t,.eqt0{color:#5a5a5a}.q1t,.eqt1{color:#2a8a1a}.q2t,.eqt2{color:#1a5ac0}.q3t,.eqt3{color:#8a2ac8}.q4t,.eqt4{color:#c87800}
.qtag{display:inline-block;padding:1px 8px;border-radius:4px;color:#fff;font-size:13px;background:#888}
.qtag.q1{background:#3a9a2a}.qtag.q2{background:#2a6ad0}.qtag.q3{background:#8a3ad0}.qtag.q4{background:#d08a10}

/* ---------- 頭像卡 ---------- */
.card{position:relative;display:inline-block;width:76px;height:92px;margin:3px;vertical-align:top;border:3px solid #9a9a9a;border-radius:6px;background:#3a3020;overflow:hidden;box-shadow:0 2px 3px rgba(0,0,0,.4)}
.card .art.portrait{width:70px;height:70px}
.card.q1{border-color:#5ab84a}.card.q2{border-color:#4a8ae8}.card.q3{border-color:#b05ae8}.card.q4{border-color:#f0b030}
.card.sel{box-shadow:0 0 0 3px #fff4a0,0 0 12px #ffe060}
.card .nm{position:absolute;left:0;right:0;bottom:0;height:20px;line-height:20px;font-size:12px;text-align:center;color:#fff;background:rgba(0,0,0,.65);white-space:nowrap;overflow:hidden}
.lvb{position:absolute;left:2px;top:2px;min-width:20px;padding:0 3px;height:18px;line-height:18px;font-size:12px;font-weight:bold;text-align:center;color:#fff;background:#8a2410;border:1px solid #e8c870;border-radius:9px}
.lvb.big{font-size:14px;height:22px;line-height:20px;min-width:26px;border-radius:11px}
.badge{position:absolute;right:2px;top:2px;padding:0 4px;font-size:12px;color:#fff;background:#5a6a1c;border:1px solid #e8c870;border-radius:4px}
.card.mini{width:44px;height:44px;margin:1px;border-width:2px}.card.mini .art.portrait{width:40px;height:40px}.card.mini .nm{display:none}.card.mini .lvb{font-size:10px;height:14px;line-height:13px;min-width:14px}
.card.lockslot{background:repeating-linear-gradient(45deg,#4a4030,#4a4030 6px,#3a3224 6px,#3a3224 12px);border-color:#6a5a3a}
.card.lockslot span{display:block;line-height:86px;text-align:center;color:#8a7a5a;font-size:22px}

/* ---------- 主城 ---------- */
.city{position:absolute;left:0;top:0;width:960px;height:600px;overflow:hidden}
.city>.art.sky{position:absolute;left:0;top:0}
.bld{position:absolute;cursor:pointer;-webkit-transition:-webkit-transform .15s;transition:transform .15s}
.bld:active{-webkit-transform:scale(.97);transform:scale(.97)}
.bld.locked .art{filter:saturate(.45) brightness(.85)}
.bname{position:absolute;left:50%;bottom:4px;-webkit-transform:translateX(-50%);transform:translateX(-50%);text-align:center;white-space:nowrap}
.bname b{display:block;padding:2px 12px;font-size:15px;color:#fff6c8;background:linear-gradient(#7d8b34,#4e5a1a);border:2px solid #e2c060;border-radius:5px;text-shadow:0 1px 2px #000;box-shadow:0 2px 3px rgba(0,0,0,.45)}
.bname span{display:inline-block;margin-top:2px;padding:0 6px;font-size:11px;color:#fff;background:rgba(40,30,0,.7);border-radius:3px}
.hud-tl{position:absolute;left:6px;top:6px;width:290px;height:76px;padding:4px;display:flex;display:-webkit-flex;z-index:20}
.avatar{position:relative;width:66px;height:66px;border:2px solid #e8c870;border-radius:6px;overflow:hidden;background:#3a3020;flex-shrink:0}
.avatar .lvb{left:auto;right:1px;top:auto;bottom:1px}
.hud-info{flex:1;-webkit-flex:1;padding-left:6px;color:#fff}
.pname{font-weight:bold;font-size:15px;color:#fff6c8;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden}
.erow{display:flex;display:-webkit-flex;align-items:center;-webkit-align-items:center;margin-top:2px}
.erow .art.icon{width:18px;height:18px;flex-shrink:0}
.regen{font-size:11px;color:#e8f0b0;text-align:right}
.bar{position:relative;height:15px;background:#2a2008;border:1px solid #c9a24a;border-radius:8px;overflow:hidden;flex:1;-webkit-flex:1;margin-top:2px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffe070,#d09a10)}
.bar.energy i{background:linear-gradient(#80e0ff,#2a8ad0)}
.bar.exp i{background:linear-gradient(#b0f070,#4a9a10)}
.bar b{position:relative;display:block;text-align:center;font-size:11px;line-height:13px;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;white-space:nowrap}
.hud-top{position:absolute;right:8px;top:8px;display:flex;display:-webkit-flex;gap:6px;z-index:20}
.cur{position:relative;display:flex;display:-webkit-flex;align-items:center;-webkit-align-items:center;height:32px;padding:0 6px 0 2px;background:linear-gradient(rgba(70,80,20,.92),rgba(40,46,10,.92));border:2px solid #d9b45a;border-radius:16px;color:#fff6c8;font-size:14px}
.cur .art.icon{width:26px;height:26px}
.cur b{min-width:60px;text-align:right;padding-right:4px}
.plus{width:22px;height:22px;line-height:20px;text-align:center;border-radius:50%;background:#3a9a2a;border:1px solid #fff;color:#fff;font-weight:bold}
.mailbtn{width:40px;justify-content:center;-webkit-justify-content:center;padding:0}
.dot{position:absolute;right:-2px;top:-2px;width:12px;height:12px;border-radius:50%;background:#ff3020;border:2px solid #fff}
.team-strip{position:absolute;left:6px;top:88px;padding:3px 6px;display:flex;display:-webkit-flex;align-items:center;-webkit-align-items:center;z-index:19;cursor:pointer}
.ts-t,.ts-n{color:#fff6c8;font-size:13px;font-weight:bold;padding:0 4px;text-shadow:0 1px 1px #000}
.gifts{position:absolute;right:8px;top:50px;display:flex;display:-webkit-flex;gap:4px;z-index:19}
.gift{position:relative;width:62px;text-align:center;color:#fff;font-size:11px;text-shadow:0 1px 2px #000,0 0 2px #000}
.gift .art.icon{width:46px;height:46px;margin:0 auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.gift span{display:block;white-space:nowrap}
.gift em{font-style:normal;color:#ffe080}
.dim2{opacity:.6}
.chat{position:absolute;left:6px;bottom:66px;width:430px;padding:4px 8px;font-size:12px;line-height:17px;color:#fff;background:rgba(20,18,0,.55);border-radius:6px;z-index:18;pointer-events:none}
.chat div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottombar{position:absolute;right:6px;bottom:4px;display:flex;display:-webkit-flex;gap:3px;padding:3px 8px;background:linear-gradient(rgba(110,124,44,.95),rgba(70,80,22,.95));border:2px solid #d9b45a;border-radius:10px;z-index:20}
.bb{width:62px;height:54px;text-align:center;color:#fff6c8;font-size:12px;font-weight:bold;text-shadow:0 1px 1px #000}
.bb .art.icon{width:36px;height:36px;margin:0 auto}

/* ---------- 一般畫面 ---------- */
.scr{position:absolute;left:0;top:0;width:960px;height:600px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#6a7a3a,#2a3010 75%)}
.scr>.hud-tl,.scr>.hud-top{z-index:20}

/* ---------- 聚賢莊 ---------- */
.recruit-scr .inner{display:flex;display:-webkit-flex;gap:10px}
.rec-left{width:170px;flex-shrink:0}
.rbtn{display:block;margin-bottom:8px;padding:8px;text-align:center;color:#fff;border:2px solid #e2c060;border-radius:8px;box-shadow:0 2px 3px rgba(0,0,0,.4);text-shadow:0 1px 1px #000;min-height:64px}
.rbtn b{display:block;font-size:16px}.rbtn span{display:block;font-size:12px}.rbtn .sub{color:#fff0a0}
.rk-normal{background:linear-gradient(#a8b850,#5a6a1c)}.rk-purple{background:linear-gradient(#b070e0,#5a2090)}.rk-supreme{background:linear-gradient(#f0c040,#a06010)}
.rbtn em{font-style:normal}
.cands{flex:1;-webkit-flex:1;display:flex;display:-webkit-flex;gap:8px;justify-content:center;-webkit-justify-content:center}
.cand{width:160px;padding:8px 6px;text-align:center;background:linear-gradient(#fbf3d4,#e8d8a4);border:3px solid #9a9a9a;border-radius:8px;box-shadow:0 3px 6px rgba(0,0,0,.35);font-size:12px}
.cand.q1{border-color:#5ab84a}.cand.q2{border-color:#4a8ae8}.cand.q3{border-color:#b05ae8;box-shadow:0 0 12px rgba(176,90,232,.7)}.cand.q4{border-color:#f0b030;box-shadow:0 0 14px rgba(240,176,48,.85)}
.cand-q{font-weight:bold;font-size:13px}
.cand.q1 .cand-q{color:#2a8a1a}.cand.q2 .cand-q{color:#1a5ac0}.cand.q3 .cand-q{color:#8a2ac8}.cand.q4 .cand-q{color:#c87800}
.cand-art{width:100px;height:100px;margin:2px auto;border:2px solid #a88a40;border-radius:6px;overflow:hidden;background:#3a3020}
.cand-name{font-size:17px;font-weight:bold;color:#5a2a00}
.cand-type{color:#6a5a30;margin-bottom:2px}
.mini-stats{width:100%;border-collapse:collapse;margin:2px 0}.mini-stats td{padding:1px 2px;border-bottom:1px dotted #c0a860}
.mini-stats td:nth-child(odd){color:#7a5a20}.mini-stats td:nth-child(even){font-weight:bold;text-align:left}
.cand-skill{min-height:32px;color:#5a3a10;margin:3px 0}
.flip-in{-webkit-animation:flipin .5s both;animation:flipin .5s both}
@-webkit-keyframes flipin{from{-webkit-transform:rotateY(90deg);opacity:0}to{-webkit-transform:none;opacity:1}}
@keyframes flipin{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.roster-grid{min-height:200px}
.roster-info{margin-top:6px;font-size:14px}
.soul-list{display:flex;display:-webkit-flex;flex-wrap:wrap;-webkit-flex-wrap:wrap;gap:6px}
.soulrow{display:flex;display:-webkit-flex;align-items:center;-webkit-align-items:center;gap:8px;width:420px;padding:4px;background:rgba(255,255,255,.35);border:2px solid #b8a468;border-radius:6px;font-size:13px}
.soulrow .art.portrait{width:52px;height:52px;border-radius:4px;background:#3a3020;flex-shrink:0}
.soulrow>div{flex:1;-webkit-flex:1}
.rc-box{display:flex;display:-webkit-flex;gap:12px;align-items:center;-webkit-align-items:center;text-align:left}
.rc-box .art.portrait{width:84px;height:84px;flex-shrink:0;border:2px solid #a88a40;border-radius:6px;background:#3a3020}
.odds{border-collapse:collapse;margin:0 auto;font-size:13px}.odds td,.odds th{border:1px solid #b8a468;padding:3px 7px;text-align:center}
.reveal{position:absolute;left:50%;top:50%;width:440px;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);text-align:center;color:#fff}
.rays{position:absolute;left:50%;top:150px;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(rgba(255,230,120,.28) 0 10deg,transparent 10deg 20deg);border-radius:50%;-webkit-animation:spin 12s linear infinite;animation:spin 12s linear infinite}
@-webkit-keyframes spin{to{-webkit-transform:rotate(360deg)}}@keyframes spin{to{transform:rotate(360deg)}}
.reveal-stand{position:relative;width:240px;height:300px;margin:0 auto;-webkit-animation:popin .6s both;animation:popin .6s both}
.reveal-text{position:relative;font-size:22px;font-weight:bold;text-shadow:0 2px 3px #000;margin-top:4px}
.reveal-sub{position:relative;font-size:14px;margin:6px 0;text-shadow:0 1px 2px #000}
.reveal .btn-row{position:relative}
@-webkit-keyframes popin{from{-webkit-transform:scale(.3);opacity:0}70%{-webkit-transform:scale(1.08)}to{-webkit-transform:none;opacity:1}}
@keyframes popin{from{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}to{transform:none;opacity:1}}

/* 立繪：金色法陣＋光暈（A：官方立繪風格） */
.mc-wrap{position:absolute;left:50%;bottom:6px;width:220px;height:88px;margin-left:-110px;-webkit-animation:glow 2.4s ease-in-out infinite;animation:glow 2.4s ease-in-out infinite}
.aura-wrap{position:absolute;left:50%;bottom:30px;width:200px;height:300px;margin-left:-100px;-webkit-animation:aura 1.8s ease-in-out infinite;animation:aura 1.8s ease-in-out infinite;pointer-events:none}
.hero-fig{position:absolute;left:50%;bottom:22px;width:180px;height:280px;margin-left:-90px}
@-webkit-keyframes glow{50%{opacity:.7}}@keyframes glow{50%{opacity:.7}}
@-webkit-keyframes aura{50%{-webkit-transform:scale(1.05,1.08);opacity:.75}}@keyframes aura{50%{transform:scale(1.05,1.08);opacity:.75}}

/* ---------- 神武殿 ---------- */
.hall-scr .bigframe{top:12px;height:578px}
.statpanel{position:absolute;left:12px;top:72px;width:230px;height:330px;padding:8px;font-size:13px}
.sp-name{font-size:18px;font-weight:bold;color:#5a2a00}.sp-name span{font-size:14px;color:#8a2410}
.sp-type{color:#6a5a30;margin-bottom:4px}
.stats{width:100%;border-collapse:collapse;margin-top:6px}
.stats td{padding:4px 3px;border-bottom:1px dotted #b8a468}
.stats td:nth-child(odd){color:#7a5a20;width:22%}.stats td:nth-child(even){font-weight:bold;color:#2a1a00}
.stats tr.sep td{border-top:2px solid #a88a40}
.sp-btns{margin-top:8px;text-align:center}
.tagok{display:inline-block;padding:4px 10px;background:#5a6a1c;color:#fff;border-radius:4px}
.hall-center{position:absolute;left:252px;top:72px;width:330px;height:330px;border:2px solid #a88a40;border-radius:6px;overflow:hidden;background:radial-gradient(ellipse at 50% 85%,#4a3a6a,#151030 70%)}
.starry{position:absolute;left:0;top:0;right:0;bottom:0;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#ffe 1px,transparent 1.5px);background-size:47px 53px,71px 61px;background-position:0 0,23px 31px;opacity:.5}
.rock{position:absolute;left:40px;right:40px;bottom:0;height:40px;background:radial-gradient(ellipse at 50% 0,#5a4a3a,#2a2018 70%);border-radius:50% 50% 0 0}
.hall-center .hero-fig{bottom:30px}
.eslot{position:absolute;width:64px;height:64px}
.es0{left:8px;top:40px}.es1{left:8px;top:150px}.es2{right:8px;top:40px}.es3{right:8px;top:150px}
.ecell{position:relative;display:inline-block;width:62px;height:62px;margin:2px;vertical-align:top;background:#3a3020;border:2px solid #8a8a8a;border-radius:6px;overflow:hidden}
.eslot .ecell{margin:0}
.ecell .art.icon{width:58px;height:58px}
.ecell.eq1{border-color:#5ab84a}.ecell.eq2{border-color:#4a8ae8}.ecell.eq3{border-color:#b05ae8}.ecell.eq4{border-color:#f0b030}
.ecell.sel{box-shadow:0 0 0 3px #fff4a0,0 0 10px #ffe060}
.elv{position:absolute;left:1px;top:1px;font-size:10px;color:#fff;background:rgba(0,0,0,.6);padding:0 3px;border-radius:3px}
.enm{position:absolute;left:0;right:0;bottom:0;font-size:10px;line-height:14px;text-align:center;color:#fff;background:rgba(0,0,0,.6);white-space:nowrap;overflow:hidden}

      pdef: Math.floor((p.str * 0.5 + p.con * 0.67) * m + lv * 1.5),
      mdef: Math.floor((p.int * 0.5 + p.con * 0.42) * m + lv * 1.5),
      hp: Math.floor((p.con * 20 + lv * 13) * m * 0.8),
      hit: 0, crit: tpl.boss ? 5 : 0, dodge: 0,
      layers: 1, boss: !!tpl.boss,
      look: { g: tpl.look[0], skin: tpl.look[1], hair: tpl.look[2], hs: tpl.look[3], beard: tpl.look[4], cloth: tpl.look[5], trim: tpl.look[6], wp: tpl.look[7] },
      active: { name: tpl.boss ? tpl.name.split('·').pop() + '之擊' : '攻擊', pattern: tpl.pattern, mult: 1, flat: 0 },
      ult: { name: tpl.boss ? '絕技·' + tpl.name.split('·').pop() : '奮力一擊', pattern: tpl.ult, mult: tpl.boss ? 1.6 : 1.4, flat: lv * 4 },
      passive: null
    };
    // A：宣傳片 Boss 有多層血條；倍數為 D
    // 第三階段：第 5～8 章與高層通天塔的 Boss 血條層數增加（D）
    var deep = (stage.ch || 0) >= 5 || (stage.depth || 0) >= 5;
    if (spec.leader && (stage.kind === 'boss' || stage.kind === 'hidden')) { u.hp = Math.floor(u.hp * (deep ? 3 : 2.4)); u.layers = deep ? ((stage.ch || stage.depth) >= 7 ? 5 : 4) : 3; }
    else if (spec.leader && stage.kind === 'elite') { u.hp = Math.floor(u.hp * (deep ? 2 : 1.7)); u.layers = deep ? 3 : 2; }
    else if (spec.leader) { u.hp = Math.floor(u.hp * 1.3); }
    // 第五階段平衡：中後期敵人成長曲線（D，依 tools/balance.js 模擬調整，玩家裝備成長為二次曲線，敵人原為線性）
    var es = cfg.enemyScale;
    if (es && lv > es.from) {
      var x = lv - es.from, fa = 1 + es.atk * x + (es.atk2 || 0) * x * x, fd = 1 + es.def * x + (es.def2 || 0) * x * x, fh = 1 + es.hp * x + (es.hp2 || 0) * x * x;
      U.each(['patk', 'matk', 'jatk'], function (k) { u[k] = Math.floor(u[k] * fa); });
      U.each(['pdef', 'mdef', 'jdef'], function (k) { u[k] = Math.floor(u[k] * fd); });
      u.hp = Math.floor(u.hp * fh); u.ult.flat = Math.floor(u.ult.flat * fa);
    }
    return u;
  };

  // 戰鬥單位（我方）
  R.heroUnit = function (h, st) {
    var def = R.heroDef(h.id), d = R.battleStats(h, st);
    var name = h.id === 'lead' ? (st.player.name || '主角') : def.name;
    var look = def.look;
    if (h.id === 'lead' && st.player.look) look = st.player.look;
    return {
      name: name, lv: h.lv, phys: d.phys, dtype: d.dtype, agi: d.agi, patk: d.patk, matk: d.matk, jatk: d.jatk, pdef: d.pdef, mdef: d.mdef, jdef: d.jdef,
      hp: d.hp, hit: d.hit, crit: d.crit, dodge: d.dodge, look: look, quality: h.id === 'lead' ? 3 : def.quality,
      active: R.skillOf(h, 'a'), ult: R.skillOf(h, 'u'), passive: def.passive, pm: R.passiveMul(h), layers: 1, hid: h.uid, star: h.star || 0
    };
  };
  return R;
})();

</script>
<script>/* js/battle.js */
/* 戰鬥引擎（純邏輯，不碰畫面）
   先完整模擬並產生事件列表，畫面只負責重播。
   傷害公式為「暫定」（D）：原作公式未公開。 */
MJ.Battle = (function () {
  var B = {}, U = MJ.U;
  B.FORMULA_NOTE = '暫定傷害公式（D，非原作數值）：傷害 = max(1, (攻擊 × 技能倍率 + 固定值) × 隨機(0.95~1.05) − 防禦)；物理對物防、法術對法防、絕技對絕技防禦（A：三種傷害）；命中率 = 90% + (命中 − 閃避)%；暴擊率 = 5% + 暴擊%，暴擊 ×1.5；目標高於攻擊者 10 級以上必定未命中（B）。';

  function rc(cell) { return { r: Math.floor(cell / 3), c: cell % 3 }; }
  function cellOf(r, c) { return r * 3 + c; }
  B.patternCells = function (pattern, tcell) {
    var p = rc(tcell), out = [], r, c;
    function add(r2, c2) { if (r2 >= 0 && r2 < 3 && c2 >= 0 && c2 < 3) out.push(cellOf(r2, c2)); }
    switch (pattern) {
      case 'line2': add(p.r, p.c); add(p.r, p.c + 1); break;
      case 'line3': for (c = 0; c < 3; c++) add(p.r, c); break;
      case 'col2': add(p.r, p.c); add(p.r < 2 ? p.r + 1 : p.r - 1, p.c); break;
      case 'col3': for (r = 0; r < 3; r++) add(r, p.c); break;
      case 'square': var r2 = p.r < 2 ? p.r + 1 : p.r - 1, c2 = p.c < 2 ? p.c + 1 : p.c - 1; add(p.r, p.c); add(p.r, c2); add(r2, p.c); add(r2, c2); break;
      case 'cross': add(p.r, p.c); add(p.r - 1, p.c); add(p.r + 1, p.c); add(p.r, p.c - 1); add(p.r, p.c + 1); break;
      case 'diag': add(p.r, p.c); add(p.r - 1, p.c - 1); add(p.r - 1, p.c + 1); add(p.r + 1, p.c - 1); add(p.r + 1, p.c + 1); break;
      case 'all': for (r = 0; r < 9; r++) out.push(r); break;
      default: add(p.r, p.c);
    }
    return out;
  };
  // C：優先攻擊同一排最前方的敵人，否則最近一排
  B.pickTarget = function (unit, foes) {
    var alive = U.filter(foes, function (u) { return u.hp > 0; });
    if (!alive.length) return null;
    var my = rc(unit.cell).r, best = null, bestKey = 1e9;
    U.each(alive, function (u) {
      var p = rc(u.cell), key = Math.abs(p.r - my) * 10 + p.c + (p.r < my ? 0.5 : 0);
      if (key < bestKey) { bestKey = key; best = u; }
    });
    return best;
  };

  // A（影片2）：雙方依位置交替行動——左方前排下、右方前排下、左方前排中……；由前列到後列，同列由下到上
  B.posKey = function (cell) { var p = rc(cell); return p.c * 3 + (2 - p.r); };
  B.turnOrder = function (A, Bs) {
    function sorted(list) { return U.filter(list, function (u) { return u.hp > 0; }).sort(function (a, b) { return B.posKey(a.cell) - B.posKey(b.cell); }); }
    var a = sorted(A), b = sorted(Bs), out = [], n = Math.max(a.length, b.length);
    for (var i = 0; i < n; i++) { if (a[i]) out.push(a[i]); if (b[i]) out.push(b[i]); }
    return out;
  };
  function mkUnit(src, side, cell) {
    var u = U.extend({}, src);
    u.side = side; u.cell = cell; u.key = side + cell;
    u.maxHp = src.hp; u.hp = src.curHp != null ? Math.max(0, Math.min(src.hp, src.curHp)) : src.hp; u.rage = src.curRage || 0;
    u.dtype = src.dtype || (src.phys ? 'p' : 'm'); u.pm = src.pm || 1;
    if (u.jatk == null) u.jatk = Math.max(src.patk || 0, src.matk || 0);
    if (u.jdef == null) u.jdef = src.pdef || 0; u.stun = 0; u.defBuff = 0; u.defBuffT = 0; u.revived = false;
    return u;
  }

  B.run = function (teamA, teamB, opt) {
    opt = opt || {};
    var rng = U.rng(opt.seed || 1);
    var maxRounds = opt.maxRounds || 36, lvSup = opt.levelSuppression || 10;
    var A = [], Bs = [], ev = [], all, pending = [];
    U.each(teamA, function (x) { A.push(mkUnit(x.unit, 'A', x.cell)); });
    U.each(teamB, function (x) { Bs.push(mkUnit(x.unit, 'B', x.cell)); });
    all = A.concat(Bs);
    function foesOf(u) { return u.side === 'A' ? Bs : A; }
    function alliesOf(u) { return u.side === 'A' ? A : Bs; }
    function alive(list) { return U.filter(list, function (u) { return u.hp > 0; }); }
    function snapshot(u) { return { key: u.key, hp: u.hp, maxHp: u.maxHp, rage: u.rage }; }

    function hurt(att, tgt, skill, isCounter) {
      var e = { t: 'hit', from: att.key, to: tgt.key };
      if (tgt.lv - att.lv > lvSup) { e.miss = true; e.why = '等級壓制'; ev.push(e); return 0; }
      var hitCh = U.clamp(0.9 + ((att.hit || 0) - (tgt.dodge || 0)) / 100, 0.2, 1);
      if (rng() > hitCh) { e.miss = true; e.why = '閃避'; ev.push(e); return 0; }
      // 三種傷害（A）：物理對物防、法術對法防、絕技對絕技防禦（以敏捷為主，D）
      var dt = att.dtype, atk = (dt === 'p' ? att.patk : dt === 'm' ? att.matk : att.jatk) * (1 + (att.atkBuff || 0)), def = dt === 'p' ? tgt.pdef : dt === 'm' ? tgt.mdef : tgt.jdef;
      e.dt = dt;
      var raw = (atk * skill.mult + (skill.flat || 0)) * (0.95 + rng() * 0.1) - def * (1 + tgt.defBuff);
      var dmg = Math.max(1, Math.floor(raw));
      if (rng() < 0.05 + (att.crit || 0) / 100) { dmg = Math.floor(dmg * 1.5); e.crit = true; }
      tgt.hp = Math.max(0, tgt.hp - dmg);
      e.dmg = dmg; e.hp = tgt.hp;
      ev.push(e);
      if (skill.ultTotal) skill.ultTotal.v += dmg;
      // A：「狂暴」字樣見於官方圖；觸發條件與數值為 D——王關首領生命低於 30% 時攻擊 +20%
      if (tgt.hp > 0 && tgt.boss && tgt.layers > 1 && !tgt.kb && tgt.hp < tgt.maxHp * 0.3) { tgt.kb = true; tgt.atkBuff = 0.2; ev.push({ t: 'text', to: tgt.key, s: '狂暴', c: 'red' }); }
      if (tgt.hp > 0) {
        if (att.passive === 'xinu') { var xn = Math.round(20 * att.pm); tgt.rage = Math.max(0, tgt.rage - xn); ev.push({ t: 'text', to: tgt.key, s: '無雙-' + xn, c: 'red' }); }
        else gainRage(tgt, 10 + Math.floor(rng() * 11));
      }
      if (att.passive === 'xixue' && att.hp > 0) {
        var hv = Math.max(1, Math.floor(dmg * 0.15 * att.pm)); att.hp = Math.min(att.maxHp, att.hp + hv);
        ev.push({ t: 'heal', to: att.key, amt: hv, hp: att.hp, why: '吸血' });
      }
      if (tgt.hp <= 0) die(tgt);
      else if (skill.fx) {
        if (skill.fx.stun && rng() < skill.fx.stun) { tgt.stun = 1; ev.push({ t: 'status', to: tgt.key, s: '眩暈' }); }
        if (skill.fx.armorBreak && rng() < skill.fx.armorBreak) { tgt.defBuff = -0.15; tgt.defBuffT = 2; ev.push({ t: 'text', to: tgt.key, s: '防禦-15%', c: 'red' }); }
      }
      if (!isCounter && tgt.hp > 0 && tgt.passive === 'huizhan' && !tgt.stun && rng() < 0.2 * tgt.pm) {
        pending.push({ a: tgt, b: att }); // 反擊延到本次招式結算後

      }
      return dmg;
    }
    // C：無雙值——攻擊 +25~35、受擊 +10~20，滿 100 施放無雙技（影片2 顯示綠字「無雙+31」）
    function gainRage(u, n) {
      if (u.hp <= 0 || u.rage >= 100) return;
      u.rage = Math.min(100, u.rage + n);
      ev.push({ t: 'rage', u: u.key, gain: n, rage: u.rage });
    }
    function die(u) {
      if (!u.revived && (u.passive === 'suxing' || u.passive === 'busi')) {
        u.revived = true;
        u.hp = u.passive === 'suxing' ? Math.max(1, Math.floor(u.maxHp * 0.15 * u.pm)) : 1;
        ev.push({ t: 'revive', to: u.key, hp: u.hp, name: u.passive === 'suxing' ? '甦醒' : '不死' });
        return;
      }
      u.hp = 0;
      ev.push({ t: 'dead', to: u.key });
    }
    function useSkill(u, skill, isUlt) {
      if (skill.pattern === 'healAll') {
        var mates = alive(alliesOf(u));
        ev.push({ t: 'act', u: u.key, skill: skill.name, ult: isUlt, cells: U.map(mates, function (m) { return m.cell; }), side: u.side, heal: true });
        var base = Math.max(u.matk, u.patk);
        U.each(mates, function (m) {
          var amt = Math.max(1, Math.floor((base * skill.mult + (skill.flat || 0)) * (0.95 + rng() * 0.1)));
          m.hp = Math.min(m.maxHp, m.hp + amt);
          ev.push({ t: 'heal', to: m.key, amt: amt, hp: m.hp });
        });
        return;
      }
      var foes = foesOf(u), tgt = B.pickTarget(u, foes);
      if (!tgt) return;
      var cells = B.patternCells(skill.pattern, tgt.cell);
      ev.push({ t: 'act', u: u.key, skill: skill.name, ult: isUlt, cells: cells, side: tgt.side, target: tgt.key, pattern: skill.pattern });
      var sk = skill;
      if (isUlt) { sk = U.extend({}, skill); sk.ultTotal = { v: 0 }; }
      U.each(foes, function (f) { if (f.hp > 0 && cells.indexOf(f.cell) >= 0) hurt(u, f, sk, false); });
      if (isUlt) ev.push({ t: 'ultEnd', u: u.key, total: sk.ultTotal.v });
      var pc = pending; pending = [];
      U.each(pc, function (p) {
        if (p.a.hp <= 0 || p.b.hp <= 0) return;
        ev.push({ t: 'act', u: p.a.key, skill: '反擊', ult: false, cells: [p.b.cell], side: p.b.side, target: p.b.key, counter: true });
        ev.push({ t: 'text', to: p.a.key, s: '反擊', c: 'red' });
        hurt(p.a, p.b, { mult: 1, flat: 0 }, true);
      });
      if (skill.fx && skill.fx.buffDef) {
        U.each(alive(alliesOf(u)), function (m) { m.defBuff = skill.fx.buffDef; m.defBuffT = 2; ev.push({ t: 'text', to: m.key, s: '物防+' + Math.round(skill.fx.buffDef * 100) + '%', c: 'green' }); });
      }
    }
    var round = 0, winner = null;
    ev.push({ t: 'start', units: U.map(all, snapshot) });
    while (round < maxRounds && !winner) {
      round++;
      ev.push({ t: 'round', n: round });
      var order = B.turnOrder(A, Bs);
      for (var i = 0; i < order.length && !winner; i++) {
        var u = order[i];
        if (u.hp <= 0) continue; // 陣亡單位不行動
        if (u.defBuffT) { u.defBuffT--; if (!u.defBuffT) u.defBuff = 0; }
        if (u.stun) { u.stun = 0; ev.push({ t: 'skip', u: u.key, why: '眩暈' }); continue; }
        if (u.passive === 'liaoshang' && u.hp < u.maxHp && rng() < 0.5) {
          var hv = Math.floor(u.maxHp * 0.08 * u.pm); u.hp = Math.min(u.maxHp, u.hp + hv);
          ev.push({ t: 'text', to: u.key, s: '療傷', c: 'green' }); ev.push({ t: 'heal', to: u.key, amt: hv, hp: u.hp });
        }
        var isUlt = u.rage >= 100;
        if (isUlt) u.rage = 0;
        useSkill(u, isUlt ? u.ult : u.active, isUlt);
        if (u.hp > 0 && !isUlt) gainRage(u, 25 + Math.floor(rng() * 11));
        if (u.hp > 0 && u.passive === 'lianzhan' && alive(foesOf(u)).length && rng() < Math.min(0.5, 0.2 * u.pm)) {
          ev.push({ t: 'text', to: u.key, s: '2連擊', c: 'red' });
          useSkill(u, u.active, false);
        }
        if (!alive(Bs).length) winner = 'A';
        else if (!alive(A).length) winner = 'B';
      }
    }
    var win = winner === 'A';
    ev.push({ t: 'end', win: win, timeout: !winner, rounds: round });
    return {
      win: win, timeout: !winner, rounds: round, events: ev,
      deadA: U.filter(A, function (u) { return u.hp <= 0; }).length,
      units: U.map(all, function (u) { return { key: u.key, side: u.side, cell: u.cell, name: u.name, hp: u.hp, maxHp: u.maxHp, rage: u.rage, hid: u.hid }; })
    };
  };
  return B;
})();

<script>/* js/state.js */
/* 存檔：LocalStorage 自動存檔、手動存檔、匯出/匯入（含驗證）、重置、版本遷移 */
MJ.S = (function () {
  var S = {}, U = MJ.U;
  S.KEY = 'mjws_save';
  S.BACKUP_KEY = 'mjws_save_backup';
  S.VERSION = 4; // v1=第一階段 v2=第二階段養成 v3=第三階段副本與經濟 v4=第四階段音效與拜訪武將
  S.RELEASE = '正式版（第五階段＋奇遇）';
  S.APP = 'mengjiang-remake';
  S.state = null;
  S.lastSave = 0;
  S.storageOk = true;

  function ls() { try { return window.localStorage; } catch (e) { return null; } }
  S.storageAvailable = function () {
    var s = ls(); if (!s) return false;
    try { s.setItem('__mj_t', '1'); s.removeItem('__mj_t'); return true; } catch (e) { return false; }
  };
  // 驗證：回傳錯誤訊息陣列，空陣列代表通過
  S.validate = function (st) {
    var err = [];
    function need(cond, msg) { if (!cond) err.push(msg); }
    need(st && typeof st === 'object', '存檔不是物件');
    if (err.length) return err;
    need(typeof st.version === 'number', '缺少版本號 version');
    need(st.version <= S.VERSION, '存檔版本 ' + st.version + ' 比遊戲新，無法讀取');
    need(st.player && typeof st.player.name === 'string', '缺少玩家資料');
    if (st.player) {
      need(typeof st.player.gold === 'number' && st.player.gold >= 0, '金幣數值錯誤');
      need(typeof st.player.silver === 'number' && st.player.silver >= 0, '銀幣數值錯誤');
      need(typeof st.player.energy === 'number' && st.player.energy >= 0, '精力數值錯誤');
    }
    need(U.isArray(st.heroes) && st.heroes.length > 0, '武將列表錯誤');
    if (U.isArray(st.heroes)) {
      var hasLead = false, uids = {};
      U.each(st.heroes, function (h) {
        if (!h || typeof h.uid !== 'number' || typeof h.lv !== 'number' || h.lv < 1) { err.push('武將資料格式錯誤'); return; }
        if (uids[h.uid]) err.push('武將編號重複'); uids[h.uid] = 1;
        if (h.id === 'lead') hasLead = true;
        else if (MJ.D && !MJ.D.heroIndex[h.id]) err.push('未知武將：' + h.id);
      });
      need(hasLead, '缺少主角');
    }
    need(st.team && st.team.cells && typeof st.team.formation === 'string', '陣容資料錯誤');
    need(st.bag && U.isArray(st.bag.equips) && st.bag.stack && typeof st.bag.stack === 'object', '包裹資料錯誤');
    need(st.stages && typeof st.stages === 'object', '關卡資料錯誤');
    return err;
  };
  // 預設欄位（可重複呼叫、不覆蓋既有值）
  function def(o, k, v) { if (o[k] == null) o[k] = v; return o[k]; }
  S.equipDefaults = function (e) { if (!e) return e; def(e, 'plus', 0); def(e, 'aff', []); def(e, 'gems', []); return e; };
  S.heroDefaults = function (h) {
    def(h, 'eq', {}); def(h, 'sk', { a: 1, u: 1, p: 1 }); def(h, 'py', { str: 0, int: 0, agi: 0, con: 0 }); def(h, 'xf', []); def(h, 'star', 0);
    U.each(U.keys(h.eq), function (k) { S.equipDefaults(h.eq[k]); });
    return h;
  };
  S.applyDefaults = function (st) {
    def(st, 'codex', {}); def(st, 'jiangxing', { lit: 0, pts: 0 });
    def(st, 'counters', {});
    if (st.player) def(st.player, 'xinghun', 0);
    if (st.settings) def(st.settings, 'econ', st.settings.energyMode === 'fast' ? 'fast' : 'std');
    if (st.buildings) def(st.buildings, 'shenbing', 1);
    U.each(st.heroes || [], function (h) { if (h) { S.heroDefaults(h); if (h.id !== 'lead') st.codex[h.id] = 1; } });
    if (st.bag && st.bag.equips) U.each(st.bag.equips, S.equipDefaults);
    U.each(st.mail || [], function (m) { if (m && m.att && m.att.equips) U.each(m.att.equips, S.equipDefaults); });
    if (S.extraDefaults) U.each(S.extraDefaults, function (f) { f(st); });
    return st;
  };
  // 版本升級步驟：S.STEPS[n] 把 vn 轉成 vn+1
  S.STEPS = {
    1: function (st) { if (st.settings && st.settings.energyMode == null) st.settings.energyMode = 'original'; },
    2: function (st) { if (st.settings && st.settings.econ == null) st.settings.econ = st.settings.energyMode === 'fast' ? 'fast' : 'std'; },
    3: function (st) { if (st.settings) { if (st.settings.bgm == null) st.settings.bgm = true; if (st.settings.sfx == null) st.settings.sfx = true; } }
  };
  // 遷移：舊版本存檔逐步升級
  S.migrate = function (st) {
    if (!st || typeof st !== 'object') return st;
    if (!st.version) st.version = 1;
    if (st.version > S.VERSION) return st; // 交給 validate 回報
    if (st.version < S.VERSION && !st.migratedFrom) st.migratedFrom = st.version;
    // 逐版升級步驟（每一步只做該版本需要的轉換；欄位補齊統一交給 applyDefaults）
    for (var v = st.version; v < S.VERSION; v++) if (S.STEPS[v]) { try { S.STEPS[v](st); } catch (e) { /* 單一步驟失敗不影響其餘欄位補齊 */ } }
    S.applyDefaults(st);
    st.version = S.VERSION;
    return st;
  };
  S.wrap = function (st) {
    return { app: S.APP, version: S.VERSION, savedAt: Date.now(), data: st };
  };
  S.parse = function (text) {
    var obj;
    try { obj = JSON.parse(text); } catch (e) { return { ok: false, errors: ['不是有效的 JSON 檔案'] }; }
    if (!obj || obj.app !== S.APP || !obj.data) return { ok: false, errors: ['不是《猛將無雙》重製版的存檔'] };
    var st = S.migrate(obj.data);
    var errs = S.validate(st);
    if (errs.length) return { ok: false, errors: errs };
    return { ok: true, state: st, savedAt: obj.savedAt };
  };
  S.save = function (manual) {
    if (!S.state) return false;
    var s = ls();
    if (!s) { S.storageOk = false; return false; }
    try {
      var text = JSON.stringify(S.wrap(S.state));
      if (manual) { var old = s.getItem(S.KEY); if (old) s.setItem(S.BACKUP_KEY, old); }
      s.setItem(S.KEY, text);
      S.lastSave = Date.now(); S.storageOk = true;
      return true;
    } catch (e) { S.storageOk = false; return false; }
  };
  S.load = function () {
    var s = ls(); if (!s) return { ok: false, none: true };
    var text = null;
    try { text = s.getItem(S.KEY); } catch (e) { }
    if (!text) return { ok: false, none: true };
    var r = S.parse(text);
    if (!r.ok) {
      // 主存檔損壞時嘗試備份
      var b = null; try { b = s.getItem(S.BACKUP_KEY); } catch (e2) { }
      if (b) { var rb = S.parse(b); if (rb.ok) { rb.fromBackup = true; return rb; } }
    }
    return r;
  };
  S.exportText = function () { return JSON.stringify(S.wrap(S.state), null, 1); };
  S.reset = function () {
    var s = ls();
    if (s) { try { s.removeItem(S.KEY); s.removeItem(S.BACKUP_KEY); } catch (e) { } }
    S.state = null;
  };
  return S;
})();

<script>/* js/game.js */
/* 遊戲動作：所有會改變存檔的操作都在這裡，UI 只呼叫這些函式 */
MJ.G = (function () {
  var G = {}, U = MJ.U, R = MJ.R;
  var SLOTS = R.SLOTS; // 第二階段：6 部位（A：影片中裝備欄位多於 4 格；C：部位名稱）
  G.SLOTS = SLOTS;
  G.SLOT_NAMES = { weapon: '武器', helm: '頭盔', armor: '盔甲', cape: '披風', belt: '腰帶', ring: '飾品' };
  G.BAG_CAP = 60; // D
  G.TIANWANG = ['zhangjiao', 'qiuchuji', 'yuelingshan', 'luzhangke', 'huaxiong', 'caiwenji']; // B：六大天王

  G.initData = function () {
    var D = MJ.D;
    D.heroIndex = {}; U.each(D.heroes.list, function (h) { D.heroIndex[h.id] = h; });
    D.equipIndex = {}; U.each(D.equipment.list, function (e) { D.equipIndex[e.id] = e; });
    D.stageIndex = {}; U.each(D.stages.stages, function (s) { D.stageIndex[s.id] = s; });
    D.formIndex = {}; U.each(D.formations, function (f) { D.formIndex[f.id] = f; });
  };
  function C() { return MJ.D.config; }
  function st() { return MJ.S.state; }
  function ok(o) { o = o || {}; o.ok = true; return o; }
  function fail(msg) { return { ok: false, msg: msg }; }
  G.lead = function (s) { s = s || st(); return U.find(s.heroes, function (h) { return h.id === 'lead'; }); };
  G.hero = function (uid, s) { s = s || st(); return U.find(s.heroes, function (h) { return h.uid === uid; }); };
  G.nameOf = function (h) { return h.id === 'lead' ? st().player.name : R.heroDef(h.id).name; };
  G.log = function (text, kind) {
    var s = st(); s.log.unshift({ t: U.now(), text: text, k: kind || '' });
    if (s.log.length > 80) s.log.length = 80;
    G.chat(text);
  };
  G.chatLines = [];
  G.chat = function (text) { G.chatLines.unshift(text); if (G.chatLines.length > 6) G.chatLines.length = 6; if (G.onChat) G.onChat(); };
  G.commit = function () { MJ.S.save(false); if (G.onChange) G.onChange(); };

  // ---------- 新遊戲 ----------
  G.newGame = function (name, leadType, gender, seed) {
    var rng = U.rng(seed || (U.now() & 0x7fffffff));
    name = String(name || '').replace(/^\s+|\s+$/g, '').slice(0, 8) || '無名俠客';
    if (!C().leadTypes[leadType]) leadType = '力耐';
    var look = U.clone(MJ.D.heroes.lead.look);
    if (gender === 'f') { look.g = 'f'; look.hs = 'long'; look.cloth = '#ad1457'; look.trim = '#ffd54f'; }
    var s = {
      version: MJ.S.VERSION, created: U.now(),
      player: { name: name, gender: gender === 'f' ? 'f' : 'm', leadType: leadType, gold: 50, silver: 3000, energy: R.energyMax(1), energyTs: U.now(), look: look },
      heroes: [], team: { formation: 'fangyuan', cells: {} },
      bag: { stack: {}, equips: [] }, stages: {}, firstClaimed: {},
      recruit: { cands: [], normalUsed: 0, normalDay: U.dayKey(), cd: {}, firstDone: {} },
      buildings: { shenwu: 1, juxian: 1, xukong: 1 },
      training: null, mail: [], tasksClaimed: {}, gifts: { opening: false, sevenDay: [], lastDay: '' },
      stats: { recruits: 0, battles: 0, wins: 0 }, log: [], settings: { speed: 1, rotate: true, energyMode: 'original' },
      nextUid: 1, freeGiftTs: U.now()
    };
    MJ.S.state = s;
    MJ.S.applyDefaults(s);
    var lead = G.newHero('lead', s);
    s.heroes.push(lead);
    // B：新手教學贈送 2 名隨機六大天王
    var pool = G.TIANWANG.slice(), picks = [];
    while (picks.length < 2) { var i = Math.floor(rng() * pool.length); picks.push(pool.splice(i, 1)[0]); }
    U.each(picks, function (id) { s.heroes.push(G.newHero(id, s)); });
    s.team.cells = { 3: s.heroes[0].uid, 0: s.heroes[1].uid, 6: s.heroes[2].uid };
    // 新手白裝
    G.addEquip('wp1', 0, true); G.addEquip('ar1', 0, true);
    G.addItem('jinglitang', 2, true);
    G.rerollCands('init', rng);
    G.log('歡迎來到猛將無雙！' + R.heroDef(picks[0]).name + '、' + R.heroDef(picks[1]).name + ' 前來投奔。', 'sys');
    s.mail.push({ id: 1, title: '江湖新人禮', text: '少俠初入江湖，略備薄禮。', att: { silver: 1000, items: [{ item: 'tufeiling', n: 2 }] }, read: false, claimed: false, t: U.now() });
    G.commit();
    return s;
  };

  G.newHero = function (id, s) {
    s = s || st();
    if (id !== 'lead') { s.codex = s.codex || {}; s.codex[id] = 1; }
    return { uid: s.nextUid++, id: id, lv: 1, exp: 0, eq: {}, sk: { a: 1, u: 1, p: 1 }, py: { str: 0, int: 0, agi: 0, con: 0 }, xf: [], star: 0 };
  };

  // ---------- 精力 ----------
  G.regenMinutes = function () { var s = st(); return C().energyRegenMinutes[s.settings.energyMode === 'fast' ? 'fast' : 'original']; };
  G.tick = function () {
    var s = st(); if (!s) return;
    var max = R.energyMax(G.lead().lv), per = G.regenMinutes() * 60000, now = U.now();
    if (s.player.energy >= max) { s.player.energyTs = now; return; }
    var n = Math.floor((now - s.player.energyTs) / per);
    if (n > 0) { s.player.energy = Math.min(max, s.player.energy + n); s.player.energyTs += n * per; }
    if (s.player.energy >= max) s.player.energyTs = now;
  };
  G.nextEnergyIn = function () { var s = st(); return Math.max(0, s.player.energyTs + G.regenMinutes() * 60000 - U.now()); };

  // ---------- 包裹 ----------
  G.bagUsed = function () { var s = st(); return s.bag.equips.length + U.filter(U.keys(s.bag.stack), function (k) { return s.bag.stack[k] > 0 && k.indexOf('soul:') !== 0; }).length; };
  G.addEquip = function (t, q, silent) {
    var s = st(), e = { uid: s.nextUid++, t: t, q: q || 0, plus: 0, aff: [], gems: [] };
    if (G.bagUsed() >= G.BAG_CAP) { G.mailOverflow({ equips: [e] }); return e; }
    s.bag.equips.push(e);
    return e;
  };
  G.addItem = function (key, n) {
    var s = st();
    if (key.indexOf('soul:') !== 0 && !s.bag.stack[key] && G.bagUsed() >= G.BAG_CAP) { G.mailOverflow({ items: [{ item: key, n: n }] }); return; }
    s.bag.stack[key] = (s.bag.stack[key] || 0) + n;
  };
  G.mailOverflow = function (att) {
    var s = st();
    s.mail.push({ id: s.nextUid++, title: '包裹已滿', text: '包裹空間不足，物品已轉寄郵件。', att: att, read: false, claimed: false, t: U.now() });
  };
  G.itemName = function (key) {
    if (key.indexOf('soul:') === 0) { var d = R.heroDef(key.slice(5)); return (d ? d.name : '?') + '將魂'; }
    if (key.indexOf('eq:') === 0) { var t = R.equipTpl(key.slice(3)); return t ? t.name : key; }
    var it = MJ.D.equipment.items[key]; return it ? it.name : key;
  };
  // 發放獎勵 {gold, silver, items:[{item,n,q}]}，回傳文字列表
  G.grant = function (rw) {
    var s = st(), out = [];
    if (rw.gold) { s.player.gold += rw.gold; out.push('金幣 ×' + rw.gold); }
    if (rw.silver) { s.player.silver += rw.silver; out.push('銀幣 ×' + rw.silver); }
    if (rw.energy) { s.player.energy += rw.energy; out.push('精力 +' + rw.energy); }
    U.each(rw.items || [], function (it) {
      if (it.item.indexOf('eq:') === 0) { G.addEquip(it.item.slice(3), it.q || 0); out.push(C().equipQualityNames[it.q || 0] + '·' + G.itemName(it.item)); }
      else { G.addItem(it.item, it.n || 1); out.push(G.itemName(it.item) + ' ×' + (it.n || 1)); }
    });
    U.each(rw.equips || [], function (e) { if (G.bagUsed() < G.BAG_CAP) s.bag.equips.push(e); else G.mailOverflow({ equips: [e] }); out.push(G.itemName('eq:' + e.t)); });
    return out;
  };

  // ---------- 經驗 / 升級 ----------
  G.addExp = function (h, n) {
    var s = st(), lead = G.lead(), ups = 0;
    if (h.lv >= R.maxLevel) return 0;
    h.exp += n;
    while (h.exp >= R.expNeed(h.lv) && h.lv < R.maxLevel) {
      if (h.id !== 'lead' && h.lv >= lead.lv) { h.exp = Math.min(h.exp, R.expNeed(h.lv) - 1); break; } // B：武將不可超過主角等級
      h.exp -= R.expNeed(h.lv); h.lv++; ups++;
      if (h.id === 'lead') {
        s.player.energy = Math.max(s.player.energy, R.energyMax(h.lv)); // B：主角升級補滿精力
        G.log('主角升到 ' + h.lv + ' 級！精力已補滿。', 'lv');
      }
    }
    return ups;
  };

  // ---------- 陣容 ----------
  G.formation = function () { return MJ.D.formIndex[st().team.formation] || MJ.D.formations[0]; };
  G.teamList = function () {
    var s = st(), out = [];
    U.each(U.keys(s.team.cells), function (c) { var h = G.hero(s.team.cells[c]); if (h) out.push({ cell: +c, hero: h }); });
    out.sort(function (a, b) { return a.cell - b.cell; });
    return out;
  };
  // 第二階段：上陣人數超過陣法格數時開放全部 9 格（A：後期 9 人上陣；D：解鎖方式）
  G.openCells = function () {
    var f = G.formation();
    return R.teamSlots(G.lead().lv) > f.cells.length ? [0, 1, 2, 3, 4, 5, 6, 7, 8] : f.cells;
  };
  G.inTeam = function (uid) { var s = st(); return U.find(U.keys(s.team.cells), function (c) { return s.team.cells[c] === uid; }); };
  G.teamCount = function () { return G.teamList().length; };
  G.setCell = function (cell, uid) {
    var s = st(), f = G.formation();
    if (G.openCells().indexOf(cell) < 0) return fail('此陣法不開放這個位置');
    var h = G.hero(uid); if (!h) return fail('找不到武將');
    var cur = G.inTeam(uid);
    if (cur != null) delete s.team.cells[cur];
    var occupant = s.team.cells[cell];
    if (occupant && cur != null) s.team.cells[cur] = occupant; // 互換
    else if (!occupant && cur == null && G.teamCount() >= R.teamSlots(G.lead().lv)) return fail('出戰人數已達上限（' + R.teamSlots(G.lead().lv) + ' 人）');
    s.team.cells[cell] = uid;
    G.commit(); return ok();
  };
  G.addToTeam = function (uid) {
    var f = G.formation(), s = st();
    if (G.inTeam(uid) != null) return fail('已在陣中');
    if (G.teamCount() >= R.teamSlots(G.lead().lv)) return fail('出戰人數已達上限（' + R.teamSlots(G.lead().lv) + ' 人）');
    var free = U.find(G.openCells(), function (c) { return !s.team.cells[c]; });
    if (free == null) return fail('陣法沒有空位');
    return G.setCell(free, uid);
  };
  G.removeFromTeam = function (uid) {
    var s = st(), c = G.inTeam(uid);
    if (c == null) return fail('不在陣中');
    if (G.hero(uid).id === 'lead') return fail('主角必須出戰');
    delete s.team.cells[c]; G.commit(); return ok();
  };
  G.setFormation = function (fid) {
    var s = st(), f = MJ.D.formIndex[fid]; if (!f) return fail('未知陣法');
    if (f.open && G.lead().lv < f.open) return fail('主角 ' + f.open + ' 級開放此陣法');
    var list = G.teamList(); s.team.formation = fid; s.team.cells = {};
    // 依原順序搬到新陣法可用格
    var oc = G.openCells();
    U.each(list, function (x, i) { if (i < oc.length) s.team.cells[oc[i]] = x.hero.uid; });
    G.commit(); return ok();
  };

  // ---------- 聚賢莊 ----------
  G.recruitKinds = ['normal', 'baijin', 'zijin', 'zhizun'];
  G.rerollCands = function (kind, rng) {
    var s = st(), cfg = C().recruit[kind === 'init' ? 'normal' : kind];
    rng = rng || U.rng((U.now() ^ (s.nextUid * 7919)) >>> 0);
    var owned = {}; U.each(s.heroes, function (h) { owned[h.id] = 1; });
    var out = [], used = {};
    for (var i = 0; i < 4; i++) {
      var q = U.pickWeighted(cfg.odds, rng());
      if (i === 0 && cfg.firstMin && !s.recruit.firstDone[kind]) q = Math.max(q, cfg.firstMin); // B：首次紫金/至尊保底
      var pool = [];
      for (var qq = q; qq >= 0 && !pool.length; qq--) {
        pool = U.filter(MJ.D.heroes.list, function (h) { return h.quality === qq && !owned[h.id] && !used[h.id]; });
      }
      if (!pool.length) break;
      var pick = pool[Math.floor(rng() * pool.length)];
      used[pick.id] = 1; out.push(pick.id);
    }
    if (cfg.firstMin) s.recruit.firstDone[kind] = true;
    s.recruit.cands = out;
    return out;
  };
  G.recruitStatus = function (kind) {
    var s = st(), cfg = C().recruit[kind], now = U.now();
    if (kind === 'normal' && s.recruit.normalDay !== U.dayKey()) { s.recruit.normalDay = U.dayKey(); s.recruit.normalUsed = 0; }
    var cdEnd = s.recruit.cd[kind] || 0;
    return { cfg: cfg, cdLeft: Math.max(0, cdEnd - now), left: kind === 'normal' ? cfg.daily - s.recruit.normalUsed : null };
  };
  G.refresh = function (kind, payGold) {
    var s = st(), stt = G.recruitStatus(kind);
    if (!stt.cfg) return fail('未知刷新方式');
    if (kind === 'normal' && stt.left <= 0) return fail('今日普通刷新次數已用完（每日 ' + stt.cfg.daily + ' 次）');
    var cost = 0;
    if (stt.cdLeft > 0) {
      if (!payGold) return fail('冷卻中，剩餘 ' + U.dur(stt.cdLeft));
      cost = stt.cfg.skipGold;
      if (s.player.gold < cost) return fail('金幣不足（需要 ' + cost + '）');
      s.player.gold -= cost;
    }
    if (kind === 'normal') s.recruit.normalUsed++;
    s.recruit.cd[kind] = U.now() + stt.cfg.cdMin * 60000;
    G.rerollCands(kind);
    G.commit();
    return ok({ cost: cost, cands: s.recruit.cands });
  };
  G.recruitCost = function (id) { return C().recruitCost[R.heroDef(id).quality]; };
  G.recruit = function (id) {
    var s = st(), def = R.heroDef(id);
    if (!def || s.recruit.cands.indexOf(id) < 0) return fail('此武將不在拜訪名單中');
    if (U.find(s.heroes, function (h) { return h.id === id; })) return fail('已擁有此武將');
    if (s.heroes.length >= R.rosterCap(s)) return fail('武將數已滿（' + s.heroes.length + '/' + R.rosterCap(s) + '），請先解僱或升級聚賢莊');
    var cost = G.recruitCost(id);
    if (s.player.silver < cost) return fail('銀幣不足（需要 ' + U.fmt(cost) + '）');
    s.player.silver -= cost;
    var h = G.newHero(id, s);
    s.heroes.push(h);
    s.recruit.cands.splice(s.recruit.cands.indexOf(id), 1);
    s.stats.recruits++;
    G.log('你在聚賢莊招募了【' + C().qualityNames[def.quality] + '】' + def.name + '！', 'recruit');
    G.commit();
    return ok({ hero: h });
  };
  G.dismiss = function (uid) {
    var s = st(), h = G.hero(uid);
    if (!h) return fail('找不到武將');
    if (h.id === 'lead') return fail('主角不能解僱');
    var def = R.heroDef(h.id), n = C().dismissSouls[def.quality];
    // 卸下裝備回包裹
    U.each(SLOTS, function (sl) { if (h.eq[sl]) { if (G.bagUsed() < G.BAG_CAP) s.bag.equips.push(h.eq[sl]); else G.mailOverflow({ equips: [h.eq[sl]] }); } });
    var c = G.inTeam(uid); if (c != null) delete s.team.cells[c];
    s.heroes.splice(s.heroes.indexOf(h), 1);
    if (s.training && s.training.uid === uid) s.training = null;
    if (n > 0) G.addItem('soul:' + h.id, n);
    G.log('解僱了 ' + def.name + (n > 0 ? '，獲得將魂 ×' + n + '。' : '。黑色武將不能遣散成將魂（B：攻略）。'), 'sys');
    G.commit();
    return ok({ souls: n });
  };
  G.summon = function (id) {
    var s = st(), def = R.heroDef(id), have = s.bag.stack['soul:' + id] || 0;
    if (!def) return fail('未知武將');
    if (U.find(s.heroes, function (h) { return h.id === id; })) return fail('已擁有此武將');
    if (have < def.souls) return fail('將魂不足（' + have + '/' + def.souls + '）');
    if (s.heroes.length >= R.rosterCap(s)) return fail('武將數已滿');
    s.bag.stack['soul:' + id] = have - def.souls;
    if (!s.bag.stack['soul:' + id]) delete s.bag.stack['soul:' + id];
    s.heroes.push(G.newHero(id, s));
    G.log('以將魂召喚了 ' + def.name + '！', 'recruit');
    G.commit(); return ok();
  };

  // ---------- 裝備 ----------
  G.equip = function (heroUid, equipUid) {
    var s = st(), h = G.hero(heroUid);
    var e = U.find(s.bag.equips, function (x) { return x.uid === equipUid; });
    if (!h || !e) return fail('找不到武將或裝備');
    var tpl = R.equipTpl(e.t);
    if (h.lv < tpl.lv) return fail('需要等級 ' + tpl.lv);
    s.bag.equips.splice(s.bag.equips.indexOf(e), 1);
    var old = h.eq[tpl.slot];
    h.eq[tpl.slot] = e;
    if (old) s.bag.equips.push(old);
    G.commit(); return ok({ old: old });
  };
  G.unequip = function (heroUid, slot) {
    var s = st(), h = G.hero(heroUid);
    if (!h || !h.eq[slot]) return fail('此部位沒有裝備');
    if (G.bagUsed() >= G.BAG_CAP) return fail('包裹已滿');
    s.bag.equips.push(h.eq[slot]); delete h.eq[slot];
    G.commit(); return ok();
  };
  G.autoEquip = function (heroUid) { // 「最強」按鈕
    var s = st(), h = G.hero(heroUid), changed = 0;
    if (!h) return fail('找不到武將');
    var d = R.derived(h, s);
    U.each(SLOTS, function (slot) {
      var best = h.eq[slot], bestScore = best ? R.equipScore(best) : -1;
      U.each(s.bag.equips, function (e) {
        var tpl = R.equipTpl(e.t);
        if (tpl.slot !== slot || tpl.lv > h.lv) return;
        if (slot === 'weapon') { var wk = { p: 'patk', m: 'matk', j: 'jatk' }[d.dtype]; if (!tpl.stats[wk]) return; }
        var sc = R.equipScore(e);
        if (sc > bestScore) { best = e; bestScore = sc; }
      });
      if (best && best !== h.eq[slot]) {
        s.bag.equips.splice(s.bag.equips.indexOf(best), 1);
        if (h.eq[slot]) s.bag.equips.push(h.eq[slot]);
        h.eq[slot] = best; changed++;
      }
    });
    G.commit(); return ok({ changed: changed });
  };
  G.sellEquip = function (uid) {
    var s = st(), e = U.find(s.bag.equips, function (x) { return x.uid === uid; });
    if (!e) return fail('找不到裝備');
    var p = R.equipSell(e); s.bag.equips.splice(s.bag.equips.indexOf(e), 1); s.player.silver += p;
    G.commit(); return ok({ silver: p });
  };

  // ---------- 道具 ----------
  G.useItem = function (key, heroUid) {
    var s = st(), it = MJ.D.equipment.items[key];
    if (!it || !s.bag.stack[key]) return fail('沒有這個道具');
    var u = it.use, msg = '';
    if (u.energy) { s.player.energy += u.energy; msg = '精力 +' + u.energy; }
    else if (u.silver) { s.player.silver += u.silver; msg = '銀幣 +' + u.silver; }
    else if (u.heroExp) {
      var h = G.hero(heroUid);
      if (!h) return fail('請選擇武將');
      if (h.id === 'lead') return fail('突飛令不能對主角使用');
      var lead = G.lead();
      if (h.lv >= lead.lv && h.exp >= R.expNeed(h.lv) - 1) return fail('武將等級不能超過主角');
      var n = h.lv * u.heroExp; G.addExp(h, n); msg = G.nameOf(h) + ' 經驗 +' + n;
    }
    s.bag.stack[key]--; if (!s.bag.stack[key]) delete s.bag.stack[key];
    G.commit(); return ok({ msg: msg });
  };

  // ---------- 商城 ----------
  G.buy = function (sid) {
    var s = st(), e = U.find(MJ.D.shop, function (x) { return x.id === sid; });
    if (!e) return fail('商品不存在');
    var cur = e.price.silver ? 'silver' : 'gold', p = e.price[cur];
    if (s.player[cur] < p) return fail((cur === 'silver' ? '銀幣' : '金幣') + '不足');
    if (G.bagUsed() >= G.BAG_CAP && (e.item.indexOf('eq:') === 0 || !s.bag.stack[e.item])) return fail('包裹已滿');
    s.player[cur] -= p;
    var got = G.grant({ items: [{ item: e.item, q: e.q, n: e.n || 1 }] });
    G.commit(); return ok({ got: got });
  };

  // ---------- 虛空之門 ----------
  G.stageState = function (id) { return st().stages[id] || { stars: 0, clears: 0 }; };
  G.chapterUnlocked = function (ch) {
    var c = U.find(MJ.D.stages.chapters, function (x) { return x.id === ch; });
    return c && G.lead().lv >= c.lv && G.stageUnlocked('s' + ch + '_1', true);
  };
  G.stageUnlocked = function (id, skipCh) {
    var sg = MJ.D.stageIndex[id]; if (!sg) return false;
    if (!skipCh && !G.chapterUnlocked(sg.ch)) return false;
    if (!sg.unlock) return true;
    if (sg.unlock === 'all3star') {
      return U.filter(MJ.D.stages.stages, function (x) { return x.ch === sg.ch && x.kind !== 'hidden' && G.stageState(x.id).stars >= 3; }).length === 8;
    }
    return G.stageState(sg.unlock).clears > 0;
  };
  G.lockReason = function (id) {
    var sg = MJ.D.stageIndex[id], c = U.find(MJ.D.stages.chapters, function (x) { return x.id === sg.ch; });
    if (G.lead().lv < c.lv) return '需要主角等級 ' + c.lv;
    if (sg.unlock === 'all3star') return '本章其他關卡全部三星後開啟';
    if (sg.unlock) return '需先通關「' + MJ.D.stageIndex[sg.unlock].name + '」';
    return '';
  };
  G.buildEnemy = function (sg) {
    return U.map(sg.enemies, function (e) { return { cell: e.cell, unit: R.enemyUnit(e, sg) }; });
  };
  G.buildTeam = function () {
    var s = st();
    return U.map(G.teamList(), function (x) { return { cell: x.cell, unit: R.heroUnit(x.hero, s) }; });
  };
  G.fight = function (id, seed) {
    var s = st(), sg = MJ.D.stageIndex[id];
    if (!sg) return fail('關卡不存在');
    if (!G.stageUnlocked(id)) return fail('關卡未解鎖：' + G.lockReason(id));
    G.tick();
    if (s.player.energy < sg.energy) return fail('精力不足（需要 ' + sg.energy + '）');
    if (!G.teamCount()) return fail('沒有出戰武將');
    seed = seed || ((U.now() ^ (s.stats.battles * 2654435761)) >>> 0) || 1;
    var team = G.buildTeam(), foes = G.buildEnemy(sg);
    // D（原創防卡關）：越戰越勇——同一關每連敗一次，我方生命與攻擊 +8%，最多 +80%，通關後歸零
    var morale = R.moraleBonus(G.stageState(id).fails || 0);
    if (morale > 0) U.each(team, function (t) { var u = t.unit; u.hp = Math.round(u.hp * (1 + morale)); u.patk = Math.round(u.patk * (1 + morale)); u.matk = Math.round(u.matk * (1 + morale)); u.jatk = Math.round(u.jatk * (1 + morale)); });
    var res = MJ.Battle.run(team, foes, { seed: seed, maxRounds: C().maxRounds, levelSuppression: C().levelSuppression });
    s.stats.battles++;
    var out = { win: res.win, battle: res, stage: sg, team: team, foes: foes, rewards: [], levelUps: [], seed: seed, energyCost: 0, morale: morale };
    var lead = G.lead();
    if (res.win) {
      s.stats.wins++;
      s.player.energy -= sg.energy; out.energyCost = sg.energy;
      var stars = res.deadA === 0 ? 3 : (res.deadA === 1 ? 2 : 1); // D：星級規則
      var ss = s.stages[id] || { stars: 0, clears: 0 };
      var first = ss.clears === 0;
      ss.clears++; ss.stars = Math.max(ss.stars, stars); ss.fails = 0; s.stages[id] = ss;
      out.stars = stars; out.first = first;
      var rng = U.rng(seed ^ 0x5bd1e995);
      var rw = { silver: Math.floor(sg.silver * (G.econ ? G.econ().reward : 1)), items: [] };
      U.each(sg.drops, function (d) { if (rng() < d.chance) rw.items.push({ item: d.item, q: d.q, n: d.n }); });
      out.rewards = G.grant(rw);
      if (first && !s.firstClaimed[id]) {
        s.firstClaimed[id] = true;
        out.firstRewards = G.grant(sg.first);
      }
      // 經驗：全隊獲得（含陣亡）
      U.each(G.teamList(), function (x) {
        var before = x.hero.lv; G.addExp(x.hero, sg.exp);
        if (x.hero.lv > before) out.levelUps.push(G.nameOf(x.hero) + ' Lv' + before + '→' + x.hero.lv);
      });
      out.exp = sg.exp;
      G.log('通關「' + sg.name + '」' + stars + '星' + (first ? '（首通）' : ''), 'battle');
    } else {
      // B：30 級前戰敗不扣精力；之後扣除
      if (lead.lv >= C().noEnergyLossBelowLevel) { s.player.energy -= sg.energy; out.energyCost = sg.energy; }
      var fs = s.stages[id] || { stars: 0, clears: 0 }; fs.fails = (fs.fails || 0) + 1; s.stages[id] = fs;
      out.nextMorale = R.moraleBonus(fs.fails);
      G.log('挑戰「' + sg.name + '」失敗' + (res.timeout ? '（超過 ' + C().maxRounds + ' 回合）' : ''), 'battle');
    }
    G.commit();
    return ok(out);
  };

  // ---------- 訓練（神武殿） ----------
  G.trainRate = function (h) { return Math.floor((h.lv * 2 + 4) * (1 + 0.1 * ((st().buildings.shenwu || 1) - 1))); }; // D：每分鐘經驗
  G.startTrain = function (uid) {
    var s = st(), h = G.hero(uid); if (!h) return fail('找不到武將');
    if (s.training) return fail('訓練位已被佔用');
    s.training = { uid: uid, ts: U.now() }; G.commit(); return ok();
  };
  G.trainGain = function () {
    var s = st(); if (!s.training) return 0; var h = G.hero(s.training.uid); if (!h) return 0;
    var min = Math.min(480, Math.floor((U.now() - s.training.ts) / 60000)); // D：最多累積 8 小時
    return min * G.trainRate(h);
  };
  G.stopTrain = function () {
    var s = st(); if (!s.training) return fail('沒有訓練中的武將');
    var h = G.hero(s.training.uid), n = G.trainGain();
    if (h && n) G.addExp(h, n);
    s.training = null; G.commit(); return ok({ exp: n, name: h ? G.nameOf(h) : '' });
  };

  // ---------- 建築升級 ----------
  G.buildingCost = function (k, lv) { return Math.floor(500 * lv * lv); }; // D
  G.upgradeBuilding = function (k) {
    var s = st(), lv = s.buildings[k] || 1;
    var bc = C().buildings[k];
    if (!bc || bc.phase || k === 'xukong') return fail('此建築不能升級');
    if (bc.open && G.lead().lv < bc.open) return fail('主角 ' + bc.open + ' 級開放');
    if (lv >= G.lead().lv) return fail('建築等級不能超過主角等級');
    var cost = G.buildingCost(k, lv);
    if (s.player.silver < cost) return fail('銀幣不足（需要 ' + U.fmt(cost) + '）');
    s.player.silver -= cost; s.buildings[k] = lv + 1;
    G.log(C().buildings[k].name + ' 升到 ' + (lv + 1) + ' 級', 'sys');
    G.commit(); return ok();
  };

  // ---------- 禮包 / 任務 / 郵件 ----------
  G.freeGiftLeft = function () { return Math.max(0, st().freeGiftTs + C().freeGiftMinutes * 60000 - U.now()); };
  G.claimFreeGift = function () {
    var s = st(); if (G.freeGiftLeft() > 0) return fail('還要等 ' + U.dur(G.freeGiftLeft()));
    s.freeGiftTs = U.now();
    var got = G.grant({ silver: 200 + G.lead().lv * 20, items: Math.random() < 0.3 ? [{ item: 'jinglitang', n: 1 }] : [] });
    G.commit(); return ok({ got: got });
  };
  G.claimOpening = function () { // B：首日送藍裝一套與 50 金
    var s = st(); if (s.gifts.opening) return fail('已領取');
    s.gifts.opening = true;
    var got = G.grant({ gold: 50, items: [{ item: 'eq:wp1', q: 2 }, { item: 'eq:ar1', q: 2 }, { item: 'eq:cp1', q: 2 }, { item: 'eq:bt1', q: 2 }] });
    G.commit(); return ok({ got: got });
  };
  G.SEVEN = [{ silver: 1000 }, { gold: 20 }, { items: [{ item: 'dabuwan', n: 1 }] }, { silver: 3000 }, { items: [{ item: 'tufeiling', n: 3 }] }, { gold: 50 }, { items: [{ item: 'eq:wp6', q: 3 }] }]; // D
  G.sevenDayState = function () {
    var s = st(), days = s.gifts.sevenDay.length, today = U.dayKey();
    return { claimed: days, canClaim: days < 7 && s.gifts.lastDay !== today };
  };
  G.claimSevenDay = function () {
    var s = st(), x = G.sevenDayState(); if (!x.canClaim) return fail(x.claimed >= 7 ? '七日禮包已全部領取' : '今天已領取，明天再來');
    s.gifts.sevenDay.push(U.dayKey()); s.gifts.lastDay = U.dayKey();
    var got = G.grant(G.SEVEN[x.claimed]); G.commit(); return ok({ got: got, day: x.claimed + 1 });
  };
  G.taskDone = function (t) {
    var s = st(), c = t.cond;
    if (c.recruits) return s.stats.recruits >= c.recruits;
    if (c.team) return G.teamCount() >= c.team;
    if (c.clear) return G.stageState(c.clear).clears > 0;
    if (c.level) return G.lead().lv >= c.level;
    if (c.heroes) return s.heroes.length >= c.heroes;
    if (c.equipped) return !!U.find(s.heroes, function (h) { return U.keys(h.eq).length >= c.equipped; });
    return false;
  };
  G.claimTask = function (id) {
    var s = st(), t = U.find(MJ.D.tasks, function (x) { return x.id === id; });
    if (!t) return fail('任務不存在'); if (s.tasksClaimed[id]) return fail('已領取');
    if (!G.taskDone(t)) return fail('任務尚未完成');
    s.tasksClaimed[id] = true; var got = G.grant(t.reward); G.commit(); return ok({ got: got });
  };
  G.claimMail = function (id) {
    var s = st(), m = U.find(s.mail, function (x) { return x.id === id; });
    if (!m) return fail('郵件不存在'); if (m.claimed) return fail('已領取');
    if (m.att && (m.att.equips || (m.att.items && m.att.items.length)) && G.bagUsed() >= G.BAG_CAP) return fail('包裹已滿');
    m.claimed = true; m.read = true; var got = m.att ? G.grant(m.att) : [];
    G.commit(); return ok({ got: got });
  };
  return G;
})();

</script>
<script>/* js/sys2.js */
/* 第二階段養成：技能升級、培養、心法、神兵坊（強化/洗煉/鑲嵌/合成）、將魂升階、將星錄、圖鑑
   所有數值為 D 級（自訂、可調整），功能存在與否的等級見 docs/資料考證.md */
(function (G) {
  var U = MJ.U, R = MJ.R;
  function C() { return MJ.D.config; }
  function st() { return MJ.S.state; }
  function ok(o) { o = o || {}; o.ok = true; return o; }
  function fail(msg) { return { ok: false, msg: msg }; }
  function rnd(rng) { return rng ? rng() : Math.random(); }
  function have(k) { return st().bag.stack[k] || 0; }
  function take(k, n) { var s = st(); s.bag.stack[k] = (s.bag.stack[k] || 0) - n; if (s.bag.stack[k] <= 0) delete s.bag.stack[k]; }
  function count(k, n) { var c = st().counters; c[k] = (c[k] || 0) + (n || 1); }
  G.count = count;

  // ---------- 找裝備（包裹或身上） ----------
  G.findEquip = function (uid) {
    var s = st(), e = U.find(s.bag.equips, function (x) { return x.uid === uid; });
    if (e) return { e: e, where: 'bag' };
    var res = null;
    U.each(s.heroes, function (h) { U.each(R.SLOTS, function (sl) { if (!res && h.eq[sl] && h.eq[sl].uid === uid) res = { e: h.eq[sl], where: 'hero', hero: h, slot: sl }; }); });
    return res;
  };

  // ---------- 技能升級（主動 a／無雙 u／被動 p） ----------
  G.SKILL_NAMES = { a: '主動', u: '無雙', p: '被動' };
  G.skillUpCost = function (h, w) {
    var L = R.skillLv(h, w), c = C().skill;
    if (L > c.maxLv) return null;
    if (L === c.maxLv) return { silver: c.silverBase * L * L * 2, items: { shenjishu: c.shenBooks, jinengshu: L } };
    return { silver: c.silverBase * L * L, items: { jinengshu: L } };
  };
  G.skillUp = function (uid, w) {
    var s = st(), h = G.hero(uid); if (!h) return fail('找不到武將');
    if (!G.SKILL_NAMES[w]) return fail('未知技能');
    var def = R.heroDef(h.id);
    if (w === 'p' && !def.passive) return fail('此武將沒有被動技能');
    if (w === 'u' && !def.ult) return fail('此武將沒有無雙技能');
    var cost = G.skillUpCost(h, w); if (!cost) return fail('已達「·神」最高階');
    var L = R.skillLv(h, w);
    if (L >= h.lv) return fail('技能等級不能超過武將等級（' + h.lv + '）');
    if (s.player.silver < cost.silver) return fail('銀幣不足（需要 ' + U.fmt(cost.silver) + '）');
    var miss = U.find(U.keys(cost.items), function (k) { return have(k) < cost.items[k]; });
    if (miss) return fail(G.itemName(miss) + '不足（需要 ' + cost.items[miss] + '）');
    s.player.silver -= cost.silver;
    U.each(U.keys(cost.items), function (k) { take(k, cost.items[k]); });
    h.sk[w] = L + 1; count('skillUp');
    var shen = h.sk[w] > C().skill.maxLv;
    G.log(G.nameOf(h) + ' 的' + G.SKILL_NAMES[w] + '技能升到 ' + (shen ? '「·神」' : h.sk[w] + ' 級'), 'lv');
    G.commit(); return ok({ lv: h.sk[w], shen: shen });
  };

  // ---------- 培養 ----------
  G.peiyang = function (uid, mode, rng) {
    var s = st(), h = G.hero(uid), c = C().peiyang[mode];
    if (!h) return fail('找不到武將'); if (!c) return fail('未知培養方式');
    if (h.pyPending) return fail('請先保留或放棄上次培養結果');
    if (have('peiyangdan') < c.dan) return fail('培養丹不足（需要 ' + c.dan + '）');
    if (s.player.silver < c.silver) return fail('銀幣不足（需要 ' + U.fmt(c.silver) + '）');
    take('peiyangdan', c.dan); s.player.silver -= c.silver;
    var cap = R.peiyangCap(h), p = {};
    U.each(['str', 'int', 'agi', 'con'], function (a) {
      var d = c.lo + Math.floor(rnd(rng) * (c.hi - c.lo + 1));
      p[a] = Math.max(0, Math.min(cap, (h.py[a] || 0) + d));
    });
    h.pyPending = p; count('peiyang');
    G.commit(); return ok({ pending: p, cap: cap });
  };
  G.peiyangAccept = function (uid) {
    var h = G.hero(uid); if (!h || !h.pyPending) return fail('沒有待確認的培養結果');
    h.py = h.pyPending; delete h.pyPending; G.commit(); return ok();
  };
  G.peiyangCancel = function (uid) {
    var h = G.hero(uid); if (!h || !h.pyPending) return fail('沒有待確認的培養結果');
    delete h.pyPending; G.commit(); return ok();
  };

  // ---------- 心法 ----------
  G.xinfaLearn = function (uid, xid) {
    var h = G.hero(uid), cfg = C().xinfa[xid];
    if (!h || !cfg) return fail('找不到武將或心法');
    if (!have('xf_' + xid)) return fail('沒有「' + cfg.name + '」秘笈');
    if (U.find(h.xf, function (x) { return x.id === xid; })) return fail('已修練此心法');
    if (h.xf.length >= R.xinfaSlots(h)) return fail('心法欄位不足（等級 ' + C().xinfaSlots.join('/') + ' 開放）');
    take('xf_' + xid, 1); h.xf.push({ id: xid, lv: 1 });
    G.log(G.nameOf(h) + ' 修練了心法「' + cfg.name + '」', 'lv');
    G.commit(); return ok({ msg: G.nameOf(h) + ' 修練了「' + cfg.name + '」' });
  };
  G.xinfaUpCost = function (x) { return { pages: x.lv, silver: C().xinfaSilver * x.lv }; };
  G.xinfaUp = function (uid, idx) {
    var s = st(), h = G.hero(uid), x = h && h.xf[idx];
    if (!x) return fail('找不到心法');
    if (x.lv >= C().xinfaMax) return fail('心法已達最高級');
    var c = G.xinfaUpCost(x);
    if (have('xinfacanye') < c.pages) return fail('心法殘頁不足（需要 ' + c.pages + '）');
    if (s.player.silver < c.silver) return fail('銀幣不足（需要 ' + U.fmt(c.silver) + '）');
    take('xinfacanye', c.pages); s.player.silver -= c.silver; x.lv++;
    G.commit(); return ok({ lv: x.lv });
  };
  G.xinfaForget = function (uid, idx) {
    var h = G.hero(uid), x = h && h.xf[idx];
    if (!x) return fail('找不到心法');
    h.xf.splice(idx, 1); G.addItem('xf_' + x.id, 1);
    G.commit(); return ok();
  };

  // ---------- 神兵坊：強化 ----------
  G.enhance = function (uid, rng) {
    var s = st(), f = G.findEquip(uid); if (!f) return fail('找不到裝備');
    var e = f.e, cap = R.enhanceCap(s);
    if ((e.plus || 0) >= cap) return fail('已達強化上限 +' + cap + '（升級神兵坊可提高）');
    var cost = R.enhanceCost(e);
    if (s.player.silver < cost) return fail('銀幣不足（需要 ' + U.fmt(cost) + '）');
    s.player.silver -= cost;
    var success = rnd(rng) < R.enhanceChance(e);
    if (success) { e.plus = (e.plus || 0) + 1; count('enhance'); }
    G.commit(); return ok({ success: success, plus: e.plus, cost: cost });
  };
  // ---------- 洗煉 ----------
  G.washCost = function (e) { return C().wash.silver * (R.equipTpl(e.t).lv + 5) / 5 | 0; };
  G.wash = function (uid, rng) {
    var s = st(), f = G.findEquip(uid); if (!f) return fail('找不到裝備');
    var e = f.e, n = C().wash.counts[e.q] || 0;
    if (!n) return fail('白色裝備沒有附加屬性，無法洗煉');
    if (e.washPending) return fail('請先保留或放棄上次洗煉結果');
    if (!have('xilianshi')) return fail('洗煉石不足');
    var cost = G.washCost(e);
    if (s.player.silver < cost) return fail('銀幣不足（需要 ' + U.fmt(cost) + '）');
    take('xilianshi', 1); s.player.silver -= cost;
    var pool = C().wash.pool, keys = U.keys(pool), lv = R.equipTpl(e.t).lv + 5, out = [];
    for (var i = 0; i < n; i++) {
      var k = keys[Math.floor(rnd(rng) * keys.length)], r = pool[k], v = (r[0] + (r[1] - r[0]) * rnd(rng)) * lv;

  };
  G.washAccept = function (uid) { var f = G.findEquip(uid); if (!f || !f.e.washPending) return fail('沒有待確認的洗煉結果'); f.e.aff = f.e.washPending; delete f.e.washPending; G.commit(); return ok(); };
  G.washCancel = function (uid) { var f = G.findEquip(uid); if (!f || !f.e.washPending) return fail('沒有待確認的洗煉結果'); delete f.e.washPending; G.commit(); return ok(); };
  // ---------- 鑲嵌 ----------
  G.socket = function (uid, gemKey) {

  };
  G.unsocket = function (uid, idx, useFu) {
    var f = G.findEquip(uid); if (!f || !f.e.gems || !f.e.gems[idx]) return fail('找不到寶石');
    var g = f.e.gems[idx], kept = false;
    if (useFu) { if (!have('zhaochufu')) return fail('摘除符不足'); take('zhaochufu', 1); }
    if (useFu) { G.addItem(g, 1); kept = true; }
    f.e.gems.splice(idx, 1);

  };
  G.gemCombine = function (key) {
    var s = st(), it = MJ.D.equipment.items[key], c = C().gemCombine;
    if (!it || !it.gem) return fail('不是寶石');
    if (it.gem.lv >= C().gemMaxLv) return fail('已是最高級寶石');

    var to = 'gem_' + it.gem.k + '_' + (it.gem.lv + 1);

  // ---------- 將魂升階 ----------
  G.starUp = function (uid) {

    var cost = R.starCost(h), k = 'soul:' + h.id;

    G.log(G.nameOf(h) + ' 升到 ' + h.star + ' 階！', 'lv');
    G.commit(); return ok({ star: h.star });
  };
  // ---------- 將星錄 ----------
  G.sacrificeSoul = function (id, n) {
    var s = st(), k = 'soul:' + id, def = R.heroDef(id);
    n = Math.floor(n || 0);
    if (!def) return fail('未知武將'); if (n <= 0) return fail('數量錯誤');
    if (have(k) < n) return fail('將魂不足');
    take(k, n); var pts = C().soulValue[def.quality] * n; s.player.xinghun += pts;
    G.commit(); return ok({ pts: pts });
  };
  G.lightStar = function () {
    var s = st(), j = s.jiangxing;
    if (j.lit >= R.jxMax) return fail('將星已全部點亮');
    var star = R.jxStar(j.lit);
    if (s.player.xinghun < star.cost) return fail('星魂不足（需要 ' + star.cost + '）');
    s.player.xinghun -= star.cost; j.lit++;
    G.log('點亮將星「' + star.name + '」：全隊' + (MJ.UI && MJ.UI.STAT_NAMES ? MJ.UI.STAT_NAMES[star.k] : star.k) + ' +' + star.pct + '%', 'lv');
    G.commit(); return ok({ star: star });
  };
  // ---------- 圖鑑 ----------
  G.codexCount = function () { return U.keys(st().codex).length; };

  // ---------- 道具：秘笈直接修練 ----------
  var oldUse = G.useItem;
  G.useItem = function (key, heroUid) {
    var it = MJ.D.equipment.items[key];
    if (it && it.xinfa) return G.xinfaLearn(heroUid, it.xinfa);

    return oldUse(key, heroUid);
  };
  // ---------- 任務條件擴充 ----------
  var oldDone = G.taskDone;
  G.taskDone = function (t) {
    var s = st(), c = t.cond;
    if (c.plus) return !!U.find(s.heroes.concat([]), function (h) { return U.find(R.SLOTS, function (sl) { return h.eq[sl] && h.eq[sl].plus >= c.plus; }); }) || !!U.find(s.bag.equips, function (e) { return e.plus >= c.plus; });
    if (c.skill) return !!U.find(s.heroes, function (h) { return h.sk && (h.sk.a >= c.skill || h.sk.u >= c.skill || h.sk.p >= c.skill); });

    if (c.codex) return G.codexCount() >= c.codex;

  };
})(MJ.G);

<script>/* js/sys3.js */
/* 第三階段：通天塔、無極幻境（連續波次）、農田（真實時間、離線成長）、每日任務、成就、簽到、經濟模式
   所有數值皆為 D 級（自訂），功能存在與否的等級見 docs/資料考證.md */
(function (G) {
  var U = MJ.U, R = MJ.R;
  function C() { return MJ.D.config; }

  function now() { return U.now(); }
  function seedOf() { return ((now() ^ ((st().stats.battles + 7) * 2654435761)) >>> 0) || 1; }
  var GEMK = ['atk', 'hp', 'pdef', 'mdef', 'jdef', 'crit'];

    def(s, 'wuji', { first: {}, clears: 0 });
    def(s, 'farm', { plots: [] });
    def(s, 'daily', null);
    def(s, 'ach', {});
    def(s, 'sign', { month: '', days: [], total: 0, bonus: {} });
    if (s.settings) def(s.settings, 'econ', 'std');
  });

  // ---------- 經濟模式 ----------
  // 標準：接近原作節奏；單機加速：精力每分鐘回復、農田 4 倍速、訓練 2 倍、戰鬥銀幣 1.5 倍（D）
  G.ECON = {
    std: { id: 'std', name: '標準', energy: 'original', farm: 1, train: 1, reward: 1 },

  };
  G.econ = function () { var s = st(); return G.ECON[s && s.settings && s.settings.econ === 'fast' ? 'fast' : 'std']; };
  G.setEcon = function (id) {
    var s = st(); if (!G.ECON[id]) return fail('未知模式');
    G.tick(); s.settings.econ = id; s.settings.energyMode = G.ECON[id].energy; s.player.energyTs = now();

  };
  var oldTrainRate = G.trainRate;
  G.trainRate = function (h) { return Math.floor(oldTrainRate(h) * G.econ().train); };

  // ---------- 每日計數（本地午夜重置） ----------
  G.daily = function () {
    var s = st(), d = U.dayKey();
    if (!s.daily || s.daily.day !== d) s.daily = { day: d, c: {}, claimed: {}, chest: {}, act: 0, wuji: {} };
    return s.daily;
  };
  G.bump = function (k, n) { var d = G.daily(); d.c[k] = (d.c[k] || 0) + (n || 1); G.count(k, n || 1); };
  function wrap(name, key, cond) {
    var f = G[name];
    G[name] = function () {
      var r = f.apply(G, arguments);
      if (r && r.ok && (!cond || cond(r))) { G.bump(key); G.commit(); }
      return r;
    };
  }
  wrap('fight', 'fight');
  wrap('fight', 'win', function (r) { return r.win; });
  wrap('refresh', 'refresh');
  wrap('recruit', 'recruitD');
  wrap('enhance', 'enhanceTry');
  wrap('skillUp', 'skillUpD');

  G.DAILY = [
    { id: 'd1', name: '小試身手', desc: '虛空之門挑戰 3 次', k: 'fight', n: 3, act: 20, reward: { silver: 1000 } },
    { id: 'd2', name: '連戰連勝', desc: '戰鬥勝利 5 次', k: 'win', n: 5, act: 20, reward: { items: [{ item: 'jinengshu', n: 1 }] } },
    { id: 'd3', name: '廣納賢才', desc: '聚賢莊刷新 2 次', k: 'refresh', n: 2, act: 10, reward: { silver: 800 } },
    { id: 'd4', name: '精益求精', desc: '神兵坊強化 3 次', k: 'enhanceTry', n: 3, act: 15, reward: { items: [{ item: 'xilianshi', n: 1 }] } },
    { id: 'd5', name: '勤耕不輟', desc: '農田收成 2 次', k: 'harvest', n: 2, act: 15, reward: { items: [{ item: 'huafei', n: 1 }] } },
    { id: 'd6', name: '登高望遠', desc: '挑戰通天塔 1 次', k: 'towerTry', n: 1, act: 10, reward: { items: [{ item: 'peiyangdan', n: 2 }] } },
    { id: 'd7', name: '幻境歷練', desc: '挑戰無極幻境 1 次', k: 'wujiTry', n: 1, act: 10, reward: { items: [{ item: 'xinfacanye', n: 1 }] } }
  ];
  G.DAILY_CHEST = [
    { id: 'c1', need: 30, reward: { silver: 2000 } },
    { id: 'c2', need: 60, reward: { gold: 10, items: [{ item: 'jinglitang', n: 1 }] } },
    { id: 'c3', need: 90, reward: { gold: 20, items: [{ item: 'tufeiling', n: 1 }] } }
  ];
  G.dailyProgress = function (q) { var d = G.daily(); return Math.min(q.n, d.c[q.k] || 0); };
  G.claimDaily = function (id) {
    var q = U.find(G.DAILY, function (x) { return x.id === id; }); if (!q) return fail('任務不存在');
    var d = G.daily();
    if (d.claimed[id]) return fail('今天已領取');
